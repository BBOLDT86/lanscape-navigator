<style>
/* Layout: a Pinterest-style shortest-column masonry wall; closeups and looks open as sheets over it. */
:root{
  --paper:#f4ede1; --paper-2:#ece2d1; --card:#fffaf2; --ink:#2b2017; --ink-2:#5e4f3f; --ink-3:#8b7a65;
  --line:#e2d5c0; --line-2:#cfbea2; --amber:#c06a17; --amber-hover:#a5570c; --amber-ink:#fffaf2; --amber-soft:#f3dab4;
  --moss:#4c6a35; --moss-soft:#e2ead2; --rust:#a3442a; --scrim:rgba(30,20,10,.74);
  --photo-top:rgba(18,12,6,.38); --photo-bottom:rgba(18,12,6,.5); --chip-on-photo:rgba(255,250,242,.94); --chip-on-photo-ink:#2b2017;
  --shadow:0 1px 2px rgba(60,38,16,.08),0 10px 30px rgba(60,38,16,.12);
  --sw-rust:#b4552a; --sw-mustard:#c99d26; --sw-camel:#d3b48a; --sw-brown:#6b4528; --sw-olive:#5c6b33;
  --sw-burgundy:#7d2433; --sw-navy:#2c3f5e; --sw-grey:#8d8b86; --sw-black:#1f1b17; --sw-pink:#c98aa0;
  --f-display:'Fraunces','Iowan Old Style','Palatino Linotype',Georgia,serif;
  --f-body:'Manrope','Avenir Next','Segoe UI',system-ui,-apple-system,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#17120d; --paper-2:#211912; --card:#241b13; --ink:#f2e8d9; --ink-2:#cbb9a1; --ink-3:#9a8873;
  --line:#35291e; --line-2:#4a3a2b; --amber:#e3953c; --amber-hover:#eeaa5c; --amber-ink:#1d130a; --amber-soft:#4a3119;
  --moss:#a5c486; --moss-soft:#26311c; --rust:#e48b6b; --scrim:rgba(0,0,0,.7);
  --shadow:0 1px 2px rgba(0,0,0,.45),0 12px 32px rgba(0,0,0,.5); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#17120d; --paper-2:#211912; --card:#241b13; --ink:#f2e8d9; --ink-2:#cbb9a1; --ink-3:#9a8873;
  --line:#35291e; --line-2:#4a3a2b; --amber:#e3953c; --amber-hover:#eeaa5c; --amber-ink:#1d130a; --amber-soft:#4a3119;
  --moss:#a5c486; --moss-soft:#26311c; --rust:#e48b6b; --scrim:rgba(0,0,0,.7);
  --shadow:0 1px 2px rgba(0,0,0,.45),0 12px 32px rgba(0,0,0,.5); color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
button,input,select{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
[hidden]{display:none!important}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1720px;margin:0 auto;padding-inline:clamp(16px,2.6vw,36px)}
.wrap{padding-left:max(clamp(16px,2.6vw,36px),env(safe-area-inset-left,0px));padding-right:max(clamp(16px,2.6vw,36px),env(safe-area-inset-right,0px))}
.lede .sm,.stats dt .sm{display:none}
button,a,input,select,label{touch-action:manipulation}
@media (hover:none){
  button,a{-webkit-tap-highlight-color:transparent}
  .chip:active,.dept:active,.btn:active,.tab:active,.size-chip:active,.step:active,.board-opt:active{opacity:.7}
  .pin:active .media img{filter:brightness(.92)}
}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--paper);border-bottom:1px solid var(--line)}
@supports (backdrop-filter:blur(8px)){.topbar{background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:saturate(1.3) blur(12px)}}
.topbar-in{display:flex;align-items:center;gap:10px;padding-block:10px}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;flex:none;margin-right:4px}
.brand-mark{width:34px;height:34px;border-radius:50%;background:var(--amber);color:var(--amber-ink);display:grid;place-items:center}
.brand-word{font-family:var(--f-display);font-weight:650;font-size:25px;letter-spacing:-.015em;font-variation-settings:'opsz' 96;line-height:1}
.brand-word i{font-weight:500;color:var(--amber)}
.tabs{display:flex;gap:2px;flex:none}
.tab{display:inline-flex;align-items:center;gap:7px;border:0;background:transparent;padding:10px 15px;border-radius:999px;font-weight:700;font-size:14.5px;cursor:pointer;text-decoration:none;color:var(--ink)}
.tab:hover{background:var(--paper-2)}
.tab[aria-current="page"]{background:var(--ink);color:var(--paper)}
.tab .count{font:600 11.5px var(--f-mono);background:var(--amber);color:var(--amber-ink);border-radius:999px;padding:1px 7px}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:9px;background:var(--paper-2);border:1px solid transparent;border-radius:999px;padding:0 16px;height:46px;transition:border-color .15s,background .15s}
.search:focus-within{border-color:var(--amber);background:var(--card)}
.search svg{flex:none;color:var(--ink-3)}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:15px;color:var(--ink)}
.search input::placeholder{color:var(--ink-3)}
.icon-btn{flex:none;height:42px;min-width:42px;padding:0 12px;border-radius:999px;border:1px solid var(--line-2);background:var(--card);display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;font-weight:700;font-size:13.5px;color:var(--ink)}
.icon-btn:hover{border-color:var(--ink-3)}
.icon-btn .mono{font-size:12.5px}
.icon-btn.is-on{background:var(--amber-soft);border-color:transparent}
.size-wrap{position:relative;flex:none}
.pop{position:absolute;right:0;top:calc(100% + 8px);z-index:45;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:14px;width:260px}
.pop h2{font:700 13px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:0 0 10px}
.pop p{margin:10px 0 0;font-size:12.5px;color:var(--ink-3);line-height:1.45}
.size-chips{display:flex;flex-wrap:wrap;gap:6px}
.size-chip{min-width:48px;height:38px;border-radius:12px;border:1px solid var(--line-2);background:var(--paper);font:600 13px var(--f-mono);cursor:pointer;color:var(--ink)}
.size-chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.closet-size{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;margin-top:10px;height:40px;padding:0 14px;border-radius:12px;border:1px dashed var(--line-2);background:transparent;font-weight:700;font-size:13px;cursor:pointer;color:var(--ink)}
.closet-size:hover{border-color:var(--ink-3)}
.closet-size[aria-pressed="true"]{border-style:solid;border-color:transparent;background:var(--amber-soft)}
.link-btn{background:none;border:0;padding:0;color:var(--amber);font-weight:700;cursor:pointer;font-size:13px}
.link-btn:hover{text-decoration:underline}

/* ---------- intro / page heads ---------- */
main{padding-bottom:48px;min-height:70vh}
.intro{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px 40px;align-items:end;padding-block:28px 18px}
.eyebrow{margin:0 0 10px;font:600 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--amber)}
.intro h1,.page-head h1{font-family:var(--f-display);font-weight:600;font-size:clamp(30px,4.2vw,52px);line-height:1.02;letter-spacing:-.02em;margin:0;text-wrap:balance;font-variation-settings:'opsz' 144}
.intro h1 em,.page-head h1 em{font-style:italic;font-weight:500;color:var(--amber)}
.lede{margin:12px 0 0;max-width:62ch;color:var(--ink-2);font-size:15.5px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin:0;border:1px solid var(--line);border-radius:18px;background:var(--card);overflow:hidden}
.stats div{padding:14px 16px;border-left:1px solid var(--line);min-width:0}
.stats div:first-child{border-left:0}
.stats dt{font:600 11px var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.stats dd{margin:4px 0 0;font:600 clamp(20px,2.2vw,27px)/1.1 var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink)}
.stats dd small{display:block;margin-top:3px;white-space:nowrap;font-size:11.5px;color:var(--ink-3);font-weight:500}
.page-head{padding-block:28px 18px;display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px 24px}
.page-head p{margin:10px 0 0;max-width:68ch;color:var(--ink-2)}

/* ---------- departments, category chips + filters ---------- */
.depts{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:2px 0 14px;border-bottom:1px solid var(--line)}
.depts::-webkit-scrollbar{display:none}
.dept{flex:none;display:inline-flex;align-items:center;gap:8px;padding:12px 14px 10px;margin-bottom:-1px;border:0;border-bottom:3px solid transparent;background:none;font-weight:800;font-size:15px;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.dept:first-child{padding-left:2px}
.dept:hover{color:var(--ink)}
.dept[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--amber)}
.dept .n{font:500 12px var(--f-mono);color:var(--ink-3)}
.dept-note{margin:-4px 0 14px;max-width:84ch;font-size:14px;color:var(--ink-2)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 12px;margin:0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 16px;border-radius:999px;border:0;background:var(--paper-2);font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap;color:var(--ink)}
.chip:hover{background:var(--line)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.chip .n{font:500 12px var(--f-mono);opacity:.65}
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:12px 0 18px;border-top:1px solid var(--line)}
.fgroup{display:flex;align-items:center;gap:8px;min-width:0}
.flabel{font:700 11.5px var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 1px var(--line-2);cursor:pointer;padding:0;position:relative}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.sw[aria-pressed="true"]::after{content:"";position:absolute;inset:7px;border-radius:50%;border:2px solid var(--card)}
.sw-multi{background:conic-gradient(var(--sw-rust),var(--sw-mustard),var(--sw-olive),var(--sw-navy),var(--sw-burgundy),var(--sw-rust))}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:999px;padding:3px;background:var(--card)}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px;cursor:pointer;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.range{display:flex;align-items:center;gap:10px}
.range input{width:150px;accent-color:var(--amber)}
.range output{font:600 13px var(--f-mono);min-width:44px}
.select{height:36px;border-radius:999px;border:1px solid var(--line-2);background:var(--card);padding:0 12px;font-weight:700;font-size:13px;color:var(--ink)}
.fspacer{flex:1}
.result-count{font:500 13px var(--f-mono);color:var(--ink-3)}
.btn.filter-toggle{display:none}
@media (min-width:900px){.chips{flex-wrap:wrap;overflow:visible}}
.img-broken{opacity:0}

/* ---------- masonry pins ---------- */
.grid{display:flex;gap:16px;align-items:flex-start}
.col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:22px}
.pin{position:relative}
.pin-hit{position:absolute;inset:0;z-index:1;border:0;background:transparent;cursor:zoom-in;border-radius:16px;padding:0}
.media{position:relative;border-radius:16px;overflow:hidden;background:var(--paper-2);max-width:100%}
.media img{width:100%;height:100%;object-fit:cover;transition:transform .5s ease}
.pin:hover .media img{transform:scale(1.025)}
.shade{position:absolute;inset:0;background:linear-gradient(to bottom,var(--photo-top),transparent 34%,transparent 62%,var(--photo-bottom));opacity:0;transition:opacity .18s;pointer-events:none}
.pin:hover .shade,.pin:focus-within .shade{opacity:1}
.save-btn{position:absolute;top:10px;right:10px;z-index:2;border:0;border-radius:999px;background:var(--amber);color:var(--amber-ink);padding:10px 16px;font-weight:800;font-size:14px;cursor:pointer;opacity:0;transform:translateY(-3px);transition:opacity .18s,transform .18s,background .15s}
.save-btn:hover{background:var(--amber-hover)}
.save-btn.is-saved{background:var(--ink);color:var(--paper);opacity:1;transform:none}
.pin:hover .save-btn,.pin:focus-within .save-btn{opacity:1;transform:none}
.open-btn{position:absolute;right:10px;bottom:10px;z-index:2;width:36px;height:36px;border-radius:50%;background:var(--chip-on-photo);color:var(--chip-on-photo-ink);display:grid;place-items:center;opacity:0;transition:opacity .18s}
.pin:hover .open-btn,.pin:focus-within .open-btn{opacity:1}
.src{position:absolute;left:10px;bottom:10px;z-index:2;font:600 11px var(--f-mono);letter-spacing:.02em;background:var(--chip-on-photo);color:var(--chip-on-photo-ink);border-radius:999px;padding:4px 9px;opacity:0;transition:opacity .18s;pointer-events:none}
.pin:hover .src,.pin:focus-within .src{opacity:1}
.deal{position:absolute;top:10px;left:10px;z-index:2;font:600 12px var(--f-mono);background:var(--chip-on-photo);color:var(--chip-on-photo-ink);border-radius:999px;padding:4px 9px;pointer-events:none}
.deal.steal{background:var(--moss);color:var(--card)}
:root[data-theme="dark"] .deal.steal{color:#1a2410}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .deal.steal{color:#1a2410}}
.fallback{display:none;position:absolute;inset:0;flex-direction:column;justify-content:flex-end;gap:10px;padding:16px;background:var(--paper-2)}
.media.broken img{display:none}
.media.broken .fallback{display:flex}
.fallback .stripes{display:flex;height:42%;border-radius:10px;overflow:hidden}
.fallback .stripes span{flex:1}
.fallback b{font-family:var(--f-display);font-weight:600;font-size:17px;line-height:1.15}
.fallback small{font-size:12px;color:var(--ink-3)}
.meta{padding:9px 4px 0}
.pin-brand{margin:0 0 2px;font:600 10.5px/1.35 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pin-name{margin:0;font:700 14px/1.32 var(--f-body);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--ink)}
.pin-sub{display:flex;align-items:center;gap:8px;margin-top:5px;font:500 12.5px var(--f-mono);color:var(--ink-3)}
.pin-sub .total{color:var(--ink);font-weight:600;font-size:13.5px}
.size-tag{margin-left:auto;flex:none;font:600 11px var(--f-mono);border:1px solid var(--line-2);border-radius:7px;padding:1px 7px;color:var(--ink-2)}
.size-tag.match{background:var(--amber-soft);border-color:transparent;color:var(--ink)}
.pin.is-hidden{opacity:.45}
.empty{flex:1;text-align:center;padding:64px 16px;border:1px dashed var(--line-2);border-radius:22px;color:var(--ink-2)}
.empty h3{font-family:var(--f-display);font-weight:600;font-size:24px;margin:0 0 6px;color:var(--ink)}
@media (hover:none){
  .save-btn{opacity:1;transform:none;padding:8px 12px;font-size:12.5px}
  .shade{opacity:0}
  .open-btn,.src{display:none}
}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 20px;border-radius:999px;border:1px solid transparent;font-weight:800;font-size:14.5px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.primary:hover{opacity:.9}
.btn.amber{background:var(--amber);color:var(--amber-ink)}
.btn.amber:hover{background:var(--amber-hover)}
.btn.amber.is-saved{background:var(--ink);color:var(--paper)}
.btn.ghost{background:transparent;border-color:var(--line-2);color:var(--ink)}
.btn.ghost:hover{border-color:var(--ink-3)}
.btn.small{height:38px;padding:0 15px;font-size:13.5px}

/* ---------- sheets ---------- */
.scrim{position:fixed;inset:0;z-index:60;background:var(--scrim);overflow-y:auto;overscroll-behavior:contain;padding:28px 16px 48px;display:flex;flex-direction:column;align-items:center}
.scrim>*{flex:none}
.sheet{position:relative;background:var(--card);color:var(--ink);border-radius:30px;box-shadow:var(--shadow);width:100%;max-width:1060px}
.x{position:absolute;top:14px;right:14px;z-index:3;width:42px;height:42px;border-radius:50%;border:0;background:var(--paper-2);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.x:hover{background:var(--line)}
.cu{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);overflow:hidden}
.cu-media{background:var(--paper-2);display:flex;align-items:center;justify-content:center;min-height:360px;position:relative;border-radius:0}
.cu-media img{width:100%;max-height:82vh;object-fit:contain}
.cu-media .fallback{position:absolute}
.cu-body{padding:30px 30px 26px;display:flex;flex-direction:column;gap:16px;min-width:0}
.cu-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-right:46px}
.pill{font:600 11.5px var(--f-mono);border-radius:999px;padding:4px 10px;background:var(--paper-2);color:var(--ink-2)}
.pill.src-pill{background:var(--ink);color:var(--paper)}
.pill.tier-steal{background:var(--moss-soft);color:var(--moss)}
.pill.tier-great{background:var(--amber-soft);color:var(--ink)}
.cu-brand{margin:0 0 6px}
.facts dd small{font:500 11.5px var(--f-mono);color:var(--ink-3)}
.cu-title{font-family:var(--f-display);font-weight:600;font-size:clamp(25px,2.6vw,34px);line-height:1.08;letter-spacing:-.015em;margin:0;text-wrap:balance;font-variation-settings:'opsz' 96}
.cu-listing{margin:-6px 0 0;font:400 12.5px/1.5 var(--f-mono);color:var(--ink-3)}
.price-card{border:1px solid var(--line);border-radius:20px;padding:16px 18px;background:var(--paper)}
.pc-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:3px 0;color:var(--ink-2);font-size:14px}
.pc-row .mono{color:var(--ink)}
.pc-row.total{border-top:1px solid var(--line);margin-top:6px;padding-top:10px;color:var(--ink);font-weight:800}
.pc-row.total .mono{font-size:26px;font-weight:600}
.meter{height:8px;border-radius:99px;background:var(--line);margin:12px 0 8px;overflow:hidden}
.meter span{display:block;height:100%;background:var(--moss);border-radius:99px}
.cap{margin:4px 0 0;font-size:13px;color:var(--ink-2);line-height:1.45}
.cap b{color:var(--ink)}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 18px;margin:0}
.facts dt{font:700 11px var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.facts dd{margin:3px 0 0;font-weight:600;font-size:14.5px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.dot{width:14px;height:14px;border-radius:50%;display:inline-block;box-shadow:0 0 0 1px var(--line-2);flex:none}
.note{margin:0;padding:12px 14px;border-radius:14px;background:var(--amber-soft);font-size:14px;line-height:1.45;color:var(--ink)}
.tip{margin:0;font-size:14px;color:var(--ink-2);line-height:1.5}
.tip b{color:var(--ink)}
.cu-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:auto;padding-top:4px}
.cu-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:14px;font:500 12.5px var(--f-mono);color:var(--ink-3)}
.cu-nav button{border:0;background:none;font:700 13px var(--f-body);cursor:pointer;color:var(--ink);padding:6px 4px}
.cu-nav button:disabled{opacity:.3;cursor:default}
.more{width:100%;max-width:1060px;margin-top:26px}
.more h3{font-family:var(--f-display);font-weight:600;font-size:22px;margin:0 0 4px;color:var(--card)}
.more .sub{margin:0 0 14px;color:var(--card);opacity:.8;font-size:13.5px}
.more-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:26px}
.mini{border:0;padding:0;background:var(--card);border-radius:18px;overflow:hidden;cursor:pointer;text-align:left;color:var(--ink);display:flex;flex-direction:column;min-width:0}
.mini .media{border-radius:0;aspect-ratio:4/5}
.mini .mini-meta{padding:10px 12px 12px;min-width:0}
.mini .mini-name{font:700 13px/1.3 var(--f-body);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mini .mini-sub{display:flex;justify-content:space-between;gap:8px;margin-top:4px;font:500 12px var(--f-mono);color:var(--ink-3)}

/* save picker */
.picker{max-width:440px;padding:24px}
.picker h2{font-family:var(--f-display);font-weight:600;font-size:24px;margin:0 0 4px;padding-right:44px}
.picker .sub{margin:0 0 16px;color:var(--ink-3);font-size:13.5px}
.board-list{list-style:none;margin:0 0 14px;padding:0;display:flex;flex-direction:column;gap:6px;max-height:46vh;overflow:auto}
.board-opt{width:100%;display:flex;align-items:center;gap:12px;padding:8px;border-radius:16px;border:1px solid transparent;background:transparent;cursor:pointer;text-align:left;color:var(--ink)}
.board-opt:hover{background:var(--paper-2)}
.board-opt[aria-pressed="true"]{border-color:var(--line-2);background:var(--paper)}
.bthumb{width:48px;height:48px;border-radius:12px;background:var(--paper-2);overflow:hidden;flex:none}
.bthumb img{width:100%;height:100%;object-fit:cover}
.board-opt .bname{flex:1;min-width:0;font-weight:700}
.board-opt .bcount{display:block;font:500 12px var(--f-mono);color:var(--ink-3)}
.board-opt .check{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--paper-2);color:transparent;flex:none}
.board-opt[aria-pressed="true"] .check{background:var(--amber);color:var(--amber-ink)}
.new-board{display:flex;gap:8px}
.new-board input{flex:1;min-width:0;height:46px;border-radius:999px;border:1px solid var(--line-2);background:var(--paper);padding:0 16px;color:var(--ink)}
.new-board input:focus{outline:none;border-color:var(--amber)}

/* ---------- boards ---------- */
.boards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:26px 20px;padding-bottom:20px}
.board-card{border:0;background:transparent;padding:0;text-align:left;cursor:pointer;color:var(--ink);min-width:0}
.collage{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:3px;aspect-ratio:5/4;border-radius:20px;overflow:hidden;background:var(--paper-2);max-width:100%}
.collage .c0{grid-row:1/3}
.collage div{background:var(--paper-2);overflow:hidden;min-width:0}
.collage img{width:100%;height:100%;object-fit:cover}
.board-card:hover .collage{filter:brightness(.94)}
.board-card h3{font-family:var(--f-display);font-weight:600;font-size:21px;margin:10px 0 0;display:flex;align-items:center;gap:8px}
.board-card p{margin:2px 0 0;font:500 12.5px var(--f-mono);color:var(--ink-3)}
.auto-tag{font:600 10.5px var(--f-mono);letter-spacing:.05em;text-transform:uppercase;background:var(--moss-soft);color:var(--moss);border-radius:999px;padding:3px 8px}
.new-card .collage{place-items:center;display:grid;grid-template-columns:1fr;grid-template-rows:1fr;border:2px dashed var(--line-2);background:transparent}
.new-card .collage span{font-family:var(--f-display);font-size:46px;color:var(--ink-3);line-height:1}
.board-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 24px;padding-block:24px 18px}
.back{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13.5px;text-decoration:none;color:var(--ink-2);margin-bottom:10px}
.back:hover{color:var(--ink)}
.board-head h1{font-family:var(--f-display);font-weight:600;font-size:clamp(30px,4vw,48px);line-height:1.04;margin:0;letter-spacing:-.02em}
.board-head .bstats{margin:8px 0 0;font:500 13.5px var(--f-mono);color:var(--ink-2)}
.board-actions{display:flex;flex-wrap:wrap;gap:8px}
.confirm{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 16px;border-radius:16px;background:var(--amber-soft);margin-bottom:18px;font-weight:600}
.rename{display:flex;gap:8px;margin-top:8px}
.rename input{height:44px;border-radius:12px;border:1px solid var(--line-2);background:var(--card);padding:0 14px;font:600 18px var(--f-display);min-width:0;color:var(--ink)}

/* ---------- looks ---------- */
.looks{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:30px 22px;padding-bottom:20px}
.look-card{border:0;background:transparent;padding:0;text-align:left;cursor:pointer;color:var(--ink);min-width:0}
.look-art{position:relative;aspect-ratio:5/4;border-radius:24px;overflow:hidden;background:var(--paper-2);max-width:100%}
.look-art .la-over{position:absolute;right:6%;top:7%;width:57%;height:86%;object-fit:cover;border-radius:16px;box-shadow:var(--shadow);background:var(--line)}
.look-art .la-base{position:absolute;left:6%;bottom:7%;width:43%;height:62%;object-fit:cover;border-radius:14px;border:4px solid var(--card);box-shadow:var(--shadow);background:var(--line);z-index:2}
.look-art .la-num{position:absolute;left:7%;top:8%;font-family:var(--f-display);font-style:italic;font-size:40px;line-height:1;color:var(--ink-3);opacity:.7}
.look-card:hover .look-art{filter:brightness(.95)}
.look-card h3{font-family:var(--f-display);font-weight:600;font-size:23px;margin:12px 0 2px}
.look-card p{margin:0;color:var(--ink-2);font-size:14px}
.look-card .lprice{margin-top:6px;font:500 12.5px var(--f-mono);color:var(--ink-3)}
.lwith{margin:6px 0 0;font-size:13px;line-height:1.45;color:var(--ink-2)}
.lwith span{display:inline-block;margin-right:2px;font:600 10.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--moss)}
.look-sheet .lwith{display:inline-block;margin-top:12px;padding:8px 12px;border-radius:12px;background:var(--moss-soft);color:var(--ink)}
.look-group{padding-bottom:6px}
.lg-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;margin:6px 0 16px;padding-top:18px;border-top:1px solid var(--line)}
.lg-head h2{margin:0;font-family:var(--f-display);font-weight:600;font-size:26px;letter-spacing:-.01em}
.lg-head p{margin:0;font-size:14px;color:var(--ink-3)}
.look-sheet{max-width:980px;padding:30px}
.look-sheet .eyebrow{margin-bottom:6px;padding-right:52px}
.look-sheet h2{font-family:var(--f-display);font-weight:600;font-size:clamp(28px,3.4vw,40px);line-height:1.05;margin:0;padding-right:48px}
.look-sheet .mood{margin:8px 0 0;color:var(--ink-2);max-width:62ch}
.slots{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:16px;align-items:start;margin-top:22px}
.plus{align-self:center;font-family:var(--f-display);font-size:34px;color:var(--ink-3)}
.slot{min-width:0;display:flex;flex-direction:column;gap:8px}
.slot-label{font:700 11.5px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--amber);margin:0}
.slot .media{display:block;width:100%;aspect-ratio:4/5;border-radius:20px}
.slot .media img{object-fit:cover}
.slot h3{margin:4px 0 0;font:700 16px/1.3 var(--f-body)}
.slot .ssub{font:500 13px var(--f-mono);color:var(--ink-2)}
.slot-ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.step{width:38px;height:38px;border-radius:50%;border:1px solid var(--line-2);background:var(--card);cursor:pointer;display:grid;place-items:center;color:var(--ink)}
.step:hover{border-color:var(--ink-3)}
.slot-ctl .pos{font:500 12.5px var(--f-mono);color:var(--ink-3);min-width:46px;text-align:center}
.slot-ctl .spacer{flex:1}
.slot .warn{font-size:12.5px;color:var(--rust);margin:0}
.look-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;margin-top:24px;padding-top:18px;border-top:1px solid var(--line)}
.look-foot .ltotal{font:600 13px var(--f-body);color:var(--ink-2)}
.look-foot .ltotal b{display:block;font:600 30px var(--f-mono);color:var(--ink)}

/* ---------- footer, toast, bottom nav ---------- */
.foot{border-top:1px solid var(--line);margin-top:30px;padding-block:22px 30px;color:var(--ink-3);font-size:13px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px 32px}
.foot h4{margin:0 0 4px;font:700 11.5px var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
.foot p{margin:0;line-height:1.55;max-width:60ch}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);z-index:80;background:var(--ink);color:var(--paper);border-radius:999px;padding:12px 14px 12px 20px;display:flex;align-items:center;gap:14px;font-weight:700;font-size:14px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{border:0;background:var(--amber);color:var(--amber-ink);border-radius:999px;padding:7px 14px;font-weight:800;cursor:pointer}
.bottom-nav{display:none}

@media (max-width:1080px){
  .intro{grid-template-columns:1fr}
}
@media (max-width:860px){
  .cu{grid-template-columns:1fr}
  .cu-media{min-height:260px}
  .cu-media img{max-height:62vh}
  .more-row{grid-template-columns:repeat(2,minmax(0,1fr))}
  .slots{grid-template-columns:1fr}
  .plus{display:none}
}
@media (max-width:759px){
  .topbar-in{flex-wrap:wrap;row-gap:8px}
  .topbar .tabs{display:none}
  .brand{margin-right:auto}
  .search{order:5;flex:1 1 100%;height:44px}
  .bottom-nav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;justify-content:space-around;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
  .bottom-nav .tab{flex-direction:column;gap:2px;padding:6px 14px;font-size:11.5px;border-radius:14px}
  .bottom-nav .tab[aria-current="page"]{background:var(--paper-2);color:var(--ink)}
  body{padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
  .toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
  /* phones: a short hero so the pins start on the first screen */
  .intro{padding-block:18px 12px;gap:14px}
  .intro h1{font-size:clamp(30px,9.4vw,40px)}
  .lede{margin-top:8px;font-size:14.5px}
  .lede .lg,.stats dt .lg{display:none}
  .lede .sm,.stats dt .sm{display:inline}
  .stats{grid-template-columns:repeat(4,minmax(0,1fr));border-radius:16px}
  .stats div{padding:10px 10px 11px}
  .stats dt{font-size:10px;letter-spacing:.06em}
  .stats dd{font-size:19px}
  .stats dd small{display:none}
  /* sideways rows: fade the far edge so it reads as scrollable, and leave room to scroll past it */
  .depts,.chips{-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 32px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 32px),transparent)}
  .depts::after,.chips::after{content:"";flex:0 0 24px}
  .dept{font-size:14.5px;padding:11px 12px 9px}
  .dept-note{font-size:13.5px}
  /* 16px inputs keep iPhone Safari from zooming the page on focus */
  .search input,.new-board input,.rename input,.select{font-size:16px}
  .btn.filter-toggle{display:inline-flex;margin-bottom:12px}
  .filters{display:none}
  .filters.open{display:flex}
  .fgroup{flex-wrap:wrap}
  .range input{width:min(180px,46vw)}
  .scrim{padding:12px 10px 40px}
  .sheet{border-radius:24px}
  .cu-body{padding:22px 18px 20px}
  .look-sheet,.picker{padding:22px 18px}
  .looks{grid-template-columns:1fr}
  .grid{gap:10px}
  .col{gap:16px}
  .meta{padding-top:7px}
  .pin-name{font-size:13px}
}
/* phones on their side: the same short hero, side by side, and filters behind the toggle */
@media (max-height:500px) and (orientation:landscape){
  .intro{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);padding-block:14px 10px;gap:10px 24px}
  .intro h1{font-size:34px}
  .lede{margin-top:6px;font-size:14px}
  .lede .lg,.stats dt .lg{display:none}
  .lede .sm,.stats dt .sm{display:inline}
  .stats div{padding:8px 12px}
  .stats dd{font-size:19px}
  .stats dd small{display:none}
  .btn.filter-toggle{display:inline-flex;margin-bottom:12px}
  .filters{display:none}
  .filters.open{display:flex}
}
/* any touch screen: 16px fields so iOS doesn't zoom in when one is focused */
@media (pointer:coarse){.search input,.new-board input,.rename input,.select{font-size:16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<noscript><p style="padding:24px">Pinfall needs JavaScript to lay out the board.</p></noscript>

<header class="topbar">
  <div class="wrap topbar-in">
    <a class="brand" href="#home" aria-label="Pinfall home">
      <span class="brand-mark" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 2c3.6 3.1 5.4 6.2 5.4 9.4A5.4 5.4 0 0 1 12 16.8a5.4 5.4 0 0 1-5.4-5.4C6.6 8.2 8.4 5.1 12 2Z" fill="currentColor"/><path d="M12 9v13" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></span>
      <span class="brand-word">Pin<i>fall</i></span>
    </a>
    <nav class="tabs" aria-label="Sections">
      <a class="tab" href="#home" data-view="home">Home</a>
      <a class="tab" href="#looks" data-view="looks">Looks</a>
      <a class="tab" href="#saved" data-view="saved">Saved <span class="count" data-saved-count hidden>0</span></a>
    </nav>
    <label class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span class="vh">Search pins</span>
      <input id="q" type="search" placeholder="Search flannel, cashmere, 501, Cloud hoodie…" autocomplete="off">
    </label>
    <div class="size-wrap">
      <button class="icon-btn" id="sizeBtn" aria-haspopup="true" aria-expanded="false" aria-controls="sizePop">Size <span class="mono" id="sizeLabel">Any</span></button>
      <div class="pop" id="sizePop" hidden>
        <h2>My size</h2>
        <div class="size-chips" id="sizeChips"></div>
        <button class="closet-size" id="sizeCloset" type="button" aria-pressed="false">Use my closet sizes <span class="mono">S · M</span></button>
        <p>Applies to men’s tops on the wall and in the looks. Women’s pieces are all M; jeans and chinos are waist × inseam, all 30–32 × 30. <button class="link-btn" id="sizeClear" type="button">Any size</button></p>
      </div>
    </div>
    <button class="icon-btn" id="themeBtn" type="button" aria-label="Color theme: follows system"></button>
  </div>
</header>

<main id="main"></main>

<nav class="bottom-nav" aria-label="Sections">
  <a class="tab" href="#home" data-view="home"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1v-9.5Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>Home</a>
  <a class="tab" href="#looks" data-view="looks"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="4" width="8" height="16" rx="2" stroke="currentColor" stroke-width="2"/><rect x="13" y="4" width="8" height="10" rx="2" stroke="currentColor" stroke-width="2"/></svg>Looks</a>
  <a class="tab" href="#saved" data-view="saved"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4V3Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>Saved <span class="count" data-saved-count hidden>0</span></a>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button id="toastUndo" type="button" hidden>Undo</button></div>

<script>
(() => {
'use strict';

/* ================= data: refreshed Fri Oct 23, 2026 ================= */
const CAPTURED = 'Friday, Oct 23, 2026';

const SRC = {
  eb: { label:'eBay',     img:p => `https://i.ebayimg.com/images/g/${p.im}/s-l500.webp`,                  url:p => `https://www.ebay.com/itm/${p.i.slice(1)}` },
  pm: { label:'Poshmark', img:p => `https://di2ponv0v5otw.cloudfront.net/posts/${p.im}`,                  url:p => `https://poshmark.com/listing/${p.u}-${p.i.slice(1)}` },
  mc: { label:'Mercari',  img:p => `https://u-mercari-images.mercdn.net/photos/${p.i}_1.jpg?width=480`,   url:p => `https://www.mercari.com/us/item/${p.i}/` },
  gr: { label:'Grailed',  img:p => `https://media-assets.grailed.com/prd/listing/${p.im}`,               url:p => `https://www.grailed.com/listings/${p.i.slice(1)}` }
};

/* departments: the wall's top-level tabs */
const DEPTS = [
  { k:'ssm', label:'Scotch & Soda',      brand:'Scotch & Soda', est:'Scotch & Soda men’s', note:'Men’s flannels, overshirts, corduroy and knits.' },
  { k:'tm',  label:'TravisMathew',       brand:'TravisMathew',  est:'TravisMathew',        note:'Men’s Cloud hoodies and flannels, quarter-zips, polos and shackets.' },
  { k:'ssw', label:'S&S women’s · M',    brand:'Scotch & Soda', est:'Scotch & Soda women’s', note:'Scotch & Soda and Maison Scotch women’s tops. Every one is a size medium.' },
  { k:'cl',  label:'Closet matches',     brand:'',              est:'',                    note:'Picked from your Hanger closet: Levi’s 505 and 501 in 30–32 × 30, cashmere hoodies and sweaters in S and M, and Buck Mason and Patagonia basics.' }
];
const DEPT = Object.fromEntries(DEPTS.map(d => [d.k, d]));

const CATS = [
  { k:'flannel',   label:'Flannels',                 tip:'Wear it open over a waffle tee or henley, or buttoned under a crewneck with the collar out.',
                                                     tipW:'Wear it open over a fine knit or mock neck, or tuck just the front into high-rise jeans.' },
  { k:'overshirt', label:'Overshirts & shackets',    tip:'Treat it as the jacket: over a turtleneck or henley, sleeves pushed up once.' },

function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function hash(str) { let h = 2166136261; for (const ch of str) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }

/* ================= filtering ================= */
function filtered() {
  const terms = S.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  let list = PINS.filter(p =>
    (S.showHidden || !S.hidden.has(p.i)) &&
    inDept(p) &&
    (S.cat === 'all' || p.c === S.cat) &&
    (!S.colors.size || p.col.some(c => S.colors.has(c))) &&
    (!S.srcs.size || S.srcs.has(p.s)) &&
    (S.cond === 'any' || (S.cond === 'new' ? p.isNew : !p.isNew)) &&
    p.total <= S.maxTotal + 0.001 && sizeOk(p) &&
    terms.every(t => p.hay.includes(t)));
  if (S.sort === 'deal') list.sort((a, b) => b.off - a.off || a.total - b.total);
  else if (S.sort === 'low') list.sort((a, b) => a.total - b.total || b.off - a.off);
  else if (S.sort === 'high') list.sort((a, b) => b.total - a.total);
  else { const r = rng(S.seed); const keyed = list.map(p => [r(), p]); keyed.sort((a, b) => a[0] - b[0]); list = keyed.map(x => x[1]); }
  return list;
}

/* ================= masonry ================= */
function colCount(w) { const min = w < 560 ? 150 : 226; return Math.max(2, Math.min(7, Math.floor((w + 16) / (min + 16)))); }
function renderGrid(el, list, emptyHTML) {
  el.innerHTML = '';
  if (!list.length) { el.innerHTML = emptyHTML || ''; el.dataset.cols = 0; return; }
  const w = el.clientWidth || (document.documentElement.clientWidth - 32);
  const n = colCount(w), gap = w < 560 ? 10 : 16, colW = (w - gap * (n - 1)) / n;
  el.dataset.cols = n;
  const cols = [], hs = [];
  for (let i = 0; i < n; i++) { const c = document.createElement('div'); c.className = 'col'; cols.push(c); hs.push(0); }
  const html = cols.map(() => []);
  list.forEach(p => { let k = 0; for (let i = 1; i < n; i++) if (hs[i] < hs[k] - 1) k = i; html[k].push(pinHTML(p)); hs[k] += colW * p.rr + 100; });
  cols.forEach((c, i) => { c.innerHTML = html[i].join(''); el.appendChild(c); });
}
function fallbackHTML(p) {

}

/* ================= sheets ================= */
let scrimEl = null, lastFocus = null, onDismiss = null;
function openSheet(html, after, dismiss) {
  const keep = scrimEl ? lastFocus : document.activeElement;   // swapping sheets keeps the original focus target on the wall
  closeSheet(true);
  lastFocus = keep;
  onDismiss = dismiss || null;
  scrimEl = document.createElement('div');
  scrimEl.className = 'scrim';
  scrimEl.innerHTML = html;
  document.body.appendChild(scrimEl);
  document.body.style.overflow = 'hidden';
  scrimEl.addEventListener('click', e => { if (e.target === scrimEl) dismissSheet(); });
  const f = scrimEl.querySelector('[data-autofocus]') || scrimEl.querySelector('.x');
  if (f) f.focus({ preventScroll: true });
  if (after) after(scrimEl);
}
function dismissSheet() { if (onDismiss) onDismiss(); else closeSheet(); }
function closeSheet(silent) {
  if (!scrimEl) return;
  scrimEl.remove(); scrimEl = null; onDismiss = null;
  document.body.style.overflow = '';
  if (!silent && lastFocus && document.contains(lastFocus)) lastFocus.focus({ preventScroll: true });
  if (!silent) refreshSaveStates();
}

/* ---------- closeup ---------- */
let cuId = null;
function complements(p) {
  const out = []; const seen = new Set([p.i]);
  for (const l of LOOKS) {
    l.slots.forEach((s, si) => {
      if (!s.ids.includes(p.i)) return;
      const other = l.slots[1 - si];
      other.ids.map(id => BY_ID.get(id)).filter(q => q && !S.hidden.has(q.i) && !seen.has(q.i) && sizeOk(q)).slice(0, 3)
        .forEach(q => { seen.add(q.i); out.push({ q, why: `${l.name}: ${other.label.toLowerCase()}` }); });
    });
  }
  if (out.length < 4) {
    const map = isWomen(p) ? PAIR_W : PAIR;
    const r = rng(hash(p.i));
    const pool = PINS.filter(q => sameSide(p, q) && (map[p.c] || []).includes(q.c) && !seen.has(q.i) && !S.hidden.has(q.i) && sizeOk(q)).map(q => [r() - q.off, q]).sort((a, b) => a[0] - b[0]);
    for (const [, q] of pool) { if (out.length >= 4) break; seen.add(q.i); out.push({ q, why: p.bottoms || q.bottoms ? 'Wear them together' : 'Layers with it' }); }
  }
  return out.slice(0, 4);
}

  knit:['cord','western','flannel'], nordic:['western','cord'], cardigan:['cord','flannel','western'], qzip:['western','henley','flannel'],
  collar:['overshirt','flannel'], hoodie:['flannel','overshirt'], henley:['flannel','overshirt','qzip'],
  cashhood:['jeans','chino'], cashknit:['chino','jeans','cord'], jeans:['cashhood','cashknit','flannel','bm'], chino:['cashknit','qzip','cashhood'], bm:['jeans','chino','cashhood']

const PAIR_W = {
  flannel:['collar','knit','blouse'], overshirt:['collar','knit'], knit:['blouse','flannel'], nordic:['blouse','flannel'], cardigan:['blouse','knit'],
  collar:['flannel','overshirt','cardigan'], blouse:['cardigan','knit','nordic'], hoodie:['flannel','overshirt'], qzip:['blouse','flannel']

function openPicker(ids) {

  const items = ids.map(id => BY_ID.get(id));

    <ul class="board-list">${S.boards.map(b => { const on = ids.every(id => b.pins.includes(id)); const th = b.pins.length ? BY_ID.get(b.pins[b.pins.length - 1]) : null; return `<li><button class="board-opt" data-b="${b.id}" aria-pressed="${on}" type="button"><span class="bthumb">${th ? `<img src="${esc(th.img)}" alt="" referrerpolicy="no-referrer">` : ''}</span><span class="bname">${esc(b.name)}<span class="bcount">${b.pins.length} pin${b.pins.length === 1 ? '' : 's'}</span></span><span class="check">${ICON.check}</span></button></li>`; }).join('')}</ul>
    <form class="new-board" id="newBoardForm"><label class="vh" for="newBoardName">New board name</label><input id="newBoardName" placeholder="New board, e.g. Thanksgiving trip" maxlength="40" autocomplete="off"><button class="btn amber" type="submit">Create</button></form>
    <p class="sub" style="margin:14px 0 0"><button class="btn primary small" data-close type="button">Done</button></p>
  </div>`;
  const done = () => {
    if (reopen) openPin(reopen);              // swap straight back to the closeup so focus returns to the wall later
    else if (lookReopen) openLook(lookReopen);
    else closeSheet();
  };
  openSheet(draw(), function bind(el) {
    el.addEventListener('click', e => {
      const t = e.target.closest('button'); if (!t) return;
      if (t.matches('[data-close]')) { e.stopPropagation(); done(); return; }
      if (t.dataset.b) {
        const b = S.boards.find(x => x.id === t.dataset.b); const on = ids.every(id => b.pins.includes(id));

      el.querySelector('.sheet').outerHTML = draw();
      toast(`Saved to ${name}`);
    });
  }, done);
}

  openSheet(`
  <div class="sheet look-sheet" role="dialog" aria-modal="true" aria-labelledby="lkTitle">
    <button class="x" data-close aria-label="Close">${ICON.close}</button>
    <p class="eyebrow">${esc(LOOK_GROUP[l.d].short)} · look ${n} of ${LOOKS.length}</p>
    <h2 id="lkTitle">${esc(l.name)}</h2>
    <p class="mood">${esc(l.mood)}</p>
    ${withHTML(l)}
    <div class="slots">
      ${picks.map((x, si) => `${si === 1 ? '<div class="plus" aria-hidden="true">+</div>' : ''}
      <section class="slot" aria-label="${esc(l.slots[si].label)}">
        <p class="slot-label">${esc(l.slots[si].label)}</p>
        ${x.p ? `<button class="media" data-goto="${x.p.i}" style="border:0;padding:0;cursor:zoom-in" aria-label="View ${esc(x.p.full)}"><img src="${esc(x.p.img)}" alt="" referrerpolicy="no-referrer">${fallbackHTML(x.p)}</button>
        <div><p class="pin-brand">${esc(x.p.brandLine)}</p><h3>${esc(x.p.short)}</h3></div>
        <div class="ssub">${money(x.p.total)} all-in · size ${esc(x.p.z)} · ${SRC[x.p.s].label}</div>
        ${x.fallback ? '<p class="warn">Nothing in your size for this slot, so all sizes are shown.</p>' : ''}
        <div class="slot-ctl"><button class="step" data-step="-1" data-slot="${si}" aria-label="Previous option" type="button">${ICON.left}</button><span class="pos">${x.k + 1} / ${x.n}</span><button class="step" data-step="1" data-slot="${si}" aria-label="Next option" type="button">${ICON.right}</button><span class="spacer"></span><a class="btn ghost small" href="${esc(x.p.url)}" target="_blank" rel="noopener">Listing ${ICON.arrow}</a></div>` : '<p>No pieces left in this slot.</p>'}
      </section>`).join('')}
    </div>
    <div class="look-foot">
      <div class="ltotal">Both pieces, all-in<b>${money(tot)}</b></div>
      <div class="cu-actions" style="margin:0;padding:0">
        <button class="btn ghost" data-act="prev-look" type="button">${ICON.left} Previous look</button>
        <button class="btn ghost" data-act="next-look" type="button">Next look ${ICON.right}</button>
        <button class="btn amber" data-act="save-look" type="button" data-autofocus>Save both</button>
      </div>
    </div>
  </div>`, el => {
    el.addEventListener('click', e => {
      const t = e.target.closest('button,a'); if (!t) return;
      if (t.matches('[data-close]')) dismissSheet();
      else if (t.dataset.step) {
        const si = +t.dataset.slot; const arr = S.lookIdx[id] || [0, 0];
        arr[si] = (arr[si] || 0) + (+t.dataset.step); S.lookIdx[id] = arr; store.set('lookIdx', S.lookIdx);
        openLook(id);
      }
      else if (t.dataset.goto) { openLookId = null; openPin(t.dataset.goto); }
      else if (t.dataset.act === 'save-look') openPicker(picks.filter(x => x.p).map(x => x.p.i));
      else if (t.dataset.act === 'prev-look') openLook(LOOKS[(LOOKS.indexOf(l) - 1 + LOOKS.length) % LOOKS.length].id);
      else if (t.dataset.act === 'next-look') openLook(LOOKS[(LOOKS.indexOf(l) + 1) % LOOKS.length].id);
    });
  }, () => { openLookId = null; closeSheet(); refreshLooks(); });
}
function refreshLooks() { if (S.view === 'looks') renderLooks(); }

/* ================= actions ================= */
function toggleHide(id) {
  const was = S.hidden.has(id);
  if (was) S.hidden.delete(id); else S.hidden.add(id);
  store.set('hidden', [...S.hidden]);
  render();
  toast(was ? 'Pin is back on the wall' : 'Hidden from the wall', () => { if (was) S.hidden.add(id); else S.hidden.delete(id); store.set('hidden', [...S.hidden]); render(); });
}
function refreshSaveStates() {
  document.querySelectorAll('.pin').forEach(el => {
    const b = el.querySelector('.save-btn'); if (!b) return;
    const s = isSaved(el.dataset.id);
    b.classList.toggle('is-saved', s); b.textContent = s ? 'Saved' : 'Save';
  });
  if (S.view === 'saved') renderSaved();
  if (S.view === 'board') renderBoard();
  updateSavedCount();
}
function updateSavedCount() {
  const n = savedIds().length;
  document.querySelectorAll('[data-saved-count]').forEach(el => { el.textContent = n; el.hidden = !n; });
}
let toastTimer = null, toastUndo = null;
function toast(msg, undo) {
  const t = $('#toast'); $('#toastMsg').textContent = msg;
  const u = $('#toastUndo'); toastUndo = undo || null; u.hidden = !undo;
  t.classList.add('on'); clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), undo ? 5000 : 2200);
}
$('#toastUndo').addEventListener('click', () => { if (toastUndo) toastUndo(); toastUndo = null; $('#toast').classList.remove('on'); });

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (er) {} ta.remove(); return ok;
  }
}

/* ================= events ================= */
main.addEventListener('click', e => {
  const t = e.target.closest('button,a'); if (!t) return;
  const pin = t.closest('.pin');
  if (pin && t.dataset.act === 'save') { e.preventDefault(); cuId = null; openPicker([pin.dataset.id]); return; }
  if (pin && t.dataset.act === 'view') { openPin(pin.dataset.id); return; }
  if (t.dataset.dept) {
    S.dept = t.dataset.dept;
    if (S.cat !== 'all' && !PINS.some(p => p.c === S.cat && inDept(p))) S.cat = 'all';   // that category doesn't exist in this department
    renderHome(); return;
  }
  if (t.dataset.cat) { S.cat = t.dataset.cat; renderHome(); return; }
  if (t.dataset.color) { const k = t.dataset.color; S.colors.has(k) ? S.colors.delete(k) : S.colors.add(k); renderHome(); return; }
  if (t.dataset.src) { const k = t.dataset.src; S.srcs.has(k) ? S.srcs.delete(k) : S.srcs.add(k); renderHome(); return; }
  if (t.dataset.cond) { S.cond = t.dataset.cond; renderHome(); return; }
  if (t.id === 'filterToggle') { S.filtersOpen = !S.filtersOpen; renderHome(); return; }
  if (t.id === 'resetFilters' || t.id === 'emptyReset') { resetFilters(); return; }
  if (t.id === 'toggleHidden') { S.showHidden = !S.showHidden; renderHome(); return; }
  if (t.id === 'reshuffle') { S.seed = (S.seed * 31 + 17) % 100003; paintHomeGrid(); return; }
  if (t.dataset.look) { openLook(t.dataset.look); return; }
  if (t.dataset.board) { location.hash = '#board-' + t.dataset.board; return; }
  if (t.id === 'newBoardCard') { const b = { id: 'b' + Date.now().toString(36), name: 'Board ' + (S.boards.length + 1), pins: [] }; S.boards.push(b); saveBoards(); S.pendingRename = b.id; location.hash = '#board-' + b.id; return; }
  if (t.id === 'copyLinks') {
    const b = getBoard(S.board); const st = boardStats(b);
    const text = `${b.name} (${money(st.tot)} all-in)\n` + st.ps.map(p => `${p.brandLine}: ${p.short} · ${money(p.total)} all-in · size ${p.z} · ${p.url}`).join('\n');
    copyText(text).then(ok => toast(ok ? `Copied ${st.n} links` : 'Couldn’t copy. Select the links from the pins instead.'));
    return;
  }
  if (t.id === 'renameBoard') { S.renaming = true; renderBoard(); const i = $('#renameInput'); if (i) { i.focus(); i.select(); } return; }
  if (t.id === 'cancelRename') { S.renaming = false; renderBoard(); return; }
  if (t.id === 'deleteBoard') { S.confirmDelete = true; renderBoard(); return; }
  if (t.id === 'cancelDelete') { S.confirmDelete = false; renderBoard(); return; }
  if (t.id === 'confirmDelete') { const b = getBoard(S.board); S.boards = S.boards.filter(x => x.id !== b.id); saveBoards(); S.confirmDelete = false; toast(`Deleted ${b.name}`); location.hash = '#saved'; return; }
});
main.addEventListener('submit', e => {
  if (e.target.id !== 'renameForm') return;
  e.preventDefault();
  const b = getBoard(S.board); const v = ($('#renameInput').value || '').trim();
  if (b && v) { b.name = v; saveBoards(); }
  S.renaming = false; renderBoard();
});
main.addEventListener('input', e => {
  if (e.target.id === 'maxTotal') { S.maxTotal = +e.target.value; $('#maxOut').textContent = S.maxTotal >= 110 ? 'Any' : '$' + S.maxTotal; paintHomeGrid(); }
});
main.addEventListener('change', e => {
  if (e.target.id === 'sortSel') { S.sort = e.target.value; renderHome(); }
});
document.addEventListener('error', e => { const img = e.target; if (img && img.tagName === 'IMG') { const m = img.closest('.media'); if (m) m.classList.add('broken'); else img.classList.add('img-broken'); } }, true);

let qTimer = null;
$('#q').addEventListener('input', e => {
  clearTimeout(qTimer);
  qTimer = setTimeout(() => {
    S.q = e.target.value;
    if (S.view !== 'home') { location.hash = '#home'; return; }
    paintHomeGrid();
  }, 140);
});

/* size popover */
const sizeBtn = $('#sizeBtn'), sizePop = $('#sizePop');
function drawSizes() {
  $('#sizeChips').innerHTML = SIZES.map(z => `<button class="size-chip" data-size="${z}" aria-pressed="${S.sizes.has(z)}" type="button">${z}</button>`).join('');
  $('#sizeLabel').textContent = S.sizes.size ? SIZES.filter(z => S.sizes.has(z)).join('·') : 'Any';
  sizeBtn.classList.toggle('is-on', S.sizes.size > 0);
  const closetOn = S.sizes.size === CLOSET_SIZES.length && CLOSET_SIZES.every(z => S.sizes.has(z));
  $('#sizeCloset').setAttribute('aria-pressed', closetOn);
}
sizeBtn.addEventListener('click', e => { e.stopPropagation(); const open = sizePop.hidden; sizePop.hidden = !open; sizeBtn.setAttribute('aria-expanded', open); });
sizePop.addEventListener('click', e => {
  e.stopPropagation();
  const b = e.target.closest('[data-size]');
  if (b) { const z = b.dataset.size; S.sizes.has(z) ? S.sizes.delete(z) : S.sizes.add(z); }
  else if (e.target.id === 'sizeClear') S.sizes.clear();
  else if (e.target.closest('#sizeCloset')) S.sizes = new Set(CLOSET_SIZES);
  else return;
  store.set('sizes', [...S.sizes]); drawSizes(); render();
});
document.addEventListener('click', e => { if (!sizePop.hidden && !e.target.closest('.size-wrap')) { sizePop.hidden = true; sizeBtn.setAttribute('aria-expanded', 'false'); } });

/* theme */
const themeBtn = $('#themeBtn');
const THEME_COLOR = { light:'#f4ede1', dark:'#17120d' };   // browser chrome on phones follows the page, not just the system
function applyTheme() {
  if (S.theme === 'system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', S.theme);
  document.querySelectorAll('meta[name="theme-color"]').forEach(m => {
    if (m.dataset.media == null) m.dataset.media = m.getAttribute('media') || '';
    if (S.theme === 'system') { if (m.dataset.media) m.setAttribute('media', m.dataset.media); m.content = /dark/.test(m.dataset.media) ? THEME_COLOR.dark : THEME_COLOR.light; }
    else { m.removeAttribute('media'); m.content = THEME_COLOR[S.theme]; }
  });
  themeBtn.innerHTML = S.theme === 'dark' ? ICON.moon : S.theme === 'light' ? ICON.sun : ICON.auto;
  themeBtn.setAttribute('aria-label', `Color theme: ${S.theme === 'system' ? 'follows system' : S.theme}. Change theme`);
  themeBtn.title = `Theme: ${S.theme === 'system' ? 'system' : S.theme}`;
}
themeBtn.addEventListener('click', () => { S.theme = { system:'light', light:'dark', dark:'system' }[S.theme]; store.set('theme', S.theme); applyTheme(); });

/* keyboard */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (scrimEl) { e.preventDefault(); dismissSheet(); }
    else if (!sizePop.hidden) { sizePop.hidden = true; sizeBtn.setAttribute('aria-expanded', 'false'); sizeBtn.focus(); }
    return;
  }
  if (scrimEl && cuId && !openLookId && !e.target.closest('input,select,textarea') && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
    const b = scrimEl.querySelector(`[data-act="${e.key === 'ArrowRight' ? 'next' : 'prev'}"]`);
    if (b && !b.disabled) b.click();
  }
  if (e.key === '/' && !scrimEl && !e.target.closest('input,select,textarea')) { e.preventDefault(); $('#q').focus(); }
});

/* routing */
function route() {
  const h = (location.hash || '#home').slice(1);
  closeSheet(true); cuId = null; openLookId = null; S.confirmDelete = false;
  if (h.startsWith('board-')) { S.view = 'board'; S.board = h.slice(6); S.renaming = S.pendingRename === S.board; S.pendingRename = null; }
  else { S.view = ['home', 'looks', 'saved'].includes(h) ? h : 'home'; S.renaming = false; }
  render();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
/* tapping the tab you're already on scrolls back to the top, as phone apps do */
document.querySelectorAll('.tab[data-view]').forEach(a => a.addEventListener('click', e => {
  if ((location.hash || '#home') !== a.getAttribute('href')) return;
  e.preventDefault();
  window.scrollTo({ top: 0, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
}));

/* re-flow the masonry when the column count changes */
let lastW = 0;
new ResizeObserver(() => {
  const g = $('#grid'); if (!g) return;
  const w = g.clientWidth; if (Math.abs(w - lastW) < 2) return; lastW = w;
  const n = colCount(w);
  if (+g.dataset.cols && +g.dataset.cols !== n) {
    if (S.view === 'home') paintHomeGrid(); else if (S.view === 'board') renderGrid(g, S.list, '');
  }
}).observe(main);

/* boot */
applyTheme(); drawSizes(); updateSavedCount(); route();
})();
</script>
</body>
</html>
