 ending birthright citizenship is unconstitutional, 5–4&quot;,&quot;text&quot;:&quot;Trump v. Barbara, June 30, 2026, Chief Justice Roberts writing.&quot;,&quot;src&quot;:{&quot;publisher&quot;:&quot;Constitutional Accountability Center&quot;,&quot;url&quot;:&quot;https://www.theusconstitution.org/litigation/trump-v-barbara/&quot;,&quot;date&quot;:&quot;June 30, 2026&quot;}},{&quot;kind&quot;:&quot;quote&quot;,&quot;kicker&quot;:&quot;The promise&quot;,&quot;status&quot;:&quot;broken&quot;,&quot;quote&quot;:&quot;And I’ll have that done in 24 hours.&quot;,&quot;cite&quot;:&quot;Donald Trump on the war in Ukraine, CNN town hall, May 10, 2023&quot;,&quot;text&quot;:&quot;The war is in its fifth year. An “energy ceasefire” announced Oct. 11, 2026 was violated within hours.&quot;,&quot;src&quot;:{&quot;publisher&quot;:&quot;Responsible Statecraft&quot;,&quot;url&quot;:&quot;https://responsiblestatecraft.org/2023/05/11/trump-tells-cnn-town-hall-i-want-everyone-to-stop-dying-in-ukraine&quot;,&quot;date&quot;:&quot;May 11, 2023&quot;}},{&quot;kind&quot;:&quot;quote&quot;,&quot;kicker&quot;:&quot;The promise&quot;,&quot;status&quot;:&quot;broken&quot;,&quot;quote&quot;:&quot;But we’re not cutting Medicaid, we’re not cutting Medicare, and we’re not cutting Social Security.&quot;,&quot;cite&quot;:&quot;Donald Trump, Meet the Press, May 4, 2025&quot;,&quot;text&quot;:&quot;The One Big Beautiful Bill Act cut more than $1.2 trillion from Medicaid and food stamps; the CBO counts 10.9 million more uninsured by 2034.&quot;,&quot;src&quot;:{&quot;publisher&quot;:&quot;ABC News&quot;,&quot;url&quot;:&quot;https://www.goodmorningamerica.com/amp/news/story/trump-medicaid-republican-bill-cut-benefits-121756481&quot;,&quot;date&quot;:&quot;2025&quot;}},{&quot;kind&quot;:&quot;quote&quot;,&quot;kicker&quot;:&quot;The promise&quot;,&quot;status&quot;:&quot;broken&quot;,&quot;quote&quot;:&quot;Number one, we’re doing criminals and we’re going to do them really rapidly.&quot;,&quot;cite&quot;:&quot;Donald Trump, NBC, December 2024&quot;,&quot;text&quot;:&quot;On Jan. 24, 2026, 74 percent of the 70,766 people in ICE detention had no criminal conviction.&quot;,&quot;src&quot;:{&quot;publisher&quot;:&quot;Stateline / TRAC&quot;,&quot;url&quot;:&quot;https://stateline.org/2026/02/05/immigration-detention-passed-70000-in-january/&quot;,&quot;date&quot;:&quot;Feb. 5, 2026&quot;}},{&quot;kind&quot;:&quot;stat&quot;,&quot;kicker&quot;:&quot;The camps&quot;,&quot;big&quot;:&quot;$45B&quot;,&quot;text&quot;:&quot;for immigration detention in the One Big Beautiful Bill Act, enough for 116,000 to 125,000 beds, a 308 percent increase on the 2024 budget.&quot;,&quot;src&quot;:{&quot;publisher&quot;:&quot;American Immigration Council&quot;,&quot;url&quot;:&quot;https://www.americanimmigrationcouncil.org/fact-sheet/big-beautiful-bill-immigration-border-security/&quot;,&quot;date&quot;:&quot;July 2025&quot;}},{&quot;kind&quot;:&quot;stat&quot;,&quot;kicker&quot;:&quot;Deaths in ICE custody&quot;,&quot;big&quot;:&quot;36–37&quot;,&quot;grim&quot;:true,&quot;text&quot;:&quot;in fiscal 2026, the most in ICE’s history. Calendar 2025 matched the 2004 record at 31 to 33; 2024 had 11.&quot;,&quot;src&quot;:{&quot;publisher&quot;:&quot;Bloomberg Law via NationofChange&quot;,&quot;url&quot;:&quot;https://www.nationofchange.org/2026/10/30/ice-lists-36-detainee-deaths-in-fiscal-2026-most-since-2018/&quot;,&quot;date&quot;:&quot;Oct. 30, 2026&quot;}},{&quot;kind&quot;:&quot;stat&quot;,&quot;kicker&quot;:&quot;U.S. citizens&quot;,&quot;big&quot;:&quot;506&quot;,&quot;grim&quot;:true,&quot;text&quot;:&quot;U.S. citizens detained by immigration agents since Jan. 20, 2025, by ProPublica’s count; two, Renee Good and Alex Pretti, were shot dead by federal agents in Minneapolis in January 2026.&quot;,&quot;src&quot;:{&quot;publisher&quot;:&quot;ProPublica via Investigative Post&quot;,&quot;url&quot;:&quot;https://investigativepost.org/2026/10/08/more-than-500-u-s-citizens-detained-by-ice/&quot;,&quot;date&quot;:&quot;Oct. 8, 2026&quot;}},{&quot;kind&quot;:&quot;stat&quot;,&quot;kicker&quot;:&quot;Minab, Iran · Feb. 28, 2026&quot;,&quot;big&quot;:&quot;123&quot;,&quot;grim&quot;:true,&quot;text&quot;:&quot;children, all 13 or younger, among at least 157 people killed when a U.S. missile destroyed the Shajareh Tayyebeh elementary school on the first day of the Iran war. The Pentagon has not released its report.&quot;,&quot;src&quot;:{&quot;publisher&quot;:&quot;Airwars via AP&quot;,&quot;url&quot;:&quot;https://www.trtworld.com/article/caace236a594&quot;,&quot;date&quot;:&quot;July 2026&quot;}},{&quot;kind&quot;:&quot;stat&quot;,&quot;kicker&quot;:&quot;Foreign aid&quot;,&quot;big&quot;:&quot;14M&quot;,&quot;grim&quot;:true,&quot;text&quot;:&quot;additional deaths by 2030 projected in The Lancet from the dismantling of USAID, 4.5 million of them children under five. A Boston University counter passed 750,000 before it was retired.&quot;,&quot;src&quot;:{&quot;publisher&quot;:&quot;The Lancet via ISGlobal&quot;,&quot;url&quot;:&quot;https://www.isglobal.org/en/-/mas-de-14-millones-de-muertes-prevenibles-de-aqui-a-2030-si-continuan-los-recortes-a-la-financiacion-de-usaid&quot;,&quot;date&quot;:&quot;July 1, 2025&quot;}},{&quot;kind&quot;:&quot;stat&quot;,&quot;kicker&quot;:&quot;Turnover&quot;,&quot;big&quot;:&quot;56%&quot;,&quot;text&quot;:&quot;of the senior White House staff had turned over by Sept. 30, 2026, by Brookings’ count; three of 15 cabinet secretaries were gone. Noem in March, Bondi in April, Wiles after the midterms.&quot;,&quot;src&quot;:{&quot;publisher&quot;:&quot;Brookings&quot;,&quot;url&quot;:&quot;https://www.brookings.edu/articles/tracking-turnover-in-the-second-trump-administration&quot;,&quot;date&quot;:&quot;Sept. 30, 2026&quot;}},{&quot;kind&quot;:&quot;stat&quot;,&quot;kicker&quot;:&quot;GEO Group&quot;,&quot;big&quot;:&quot;$14 → $36&quot;,&quot;text&quot;:&quot;GEO’s shares the day before the 2024 election and the day after the inauguration. The company that runs most of ICE’s beds called 2025 “the largest amount of new business we have won in a single year in our company’s history.”&quot;,&quot;src&quot;:{&quot;publisher&quot;:&quot;The Marshall Project&quot;,&quot;url&quot;:&quot;https://www.themarshallproject.org/2026/01/06/trump-arrest-immigrants-private-prisons&quot;,&quot;date&quot;:&quot;Jan. 6, 2026&quot;}},{&quot;kind&quot;:&quot;stat&quot;,&quot;kicker&quot;:&quot;The market&quot;,&quot;big&quot;:&quot;+23%&quot;,&quot;text&quot;:&quot;the S&amp;P 500 since the last close before the inauguration, after a 7.9 percent fall in the first hundred days, a record on Oct. 6, 2026, and a 4.4 percent drop the day after the midterms.&quot;,&quot;src&quot;:{&quot;publisher&quot;:&quot;AP via La Nación&quot;,&quot;url&quot;:&quot;https://www.lanacion.com.ar/usa/how-major-us-stock-indexes-fared-friday-1162026-nid06112026/&quot;,&quot;date&quot;:&quot;Nov. 6, 2026&quot;}},{&quot;kind&quot;:&quot;stat&quot;,&quot;kicker&quot;:&quot;The family&quot;,&quot;big&quot;:&quot;~$2B&quot;,&quot;text&quot;:&quot;taken in by the Trump family in 2025 by The New York Times’ accounting, most of it from the $TRUMP memecoin and World Liberty Financial; the president’s disclosure shows $635 million in memecoin royalties alone.&quot;,&quot;src&quot;:{&quot;publisher&quot;:&quot;The New York Times via Hawaii Tribune-Herald&quot;,&quot;url&quot;:&quot;https://www.hawaiitribune-herald.com/?p=372125&quot;,&quot;date&quot;:&quot;July 1, 2026&quot;}},{&quot;kind&quot;:&quot;end&quot;,&quot;kicker&quot;:&quot;The Watch · The Mandate&quot;,&quot;title&quot;:&quot;Every figure links to where it was read.&quot;,&quot;text&quot;:&quot;The scorecard, the courts, the promises, the cabinet, the departures, the human cost and the markets, updated in weekly sprints. bboldt86.github.io/lanscape-navigator/news/mandate/&quot;}]'>
