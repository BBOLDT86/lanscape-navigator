/* ---------- photos ----------
   Shrunk hard before storing: a browser only gives us a few megabytes and a
   three-month workbook has to live alongside them. */
function shrinkImage(file, cb) {
  const r = new FileReader();
  r.onload = () => {
    const im = new Image();
    im.onload = () => {
      const max = 1400;
      const sc = Math.min(1, max / Math.max(im.width, im.height));
      const cn = document.createElement('canvas');
      cn.width = Math.max(1, Math.round(im.width * sc));
      cn.height = Math.max(1, Math.round(im.height * sc));
      cn.getContext('2d').drawImage(im, 0, 0, cn.width, cn.height);
      let q = 0.82, url = cn.toDataURL('image/jpeg', q);
      while (url.length > 620000 && q > 0.36) { q -= 0.12; url = cn.toDataURL('image/jpeg', q); }
      if (url.length > 620000) {
        const c2 = document.createElement('canvas');
        c2.width = Math.round(cn.width * .7); c2.height = Math.round(cn.height * .7);
        c2.getContext('2d').drawImage(cn, 0, 0, c2.width, c2.height);
        url = c2.toDataURL('image/jpeg', .7);
      }
      cb(url, Math.round(url.length / 1400));
    };
    im.onerror = () => toast('That did not look like an image.');
    im.src = r.result;
  };
  r.onerror = () => toast('Could not read that file.');
  r.readAsDataURL(file);
}
function takeFiles(ref, files) {
  const list = Array.from(files || []).filter(f => /^image\//.test(f.type)).slice(0, 6);
  if (!list.length) { toast('That was not an image.'); return; }
  const [dn, id, w] = ref.split('|');
  toast(list.length > 1 ? ('Adding ' + list.length + ' photos…') : 'Adding the photo…');
  let left = list.length, added = 0;
  list.forEach(f => shrinkImage(f, url => {
    if (addPhoto(dn, id, w, url)) added++;
    if (--left === 0) {
      save(true);
      if (!Store.ok || Store.failed) toast('Saved, but this browser is out of storage room. Download a backup now.', 6000);
      else toast(added + ' photo' + (added === 1 ? '' : 's') + ' added.');
      go('today', ordOf(dn));
    }
  }));
}

/* ============================================================
   Together / 90 — backup, restore, sharing
   Plain files. No passwords, no locks, no ceremony.

   ============================================================ */

/* ---------- byte helpers ---------- */
function u8b64(u8) { let s = ''; const CH = 0x8000; for (let i = 0; i < u8.length; i += CH) s += String.fromCharCode.apply(null, u8.subarray(i, i + CH)); return btoa(s); }
function b64u8(s) { const bin = atob(String(s).replace(/\s+/g, '')); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }

async function gzipB64(str) {
  const raw = new TextEncoder().encode(str);
  if (typeof CompressionStream !== 'function') return { z: 0, d: u8b64(raw) };
  try {
    const cs = new CompressionStream('gzip'); const w = cs.writable.getWriter();
    w.write(raw); w.close();
    return { z: 1, d: u8b64(new Uint8Array(await new Response(cs.readable).arrayBuffer())) };
  } catch (e) { return { z: 0, d: u8b64(raw) }; }
}
async function ungzipB64(b64, z) {
  const bytes = b64u8(b64);
  if (!z) return new TextDecoder().decode(bytes);
  const ds = new DecompressionStream('gzip'); const w = ds.writable.getWriter();
  w.write(bytes); w.close();
  return new TextDecoder().decode(await new Response(ds.readable).arrayBuffer());
}

/* ---------- what a shared file / code looks like ---------- */
const READER = 4;                 // what this build can interpret
function fileFor(obj) {
  return Object.assign({ f: 'together90', v: 4, minReader: 4, savedAt: new Date().toISOString() }, obj);
}
/* T90Z.<base64 gzipped json># — the trailing # lets us cut off any words typed
   after the code in a message, which otherwise get glued onto the payload */
async function toCode(obj) {
  const { z, d } = await gzipB64(JSON.stringify(fileFor(obj)));
  return 'T90' + (z ? 'Z' : 'P') + '.' + d + '#';
}
const B64OK = /[^A-Za-z0-9+/=]/g;
async function readShared(input) {
  if (input && typeof input === 'object') return input;
  const s = String(input || '').trim();
  if (!s) throw new Error('empty');

  const i = s.search(/T90[ZP]\./);
  if (i > -1) {
    const z = s[i + 3] === 'Z';
    let body = s.slice(i + 5);
    const stop = body.indexOf('#');
    if (stop > -1) body = body.slice(0, stop);
    body = body.replace(/\s+/g, '').replace(B64OK, '');
    if (body.length < 16) throw new Error('truncated');
    let txt; try { txt = await ungzipB64(body, z); } catch (e) { throw new Error('truncated'); }
    let o; try { o = JSON.parse(txt); } catch (e) { throw new Error('truncated'); }
    if (o.minReader && o.minReader > READER) throw new Error('newer');
    return o;
  }
  if (/T90[OA][ZP]\./.test(s)) throw new Error('handshake');
  if (s.indexOf('T90E1.') > -1) throw new Error('legacy');

  let o; try { o = JSON.parse(s); } catch (e) { throw new Error('notours'); }
  if (o && o.ct && o.salt && o.iv) throw new Error('legacy');   // file from the old locked build
  if (!o || (!o.answers && !o.couple)) throw new Error('notours');
  if (o.minReader && o.minReader > READER) throw new Error('newer');
  return o;
}
function openError(e) {
  const m = (e && e.message) || '';
  if (m === 'cancelled') return null;
  if (m === 'empty') return 'Nothing pasted.';
  if (m === 'truncated') return 'That code is incomplete — copy all of it, from T90 to the closing #.';
  if (m === 'newer') return 'That was made by a newer version of Together/90 than this copy. Replace this HTML file with the newer one and try again — loading it here would scramble the days.';
  if (m === 'handshake') return 'That is a direct-link handshake code — it goes in the Direct link box, not here.';
  if (m === 'legacy') return 'That file came from an early locked build of Together/90, which this copy does not open.';
  return 'That is not a Together/90 file or code.';
}

/* ============================================================
   IndexedDB — restore points, the live-backup file, the paired folder
   ============================================================ */
const IDB = {
  db: null, dead: false,
  open() {
    if (IDB.dead) return Promise.resolve(null);
    if (IDB.db) return Promise.resolve(IDB.db);
    return new Promise(res => {
      try {
        const r = indexedDB.open('together90', 1);
        r.onupgradeneeded = () => { const d = r.result; if (!d.objectStoreNames.contains('snaps')) d.createObjectStore('snaps', { keyPath: 'id' }); if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta'); };
        r.onsuccess = () => { IDB.db = r.result; res(IDB.db); };
        r.onerror = () => { IDB.dead = true; res(null); };
      } catch (e) { IDB.dead = true; res(null); }
    });
  },
  async tx(store, mode, fn) {
    const db = await IDB.open(); if (!db) return null;
    return new Promise(res => {
      try {
        const t = db.transaction(store, mode); const s = t.objectStore(store);
        const rq = fn(s);
        t.oncomplete = () => res(rq ? rq.result : true);
        t.onerror = () => res(null); t.onabort = () => res(null);
      } catch (e) { res(null); }
    });
  },
  put(store, v, k) { return IDB.tx(store, 'readwrite', s => s.put(v, k)); },
  get(store, k) { return IDB.tx(store, 'readonly', s => s.get(k)); },
  all(store) { return IDB.tx(store, 'readonly', s => s.getAll()); },
  del(store, k) { return IDB.tx(store, 'readwrite', s => s.delete(k)); }
};

/* ---------- restore points ---------- */
const SNAP_MAX = 24;
async function snap(label) {
  const rec = { id: Date.now(), at: new Date().toISOString(), day: day(S.cur).lbl, done: doneCount(), label: label || 'auto', data: JSON.stringify(S) };
  const ok = await IDB.put('snaps', rec);
  if (ok === null) return null;
  const all = (await IDB.all('snaps')) || [];
  all.sort((a, b) => b.id - a.id);
  for (const old of all.slice(SNAP_MAX)) await IDB.del('snaps', old.id);
  return rec.id;
}
async function snaps() { const a = (await IDB.all('snaps')) || []; return a.sort((x, y) => y.id - x.id); }
async function restoreSnap(id) {
  const r = await IDB.get('snaps', id); if (!r) { toast('That restore point is gone.'); return; }
  await snap('before restore');
  const meSet = S.meSet, me = S.me, dev = S.devid;
  S = JSON.parse(r.data); S.me = me; S.meSet = meSet; S.devid = dev; S.undo = null;
  save(true); renderRail(); go('sync'); toast('Restored to ' + new Date(r.at).toLocaleString() + '.', 3600);
}

/* ============================================================
   PAIRED FOLDER — the closest thing to a permanent link
   ------------------------------------------------------------
   There is no way to hold a real peer-to-peer connection open between two
   browsers without a server somewhere doing the introductions, and this file
   deliberately has no server. So the introduction is done by a folder the two
   of you already share — Dropbox, iCloud Drive, OneDrive, Google Drive.

   Each copy writes exactly one file into that folder, named after which
   partner it is, and reads the other one. Nothing merges except the other
   person's own column, which is the same rule the manual file loader uses.
   The pairing lives in this browser, not in the HTML, so a new build of the
   app keeps it — it just asks for the folder permission once more.
   ============================================================ */
const Pair = {
  dir: null, ok: false, clash: false, busy: false, pushing: false, t: null, iv: null,
  supported() { return typeof window.showDirectoryPicker === 'function'; },
  fname(side) { return 'Together90-' + side + '.json'; },
  state() {
    if (!Pair.supported()) return 'unsupported';
    if (Pair.clash) return 'clash';
    if (Pair.ok) return 'on';
    return Pair.dir ? 'paused' : 'off';
  },
  async load() {
    if (!Pair.supported()) return;
    const h = await IDB.get('meta', 'pairDir'); if (!h) return;
    Pair.dir = h;
    try { Pair.ok = (await h.queryPermission({ mode: 'readwrite' })) === 'granted'; } catch (e) { Pair.ok = false; }
  },
  async arm() {
    try {
      const d = await window.showDirectoryPicker({ id: 'together90pair', mode: 'readwrite' });
      Pair.dir = d; Pair.ok = true; Pair.clash = false;
      await IDB.put('meta', d, 'pairDir');
      await Pair.push();
      const n = await Pair.pull(true);
      Pair.startPoll();
      toast(n ? ('Paired, and picked up ' + n + ' things already waiting.') : 'Paired. Put the same folder on the other laptop and you are in step.', 5000);
    } catch (e) { if (e && e.name !== 'AbortError') toast('Could not use that folder.'); }
    closeModal(); renderRail(); go('sync');
  },
  async resume() {
    if (!Pair.dir) return;
    try {
      const p = await Pair.dir.requestPermission({ mode: 'readwrite' });
      Pair.ok = (p === 'granted');
      if (Pair.ok) { Pair.clash = false; await Pair.push(); await Pair.pull(); Pair.startPoll(); toast('Paired folder reconnected.'); }
    } catch (e) { toast('Could not reconnect. Choose the folder again.'); }
    go('sync');
  },
  async disarm() {
    Pair.dir = null; Pair.ok = false; Pair.clash = false;
    clearInterval(Pair.iv); await IDB.del('meta', 'pairDir');
    go('sync'); toast('Unpaired. Nothing was deleted from the folder.');
  },
  async push() {
    if (!Pair.ok || !Pair.dir || Pair.pushing) return false;
    Pair.pushing = true;
    try {
      const fh = await Pair.dir.getFileHandle(Pair.fname(S.me), { create: true });
      const w = await fh.createWritable();
      await w.write(JSON.stringify(fileFor(S)));
      await w.close();
      markBackup('pair');
      Pair.pushing = false;
      return true;
    } catch (e) { Pair.pushing = false; Pair.ok = false; paintBackup(); return false; }
  },
  /* read the partner's file; merge only if it actually changed */
  async pull(quiet) {
    if (!Pair.ok || !Pair.dir || Pair.busy) return 0;
    Pair.busy = true;
    let fh = null;
    try { fh = await Pair.dir.getFileHandle(Pair.fname(other(S.me))); }
    catch (e) { await Pair.sniffClash(); Pair.busy = false; return 0; }
    try {
      const f = await fh.getFile();
      const o = JSON.parse(await f.text());
      S.pair = S.pair || {}; S.pair.at = Date.now();
      const key = (o.savedAt || '') + '|' + f.size;
      if (key === S.pair.seen) { Pair.busy = false; save(); paintBackup(); return 0; }
      if (o.minReader && o.minReader > READER) {
        S.pair.seen = key; save(true); Pair.busy = false;
        toast('Their copy is a newer build than this one. Update this HTML file before merging.', 6000);
        return 0;
      }
      if (o.me && o.me === S.me) { S.pair.seen = key; save(true); Pair.busy = false; Pair.flagClash(); return 0; }
      const id = await snap('before the shared folder merged');
      const n = mergeIn(Object.assign({}, o, { me: other(S.me) }));
      S.pair.seen = key;
      if (n) S.undo = { id: id, what: 'took ' + nameOf(other(S.me)) + '’s latest out of the shared folder', at: Date.now() };
      save(true);
      Pair.busy = false;
      if (n && !quiet) {
        toast(nameOf(other(S.me)) + ' had ' + n + ' new thing' + (n === 1 ? '' : 's') + ' — merged in.', 4600);
        go(S.view || 'today');
      } else paintBackup();
      return n;
    } catch (e) { Pair.busy = false; return 0; }
  },
  /* partner file missing — is that because you are both set to the same side
     and therefore both writing over the same filename? */
  async sniffClash() {
    try {
      const fh = await Pair.dir.getFileHandle(Pair.fname(S.me));
      const o = JSON.parse(await (await fh.getFile()).text());
      if (o.devid && S.devid && o.devid !== S.devid) Pair.flagClash();
    } catch (e) {}
  },
  flagClash() {
    if (Pair.clash) return;
    Pair.clash = true; Pair.ok = false; clearInterval(Pair.iv); paintBackup();
    modal('<h3>You are both set to the same partner</h3>' +
      '<div class="sub" style="margin:8px 0 14px">Both copies say they are <b>' + esc(nameOf(S.me)) + '</b>, so both are writing to the same file in the shared folder and neither of you can see the other. Nothing you have written has been lost — this copy stopped syncing before anything could be overwritten.</div>' +
      '<div class="note" style="margin-bottom:14px">One of you needs to be ' + esc(nameOf('a')) + ' and the other ' + esc(nameOf('b')) + '. If <b>you</b> are actually ' + esc(nameOf(other(S.me))) + ', switch this copy over — your answers move across with you.</div>' +
      '<div class="row" style="flex-direction:column;align-items:stretch;gap:8px">' +
      '<button class="btn pri" data-act="swapthenpair">I am ' + esc(nameOf(other(S.me))) + ' — switch this copy and re-pair</button>' +
      '<button class="btn gh" data-act="closemodal">The other laptop will switch instead</button></div>');
  },
  startPoll() {
    clearInterval(Pair.iv);
    Pair.iv = setInterval(() => { if (!document.hidden && Pair.ok) Pair.pull(); }, 20000);
  },
  nudge() { clearTimeout(Pair.t); Pair.t = setTimeout(() => Pair.push(), 12000); }
};

/* ---------- backup health ---------- */
function markBackup(kind) { S.bk = S.bk || {}; S.bk.last = Date.now(); S.bk.kind = kind; save(); paintBackup(); }
function backupAgeDays() { if (!S.bk || !S.bk.last) return null; return Math.floor((Date.now() - S.bk.last) / 86400000); }
function backupStale() { if (Pair.ok || Live.ok) return false; const a = backupAgeDays(); return a === null || a >= 7; }
function paintBackup() {
  const el = $('#bkpill'); if (!el) return;
  if (Pair.ok) {

  if (Pair.dir) { el.className = 'pill warn'; el.textContent = '⇄ needs reconnecting'; el.title = 'The paired folder needs permission again'; return; }
  const a = backupAgeDays(), stale = backupStale();

  if (!backupStale() || Live.ok || Pair.ok) return;
  if (doneCount() < 5) return;
  if ($('#modal')) return;
  if (S.bk && S.bk.snoozed && Date.now() - S.bk.snoozed < 3 * 86400000) return;
  const a = backupAgeDays();
  modal('<h3>Back this up</h3><div class="sub" style="margin:8px 0 16px">' +
    (a === null ? 'You have never taken a backup. If this browser gets cleared, everything you have written goes with it.'
      : 'Your last backup was ' + a + ' days ago. You have written ' + doneCount() + ' days into this.') +
    '</div><div class="row"><button class="btn pri" data-act="dobackup">Download a backup</button>' +
    '<button class="btn gh" data-act="snooze">Remind me later</button></div>');
}

/* ============================================================
   One-time importer for files made by the older locked version.
   Only ever surfaces if someone actually has one.
   ============================================================ */
async function importLegacy(text, pass) {
  const CRY = window.crypto && window.crypto.subtle;
  if (!CRY) throw new Error('nocrypto');
  let env = null;
  const s = String(text || '').trim();
  const i = s.indexOf('T90E1.');
  if (i > -1) { const p = s.slice(i + 6).split('#')[0].replace(/\s+/g, '').split('.'); env = { salt: p[0], iv: p[1], ct: p[2], z: 1, it: 310000 }; }
  else env = JSON.parse(s);
  if (!env || !env.ct) throw new Error('notlegacy');
  for (const v of [String(pass).normalize('NFKC').trim(), String(pass)]) {
    try {
      const base = await CRY.importKey('raw', new TextEncoder().encode(v), 'PBKDF2', false, ['deriveKey']);
      const key = await CRY.deriveKey({ name: 'PBKDF2', salt: b64u8(env.salt), iterations: env.it || 310000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      const d = new Uint8Array(await CRY.decrypt({ name: 'AES-GCM', iv: b64u8(env.iv) }, key, b64u8(env.ct)));
      let txt;
      if (env.z) {
        const ds = new DecompressionStream('gzip'); const w = ds.writable.getWriter(); w.write(d); w.close();
        txt = new TextDecoder().decode(await new Response(ds.readable).arrayBuffer());
      } else txt = new TextDecoder().decode(d);
      return JSON.parse(txt);
    } catch (e) {}
  }
  throw new Error('badpass');
}

/* ---------- boot ---------- */
async function bootBackup() {
  if (!S.devid) { S.devid = uid(); save(true); }
  await Live.load();
  await Pair.load();
  paintBackup();
  if (Live.ok) Live.write();
  if (Pair.ok) { Pair.push(); Pair.pull(true).then(() => { paintBackup(); Pair.startPoll(); }); }
  if (S.couple.setup) setTimeout(maybeNudge, 2500);
}

/* ============================================================
   Together / 90 — the direct link
   ------------------------------------------------------------
   A real peer-to-peer connection. WebRTC opens a data channel
   straight between the two browsers; every word you write goes
   machine to machine and touches nothing in between.

   Two things have to happen for that to work, and neither of
   them is "a server that holds your data":

   1. THE INTRODUCTION. Each side has to learn how to reach the
      other. That is two blobs of text — an offer and an answer.
      Most apps pay a signalling server to carry them. You do not
      have to: you can text them to each other. That is what the
      two codes below are. You are the signalling channel.

   2. A PATH BETWEEN THE MACHINES. On the same wifi there already
      is one and this needs nothing else in the world. Across the
      internet each machine first has to find out its own public
      address, which is one round trip to a STUN server — a
      question about yourself, not a pipe your data goes down.
      That is off by default and clearly labelled.

   What it is not is permanent. A data channel is a live line, so
   both copies have to be open at the same time and a new session
   needs a new introduction. For "we are in different time zones
   and both asleep", the paired folder is still the right tool.
   ============================================================ */

const STUN = ['stun:stun.l.google.com:19302', 'stun:stun.cloudflare.com:3478'];

const Link = {
  pc: null, dc: null, state: 'off', role: null, theirUpd: {}, theirName: '',
  buf: {}, t: null, sending: false, at: 0, bytes: 0,

  supported() { return typeof RTCPeerConnection === 'function'; },
  live() { return Link.state === 'open'; },
  cfg() { return { iceServers: S.linkStun ? [{ urls: STUN }] : [] }; },

  set(st) { Link.state = st; paintLink(); if (S.view === 'sync') go('sync'); },

  reset(msg) {
    try { if (Link.dc) Link.dc.close(); } catch (e) {}
    try { if (Link.pc) Link.pc.close(); } catch (e) {}
    Link.pc = null; Link.dc = null; Link.role = null; Link.buf = {}; Link.theirUpd = {};
    clearTimeout(Link.t);
    Link.set('off');
    if (msg) toast(msg, 3600);
  },

  /* wait for ICE to finish so the code we hand over is complete —
     no trickle signalling, because there is nothing to trickle it down */
  gathered(pc) {
    return new Promise(res => {
      if (pc.iceGatheringState === 'complete') return res();
      const done = () => { clearTimeout(to); pc.removeEventListener('icegatheringstatechange', chk); res(); };
      const chk = () => { if (pc.iceGatheringState === 'complete') done(); };
      const to = setTimeout(done, S.linkStun ? 6000 : 2500);
      pc.addEventListener('icegatheringstatechange', chk);
    });
  },

  make() {
    const pc = new RTCPeerConnection(Link.cfg());
    pc.onconnectionstatechange = () => {
      const s = pc.connectionState;
      if (s === 'failed') Link.reset('The direct line could not be opened. Try turning on “across the internet”, or use the shared folder.');
      else if (s === 'disconnected' || s === 'closed') { if (Link.state === 'open') Link.set('lost'); }
    };
    return pc;
  },

  wire(dc) {
    Link.dc = dc;
    dc.binaryType = 'arraybuffer';
    dc.onopen = () => {
      Link.at = Date.now(); Link.set('open');
      Link.raw({ k: 'hello', me: S.me, name: nameOf(S.me), upd: S.upd });
    };
    dc.onclose = () => { if (Link.state === 'open') Link.set('lost'); };
    dc.onmessage = e => Link.take(e.data);
  },

  /* ---------- the two codes ---------- */
  async offer() {
    if (!Link.supported()) { toast('This browser cannot open a direct link.'); return; }
    Link.reset(); Link.role = 'offer'; Link.set('making');
    const pc = Link.make(); Link.pc = pc;
    Link.wire(pc.createDataChannel('t90', { ordered: true }));
    await pc.setLocalDescription(await pc.createOffer());
    await Link.gathered(pc);
    const code = await linkCode('O', { t: 'o', me: S.me, n: nameOf(S.me), sdp: pc.localDescription.sdp });
    Link.set('waitanswer');
    const box = $('#linkout'); if (box) box.value = code;
    return code;
  },

  async accept(input) {
    const o = await readLink(input);
    if (o.t !== 'o') throw new Error('wrongway');
    if (o.me === S.me) throw new Error('sameside');
    Link.reset(); Link.role = 'answer'; Link.set('making');
    Link.theirName = o.n || nameOf(other(S.me));
    const pc = Link.make(); Link.pc = pc;
    pc.ondatachannel = e => Link.wire(e.channel);
    await pc.setRemoteDescription({ type: 'offer', sdp: o.sdp });
    await pc.setLocalDescription(await pc.createAnswer());
    await Link.gathered(pc);
    const code = await linkCode('A', { t: 'a', me: S.me, n: nameOf(S.me), sdp: pc.localDescription.sdp });
    Link.set('waitopen');
    const box = $('#linkout'); if (box) box.value = code;
    return code;
  },

  async finish(input) {
    const o = await readLink(input);
    if (o.t !== 'a') throw new Error('wrongway');
    if (!Link.pc || Link.role !== 'offer') throw new Error('nooffer');
    if (o.me === S.me) throw new Error('sameside');
    Link.theirName = o.n || nameOf(other(S.me));
    await Link.pc.setRemoteDescription({ type: 'answer', sdp: o.sdp });
    Link.set('waitopen');
  },

  /* ---------- moving the words across ----------
     SCTP will not take one enormous message, so anything sizeable goes
     over in numbered pieces and is put back together at the far end. */
  raw(obj) {
    if (!Link.dc || Link.dc.readyState !== 'open') return false;
    const s = JSON.stringify(obj);
    const CH = 48000, id = uid(), parts = Math.max(1, Math.ceil(s.length / CH));
    for (let i = 0; i < parts; i++) {
      Link.dc.send(JSON.stringify({ id: id, i: i, of: parts, d: s.slice(i * CH, (i + 1) * CH) }));
    }
    Link.bytes += s.length;
    return true;
  },

  take(txt) {
    let p; try { p = JSON.parse(txt); } catch (e) { return; }
    if (p.of === undefined) return;
    const b = Link.buf[p.id] = Link.buf[p.id] || { n: 0, of: p.of, parts: [] };
    if (b.parts[p.i] === undefined) { b.parts[p.i] = p.d; b.n++; }
    if (b.n < b.of) return;
    delete Link.buf[p.id];
    let o; try { o = JSON.parse(b.parts.join('')); } catch (e) { return; }
    Link.handle(o);
  },

  handle(o) {
    if (o.k === 'hello') {
      if (o.me === S.me) { Link.reset(); sameSideOnLink(); return; }
      Link.theirName = o.name || nameOf(other(S.me));
      Link.theirUpd = o.upd || {};
      Link.push(true);
      return;
    }
    if (o.k === 'delta') {
      /* they obviously hold everything they just sent — do not bounce it back */
      Link.theirUpd = Object.assign({}, Link.theirUpd, (o.s && o.s.upd) || {});
      const inc = Object.assign({}, o.s, { me: other(S.me) });
      snap('before the direct link merged').then(id => {
        const n = mergeIn(inc);
        if (n) {
          S.undo = { id: id, what: 'took ' + Link.theirName + '’s latest over the direct link', at: Date.now() };
          save(true);
          toast(Link.theirName + ' sent ' + n + ' thing' + (n === 1 ? '' : 's') + ' across.', 3000);
          go(S.view || 'today');
        }
        /* tell them what we now hold so they stop resending it */
        Link.raw({ k: 'upd', upd: S.upd });
      });
      return;
    }
    if (o.k === 'upd') { Link.theirUpd = Object.assign({}, Link.theirUpd, o.upd || {}); return; }
  },

  push(force) {
    if (!Link.live() || Link.sending) return;
    const d = deltaFor(Link.theirUpd);
    const any = Object.keys(d.answers).length || d.board.length || d.dock.length || (force && Object.keys(d.progress).length);
    if (!any && !force) return;
    Link.sending = true;
    const sent = Link.raw({ k: 'delta', s: d });
    Link.sending = false;
    if (sent) Link.theirUpd = Object.assign({}, Link.theirUpd, d.upd);
  },

  nudge() { clearTimeout(Link.t); Link.t = setTimeout(() => Link.push(), 2500); }
};

/* everything of mine that they do not already have, and nothing else */
function deltaFor(theirUpd) {
  const t = theirUpd || {};
  const out = { me: S.me, couple: S.couple, prof: S.prof, upd: {}, answers: {}, board: [], dock: [], progress: {} };
  for (const dn in S.answers) {
    for (const id in S.answers[dn]) {
      const cell = S.answers[dn][id];
      ['a', 'b', 'us'].forEach(w => {
        if (cell[w] === undefined) return;
        const k = 'ans:' + dn + ':' + id + ':' + w;
        const mine = S.upd[k] || 1;
        if (mine <= (t[k] || 0)) return;
        out.answers[dn] = out.answers[dn] || {};
        out.answers[dn][id] = out.answers[dn][id] || {};
        out.answers[dn][id][w] = cell[w];
        out.upd[k] = mine;
      });
    }
  }
  S.board.forEach(c => { const k = 'card:' + c.id; const mine = S.upd[k] || 1; if (mine > (t[k] || 0)) { out.board.push(c); out.upd[k] = mine; } });
  S.dock.forEach(c => { const k = 'dock:' + c.id; const mine = S.upd[k] || 1; if (mine > (t[k] || 0)) { out.dock.push(c); out.upd[k] = mine; } });
  for (const dn in S.progress) if (S.progress[dn] && S.progress[dn].done) out.progress[dn] = S.progress[dn];
  return out;
}

/* ---------- handshake codes ---------- */
async function linkCode(kind, obj) {
  const { z, d } = await gzipB64(JSON.stringify(obj));
  return 'T90' + kind + (z ? 'Z' : 'P') + '.' + d + '#';
}
async function readLink(input) {
  const s = String(input || '').trim();
  if (!s) throw new Error('empty');
  const m = s.match(/T90([OA])([ZP])\./);
  if (!m) throw new Error('notalink');
  const i = s.indexOf(m[0]);
  let body = s.slice(i + m[0].length);
  const stop = body.indexOf('#'); if (stop > -1) body = body.slice(0, stop);
  body = body.replace(/\s+/g, '').replace(B64OK, '');
  if (body.length < 16) throw new Error('truncated');
  let o; try { o = JSON.parse(await ungzipB64(body, m[2] === 'Z')); } catch (e) { throw new Error('truncated'); }
  return o;
}
function linkError(e) {
  const m = (e && e.message) || '';
  if (m === 'empty') return 'Nothing pasted.';
  if (m === 'notalink') return 'That is not a direct-link code. They start with T90O or T90A.';
  if (m === 'truncated') return 'That code is cut off — copy all of it, from T90 to the closing #.';
  if (m === 'wrongway') return 'That is the wrong half of the handshake. The person who started it pastes the ANSWER; the other one pastes the INVITE.';
  if (m === 'sameside') return 'You are both set to the same partner. Fix that in the sidebar first, or your answers land in the same column.';
  if (m === 'nooffer') return 'Start an invite on this copy first, then paste their answer back here.';
  return 'That code did not open.';
}
function sameSideOnLink() {
  modal('<h3>You are both set to the same partner</h3>' +
    '<div class="sub" style="margin:8px 0 14px">The line opened and closed again straight away, because both copies say they are <b>' + esc(nameOf(S.me)) + '</b>. Nothing was sent. One of you has to be ' + esc(nameOf('a')) + ' and the other ' + esc(nameOf('b')) + '.</div>' +
    '<div class="row" style="flex-direction:column;align-items:stretch;gap:8px">' +
    '<button class="btn pri" data-act="swapside">I am ' + esc(nameOf(other(S.me))) + ' — switch this copy</button>' +
    '<button class="btn gh" data-act="closemodal">The other one will switch</button></div>');
}

function paintLink() {
  const el = $('#linkpill'); if (!el) return;
  const on = Link.live();
  el.style.display = (on || Link.state === 'lost') ? '' : 'none';
  el.className = 'pill' + (on ? ' live' : ' warn');
  el.textContent = on ? '● direct to ' + (Link.theirName || nameOf(other(S.me))) : '● line dropped';
}

/* ============================================================
   Together / 90 — the schedule
   ------------------------------------------------------------
   The content is ninety-two sittings. Real life is not ninety-two
   evenings in a row — it is the nights you are both free, minus the
   trips, the busy weeks and everything else a life is made of.

   So the days stop being dates. A session is one evening, and it
   carries however many days of material fit in the time you have.
   One Arrive at the start, one Land at the end, the practice blocks
   stacked in between. Miss one and everything repacks across the
   evenings you have left; the app tells you what that did to the
   length rather than quietly making every night longer.
   ============================================================ */

/* the week, as getDay() numbers */
const WDAY = [['Sun', 0], ['Mon', 1], ['Tue', 2], ['Wed', 3], ['Thu', 4], ['Fri', 5], ['Sat', 6]];

function planBlank() {
  const start = (S && S.couple && S.couple.start) || todayISO();
  return {
    on: false,                    // off until you turn it on: one day of material at a time
    to: isoAdd(start < todayISO() ? todayISO() : start, 91),
    days: [0, 1, 2, 3, 4, 5, 6],  // every evening until you say otherwise
    mins: 45,                     // the longest an evening is allowed to get
    skips: [],
    why: ''
  };
}

/* These get an evening to themselves on purpose. Day 18 is the thing you have
   never said you wanted, and the exercise ends with "you get to react tomorrow";
   day 90 is the letter. Burying either of them third in a stack wastes them. */
const ALONE = { '18': 1, '90': 1 };
/* and a sitting must *begin* here — round two of the dreamer conversation
   cannot share an evening with round one */
const BRK = { '45': 1 };

function planOn() { return !!(S.plan && S.plan.on); }
function isoDow(iso) { const d = new Date(iso + 'T12:00'); return d.getDay(); }
function isoAdd(iso, n) { const d = new Date(iso + 'T12:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); }
function fmtDay(iso) { const d = new Date(iso + 'T12:00'); return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' }); }
function fmtDayLong(iso) { const d = new Date(iso + 'T12:00'); return d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' }); }
function skipAt(iso) {
  return ((S.plan && S.plan.skips) || []).find(s => iso >= s.a && iso <= (s.b || s.a)) || null;
}

/* every evening still available between today and the finish line */
function planSlots() {
  const p = S.plan; if (!p) return [];
  /* tonight is spent once tonight's sitting is done */
  const out = []; let c = (p.done && p.done >= todayISO()) ? isoAdd(todayISO(), 1) : todayISO();
  let guard = 0;
  while (c <= p.to && guard++ < 400) {
    if (p.days.indexOf(isoDow(c)) > -1 && !skipAt(c)) out.push(c);
    c = isoAdd(c, 1);
  }
  return out;
}
function daysLeft() { return DAYS.filter(d => !isDone(d.k)); }
function sessionMins(ds) { return 2 + ds.reduce((n, d) => n + ((d.seg && d.seg[1]) || 9), 0) + 4; }

/* spread what is left across the evenings that are left.
   Each ALONE day eats a whole evening, so reserve one for each before
   working out how thick the ordinary sittings have to be. */
function planSessions() {
  const slots = planSlots(), todo = daysLeft();
  const out = []; let i = 0;
  for (let s = 0; s < slots.length && i < todo.length; s++) {
    const rest = todo.slice(i);
    const solo = rest.filter(d => ALONE[d.k]).length;
    const bulk = rest.length - solo;
    const room = Math.max(1, (slots.length - s) - solo);
    const want = Math.max(1, Math.ceil(bulk / room));
    const cap = (S.plan && S.plan.mins) || 45;
    const group = [];
    while (group.length < want && i < todo.length) {
      const k = todo[i].k;
      if (group.length && (BRK[k] || ALONE[k])) break;
      if (group.length && sessionMins(group.concat([todo[i]])) > cap) break;
      group.push(todo[i]); i++;
      if (ALONE[k]) break;
    }
    if (!group.length) break;
    out.push({ n: out.length + 1, date: slots[s], days: group, mins: sessionMins(group) });
  }
  out.over = todo.slice(i);           // no evening left for these
  out.slots = slots.length;
  return out;
}

/* the one you are doing now: today's, or the next one up */
function curSession() {
  const all = planSessions();
  if (!all.length) return null;
  const t = todayISO();
  return all.find(s => s.date >= t) || all[0];
}
function sessionKey(s) { return s.days[0].k; }      // Arrive / Land live on the first day

/* ============================================================
   VIEW: the session
   ============================================================ */
function sessionView() {
  const s = curSession();
  if (!s) return planDoneView();
  const dn = sessionKey(s);
  const all = planSessions();
  const late = s.date < todayISO();
  const today = s.date === todayISO();

  let h = '';
  if (!today && !late) {
    h += '<div class="note warm" style="margin-bottom:16px"><strong>Tonight&rsquo;s is already done.</strong> ' +
      'This is the one scheduled for ' + esc(fmtDayLong(s.date)) + '. Doing it early is allowed — everything after it just gets lighter.</div>';
  }
  if (S.paused) {
    h += '<div class="card" style="margin-bottom:18px"><div class="eyebrow">Paused</div><h3 style="margin:6px 0 8px">You put this down on ' + esc(new Date(S.paused.at).toLocaleDateString()) + '</h3>' +
      '<div class="sub">Nothing was lost and nothing expired. The plan repacks around however long you were away.</div>' +
      '<div class="row" style="margin-top:14px"><button class="btn pri" data-act="unpause">Pick it back up</button>' +
      '<button class="btn gh" data-act="heavy">Read the off-ramp again</button></div></div>';
  } else if (gapDays() >= 5 && doneCount() > 0) {
    h += '<div class="card" style="margin-bottom:18px"><div class="eyebrow">Welcome back</div>' +
      '<h3 style="margin:6px 0 8px">It has been ' + gapDays() + ' days. The plan already absorbed it.</h3>' +
      '<div class="sub">Nothing to catch up on and no streak to rebuild — what was left just got spread across the evenings you have. Five minutes of re-entry first is usually worth it.</div>' +
      '<div class="row" style="margin-top:14px"><button class="btn" data-act="reentry">Five-minute re-entry</button>' +
      '<button class="btn pri" data-act="dismissgap">Straight into the session</button></div></div>';
  }
  if (Store.failed) h += '<div class="banner" style="background:var(--hot-bg);color:#8f2b23"><span>⚠︎</span><div><b>This browser has stopped saving — it is out of room.</b> Open Backup &amp; sharing, download a backup, then remove a photo or two.</div></div>';

  h += '<div class="dayhead"><div class="kicker">' +
    '<span class="dnum">Session ' + s.n + ' of ' + all.length + '</span>' +
    '<span class="tag' + (today ? '' : late ? ' r3' : ' r1') + '">' + esc(fmtDay(s.date)) + (today ? ' · tonight' : late ? ' · overdue' : ' · you are ahead') + '</span>' +
    '<span class="tag">' + s.mins + ' min</span>' +
    (s.days.some(d => d.analog) ? '<span class="tag r2">off-screen</span>' : '') +
    '</div><h1>' + esc(s.days[0].t) + '</h1>' +
    (s.days.length > 1
      ? '<div class="whyline">and then ' + s.days.slice(1).map(d => '<b>' + esc(d.t) + '</b>').join(', ') + '.</div>'
      : '<div class="whyline">' + s.days[0].why + '</div>') +
    '</div>';

  const heavy = s.days.some(d => (WEEKS[d.w - 1] || {}).heavy);
  h += '<div class="fivemin"><b>If tonight falls apart</b> — do the check-in, answer “' + esc(fiveMin(s.days[0])) + '”, and say the appreciation out loud. The rest moves to the next evening on its own.</div>';
  if (heavy) h += '<div class="note sharp" style="margin:12px 0"><strong>This is one of the harder stretches.</strong> If anything lands badly, stop — there is a way out at the bottom of this page, and using it is not quitting.</div>';

  let i = 1;
  h += '<div class="seg"><div class="seghd"><span class="sn">' + (i++) + '</span><h3>Arrive</h3><span class="mins">2 min</span></div><div class="segbd">';
  arriveBlocks().forEach(b => { h += renderBlock(b, dn, 'together'); });
  h += '</div></div>';

  s.days.forEach(d => {
    const mode = effMode(d);
    h += '<div class="seg"><div class="seghd"><span class="sn">' + (i++) + '</span><h3>' + esc(d.t) + '</h3>' +
      '<span class="modetag ' + mode + '">' + mode + '</span>' +
      '<span class="mins">' + ((d.seg && d.seg[1]) || 9) + ' min</span></div><div class="segbd">' +
      '<div class="note" style="margin-bottom:18px"><b>Day ' + d.lbl + '.</b> ' + d.why + '</div>';
    d.blocks.forEach(b => { h += renderBlock(b, d.k, mode); });

/* ---------- handlers ---------- */
function handlePlanClick(act, t) {
  if (act === 'plantoggle') { S.plan = S.plan || planBlank(); S.plan.on = !S.plan.on; stamp('plan'); save(true); go(S.view); return true; }
  if (act === 'planday') {
    const d = +t.dataset.d, a = S.plan.days, i = a.indexOf(d);
    if (i > -1) { if (a.length > 1) a.splice(i, 1); } else a.push(d);
    a.sort(); stamp('plan'); save(true); go(S.view); return true;
  }
  if (act === 'planmins') { S.plan.mins = +t.dataset.m; stamp('plan'); save(true); go(S.view); return true; }
  if (act === 'planskipadd') {
    const a = ($('#sk_a') || {}).value, b = ($('#sk_b') || {}).value || a, tt = (($('#sk_t') || {}).value || 'Away').trim();
    if (!a) { toast('Pick a start date.'); return true; }
    S.plan.skips = (S.plan.skips || []).concat([{ a: a, b: b < a ? a : b, t: tt }]);
    S.plan.skips.sort((x, y) => x.a < y.a ? -1 : 1);
    stamp('plan'); save(true); go(S.view); toast('Blocked out.'); return true;
  }
  if (act === 'planskipdel') { S.plan.skips.splice(+t.dataset.i, 1); stamp('plan'); save(true); go(S.view); return true; }
  if (act === 'planextend') { S.plan.to = isoAdd(S.plan.to < todayISO() ? todayISO() : S.plan.to, 42); stamp('plan'); save(true); go('path'); toast('Finish date moved to ' + fmtDay(S.plan.to) + '.'); return true; }
  if (act === 'sessdone') {
    const s = curSession(); if (!s) return true;
    const mins = T.spent > 60 ? Math.max(1, Math.round(T.spent / 60)) : 0;
    s.days.forEach(d => {
      S.progress[d.k] = { done: true, at: new Date().toISOString(), mins: 0 };
      stamp('prog:' + d.k);
    });
    S.progress[sessionKey(s)].mins = mins;
    S.plan.done = todayISO();
    S.sessions = (S.sessions || []).concat([{ k: sessionKey(s), at: Date.now(), mins: mins }]).slice(-200);
    tReset(); save(true);
    snap('session ' + s.n + ' complete');
    if (typeof Live !== 'undefined' && Live.ok) Live.write();
    if (typeof Pair !== 'undefined' && Pair.ok) Pair.push();
    if (typeof Link !== 'undefined' && Link.live()) Link.push(true);
    beep(740, .18); setTimeout(() => beep(988, .3), 170);
    const nx = curSession();
    toast(nx ? ('Logged. Next one is ' + fmtDay(nx.date) + '.') : 'That is the last of it.', 3600);
    go('today'); setTimeout(maybeNudge, 900); return true;
  }
  return false;
}
function handlePlanInput(t) {
  if (!t.dataset.plan) return false;
  S.plan = S.plan || planBlank();
  S.plan[t.dataset.plan] = t.value;
  stamp('plan'); save(); if (t.dataset.plan === 'to') go('path');

/* ---------- deep field binding (used by widgets) ---------- */
function dfGet(dn, id, who, path) {
  let o = A(dn, id)[who]; if (!o || typeof o !== 'object') return '';
  const p = path.split('.');
  for (const k of p) { if (o == null) return ''; o = o[k]; }
  return o == null ? '' : o;
}
function dfSet(dn, id, who, path, val) {
  S.answers[dn] = S.answers[dn] || {};
  S.answers[dn][id] = S.answers[dn][id] || {};
  let root = S.answers[dn][id][who];
  if (!root || typeof root !== 'object' || Array.isArray(root)) root = {};
  let o = root; const p = path.split('.');
  for (let i = 0; i < p.length - 1; i++) {
    const k = p[i], nx = p[i + 1];
    if (o[k] == null || typeof o[k] !== 'object') o[k] = /^\d+$/.test(nx) ? [] : {};
    o = o[k];
  }
  o[p[p.length - 1]] = val;
  S.answers[dn][id][who] = root;
  stamp('ans:' + dn + ':' + id + ':' + who);
  save();
}
function df(dn, id, who, path, ph, tag, rows) {
  const v = dfGet(dn, id, who, path);
  const a = 'data-df="' + dn + '|' + id + '|' + who + '|' + path + '"';

  return '<input type="text" class="inp" ' + a + ' placeholder="' + esc(ph || '') + '" value="' + esc(v) + '">';
}

    '<div class="softbuild">I feel ' + df(dn, 'soft', who, 'feel', 'lonely / scared / stretched thin') +

}

function wCurrency() {
  const ra = llRank('a'), rb = llRank('b');

function wDockpick(dn) {

function wRiskdoor(dn) {

function wRecap(dn) {

VIEWS.after_board = function () { if ((S.boardMode || 'free') === 'free') wireDrag(); };

function wireDrag() {
  const cv = $('#boardcanvas'); if (!cv) return;
  let cur = null, ox = 0, oy = 0;
  cv.addEventListener('pointerdown', e => {
    const c = e.target.closest('.bcard'); if (!c || e.target.closest('button')) return;
    cur = c; c.classList.add('drag'); c.setPointerCapture(e.pointerId);
    ox = e.clientX - c.offsetLeft; oy = e.clientY - c.offsetTop;
  });
  cv.addEventListener('pointermove', e => {
    if (!cur) return; e.preventDefault();
    cur.style.left = Math.max(0, e.clientX - ox) + 'px';
    cur.style.top = Math.max(0, e.clientY - oy) + 'px';
  });
  const end = () => {
    if (!cur) return;
    const o = S.board.find(x => x.id === cur.dataset.id);
    if (o) { o.x = parseInt(cur.style.left) || 0; o.y = parseInt(cur.style.top) || 0; stamp('card:' + o.id); save(); }
    cur.classList.remove('drag'); cur = null;
  };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
}

    arr.map(o => '<button class="chip ' + (c[key] === o ? 'on' : '') + '" data-act="cardset" data-k="' + key + '" data-v="' + esc(o) + '">' + esc(o) + '</button>').join('') + '</div>';
  const m = modal('<h3>' + (id ? 'Edit card' : 'New card') + '</h3><div class="tiny" style="margin-bottom:14px">A dream, a desire, a need, a fear worth naming, or a promise you made.</div>' +

    '<div class="spacer"></div><label class="fl">Why it matters / what it would look like</label><textarea class="inp" id="c_note" rows="3">' + esc(c.note) + '</textarea>' +
    '<div class="spacer"></div><div class="grid2"><div><label class="fl">Emoji</label><input class="inp" id="c_emoji" maxlength="4" value="' + esc(c.emoji || '') + '" placeholder="🌍"></div>' +
    '<div><label class="fl">Image (optional)</label><input class="inp" type="file" id="c_img" accept="image/*"></div></div><div class="spacer"></div>' +
    pickRow('Whose is it?', 'owner', ['a', 'b', 'us']).replace('>a<', '>' + esc(nameOf('a')) + '<').replace('>b<', '>' + esc(nameOf('b')) + '<') +
    pickRow('Kind', 'cat', CATS) + pickRow('Risk', 'risk', RISKS) + pickRow('Where it is', 'status', STATUS) +
    '<div class="row" style="margin-top:8px"><button class="btn pri" data-act="cardsave" data-id="' + c.id + '" data-new="' + (id ? 0 : 1) + '">Save</button>' +

    (id ? '<button class="btn dg" data-act="carddel" data-id="' + c.id + '" style="margin-left:auto">Delete</button>' : '') + '</div>');
  m._draft = c;
  $('#c_img', m).addEventListener('change', ev => {
    const f = ev.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      const im = new Image();
      im.onload = () => {
        const cn = document.createElement('canvas');
        const sc = Math.min(1, 420 / im.width); cn.width = im.width * sc; cn.height = im.height * sc;
        cn.getContext('2d').drawImage(im, 0, 0, cn.width, cn.height);
        c.img = cn.toDataURL('image/jpeg', .72); toast('Image attached');
      };
      im.src = r.result;
    };
    r.readAsDataURL(f);
  });
}

    [['auto', 'Use what each day suggests'], ['together', 'Always together, one screen'], ['solo', 'Always private, then reveal'], ['handoff', 'Always hand off']].map(o => '<option value="' + o[0] + '" ' + (S.settings.defaultMode === o[0] ? 'selected' : '') + '>' + o[1] + '</option>').join('') + '</select></div>' +

  const am = avgMins(), ns = (S.sessions || []).filter(x => x.mins > 0).length;

        : 'Close to the fifteen it promises. Keep it there and this stays sustainable.') + '</div>'
    : '<div class="tiny">Start the timer on a day and this fills in. It records what a session really costs you, which is the number that decides whether this survives.</div>') +

function mergeIn(inc) {
  const src = inc.me || other(S.me);          // the slot the incoming file owns
  let n = 0;
  // answers: take the sender's own column, plus 'us' if newer
  for (const dn in (inc.answers || {})) {
    for (const id in inc.answers[dn]) {
      const cell = inc.answers[dn][id];
      ['a', 'b', 'us'].forEach(w => {
        if (cell[w] === undefined) return;
        const take = (w === src) || (w === 'us' && (inc.upd || {})['ans:' + dn + ':' + id + ':us'] > ((S.upd || {})['ans:' + dn + ':' + id + ':us'] || 0));
        if (!take) return;
        S.answers[dn] = S.answers[dn] || {}; S.answers[dn][id] = S.answers[dn][id] || {};
        if (JSON.stringify(S.answers[dn][id][w]) !== JSON.stringify(cell[w])) { S.answers[dn][id][w] = cell[w]; n++; }
      });
    }
  }
  // profile of the sender
  if (inc.prof && inc.prof[src]) { S.prof[src] = inc.prof[src]; n++; }
  // progress: union
  for (const dn in (inc.progress || {})) if (!S.progress[dn]) { S.progress[dn] = inc.progress[dn]; n++; }
  // board + dock: by id, newest wins
  (inc.board || []).forEach(c => {
    const mine = S.board.find(x => x.id === c.id);
    if (!mine) { S.board.push(c); n++; }
    else if (((inc.upd || {})['card:' + c.id] || 0) > ((S.upd || {})['card:' + c.id] || 0)) { Object.assign(mine, c); n++; }
  });
  (inc.dock || []).forEach(c => {
    const mine = S.dock.find(x => x.id === c.id);
    if (!mine) { S.dock.push(c); n++; }
    else if (((inc.upd || {})['dock:' + c.id] || 0) > ((S.upd || {})['dock:' + c.id] || 0)) { Object.assign(mine, c); n++; }
  });
  // the schedule belongs to both of you — newest edit wins
  if (inc.plan && ((inc.upd || {})['plan'] || 0) > ((S.upd || {})['plan'] || 0)) { S.plan = inc.plan; n++; }
  for (const k in (inc.upd || {})) if ((inc.upd[k] || 0) > (S.upd[k] || 0)) S.upd[k] = inc.upd[k];
  if (inc.couple) { if (!S.couple.setup) S.couple = inc.couple; }
  save(true);
  return n;
}

/* both partners left themselves on the same side: move this device's writing
   from one column to the other so nothing is lost */
function swapSides() {
  const sw = o => { const t = o.a; o.a = o.b; o.b = t; if (o.a === undefined) delete o.a; if (o.b === undefined) delete o.b; };
  for (const d in S.answers) for (const id in S.answers[d]) sw(S.answers[d][id]);
  sw(S.prof);
  S.board.forEach(c => { if (c.owner === 'a') c.owner = 'b'; else if (c.owner === 'b') c.owner = 'a'; });
  S.dock.forEach(c => { if (c.who === 'a') c.who = 'b'; else if (c.who === 'b') c.who = 'a'; });
  const u = {}; for (const k in S.upd) u[k.replace(/:a$/, ':@').replace(/:b$/, ':a').replace(/:@$/, ':b')] = S.upd[k];
  S.upd = u; S.me = other(S.me);
  if (S.pair) S.pair.seen = null;
  save(true);
}

function fileChooser(o) {
  window._inc = o;
  const who = o.me === 'b' ? 'b' : 'a';
  const authorName = (o.couple && (who === 'a' ? o.couple.a : o.couple.b)) || 'whoever made it';
  const days = Object.keys(o.answers || {}).length;
  const done = Object.keys(o.progress || {}).filter(k => o.progress[k] && o.progress[k].done).length;
  const when = o.savedAt ? new Date(o.savedAt).toLocaleString() : 'an unknown time';
  const facts = '<div class="note" style="margin-bottom:16px">Written by <b>' + esc(authorName) + '</b> · saved ' + esc(when) +
    ' · ' + days + ' day' + (days === 1 ? '' : 's') + ' of answers · ' + done + ' marked complete</div>';
  if (o.me && o.me === S.me) {
    modal('<h3>Careful — this looks like your own side</h3>' + facts +
      '<div class="sub" style="margin-bottom:14px">This device is set to <b>' + esc(nameOf(S.me)) + '</b>, and so is that file. If you merge it as-is, its answers go into <b>your</b> column and overwrite what you have written.</div>' +

  modal('<h3>What is this file?</h3>' + facts +

    '<button class="btn gh" data-act="closemodal">Cancel</button></div>' +
    '<div class="tiny" style="margin-top:14px">Merging is almost always the one you want. Replacing is for putting your own backup back after a wipe — it deletes what is currently here. Either way a restore point is taken first, so it can be undone.</div>');
}

async function paintSnaps() {
  const host = $('#snaplist'); if (!host) return;
  const all = await snaps();
  const c = $('#snapcount'); if (c) c.textContent = all === null ? 'unavailable in this browser' : (all.length + ' kept, newest first');
  if (!all || !all.length) { host.innerHTML = '<div class="tiny">None yet. One is taken automatically each time you finish a day.</div>'; return; }
  host.innerHTML = all.map(r => '<div class="snap"><div class="ht"><b>' + new Date(r.at).toLocaleString() + '</b>' +
    '<span>day ' + r.day + ' · ' + r.done + ' complete · ' + esc(r.label) + '</span></div>' +
    '<button class="btn sm" data-act="snaprestore" data-id="' + r.id + '" style="margin-left:auto">Restore</button></div>').join('');
}

VIEWS.guide = function () {
  return '<h1 style="font-size:26px;margin-bottom:6px">How to use this</h1>' +
    '<div class="sub" style="max-width:72ch;margin-bottom:18px">Fifteen minutes. Every day. Ninety-two sessions across thirteen weeks, ending on day 91 — days 3a and 3b are one weekend, done off-screen with scissors and paper. The consistency is doing more work than any single exercise.</div>' +
    '<div class="card"><div class="eyebrow">The shape of a day</div><div class="spacer"></div>' +
    '<ol class="steps"><li><b>Arrive — 2 minutes.</b> A word, an energy level, a temperature. Do not skip it; it is the data that shows you the trend later.</li>' +
    '<li><b>Practice — 9 minutes.</b> The day’s actual work. Some days you write. Some days you talk and barely type. When the timer chimes, stop even if you are mid-sentence — you will pick it up tomorrow.</li>' +
    '<li><b>Land — 4 minutes.</b> One move with a when. One appreciation, spoken out loud, in your partner’s currency, not yours.</li></ol></div>' +
    '<div class="card"><div class="eyebrow">The three modes</div><div class="spacer"></div>' +
    '<div class="note"><strong>Together</strong> — one screen, side by side, out loud. Best for the days where the talking is the point.</div><div class="spacer"></div>' +
    '<div class="note"><strong>Private, then reveal</strong> — you each answer without seeing the other, then tap reveal. This is how you find out what you actually think before you find out what they think. The blur is the whole feature.</div><div class="spacer"></div>' +
    '<div class="note"><strong>Handoff</strong> — one of you fills your side, then passes the device or sends a code. For the days you are not in the same room.</div>' +
    '<div class="tiny" style="margin-top:12px">Each day suggests the mode that works best for it, but you can override all of them in <b>Us</b> if one way fits your life better. Mixing is fine and expected.</div></div>' +
    '<div class="card"><div class="eyebrow">Four rules that make it work</div><div class="spacer"></div>' +
    '<div class="note warm"><strong>1. Nothing here becomes ammunition.</strong> The moment one of you quotes this back in a fight, the other stops telling the truth in it, and you are left with a very pretty empty box.</div><div class="spacer"></div>' +
    '<div class="note warm"><strong>2. Fifteen minutes is the floor, not a cage.</strong> If the conversation is going somewhere, stay in it. If you only have five, do the check-in, the one anchor question at the top of the day, and the appreciation.</div><div class="spacer"></div>' +
    '<div class="note warm"><strong>3. If you are flooded, stop and say so.</strong> Take twenty minutes minimum, say when you are coming back, and come back. A stopped session is not a failed one.</div><div class="spacer"></div>' +
    '<div class="note warm"><strong>4. Miss a day, do not miss two.</strong> Do not "catch up" by doing four days at once. Just pick up where you left off.</div></div>' +
    '<div class="card"><div class="eyebrow">What the parts are for</div><div class="spacer"></div>' +
    '<div class="sub"><b>Vision board</b> — where dreams, desires, needs, fears and promises live as objects you can move. Cards get added by the exercises. Their status moves Someday → Named → Dated → Doing → Lived.<br><br>' +
    '<b>Decision dock</b> — the things you go quiet about. It fills up on its own from week four. A decision leaves the dock only when it has a date and an actual call.<br><br>' +
    '<b>Us</b> — the love-language profile everything else leans on, plus your running record.<br><br>' +
    '<b>Backup &amp; sharing</b> — where you connect the two copies and keep this safe.</div></div>' +
    '<div class="card"><div class="eyebrow">Staying in step</div><h3 style="margin:6px 0 8px">Two ways, and they solve different problems</h3><div class="spacer"></div>' +
    '<div class="note"><strong>The direct link</strong> — a real peer-to-peer connection between the two browsers. You hand each other two codes once (that is the introduction two browsers cannot make on their own), and after that everything either of you writes crosses directly, in a second, through nothing. Same wifi needs nothing else at all; different networks needs one question to a STUN server about your own address, which you turn on with a tick box. Both copies have to be open at the same time, and tomorrow needs fresh codes.</div><div class="spacer"></div>' +
    '<div class="note"><strong>The shared folder</strong> — for when you are not online together. Point both copies at one folder in Dropbox, iCloud Drive, OneDrive or Google Drive. Each writes only its own half and reads only the other half, so neither can overwrite the other, and it catches up whenever the folder next syncs. Chrome or Edge on a laptop. The pairing lives in the browser, not in this file, so a newer build keeps it.</div>' +
    '<div class="tiny" style="margin-top:12px">Neither one uploads anything to us, because there is no us — this file has no server behind it and never calls one. A file or a pasted code still works for everything else, including phones.</div>' +
    '<div class="row" style="margin-top:14px"><button class="btn pri" data-act="nav" data-v="sync">Open Backup &amp; sharing</button></div></div>' +
    '<div class="card"><div class="eyebrow">Photos</div><div class="spacer"></div>' +
    '<div class="sub">Day 3b takes photographs of the paper board, and you each get your own slot with room for several. To get them off a phone: AirDrop to the laptop and drag the file straight onto your slot, or copy on the phone and press ⌘V on the page. In Safari on a Mac, <b>Add a photo</b> can also shoot straight from a nearby iPhone.<br><br>' +
    'A QR code cannot carry a photo — they hold about three kilobytes and a photo is hundreds of times that — and a scannable link would need a server this file does not have. If you do fill photos in on a phone copy, <b>Send just the photos</b> makes a small file to AirDrop back.</div></div>' +
    '<div class="card"><div class="eyebrow">Your data, plainly</div><div class="spacer"></div>' +
    '<div class="sub">Everything lives in this browser, on this device. There is no account and no server — the file never calls anywhere, and it works with the wifi off.<br><br>' +
    'That also means <b>backing up is on you</b>. Four things help: restore points kept automatically in the browser, the shared folder if you paired one, an optional live backup file that rewrites itself as you work, and backups you download. Do the last one at the end of each week.</div></div>' +
    '<div class="card"><div class="eyebrow">When it goes wrong</div><div class="spacer"></div>' +
    '<div class="sub">Every single day has a quiet <b>“This is getting heavy”</b> link at the bottom. It stops the session, reminds you of your own break protocol, and says plainly what this tool is not for. Using it is not quitting — weeks four to seven are designed to bring up hard things, and stopping when one lands badly is the skill, not the failure.<br><br>' +
    'You can also <b>pause the whole programme</b> from there. No date, no streak, no guilt. It waits.</div></div>' +
    '<div class="card"><div class="eyebrow">Honest limits</div><div class="spacer"></div>' +
    '<div class="sub">This is a structured self-help tool built on well-known frameworks — the five love languages, Gottman-style conflict repair, fear-setting and regret minimisation, and needs-and-values clarification. It is not therapy and it is not a substitute for a licensed couples therapist. If there is abuse, coercion, or fear in your relationship, please talk to a professional instead of a worksheet.</div></div>';
};

/* ============================================================
   VIEW EVENT HANDLERS
   ============================================================ */
function handleViewClick(act, t, e) {
  if (typeof handlePlanClick === 'function' && handlePlanClick(act, t)) return;
  if (act === 'nav2sync') { closeModal(); go('sync'); return; }
  if (act === 'llpick') {
    const w = t.dataset.w, i = t.dataset.i, k = t.dataset.k;
    S.prof[w] = S.prof[w] || {}; S.prof[w].llraw = S.prof[w].llraw || {};
    S.prof[w].llraw[i] = k; llScore(w);
    const p = t.parentElement; $$('.qzopt', p).forEach(x => x.classList.remove('on', 'b'));
    t.classList.add('on'); if (w === 'b') t.classList.add('b');
    const done = Object.keys(S.prof[w].llraw).length;
    if (done === LLQ.length) { toast(nameOf(w) + '’s profile is complete.'); go(S.view); }
    return;
  }
  if (act === 'llclear') { S.prof[t.dataset.w] = {}; save(true); go(S.view); return; }
  if (act === 'lltoggle') { S.llopen = S.llopen || {}; S.llopen[t.dataset.w] = !S.llopen[t.dataset.w]; save(); go(S.view); return; }
  if (act === 'valpick') {
    const dn = t.dataset.k, w = t.dataset.w, v = t.dataset.v;
    let sel = A(dn, 'values')[w]; if (!Array.isArray(sel)) sel = [];
    const i = sel.indexOf(v); if (i > -1) sel.splice(i, 1); else sel.push(v);
    setA(dn, 'values', w, sel); go('today', ordOf(dn)); return;
  }
  if (act === 'dfscale') { const [dn, id, w, p] = t.dataset.df.split('|'); dfSet(dn, id, w, p, +t.dataset.val); $$('button', t.parentElement).forEach(x => x.classList.remove('on')); t.classList.add('on'); return; }
  if (act === 'pickdock') { setA(t.dataset.k, 'focus', 'us', t.dataset.id); go('today', ordOf(t.dataset.k)); return; }

  if (act === 'newcard') { cardModal(null, t.dataset.k || day(S.cur).k); return; }
  if (act === 'editcard') { cardModal(t.dataset.id); return; }
  if (act === 'cardset') {
    const m = $('#modal'); if (!m || !m._draft) return;
    m._draft[t.dataset.k] = t.dataset.v;
    $$('.chip', t.parentElement).forEach(x => x.classList.remove('on')); t.classList.add('on'); return;
  }
  if (act === 'cardsave') {
    const m = $('#modal'); const c = m._draft;
    c.title = $('#c_title').value.trim(); c.note = $('#c_note').value.trim(); c.emoji = $('#c_emoji').value.trim();
    if (!c.title) { toast('Give it a title first'); return; }
    if (t.dataset.new === '1') S.board.push(c);
    stamp('card:' + c.id); save(true); closeModal(); toast('On the board.');
    go(S.view === 'board' ? 'board' : S.view); return;
  }
  if (act === 'carddel') { S.board = S.board.filter(x => x.id !== t.dataset.id); save(true); closeModal(); go(S.view); return; }
  if (act === 'bmode') { S.boardMode = t.dataset.m; save(); go('board'); return; }
  if (act === 'tidy') {
    S.board.forEach((c, i) => { c.x = 30 + (i % 7) * 232; c.y = 30 + Math.floor(i / 7) * 200; stamp('card:' + c.id); });
    save(true); go('board'); return;
  }

  if (act === 'newdock') { dockModal(t.dataset.k || day(S.cur).k); return; }
  if (act === 'docksave') {
    const title = $('#d_title').value.trim(); if (!title) { toast('Name it, even badly.'); return; }
    const who = ($('#d_who .chip.on') || {}).dataset ? $('#d_who .chip.on').dataset.w : 'us';
    const it = { id: uid(), title, who, age: $('#d_age').value.trim(), status: 'Circling', why: '', cost: '', call: '', by: '', owner: '', day: t.dataset.d || '' };
    S.dock.push(it); stamp('dock:' + it.id); save(true); closeModal(); toast('Docked. That is the hard part.');
    go(S.view); return;
  }
  if (act === 'dockstat') { const d = S.dock.find(x => x.id === t.dataset.id); if (d) { d.status = t.dataset.s; stamp('dock:' + d.id); save(true); go('dock'); } return; }
  if (act === 'dockdel') { S.dock = S.dock.filter(x => x.id !== t.dataset.id); save(true); go('dock'); return; }

  if (act === 'expfile' || act === 'backupnow' || act === 'dobackup') { closeModal(); downloadBackup(); return; }
  if (act === 'sharefile') { downloadShare(); return; }
  if (act === 'sharephotos') { downloadPhotos(); return; }
  if (act === 'archive') { downloadArchive(); return; }
  if (act === 'impfile') { $('#impinput').click(); return; }
  if (act === 'snooze') { S.bk = S.bk || {}; S.bk.snoozed = Date.now(); save(true); closeModal(); return; }
  if (act === 'livearm') { t.dataset.off ? Live.disarm() : Live.arm(); return; }
  if (act === 'liveresume') { Live.resume(); return; }
  if (act === 'livewrite') { Live.write().then(ok => { toast(ok ? 'Backup file rewritten.' : 'Could not write — try Reconnect.'); go('sync'); }); return; }

  /* ---- direct link ---- */
  if (act === 'linkoffer') { Link.offer().catch(er => { Link.reset(); toast(linkError(er), 5200); }); return; }
  if (act === 'linkaccept') { Link.accept(($('#linkin') || {}).value || '').catch(er => { Link.reset(); toast(linkError(er), 6000); }); return; }
  if (act === 'linkfinish') { Link.finish(($('#linkin') || {}).value || '').catch(er => toast(linkError(er), 6000)); return; }
  if (act === 'linkoff') { Link.reset('Line closed.'); go('sync'); return; }
  if (act === 'linkpush') { Link.push(true); toast('Sent.'); return; }
  if (act === 'linkstun') { S.linkStun = !S.linkStun; save(true); go('sync'); return; }
  if (act === 'copylink') {
    const ta = $('#linkout'); if (!ta || !ta.value) { toast('Nothing to copy yet'); return; }
    ta.select();
    (navigator.clipboard ? navigator.clipboard.writeText(ta.value) : Promise.reject()).then(() => toast('Copied — send all of it.'), () => { document.execCommand('copy'); toast('Copied.'); });
    return;
  }

  /* ---- paired folder ---- */
  if (act === 'pairarm') { Pair.arm(); return; }
  if (act === 'pairresume') { Pair.resume(); return; }
  if (act === 'pairoff') { Pair.disarm(); return; }
  if (act === 'pairnow') {
    Pair.push().then(() => Pair.pull()).then(n => { if (!n) toast('Nothing new from ' + nameOf(other(S.me)) + ' yet.'); paintBackup(); go('sync'); });
    return;
  }
  if (act === 'swapthenpair') { swapSides(); closeModal(); renderRail(); Pair.clash = false; Pair.resume(); return; }

  if (act === 'snapnow') { snap('manual').then(id => { toast(id ? 'Restore point taken.' : 'This browser will not store restore points.'); paintSnaps(); }); return; }
  if (act === 'snaprestore') {
    modal('<h3>Restore this point?</h3><div class="sub" style="margin:8px 0 16px">Everything currently on this device is replaced by that snapshot. A restore point of the present is taken first, so this is undoable.</div>' +
      '<div class="row"><button class="btn pri" data-act="snapyes" data-id="' + t.dataset.id + '">Restore it</button><button class="btn gh" data-act="closemodal">Cancel</button></div>');
    return;
  }
  if (act === 'snapyes') { closeModal(); restoreSnap(+t.dataset.id); return; }
  if (act === 'swapside') { swapSides(); closeModal(); renderRail(); go('sync'); toast('Switched. Load their file again.'); return; }
  if (act === 'mergeanyway') {
    const o = window._inc; if (!o) return;
    const n = mergeIn(Object.assign({}, o, { me: other(S.me) }));
    closeModal(); renderRail(); go('sync'); toast('Merged ' + n + ' things in.'); return;
  }
  if (act === 'fullrestore') {
    const o = window._inc; if (!o) return;
    snap('before replacing everything').then(id => {
      const meSet = S.meSet, me = S.me, dev = S.devid;
      S = Object.assign(blank(), o); S.me = me; S.meSet = meSet; S.devid = dev;
      S.undo = { id: id, what: 'replaced everything from a file', at: Date.now() };
      save(true); closeModal(); renderRail(); go('sync'); toast('Replaced. You can undo it at the top of this page.', 4200);
    });
    return;
  }
  if (act === 'mergefile') {
    const o = window._inc; if (!o) return;
    snap('before merging a file').then(id => {
      const n = mergeIn(o);
      S.undo = { id: id, what: 'merged a file in', at: Date.now() }; save(true);
      closeModal(); renderRail(); go('sync');
      toast(n ? ('Merged ' + n + ' things in.') : 'Nothing new to merge.');
    });
    return;
  }
  if (act === 'mergeasother') {
    const o = window._inc; if (!o) return;
    snap('before merging a file').then(id => {
      const n = mergeIn(Object.assign({}, o, { me: other(S.me) }));
      S.undo = { id: id, what: 'merged a file in', at: Date.now() }; save(true);
      closeModal(); renderRail(); go('sync'); toast('Merged ' + n + ' things into ' + nameOf(other(S.me)) + '’s column.');
    });
    return;
  }
  if (act === 'undolast') { const u = S.undo; if (!u) return; S.undo = null; restoreSnap(u.id); return; }
  if (act === 'dismissundo') { S.undo = null; save(true); go('sync'); return; }
  if (act === 'legacy') {
    modal('<h3>Import from the old locked version</h3>' +
      '<div class="sub" style="margin:8px 0 14px">Paste the contents of the old encrypted file, or the old T90E1 code, and the passphrase it was made with. This is a one-off — everything from here on is plain.</div>' +
      '<div class="syncbox"><textarea id="lgtext" placeholder="Paste the old file or code here…"></textarea></div>' +
      '<div class="spacer"></div><input class="inp" type="password" id="lgpw" placeholder="The old passphrase">' +
      '<div class="tiny" id="lgerr" style="color:var(--hot);min-height:18px;margin-top:8px"></div>' +
      '<div class="row" style="margin-top:12px"><button class="btn pri" data-act="legacygo">Import it</button>' +
      '<button class="btn gh" data-act="closemodal">Cancel</button></div>');
    return;
  }
  if (act === 'legacygo') {
    const txt = $('#lgtext').value.trim(), pw = $('#lgpw').value, err = $('#lgerr');
    if (!txt || !pw) { err.textContent = 'Both boxes, please.'; return; }
    t.disabled = true; err.textContent = 'Working…';
    importLegacy(txt, pw).then(o => {
      snap('before legacy import').then(() => {
        delete o.sec;
        const dev = S.devid;
        S = Object.assign(blank(), o); S.sec = null; S.devid = dev;
        save(true); closeModal(); renderRail(); go('sync'); toast('Imported. No passphrase from here on.');
      });
    }).catch(() => { err.textContent = 'That passphrase did not open it.'; t.disabled = false; });
    return;
  }
  if (act === 'gencode') {
    let payload = S;
    if (t.dataset.scope === 'day') {
      const dn = day(S.cur).k;
      payload = { v: 2, me: S.me, couple: S.couple, prof: S.prof, upd: S.upd, board: [], dock: [],
        answers: { [dn]: S.answers[dn] || {} }, progress: { [dn]: S.progress[dn] } };
    }
    toCode(payload).then(code => {
      $('#outcode').value = code; markBackup('code');
      if (code.length > 240000) toast('That code is enormous because of the photos — send a file instead.', 6000);
      else toast('Code ready — copy all of it.');
    });
    return;
  }
  if (act === 'copycode') {
    const ta = $('#outcode'); if (!ta.value) { toast('Generate one first'); return; }
    ta.select();
    (navigator.clipboard ? navigator.clipboard.writeText(ta.value) : Promise.reject()).then(() => toast('Copied.'), () => { document.execCommand('copy'); toast('Copied.'); });
    return;
  }
  if (act === 'mergecode') {
    const v = $('#incode').value.trim(); if (!v) { toast('Paste their code first'); return; }
    readShared(v).then(o => fileChooser(o))
      .catch(er => { const m = openError(er); if (m) toast(m, 5200); });
    return;
  }
  if (act === 'wipe') {
    modal('<h3>Erase everything?</h3><div class="sub" style="margin:8px 0 16px">Ninety days of answers, the board, the dock, and every restore point. Gone from this device. Download a backup first if there is any doubt at all.</div>' +
      '<div class="row"><button class="btn pri" data-act="backupnow">Back up first</button>' +
      '<button class="btn dg" data-act="wipeyes" style="margin-left:auto">Yes, erase it</button></div>');
    return;
  }
  if (act === 'wipeyes') {
    snaps().then(all => Promise.all((all || []).map(r => IDB.del('snaps', r.id))))
      .then(() => IDB.del('meta', 'liveHandle')).then(() => IDB.del('meta', 'pairDir')).catch(() => {})
      .then(() => {
        Store.wipe(); S = blank(); S.devid = uid();
        Live.handle = null; Live.ok = false;
        Pair.dir = null; Pair.ok = false; clearInterval(Pair.iv);
        Link.reset();
        save(true); closeModal(); renderRail(); go('today');
      });
    return;
  }
  if (act === 'printall') { window.print(); return; }
}

function handleViewInput(t) {
  if (typeof handlePlanInput === 'function' && handlePlanInput(t)) return;
  if (t.dataset.df) { const [dn, id, w, p] = t.dataset.df.split('|'); dfSet(dn, id, w, p, t.value); return; }
  if (t.dataset.dock) {
    const [id, f] = t.dataset.dock.split('|'); const d = S.dock.find(x => x.id === id);
    if (d) { d[f] = t.type === 'checkbox' ? t.checked : t.value; stamp('dock:' + id); save(); }
    return;
  }
  if (t.dataset.set) {
    const p = t.dataset.set.split('.');
    const val = t.type === 'checkbox' ? t.checked : t.value;
    if (p.length === 2) S[p[0]][p[1]] = val; else S[p[0]] = val;
    save(); if (p[1] === 'a' || p[1] === 'b') renderRail();
    return;
  }
}

document.addEventListener('change', e => {
  if (e.target.id === 'impinput') {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      readShared(r.result).then(o => fileChooser(o))
        .catch(er => { const m = openError(er); if (m) toast(m, 5200); });
    };
    r.readAsText(f);
    e.target.value = '';
  }
  if (e.target.dataset && e.target.dataset.set) handleViewInput(e.target);
});

boot();
</script>
