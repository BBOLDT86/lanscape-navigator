<style>
:root{
  /* neutrals */
  --bg:#f5f5f7; --bg2:#ffffff; --surf:#ffffff; --surf2:#fbfbfd; --surf3:#f0f0f3;
  --fill:#f2f2f5; --fill2:#e8e8ed;
  --line:rgba(0,0,0,.075); --line2:rgba(0,0,0,.14); --hair:rgba(0,0,0,.055);
  --tx:#1d1d1f; --mut:#6e6e73; --mut2:#8e8e93; --mut3:#767a80;

  /* interactive accent */
  --tint:#0071e3; --tint-h:#0077ed; --tint-bg:#eaf3fd; --tint-ring:rgba(0,113,227,.16);

  /* identity */
  --a:#c1652f;  --a-bg:#fbf0e8;  --a-line:#eeceb6;
  --b:#177f8c;  --b-bg:#e9f5f6;  --b-line:#b7dde1;
  --us:#6152c4; --us-bg:#efedfb; --us-line:#cdc6f0;

  /* semantic */
  --ok:#1e8e3e; --ok-bg:#eaf6ec; --warn:#a86400; --warn-bg:#fdf4e3; --hot:#d93025; --hot-bg:#fdeeed;

  --r:18px; --r2:12px; --r3:10px; --pill:980px;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
  --sh1:0 1px 2px rgba(0,0,0,.04);
  --sh2:0 1px 2px rgba(0,0,0,.05), 0 6px 18px rgba(0,0,0,.045);
  --sh3:0 2px 6px rgba(0,0,0,.06), 0 20px 48px rgba(0,0,0,.11);
  --blur:saturate(180%) blur(20px);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--tx); font-family:var(--sans);
  font-size:15px; line-height:1.5; letter-spacing:-.011em;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  min-height:100vh;
}
h1,h2,h3,h4,h5{margin:0; font-weight:600; letter-spacing:-.021em; color:var(--tx)}
h1{letter-spacing:-.028em}
button,input,textarea,select{font-family:inherit; font-size:inherit; color:inherit; letter-spacing:inherit}
button{cursor:pointer; background:none; border:none; padding:0}
a{color:var(--tint); text-decoration:none}
textarea{resize:vertical}
::selection{background:var(--tint-ring)}
.hide{display:none !important}

/* ---------- shell ---------- */
#app{display:flex; min-height:100vh}
#rail{
  width:230px; flex:0 0 230px; padding:20px 14px;
  position:sticky; top:0; height:100vh; overflow-y:auto; z-index:40;
  background:rgba(250,250,252,.78); backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
  border-right:1px solid var(--hair);
}
.brand{padding:6px 10px 20px}
.brand .bm{font-size:19px; font-weight:600; letter-spacing:-.028em}
.brand .bm span{color:var(--mut3); font-weight:400}
.brand .bs{font-size:12px; color:var(--mut2); margin-top:3px; letter-spacing:-.005em}
.navb{
  display:flex; align-items:center; gap:11px; width:100%; padding:8px 11px; border-radius:var(--r3);
  color:var(--tx); text-align:left; font-size:14px; margin-bottom:1px; transition:background .12s;
}
.navb:hover{background:rgba(0,0,0,.04)}
.navb.on{background:rgba(0,0,0,.065)}
.navb.on .ic{color:var(--tint)}
.navb .ic{width:18px; text-align:center; font-size:14px; color:var(--mut2); transition:color .12s}
.navb .sm{display:none}
.navb .bdg{margin-left:auto; font-size:11px; background:var(--fill2); color:var(--mut); padding:1px 7px; border-radius:var(--pill); font-variant-numeric:tabular-nums}
.railsec{font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--mut3); padding:16px 11px 6px}
.whoami{margin-top:18px; padding:12px; background:rgba(0,0,0,.035); border-radius:14px}
.whoami .lbl{font-size:11px; color:var(--mut2); margin-bottom:8px; letter-spacing:-.005em}
.whoswitch{display:flex; gap:3px; background:var(--fill2); padding:2px; border-radius:9px}
.whoswitch button{flex:1; padding:5px 4px; border-radius:7px; font-size:12.5px; color:var(--mut); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; transition:.13s}
.whoswitch button.on{background:#fff; box-shadow:var(--sh1); color:var(--tx); font-weight:500}
.whoswitch button.on[data-w="a"]{color:var(--a)}
.whoswitch button.on[data-w="b"]{color:var(--b)}

#main{flex:1; min-width:0; display:flex; flex-direction:column}
#topbar{
  position:sticky; top:0; z-index:35; display:flex; align-items:center; gap:14px;
  padding:10px 26px; min-height:56px;
  background:rgba(255,255,255,.72); backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
  border-bottom:1px solid var(--hair);
}
.tbtitle{font-size:14px; font-weight:500; color:var(--mut); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.tbspace{flex:1}
.pill{
  display:inline-flex; align-items:center; gap:6px; padding:4px 12px; border-radius:var(--pill);
  background:var(--fill); font-size:12.5px; color:var(--mut); white-space:nowrap;
}
.pill b{color:var(--tx); font-weight:600; font-variant-numeric:tabular-nums}
#view{padding:34px 26px 130px; max-width:1040px; width:100%; margin:0 auto; flex:1}
.wide #view{max-width:1400px}

/* ---------- generic ---------- */
.card{background:var(--surf); border-radius:var(--r); padding:26px; box-shadow:var(--sh2)}
.card+.card{margin-top:16px}
.eyebrow{font-size:11.5px; font-weight:600; letter-spacing:.02em; text-transform:uppercase; color:var(--mut2)}
.sub{color:var(--mut); font-size:15px}
.tiny{font-size:12.5px; color:var(--mut2); line-height:1.5}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  padding:8px 17px; border-radius:var(--pill); background:var(--fill);
  color:var(--tx); font-size:14px; font-weight:500; transition:.13s; white-space:nowrap;
}
.btn:hover{background:var(--fill2)}
.btn:active{transform:scale(.975)}
.btn.pri{background:var(--tint); color:#fff}
.btn.pri:hover{background:var(--tint-h)}
.btn.gh{background:transparent; color:var(--tint)}
.btn.gh:hover{background:var(--tint-bg)}
.btn.sm{padding:5px 13px; font-size:13px}
.btn.dg{background:transparent; color:var(--hot)}
.btn.dg:hover{background:var(--hot-bg)}
.btn:disabled{opacity:.35; cursor:not-allowed}
.btn:focus-visible,.chip:focus-visible,.navb:focus-visible{outline:none; box-shadow:0 0 0 4px var(--tint-ring)}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:16px}
.spacer{height:16px}
hr.sep{border:none; border-top:1px solid var(--hair); margin:22px 0}
.inp,textarea.inp,select.inp,input[type=date].inp{
  width:100%; background:var(--fill); border:1px solid transparent; border-radius:var(--r2);
  padding:10px 13px; color:var(--tx); outline:none; transition:.13s;
}
.inp::placeholder{color:var(--mut3)}
.inp:focus{background:#fff; border-color:var(--line2); box-shadow:0 0 0 4px var(--tint-ring)}
textarea.inp{line-height:1.55; min-height:74px}
label.fl{display:block; font-size:12.5px; color:var(--mut); margin-bottom:6px}
.chip{padding:6px 14px; border-radius:var(--pill); background:var(--fill); font-size:13px; color:var(--mut); transition:.13s}
.chip:hover{background:var(--fill2)}
.chip.on{background:var(--tint-bg); color:var(--tint); font-weight:500; box-shadow:inset 0 0 0 1px rgba(0,113,227,.22)}
.chip.on.a{background:var(--a-bg); color:var(--a); box-shadow:inset 0 0 0 1px var(--a-line)}
.chip.on.b{background:var(--b-bg); color:var(--b); box-shadow:inset 0 0 0 1px var(--b-line)}
.empty{text-align:center; padding:64px 20px; color:var(--mut2)}
.empty .big{font-size:34px; margin-bottom:12px; color:var(--mut3)}

/* ---------- day view ---------- */
.dayhead{margin-bottom:22px}
.dayhead .kicker{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:12px}
.dnum{font-size:12px; font-weight:600; letter-spacing:.02em; text-transform:uppercase; color:var(--tint)}
.dayhead h1{font-size:34px; line-height:1.1; margin-bottom:10px}
.whyline{color:var(--mut); font-size:16px; max-width:64ch; line-height:1.5}
.modetag{font-size:11px; font-weight:600; letter-spacing:.02em; text-transform:uppercase; padding:3px 10px; border-radius:var(--pill)}
.modetag.solo{color:var(--us); background:var(--us-bg)}
.modetag.together{color:var(--ok); background:var(--ok-bg)}
.modetag.handoff{color:var(--warn); background:var(--warn-bg)}

.seg{border-radius:var(--r); overflow:hidden; margin-bottom:16px; background:var(--surf); box-shadow:var(--sh2); transition:box-shadow .2s}
.seghd{display:flex; align-items:center; gap:12px; padding:15px 24px; border-bottom:1px solid var(--hair); background:var(--surf2)}
.seghd .sn{width:22px; height:22px; border-radius:50%; background:var(--fill2); display:grid; place-items:center; font-size:11.5px; font-weight:600; color:var(--mut)}
.seghd h3{font-size:16px}
.seghd .mins{margin-left:auto; font-size:12.5px; color:var(--mut2); font-variant-numeric:tabular-nums}
.seg.active{box-shadow:var(--sh2), 0 0 0 2px var(--tint)}
.seg.active .seghd{background:var(--tint-bg)}
.seg.active .seghd .sn{background:var(--tint); color:#fff}
.segbd{padding:24px}
.blk+.blk{margin-top:24px; padding-top:24px; border-top:1px solid var(--hair)}
.q{font-size:16px; font-weight:500; margin-bottom:5px; line-height:1.4}
.qh{font-size:13.5px; color:var(--mut); margin-bottom:12px; line-height:1.5}
.note{background:var(--fill); border-radius:var(--r2); padding:15px 18px; color:var(--mut); font-size:14.5px; line-height:1.6}
.note strong{color:var(--tx); font-weight:600}
.note.warm{background:var(--a-bg); color:#7a4a24}
.note.warm strong{color:#5e3618}
.note.sharp{background:var(--hot-bg); color:#8f2b23}
.note.sharp strong{color:#6f201a}

.two{display:grid; grid-template-columns:1fr 1fr; gap:14px}
.slot{border-radius:14px; padding:14px 16px; background:var(--surf2); box-shadow:inset 0 0 0 1px var(--line); position:relative}
.slot.a{box-shadow:inset 0 0 0 1px var(--a-line); background:#fdf8f4}
.slot.b{box-shadow:inset 0 0 0 1px var(--b-line); background:#f4fafb}
.slot.us{box-shadow:inset 0 0 0 1px var(--us-line); background:#f8f7fd}
.slot .nm{font-size:11px; font-weight:600; letter-spacing:.03em; text-transform:uppercase; margin-bottom:8px}
.slot.a .nm{color:var(--a)} .slot.b .nm{color:var(--b)} .slot.us .nm{color:var(--us)}
.slot textarea,.slot input[type=text]{width:100%; background:transparent; border:none; outline:none; color:var(--tx); padding:0; line-height:1.55}
.slot textarea::placeholder,.slot input::placeholder{color:var(--mut3)}
.veil{position:absolute; inset:0; border-radius:14px; background:rgba(252,252,253,.86); backdrop-filter:blur(7px); -webkit-backdrop-filter:blur(7px); display:grid; place-items:center; text-align:center; padding:16px; z-index:5}
.veil .vt{font-size:12.5px; color:var(--mut2); margin-bottom:10px; max-width:26ch; line-height:1.45}

.scale{display:flex; gap:3px; margin-top:9px; background:rgba(0,0,0,.05); padding:3px; border-radius:11px}
.scale button{flex:1; padding:7px 0; border-radius:8px; font-size:13px; color:var(--mut); font-variant-numeric:tabular-nums; transition:.12s}
.scale button:hover{background:rgba(255,255,255,.6); color:var(--tx)}
.scale button.on{background:#fff; box-shadow:var(--sh1); color:var(--tx); font-weight:600}
.scale.a button.on{color:var(--a)} .scale.b button.on{color:var(--b)} .scale.us button.on{color:var(--us)}
.sclbl{display:flex; justify-content:space-between; font-size:11.5px; color:var(--mut3); margin-top:7px}

.lst .li{display:flex; gap:8px; margin-bottom:8px; align-items:center}
.lst .li .inp{flex:1; background:#fff; box-shadow:inset 0 0 0 1px var(--line)}
.lst .li .x{color:var(--mut3); padding:4px 8px; font-size:17px; line-height:1; border-radius:var(--pill)}
.lst .li .x:hover{color:var(--hot); background:var(--hot-bg)}

.commit{border-radius:var(--r2); padding:14px; background:var(--tint-bg)}
.currencyhint{font-size:12px; color:var(--a); margin-top:6px}

.daynav{display:flex; gap:10px; align-items:center; justify-content:space-between; margin-top:28px; padding-top:22px; border-top:1px solid var(--hair)}

/* ---------- timer ---------- */
#timerwrap{display:flex; align-items:center; gap:10px}
.tring{position:relative; width:34px; height:34px; flex:0 0 34px}
.tring svg{transform:rotate(-90deg); display:block}
.tring .tbg{stroke:var(--fill2)}
.tring #tdash{stroke:var(--tint)}
.tring .tt{position:absolute; inset:0; display:grid; place-items:center; font-size:10px; color:var(--mut); font-variant-numeric:tabular-nums; font-weight:500}
#tlabel{font-size:11.5px; color:var(--mut2); min-width:76px; line-height:1.3}
#tlabel b{display:block; color:var(--tx); font-size:13px; font-weight:600}
#tplay{width:32px; height:32px; padding:0; border-radius:50%; font-size:11px; background:var(--fill)}

/* ---------- path grid ---------- */
.weekrow{margin-bottom:28px}
.weekhd{display:flex; align-items:baseline; gap:12px; margin-bottom:11px; flex-wrap:wrap}
.weekhd .wn{font-size:11.5px; font-weight:600; letter-spacing:.03em; text-transform:uppercase; color:var(--mut3)}
.weekhd h3{font-size:18px}
.weekhd .wd{font-size:14px; color:var(--mut2)}
.daysgrid{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:9px}
.dcell{
  border-radius:14px; padding:12px; background:var(--surf); box-shadow:var(--sh1), inset 0 0 0 1px var(--line);
  text-align:left; min-height:88px; display:flex; flex-direction:column; gap:6px; transition:.15s;
}
.dcell:hover{box-shadow:var(--sh2), inset 0 0 0 1px var(--line2); transform:translateY(-1px)}
.dcell .n{font-size:11px; color:var(--mut3); font-weight:500}
.dcell .tt{font-size:12.5px; line-height:1.35; color:var(--tx)}
.dcell.done{background:var(--ok-bg); box-shadow:inset 0 0 0 1px rgba(30,142,62,.16)}
.dcell.done .n{color:var(--ok)}
.dcell.done .n::after{content:" ✓"}
.dcell.today{box-shadow:var(--sh2), inset 0 0 0 2px var(--tint)}
.dcell.fut{opacity:.5}
.phasebar{display:flex; height:6px; border-radius:var(--pill); overflow:hidden; margin:14px 0 30px}
.phasebar i{display:block; height:100%}

/* ---------- board ---------- */
#boardwrap{
  position:relative; border-radius:var(--r); background-color:#fafafc;
  background-image:radial-gradient(rgba(0,0,0,.075) 1px, transparent 1px);
  background-size:22px 22px; box-shadow:inset 0 0 0 1px var(--line);
  overflow:auto; height:min(72vh,720px);
}
#boardcanvas{position:relative; width:2000px; height:1300px}
.bcard{
  position:absolute; width:224px; background:#fff; border-radius:16px; padding:14px 15px;
  box-shadow:var(--sh2); cursor:grab; user-select:none; touch-action:none; transition:box-shadow .15s, transform .05s;
}
.bcard:hover{box-shadow:var(--sh3)}
.bcard.drag{cursor:grabbing; z-index:99; box-shadow:var(--sh3); transform:scale(1.025) rotate(-.4deg)}
.bcard .em{font-size:21px; line-height:1; margin-bottom:7px}
.bcard .bt{font-size:14.5px; font-weight:600; line-height:1.3; margin-bottom:5px; letter-spacing:-.015em}
.bcard .bn{font-size:12.5px; color:var(--mut); line-height:1.45; max-height:56px; overflow:hidden}
.bcard .bf{display:flex; gap:5px; margin-top:11px; align-items:center; flex-wrap:wrap}
.bcard img.ph{width:100%; border-radius:10px; margin-bottom:9px; display:block}
.tag{font-size:10.5px; font-weight:500; letter-spacing:.01em; padding:2px 8px; border-radius:var(--pill); background:var(--fill); color:var(--mut)}
.tag.a{color:var(--a); background:var(--a-bg)} .tag.b{color:var(--b); background:var(--b-bg)} .tag.us{color:var(--us); background:var(--us-bg)}
.tag.r1{color:var(--ok); background:var(--ok-bg)} .tag.r2{color:var(--warn); background:var(--warn-bg)} .tag.r3{color:var(--hot); background:var(--hot-bg)}
button.tag:hover{background:var(--fill2); color:var(--tx)}
.bcard .bf .ed{margin-left:auto; color:var(--tint); background:transparent}
.bcard .bf .ed:hover{background:var(--tint-bg); color:var(--tint)}
.bcard[data-own=a]{box-shadow:var(--sh2), inset 3px 0 0 var(--a)}
.bcard[data-own=b]{box-shadow:var(--sh2), inset 3px 0 0 var(--b)}
.bcard[data-own=us]{box-shadow:var(--sh2), inset 3px 0 0 var(--us)}
.bcard[data-st=Lived]{background:linear-gradient(160deg,var(--ok-bg),#fff 70%)}
.boardbar{display:flex; gap:9px; flex-wrap:wrap; align-items:center; margin-bottom:16px}
.boardbar h1{font-size:26px; margin-right:6px}
.segctl{display:flex; gap:2px; background:var(--fill2); padding:2px; border-radius:10px}
.segctl button{padding:5px 13px; border-radius:8px; font-size:13px; color:var(--mut); transition:.12s}
.segctl button.on{background:#fff; box-shadow:var(--sh1); color:var(--tx); font-weight:500}
.bgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(238px,1fr)); gap:14px}
.bgrid .bcard{position:static; width:auto}
.lanes{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:12px}
.lane{background:rgba(0,0,0,.028); border-radius:16px; padding:12px; min-height:130px}
.lane h4{font-size:11.5px; font-weight:600; letter-spacing:.03em; text-transform:uppercase; color:var(--mut2); margin-bottom:11px}
.lane .bcard{position:static; width:auto; margin-bottom:10px}

/* ---------- dock ---------- */
.dockitem{border-radius:var(--r); background:var(--surf); padding:22px; margin-bottom:14px; box-shadow:var(--sh2)}
.dockitem.hot{box-shadow:var(--sh2), inset 0 0 0 1px rgba(217,48,37,.28); background:linear-gradient(180deg,var(--hot-bg),#fff 90px)}
.dockitem h4{font-size:18px; letter-spacing:-.02em}
.dockmeta{display:flex; gap:8px; flex-wrap:wrap; margin:9px 0}
.dockfields{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:16px}
.statusline{display:flex; gap:2px; margin-top:14px; background:var(--fill2); padding:2px; border-radius:10px}
.statusline button{flex:1; padding:6px 3px; font-size:11.5px; font-weight:500; color:var(--mut); border-radius:8px; transition:.12s}
.statusline button.on{background:#fff; box-shadow:var(--sh1); color:var(--tint)}
.countdown{font-size:13px; color:var(--warn); margin-top:6px}
.countdown.late{color:var(--hot); font-weight:500}

/* ---------- us / profile ---------- */
.llbar{display:flex; align-items:center; gap:12px; margin-bottom:9px}
.llbar .nm2{width:124px; font-size:13.5px; color:var(--mut); flex:0 0 124px}
.llbar .track{flex:1; height:8px; background:var(--fill2); border-radius:var(--pill); overflow:hidden}
.llbar .fill{height:100%; border-radius:var(--pill); transition:width .4s cubic-bezier(.3,0,.2,1)}
.llbar .pct{width:38px; text-align:right; font-size:12px; color:var(--mut2); font-variant-numeric:tabular-nums}
.qz{border-radius:14px; padding:15px; margin-bottom:11px; background:var(--surf2); box-shadow:inset 0 0 0 1px var(--line)}
.qz .qn{font-size:11.5px; color:var(--mut3); margin-bottom:9px; font-weight:500}
.qzopt{display:block; width:100%; text-align:left; padding:11px 14px; border-radius:11px; margin-bottom:7px; color:var(--mut); font-size:13.5px; line-height:1.4; background:#fff; box-shadow:inset 0 0 0 1px var(--line); transition:.13s}

.qzopt.on{background:var(--a-bg); box-shadow:inset 0 0 0 1.5px var(--a); color:#5e3618}
.qzopt.on.b{background:var(--b-bg); box-shadow:inset 0 0 0 1.5px var(--b); color:#0d4d55}
.vsort{display:flex; flex-wrap:wrap; gap:7px}
.vsort button{padding:7px 14px; border-radius:var(--pill); background:var(--fill); font-size:13px; color:var(--mut); transition:.13s}
.vsort button:hover{background:var(--fill2)}
.vsort button.on{background:var(--a-bg); color:var(--a); box-shadow:inset 0 0 0 1px var(--a-line)}
.vsort button.on.b{background:var(--b-bg); color:var(--b); box-shadow:inset 0 0 0 1px var(--b-line)}
.vsort button.top{font-weight:600; box-shadow:inset 0 0 0 1.5px currentColor}
.fearcols{display:grid; grid-template-columns:repeat(3,1fr); gap:12px}
.fearcols .fc{background:var(--surf2); border-radius:14px; padding:14px; box-shadow:inset 0 0 0 1px var(--line)}
.fearcols h5{font-size:11.5px; font-weight:600; letter-spacing:.03em; text-transform:uppercase; color:var(--mut2); margin:0 0 10px}

.hors{display:grid; grid-template-columns:repeat(2,1fr); gap:14px}

.horscard h5{font-size:15px; margin-bottom:5px; letter-spacing:-.015em}
.horscard .inp{background:#fff; box-shadow:inset 0 0 0 1px var(--line)}
.horscard .ant{font-size:12.5px; color:var(--ok); margin-top:12px; padding-top:12px; border-top:1px solid var(--hair); line-height:1.5}
.softbuild{background:var(--surf2); border-radius:14px; padding:18px; line-height:2.6; box-shadow:inset 0 0 0 1px var(--line); font-size:15px}
.softbuild input{background:#fff; border:none; border-bottom:1.5px solid var(--a); color:var(--a); padding:3px 8px; min-width:158px; outline:none; border-radius:5px 5px 0 0}
.softout{margin-top:16px; padding:16px 18px; background:var(--a-bg); border-radius:14px; font-size:16px; line-height:1.55; color:#5e3618}
.softout b{color:var(--a)}

/* ---------- sync ---------- */
.syncbox{background:var(--fill); border-radius:var(--r2); padding:13px}
.syncbox textarea{width:100%; height:118px; background:transparent; border:none; outline:none; color:var(--mut); font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace; font-size:11px; word-break:break-all; line-height:1.55}
.steps{counter-reset:s; padding:0; margin:0; list-style:none}
.steps li{counter-increment:s; position:relative; padding-left:36px; margin-bottom:14px; color:var(--mut); font-size:14.5px; line-height:1.5}
.steps li::before{content:counter(s); position:absolute; left:0; top:1px; width:23px; height:23px; border-radius:50%; background:var(--tint-bg); display:grid; place-items:center; font-size:11.5px; font-weight:600; color:var(--tint)}
.steps li b{color:var(--tx); font-weight:600}

/* ---------- backup health ---------- */
.hrow{display:flex; align-items:center; gap:12px; padding:13px 0; border-bottom:1px solid var(--hair)}
.hrow:last-child{border-bottom:none}
.dot{width:9px; height:9px; border-radius:50%; flex:0 0 9px}

.ht{min-width:0}

.ht span{display:block; font-size:12.5px; color:var(--mut2); line-height:1.4}
.snap{display:flex; align-items:center; gap:12px; padding:10px 13px; background:var(--surf2); border-radius:11px; margin-bottom:7px; box-shadow:inset 0 0 0 1px var(--line)}

/* ---------- misc ---------- */
#toast{position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(80px); background:rgba(29,29,31,.92); backdrop-filter:blur(12px); color:#fff; padding:11px 22px; border-radius:var(--pill); font-size:14px; z-index:200; transition:.28s cubic-bezier(.3,0,.2,1); box-shadow:var(--sh3); pointer-events:none; opacity:0}

.mbox{background:var(--surf); border-radius:20px; padding:28px; max-width:560px; width:100%; max-height:88vh; overflow-y:auto; box-shadow:var(--sh3)}
.mbox h3{font-size:21px; margin-bottom:6px}
.banner{background:var(--warn-bg); border-radius:14px; padding:14px 17px; font-size:13.5px; color:#7a4a00; margin-bottom:20px; display:flex; gap:12px; align-items:flex-start; line-height:1.5}
.banner b{color:#5c3800}
.stat{background:var(--surf2); border-radius:14px; padding:16px 18px; box-shadow:inset 0 0 0 1px var(--line)}
.stat .v{font-size:28px; font-weight:600; letter-spacing:-.03em; line-height:1.1; font-variant-numeric:tabular-nums}
.stat .k{font-size:11.5px; letter-spacing:.02em; text-transform:uppercase; color:var(--mut2); margin-top:5px; font-weight:500}
.statrow{display:grid; grid-template-columns:repeat(auto-fit,minmax(126px,1fr)); gap:12px}
.rtable{width:100%; border-collapse:separate; border-spacing:0; background:var(--surf2); border-radius:14px; overflow:hidden; box-shadow:inset 0 0 0 1px var(--line)}
.rtable th{text-align:left; padding:10px 13px; font-size:11px; font-weight:600; letter-spacing:.03em; text-transform:uppercase; color:var(--mut2); background:rgba(0,0,0,.02)}
.rtable td{padding:9px 13px; font-size:13px; border-top:1px solid var(--hair)}
.mob{display:none}

@media (max-width:880px){

  #rail .brand,#rail .railsec,#rail .whoami{display:none}

  .navb.on .ic{color:var(--tint)}
  .navb .ic{font-size:16px}
  .navb .bdg{display:none}

}
@media (prefers-reduced-motion:reduce){*{transition:none !important; animation:none !important}}

}


/* ---------- photos ---------- */
.photo{width:100%; border-radius:12px; display:block; cursor:zoom-in; box-shadow:var(--sh1)}
.phdrop{border:1.5px dashed var(--line2); border-radius:12px; padding:34px 16px; text-align:center; color:var(--mut3); font-size:13px; background:rgba(0,0,0,.015)}
.dcell.analog{background:linear-gradient(160deg,var(--a-bg),var(--surf) 70%)}
.dcell.analog.done{background:var(--ok-bg)}
.phwrap{border-radius:14px; transition:box-shadow .12s, background .12s}
.phwrap.over{box-shadow:0 0 0 3px var(--tint-ring); background:var(--tint-bg)}
.phgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(132px,1fr)); gap:9px}
.phcell{position:relative; margin:0}
.phx{position:absolute; top:6px; right:6px; width:24px; height:24px; border-radius:50%; background:rgba(29,29,31,.72); color:#fff; font-size:15px; line-height:1; display:grid; place-items:center; backdrop-filter:blur(6px)}
.phx:hover{background:var(--hot)}
.phclaim{display:grid; grid-template-columns:repeat(auto-fill,minmax(168px,1fr)); gap:12px; margin-top:12px}
.phclaim .cc{background:var(--surf2); border-radius:14px; padding:10px; box-shadow:inset 0 0 0 1px var(--line)}
.phclaim .cc .row{margin-top:8px; gap:6px}

/* ---------- five-minute version, hand-off, off-ramp ---------- */
.fivemin{background:var(--tint-bg); border-radius:var(--r2); padding:14px 17px; font-size:14px; color:#0b4a86; line-height:1.55}
.fivemin b{font-weight:650}
.handoff{display:flex; gap:14px; align-items:center; flex-wrap:wrap; background:var(--us-bg); border-radius:var(--r2); padding:13px 16px; margin-top:16px; font-size:14px; color:#3b2f6b}
.handoff b{font-weight:650}
.offramp{display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-top:26px; padding-top:18px; border-top:1px solid var(--hair)}
.lnk{color:var(--mut); font-size:13.5px; text-decoration:underline; text-underline-offset:3px; text-decoration-color:var(--line2)}
.lnk:hover{color:var(--hot); text-decoration-color:var(--hot)}
.brand .homelink{display:inline-block; margin-top:10px; font-size:12px; color:var(--mut2); letter-spacing:-.005em}
.brand .homelink:hover{color:var(--tint)}
#storepill{background:var(--hot-bg); color:var(--hot); font-weight:650; letter-spacing:.04em}

/* ---------- paired folder ---------- */
#bkpill.live{background:var(--ok-bg); color:var(--ok)}
.pairbox{background:linear-gradient(180deg,var(--tint-bg),var(--surf) 120px); border-radius:var(--r); padding:22px; box-shadow:inset 0 0 0 1px rgba(0,113,227,.16)}
.pairstate{display:flex; align-items:center; gap:11px; margin:12px 0}
.pairstate .dot{width:10px; height:10px; flex:0 0 10px}
.pairstate b{font-size:15px}
.pairfiles{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace; font-size:12px; color:var(--mut); background:var(--fill); border-radius:10px; padding:10px 13px; line-height:1.7; word-break:break-all}
.pairfiles i{color:var(--mut3); font-style:normal}

/* ---------- the direct link ---------- */
.linkbox{background:linear-gradient(180deg,var(--us-bg),var(--surf) 140px); box-shadow:inset 0 0 0 1px var(--us-line); margin-bottom:16px}
.linkbox .steps li::before{background:#e5e1f7; color:var(--us)}
.linkbox .syncbox textarea{height:92px}
#linkpill{background:var(--ok-bg); color:var(--ok); font-weight:600}
#linkpill.warn{background:var(--warn-bg); color:var(--warn)}

/* ---------- the schedule ---------- */
.planbox{background:linear-gradient(180deg,var(--ok-bg),var(--surf) 150px); box-shadow:inset 0 0 0 1px rgba(30,142,62,.2); margin-bottom:18px}
.skiprow{display:flex; align-items:center; gap:12px; padding:9px 13px; background:var(--surf2); border-radius:11px; margin-bottom:6px; box-shadow:inset 0 0 0 1px var(--line); font-size:13.5px}
.skiprow b{font-weight:600}
.skiprow span{color:var(--mut2); font-size:12.5px}
.skiprow .btn{margin-left:auto}
.sessrow{display:flex; align-items:flex-start; gap:16px; padding:12px 15px; background:var(--surf); border-radius:13px; margin-bottom:7px; box-shadow:var(--sh1), inset 0 0 0 1px var(--line)}
.sessrow.now{box-shadow:var(--sh2), inset 0 0 0 2px var(--tint); background:var(--tint-bg)}
.sessrow .sd{flex:0 0 112px}
.sessrow .sd b{display:block; font-size:13.5px; font-weight:600; font-variant-numeric:tabular-nums}
.sessrow .sd span{display:block; font-size:11.5px; color:var(--mut2)}
.sessrow .st{min-width:0}
.sessrow .st b{display:block; font-size:13.5px; font-weight:600}
.sessrow .st span{display:block; font-size:12.5px; color:var(--mut); line-height:1.5}
@media (max-width:880px){ .sessrow{flex-direction:column; gap:4px} .sessrow .sd{flex:none} }
/* phones: a text field under 16px makes iPhone Safari zoom the page when it is tapped */
@media (pointer:coarse){input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=color]):not([type=file]),select,textarea{font-size:max(16px,1em)!important}}
</style>

        <div class="tring">
          <svg width="34" height="34"><circle class="tbg" cx="17" cy="17" r="14" fill="none" stroke-width="3"></circle>
          <circle id="tdash" cx="17" cy="17" r="14" fill="none" stroke-width="3" stroke-linecap="round" stroke-dasharray="0 88"></circle></svg>

</div>
<div id="toast"></div>
<script>
/* ============================================================
   Together / 90 — curriculum
   Weeks 1–4 : Ground · Currencies · Naming · The Avoidance Map
   ============================================================ */
const WEEKS = [
  { n: 1,  t: 'Ground',                 d: 'An honest baseline, permission to tell the truth, and one weekend off-screen.' },
  { n: 2,  t: 'Currencies',             d: 'Give in a language that is not your own.' },
  { n: 3,  t: 'Naming',                 d: 'Wants, needs, demands — said out loud, finally.' },
  { n: 4,  heavy:1, t: 'The Avoidance Map',      d: 'Find every place the two of you go quiet.' },
  { n: 5,  heavy:1, t: 'Fear, Named',            d: 'One fear, under a microscope, with the cost of doing nothing.' },
  { n: 6,  heavy:1, t: 'Conflict That Works',    d: 'Fix the mechanics before you touch the content.' },
  { n: 7,  heavy:1, t: 'Dreams Within Conflict', d: 'The gridlocked thing has a dream buried in it.' },
  { n: 8,  t: 'Money, Time, Risk',      d: 'The constraint layer, without flinching.' },
  { n: 9,  t: 'The Board, Built',       d: 'Make the future specific enough to argue about.' },
  { n: 10, t: 'Two-Way Doors',          d: 'Turn leaps into experiments you can actually run.' },
  { n: 11, t: 'Deciding',               d: 'Make the calls. With dates. Out loud.' },
  { n: 12, t: 'Living It',              d: 'Execution, and the wobble that comes after deciding.' },
  { n: 13, t: 'Keep',                   d: 'What changed, what stays, and the rhythm from here.' }
];

const D1 = [
/* ---------------- WEEK 1 — GROUND ---------------- */
{ w:1, d:1, t:'The state of us, honestly', mode:'together', seg:[2,9,4],
  why:'Before anything gets better you need a number you can come back to. Today is the number.',
  blocks:[
    {k:'note', tone:'warm', text:'Say this out loud before you start: <strong>nothing written in here becomes ammunition later.</strong> Not in a fight, not in six months, not as a joke. If either of you cannot promise that, stop and talk about why — that conversation is more important than day one.'},
    {k:'scale', id:'b_close', q:'How close do we feel right now?', lo:1, hi:10, lolbl:'roommates', hilbl:'in it together', who:'both'},
    {k:'scale', id:'b_honest', q:'How much of what I actually think do I say to you?', lo:1, hi:10, lolbl:'I edit constantly', hilbl:'almost all of it', who:'both'},
    {k:'scale', id:'b_future', q:'How clear is the picture of our next five years?', lo:1, hi:10, lolbl:'total fog', hilbl:'I could draw it', who:'both'},
    {k:'scale', id:'b_stuck', q:'How stuck are we on the things that matter most?', lo:1, hi:10, lolbl:'moving well', hilbl:'completely frozen', who:'both'},
    {k:'ask', id:'b_one', q:'If exactly one thing were different about us in ninety days, what would you pick?', ph:'Say the real one, not the polite one.', rows:3, who:'both'}
  ]},

{ w:1, d:2, t:'Why you, originally', mode:'together', seg:[2,9,4],
  why:'You are about to spend twelve weeks on the hard stuff. Start by remembering there is something worth doing it for.',
  blocks:[
    {k:'ask', id:'origin', q:'Tell the story of the moment you knew. Not the highlight-reel version — the small, specific one.', hint:'Read them out to each other. Do not just type and move on.', ph:'It was a Tuesday and you...', rows:4, who:'both'},
    {k:'ask', id:'still', q:'What is something they do now, this year, that still gets you?', ph:'Something they would be surprised to hear you noticed.', rows:3, who:'both'},
    {k:'ask', id:'proud', q:'Finish this: I am proud that we survived ___.', rows:2, who:'both'}
  ]},

{ w:1, d:'3a', t:'Make it by hand', mode:'together', seg:[2,9,4], analog:1,
  why:'Off the screen. Scissors, magazines, printouts, paper. Your hands will reach for things your explanations would have talked you out of.',
  blocks:[
    {k:'note', tone:'warm', text:'<strong>Today is analog.</strong> The app is only the bookends &mdash; a couple of minutes at the start, a couple at the end. In between there are no screens.<br><br>What you need: a big sheet of card, anything with images in it, scissors, glue. Ninety minutes is plenty; an hour is fine.<br><br><strong>The one rule:</strong> the first stretch is silent. No explaining what you are cutting out and no negotiating what goes on. Explaining kills it &mdash; you start choosing things you can defend instead of things you want. Talk afterwards.'},
    {k:'ask', id:'a_first', q:'What did you reach for first, before you had thought about it?', hint:'Fill this in after you have finished cutting, not before.', ph:'', rows:3, who:'both'},
    {k:'ask', id:'a_nearly', q:'What did you nearly put on and then put back down? Why?', hint:'This is usually the most honest thing that happened today.', rows:3, who:'both'},
    {k:'ask', id:'a_theirs', q:'What is on their side of the board that you did not expect?', rows:3, who:'both'},
    {k:'note', text:'Leave it somewhere you will both walk past tonight. Do not tidy it away. Tomorrow you photograph it and say out loud what is on it.'}
  ]},

{ w:1, d:'3b', t:'Photograph it, then say what it means', mode:'together', seg:[2,10,3], analog:1,
  why:'A board on the wall becomes wallpaper inside a week. Photograph it, name what is actually on it, and pull the few that matter into the app so they cannot quietly disappear.',
  blocks:[
    {k:'photo', id:'boardphoto', q:'Photograph the board — one slot each.', hint:'You each get your own slot, and each slot holds as many photos as you like. Straight on, good light, close enough to read. Everything stays on this device; nothing is uploaded anywhere.', who:'both'},
    {k:'note', tone:'warm', text:'Now go round it together, out loud. One of you points at something and says what it is doing there; the other only asks questions. Then swap. No editing anyone else&rsquo;s piece.'},
    {k:'ask', id:'b_three', q:'The three things on that board you would be most upset to still be talking about in five years.', hint:'Not the prettiest three. The ones with a clock on them.', rows:4, who:'both'},
    {k:'ask', id:'b_surprise', q:'What is on there that you have never actually said to each other in words?', rows:3, who:'both'},
    {k:'ask', id:'b_missing', q:'What did not make it onto the board — and is that because it is genuinely gone, or because it felt too much to put up?', rows:4, who:'both'},
    {k:'board', text:'Put your three onto the digital board now, while they are fresh. Give each one an owner and an honest risk level. The paper one stays on the wall; this one is so the exercises later in the ninety days have something to bite on.'},
    {k:'note', text:'From tomorrow it goes back to the screen and the fifteen minutes. Week nine comes back to this board and makes it specific — the paper version should still be up when you get there.'}
  ]},

{ w:1, d:3, t:'Where love actually lands', mode:'together', seg:[3,10,2],
  why:'Most people give love in the currency they want to receive. It is the single most common reason two people who love each other both feel unloved.',
  blocks:[
    {k:'note', text:'Fifteen forced choices each. There are no good answers, only true ones. Pick what <em>lands</em>, not what sounds generous. This takes about four minutes each and everything downstream leans on it.'},
    {k:'widget', w:'lovelang'}
  ]},

{ w:1, d:4, t:'The currency exchange', mode:'together', seg:[2,9,4],
  why:'Knowing your partner is a Words person is trivia. Spending in it daily is the practice.',
  blocks:[
    {k:'widget', w:'currency'},
    {k:'ask', id:'cheap', q:'Three things in your partner’s currency that would cost you almost nothing to do this week.', hint:'Cheap for you, loud for them. That is the whole trade.', ph:'', rows:3, who:'both'},
    {k:'ask', id:'hard', q:'And one that would genuinely cost you something. Why is that one hard?', rows:3, who:'both'}
  ]},

{ w:1, d:5, t:'What a good week looks like', mode:'solo', seg:[2,9,4],
  why:'You have both been assuming the other knows. Answer privately first — the gap between the two answers is the useful part.',
  blocks:[
    {k:'note', text:'Answer without looking at their side. Reveal only when you have both finished.'},
    {k:'ask', id:'goodweek', q:'Describe an ordinary good week between us. Tuesday, not the anniversary.', hint:'Be concrete. What time do you eat, who does what, what does Saturday morning look like, when do you touch each other.', ph:'', rows:5, who:'both'},
    {k:'ask', id:'lastgood', q:'When did we last have one of those? What made it possible?', rows:3, who:'both'},
    {k:'ask', id:'gap', q:'After revealing: what surprised you in their version?', hint:'Do this part out loud, together.', rows:3, who:'us'}
  ]},

{ w:1, d:6, t:'The three rules', mode:'together', seg:[2,9,4],
  why:'You are going to hit weeks where one of you wants to quit. Write the rules now, while it is still easy.',
  blocks:[

/* ---------------- WEEK 3 — NAMING ---------------- */
{ w:3, d:15, t:'Want, need, demand', mode:'together', seg:[2,9,4],
  why:'Most fights are a need dressed as a demand, or a want being defended like a need. Sorting them lowers the stakes enormously.',
  blocks:[
    {k:'note', text:'<strong>A want</strong> is something that would make life better — negotiable, tradeable. <strong>A need</strong> is something you go sour without — non-negotiable in substance, flexible in form. <strong>A demand</strong> is a want or need with a threat attached, spoken or not.'},
    {k:'list', id:'wants', q:'Three wants.', ph:'A want, in your own words', max:4, who:'both'},
    {k:'list', id:'needs', q:'Three needs.', hint:'Test: if this were absent for two years, would you become someone you do not like?', ph:'A need, in your own words', max:4, who:'both'},
    {k:'ask', id:'demand', q:'One thing you have been delivering as a demand. What is the need underneath it?', rows:3, who:'both'}
  ]},

{ w:3, d:16, t:'Values, sorted', mode:'solo', seg:[2,10,3],
  why:'You cannot negotiate a life together from vibes. You need the actual list.',
  blocks:[
    {k:'note', text:'Tap everything that genuinely drives you — then look at the first three you tapped. Those are usually more honest than the ones you would pick after thinking about it. Do this without discussing.'},
    {k:'widget', w:'values'},
    {k:'ask', id:'v_why', q:'Your number one — where did it come from, and what has it cost you?', rows:3, who:'both'}
  ]},

{ w:3, d:17, t:'Where our values collide', mode:'together', seg:[2,9,4],

{ w:3, d:18, t:'The thing I have never told you I want', mode:'solo', seg:[2,10,3],
  why:'There is one. Both of you have one. Today is the day.',
  blocks:[
    {k:'note', tone:'warm', text:'Write it privately. Reveal only when you have both written something real. Rule for the reader: <strong>your only job on hearing it is to understand it.</strong> Not to agree, not to solve it, not to defend yourself. You get to react tomorrow.'},
    {k:'ask', id:'never', q:'The thing you have never said you want.', hint:'It might be big — a place, a career, a child, an open question about the shape of your life. It might be small and embarrassing. The size does not matter; the silence does.', rows:5, who:'both'},

    {k:'ask', id:'heard', q:'Reader: say back what you heard, in your own words, before anything else.', rows:3, who:'both'},
    {k:'board', text:'Put it on the board. Not to commit to it — to stop it being invisible. Mark it Someday if that is the truth.'}
  ]},

{ w:4, d:24, t:'Who benefits from not deciding', mode:'solo', seg:[2,10,3],

    {k:'ask', id:'ifhonest', q:'If you are honest — are you waiting for them to decide so it is not on you?', rows:3, who:'both'}
  ]},

  ]},

{ w:4, d:27, t:'Dock the first three', mode:'together', seg:[2,9,4],

  ]},

{ w:6, d:39, t:'Soft start-up', mode:'together', seg:[2,10,3],
  why:'A conversation ends roughly the way it starts. The first sixty seconds decide most of it.',
  blocks:[
    {k:'note', text:'The antidote to criticism is a gentle start-up: describe the situation, say how you feel, make a positive specific request. No "you always". No character assessment. No opening with the word "you".'},
    {k:'widget', w:'softstart'},
    {k:'ask', id:'harsh', q:'Now write the harsh version you would normally have used. Put them side by side.', hint:'Seeing the two next to each other is the lesson.', rows:3, who:'both'},
    {k:'ask', id:'sayit', q:'Say the soft version out loud, for real, about a real thing. What happened?', rows:3, who:'us'}
  ]},

{ w:6, d:40, t:'Repair attempts', mode:'together', seg:[2,9,4],
  why:'It is not whether you fight. It is whether the brakes work mid-fight, and whether the other person lets them work.',
  blocks:[
    {k:'note', text:'A repair attempt is anything that de-escalates: a joke, a hand, "can I start over?", "that came out wrong", "I am scared, not angry". Half the skill is making them. The other half — the harder half — is accepting one when you are still angry.'},
    {k:'list', id:'repairs', q:'Build your phrase bank. What will you actually say?', hint:'It has to sound like you. A phrase you would never say is useless.', ph:'Let me try that again.', max:6, who:'both'},
    {k:'ask', id:'accept', q:'Which of you is worse at accepting a repair attempt? What does refusing one get you?', hint:'Usually: being right for a few more minutes.', rows:3, who:'both'},
    {k:'ask', id:'signal', q:'Agree a signal for "I am making a repair attempt, please take it".', rows:2, who:'us'}
  ]},

{ w:6, d:41, t:'Run one back', mode:'together', seg:[2,11,2],
  why:'Take a fight you actually had and replay it with the new machinery. Not to relitigate it — to practise.',
  blocks:[
    {k:'note', tone:'sharp', text:'Pick a real one, recent, medium-sized. Not the biggest one you have. This is a rehearsal, not a rematch. If either of you gets flooded, use the protocol from day 38 — that is a success, not a failure.'},
    {k:'ask', id:'fight', q:'Which fight, in one line?', rows:2, who:'us'},
    {k:'ask', id:'horse_it', q:'Which horseman showed up first, and whose was it?', rows:2, who:'both'},
    {k:'ask', id:'redo', q:'Write your opening line again, as a soft start-up. Then say it to them.', rows:3, who:'both'},
    {k:'ask', id:'diff', q:'What was different this time?', rows:3, who:'us'}
  ]},

{ w:6, d:42, t:'Week six, read back', mode:'together', seg:[2,9,4],
  why:'The machinery week is done. Next week you point it at the thing that has never moved.',
  blocks:[
    {k:'widget', w:'recap'},
    {k:'ask', id:'w6_use', q:'Did you use any of it this week — a break, a soft start-up, a repair? What happened?', rows:3, who:'both'},
    {k:'ask', id:'w6_hard', q:'Which of the four is going to be the hard one for you long term?', rows:2, who:'both'},
    {k:'note', tone:'sharp', text:'Week seven is the hardest week in the ninety. It is one structured conversation stretched over several days, about the thing you two have never resolved. Do it on days you are not exhausted. Do not do it after alcohol. If you need to shift it by a day, shift it — but do not skip it.'}
  ]},

/* ---------------- WEEK 7 — DREAMS WITHIN CONFLICT ---------------- */
{ w:7, d:43, t:'Pick the gridlock', mode:'together', seg:[2,9,4],
  why:'Perpetual problems are normal — most couples have several. Gridlock is different: the same argument, no movement, and it feels worse each time.',
  blocks:[
    {k:'note', text:'Gridlock has a signature: you keep having the same conversation, neither position moves an inch, and afterwards you both feel a bit rejected. Underneath almost every gridlock is a dream one of you is protecting — usually one that was formed long before you met.'},
    {k:'widget', w:'dockpick', q:'Which one is the gridlock?'},
    {k:'ask', id:'gl_history', q:'How long has this exact argument been running, and what is the shortest version of each side?', rows:4, who:'us'},
    {k:'ask', id:'gl_feel', q:'What do you feel right after you have it?', rows:3, who:'both'}
  ]},

{ w:7, d:44, t:'Dreamer and dreamcatcher — round one', mode:'together', seg:[2,11,2],
  why:'One of you speaks. One of you only asks questions. No solving, no defending, no negotiating. This structure is the entire point.',
  blocks:[
    {k:'note', tone:'warm', text:'<strong>Decide who is the Dreamer today.</strong> The other is the Dreamcatcher and does exactly two things: asks questions, and says back what they heard. The Dreamcatcher does not get to disagree today. Not once. You get your turn tomorrow.'},
    {k:'ask', id:'dreamer', q:'Dreamer — what is your position on this, and what does it mean to you?', hint:'Not why you are right. What it means. What you are hoping for.', rows:4, who:'both'},
    {k:'ask', id:'dr_story', q:'Dreamcatcher, ask these and write what you hear: Is there a story or a childhood memory behind this for you? What would it mean about you if you got it? What is the nightmare version if you do not?', rows:5, who:'both'},
    {k:'ask', id:'dr_back', q:'Dreamcatcher — say it back. Then ask: did I get it right?', rows:3, who:'both'}
  ]},

{ w:7, d:45, t:'Round two — switch', mode:'together', seg:[2,11,2],
  why:'Same structure, roles reversed. Yesterday you were heard. Today you do the hearing.',
  blocks:[
    {k:'note', tone:'warm', text:'Swap. If yesterday’s Dreamer catches themselves defending their own position today, stop and restart. Today is not about you.'},
    {k:'ask', id:'dreamer2', q:'Today’s Dreamer — same questions. What does your side of this mean to you?', rows:4, who:'both'},
    {k:'ask', id:'dr_story2', q:'The story underneath it. Where does this come from?', rows:5, who:'both'},
    {k:'ask', id:'dr_back2', q:'Dreamcatcher — say it back in your own words.', rows:3, who:'both'},
    {k:'ask', id:'dr_shift', q:'Both of you: has the shape of this changed at all in two days?', rows:3, who:'both'}
  ]},

{ w:7, d:46, t:'Where the dream came from', mode:'solo', seg:[2,10,3],
  why:'Dreams are inherited. Understanding the inheritance does not settle the argument, but it stops it being an argument about who is unreasonable.',
  blocks:[
    {k:'ask', id:'inherit', q:'What did your family teach you about this exact subject — money, moving, risk, children, work, whichever it is?', rows:4, who:'both'},
    {k:'ask', id:'vow', q:'What did you privately vow, back then, about how your own life would go?', hint:'Almost everyone has one. "I will never be broke like that." "I will never be stuck in one place." "My kids will always know where I am."', rows:3, who:'both'},
    {k:'ask', id:'vow_now', q:'Is that vow still serving you, or is it just old?', rows:3, who:'both'},
    {k:'ask', id:'vow_hear', q:'After revealing: what does your partner’s vow explain about the last five years?', rows:3, who:'both'}
  ]},

{ w:7, d:47, t:'Core and flexible', mode:'together', seg:[2,10,3],
  why:'Inside every dream is a small non-negotiable core and a large negotiable outer layer. People fight over the outer layer thinking it is the core.',
  blocks:[
    {k:'note', text:'Example: the dream is "a year abroad". The core might be "I need to prove I can start over somewhere". The flexible part is the year, the country, the timing, and whether it is even abroad.'},
    {k:'ask', id:'core', q:'What is the smallest, truest core of your dream here? The part that, if you lost it, the rest would be pointless.', rows:3, who:'both'},
    {k:'ask', id:'flex', q:'Now everything around it that is genuinely negotiable. Be generous — most of it is.', rows:4, who:'both'},
    {k:'ask', id:'core_honour', q:'Read each other’s cores. Can you honour their core without giving up yours?', hint:'The answer is yes far more often than gridlock suggests.', rows:3, who:'us'}
  ]},

{ w:7, d:48, t:'A temporary compromise', mode:'together', seg:[2,10,3],
  why:'You are not solving this permanently today. You are designing something you can both live with for a set period, then review.',
  blocks:[
    {k:'note', tone:'warm', text:'Temporary is what makes it possible. A compromise with an end date is a trial, and people will trial things they would never sign.'},
    {k:'ask', id:'comp', q:'Write the temporary arrangement. Concrete enough that a stranger could tell whether you were doing it.', rows:4, who:'us'},
    {k:'ask', id:'comp_time', q:'How long does it run for, and what is the date we review it?', ph:'Six weeks. Review on the 14th.', rows:2, who:'us'},
    {k:'ask', id:'comp_give', q:'What is each of you actually giving up here? Say it plainly so nobody pretends it was free.', rows:3, who:'both'},
    {k:'dock', text:'Update this decision in the dock — status Framed, and put the review date in as the decide-by.'}
  ]},

{ w:7, d:49, t:'Week seven, read back', mode:'together', seg:[2,9,4],
  why:'That was the hardest week. It gets more practical from here.',
  blocks:[
    {k:'widget', w:'recap'},
    {k:'ask', id:'w7_moved', q:'Did anything move that had not moved in years?', rows:3, who:'both'},
    {k:'ask', id:'w7_cost', q:'What did this week cost you? Say it — do not be gracious about it.', rows:3, who:'both'},
    {k:'ask', id:'w7_thank', q:'One thing your partner did this week that took courage.', rows:3, who:'both'}
  ]},

/* ---------------- WEEK 8 — MONEY, TIME, RISK ---------------- */
{ w:8, d:50, t:'The actual numbers', mode:'together', seg:[2,11,2],
  why:'Dreams die in vagueness. Half the fear around a big move is fear of a number nobody has written down.',
  blocks:[
    {k:'note', text:'Get the real figures out. If you do not know one, write "do not know" — the gaps are as useful as the numbers, and they become this week-s homework.'},
    {k:'ask', id:'n_in', q:'What comes in each month, after tax, both of us combined?', rows:2, who:'us'},
    {k:'ask', id:'n_out', q:'What goes out, honestly? Including the bits we do not talk about.', rows:2, who:'us'},
    {k:'ask', id:'n_buf', q:'How many months could we cover with what we have if income stopped tomorrow?', rows:2, who:'us'},
    {k:'ask', id:'n_dream', q:'What would the thing we want actually cost — the setup cost and the monthly difference?', rows:3, who:'us'},
    {k:'ask', id:'n_gap', q:'What do we not know, and who finds it out by when?', rows:3, who:'us'}
  ]},

{ w:8, d:51, t:'Runway and ruin', mode:'together', seg:[2,10,3],
  why:'There is a difference between a risk that hurts and a risk you cannot come back from. Almost nothing is the second one.',
  blocks:[
    {k:'ask', id:'ruin', q:'What would genuine ruin look like for us? Define it precisely.', hint:'Not "it would be really bad". What specifically would have to be true? Losing the house? No income for a year? Debt we could not service?', rows:3, who:'us'},
    {k:'ask', id:'distance', q:'How far are we from that, in months and in decisions?', rows:3, who:'us'},
    {k:'ask', id:'rule', q:'Write the rule that keeps us out of it.', hint:'A good rule is a bright line you do not have to relitigate in the moment. "We never go below four months of expenses." "We never put the house up as collateral."', rows:3, who:'us'},
    {k:'ask', id:'inside', q:'Given that rule — how much room do we actually have to be brave?', hint:'Most people find they have more room than the anxiety suggested. Some find they have less, which is also worth knowing.', rows:3, who:'us'}
  ]},

{ w:8, d:52, t:'Risk appetite, calibrated', mode:'solo', seg:[2,9,4],
  why:'You are not equally brave, and neither of you is wrong. The problem is when it is never discussed and just gets acted out.',
  blocks:[
    {k:'scale', id:'risk_me', q:'My natural risk appetite.', lo:1, hi:10, lolbl:'certainty, always', hilbl:'roll it', who:'both'},
    {k:'scale', id:'risk_them', q:'Where I think THEY sit.', lo:1, hi:10, lolbl:'certainty, always', hilbl:'roll it', who:'both'},
    {k:'ask', id:'risk_area', q:'Where are you braver than they think? Where are you more frightened than you let on?', rows:4, who:'both'},
    {k:'ask', id:'risk_role', q:'After revealing: have the two of you been playing assigned roles — one the brake, one the accelerator — regardless of what you actually think?', hint:'This is extremely common. The cautious one gets stuck being cautious about everything, and stops being able to say when they are excited.', rows:4, who:'both'}
  ]},

{ w:8, d:53, t:'What we are really risking', mode:'together', seg:[2,9,4],
  why:'Say the loss out loud. Unnamed, it is infinite. Named, it has edges.',
  blocks:[
    {k:'ask', id:'lose_money', q:'If we go for it and it fails — what do we lose in money?', rows:2, who:'us'},
    {k:'ask', id:'lose_face', q:'In how we look to other people?', hint:'This one drives more decisions than anyone admits. Name the specific people whose opinion is doing the work.', rows:3, who:'us'},
    {k:'ask', id:'lose_self', q:'In how we see ourselves?', rows:3, who:'both'},
    {k:'ask', id:'lose_ok', q:'Which of those three are you actually willing to risk?', rows:3, who:'both'}
  ]},

{ w:8, d:54, t:'Time is the scarcer one', mode:'together', seg:[2,10,3],
  why:'Money can be recovered. The specific years you are in cannot.',
  blocks:[
    {k:'note', tone:'sharp', text:'Do the arithmetic. It is uncomfortable and it is clarifying.'},
    {k:'ask', id:'t_health', q:'How many years do you realistically have of the body you would need for this — the hiking, the moving, the sleepless start-up years, the pregnancy, whatever it is?', rows:3, who:'both'},
    {k:'ask', id:'t_people', q:'How many more times will you see the people who matter most, at the current rate?', hint:'Visits per year multiplied by years remaining. Write the number down.', rows:3, who:'both'},
    {k:'ask', id:'t_window', q:'Is there a real window on any of this that closes?', hint:'Some windows are invented to create urgency. Some are real. Say which is which.', rows:3, who:'us'},
    {k:'ask', id:'t_now', q:'Does that change the timing of anything on the board?', rows:3, who:'us'}
  ]},

{ w:8, d:55, t:'What we are protecting that is not worth it', mode:'solo', seg:[2,10,3],
  why:'Some of what you are guarding stopped being valuable years ago. You are still paying the guard.',
  blocks:[
    {k:'note', tone:'sharp', text:'Private. Then reveal. Try not to soften it for the reveal.'},
    {k:'ask', id:'p_thing', q:'Name something you are protecting — a possession, a status, an identity, a relationship, a plan — that you suspect is not worth what it costs.', rows:3, who:'both'},
    {k:'ask', id:'p_cost', q:'What does keeping it cost, per year, in money, time, and freedom?', rows:3, who:'both'},
    {k:'ask', id:'p_who', q:'Who would be upset if you let it go? Are they going to live your next ten years?', rows:3, who:'both'},
    {k:'board', text:'If something here should become a card — a thing you are letting go of, or a promise you are making about it — add it.'}
  ]},

{ w:8, d:56, t:'Week eight, read back', mode:'together', seg:[2,9,4],
  why:'The constraint layer is mapped. Next week you get to build the thing you are constrained about.',
  blocks:[
    {k:'widget', w:'recap'},
    {k:'ask', id:'w8_bigger', q:'Did the room to move turn out bigger or smaller than you thought?', rows:3, who:'both'},
    {k:'ask', id:'w8_todo', q:'What number do we still not know, and who is finding it out this week?', rows:3, who:'us'},
    {k:'note', tone:'warm', text:'Next week is the fun one. You have earned it.'}
  ]},

/* ---------------- WEEK 9 — THE BOARD, BUILT ---------------- */
{ w:9, d:57, t:'Three years, specifically', mode:'solo', seg:[2,11,2],
  why:'Not goals. A scene. Write it in the present tense as though you are standing in it.',
  blocks:[
    {k:'note', text:'Write privately. Present tense. Specific enough that someone could film it. Where you wake up, what the room is like, what the first hour looks like, who is there, what you do on a Wednesday, what you do on a Saturday, what you are worried about, what you are proud of.'},
    {k:'ask', id:'y3', q:'A Wednesday, three years from now.', rows:7, who:'both'},
    {k:'ask', id:'y3_feel', q:'What is the dominant feeling in that scene?', rows:2, who:'both'}
  ]},

{ w:9, d:58, t:'Ten years, specifically', mode:'solo', seg:[2,11,2],
  why:'Ten years is far enough away that you stop being practical and start being honest.',
  blocks:[
    {k:'ask', id:'y10', q:'A day, ten years out. Same rules — present tense, filmable.', rows:7, who:'both'},
    {k:'ask', id:'y10_who', q:'Who are you, in that scene? What have you become that you are not yet?', rows:3, who:'both'},
    {k:'ask', id:'y10_miss', q:'What is missing from that picture that you noticed while writing it?', rows:3, who:'both'}
  ]},

{ w:9, d:59, t:'Overlay', mode:'together', seg:[2,11,2],
  why:'Two futures, laid on top of each other. Where they line up is your shared project. Where they do not is your real work.',
  blocks:[
    {k:'widget', w:'snapshot', src:57, ids:['y3']},
    {k:'ask', id:'ov_same', q:'What is in both pictures?', hint:'Read them to each other before you answer. Out loud, whole thing, no interrupting.', rows:4, who:'us'},
    {k:'ask', id:'ov_diff', q:'What is in one and not the other?', rows:4, who:'us'},
    {k:'ask', id:'ov_clash', q:'What is in one and actively rules out the other?', hint:'Be honest here. Two people can love each other and want incompatible Wednesdays. Naming it early is how it gets designed around instead of discovered at fifty.', rows:4, who:'us'}
  ]},

{ w:9, d:60, t:'Non-negotiable, or just loud', mode:'together', seg:[2,10,3],
  why:'You each have three real non-negotiables. Everything else has been getting defended as though it were one.',
  blocks:[
    {k:'list', id:'nonneg', q:'Your three genuine non-negotiables for the next ten years.', hint:'Only three. If you have five, two of them are preferences. The test: you would rather have a hard conversation about the whole relationship than give this up.', ph:'A real one', max:3, who:'both'},
    {k:'ask', id:'nn_why', q:'For your hardest one — why is that a non-negotiable and not a strong preference?', rows:3, who:'both'},
    {k:'ask', id:'nn_ok', q:'Read each other’s. Can you live inside theirs?', rows:3, who:'both'},
    {k:'ask', id:'nn_drop', q:'What have you been defending as non-negotiable that you now realise is not?', rows:3, who:'both'}
  ]},

{ w:9, d:61, t:'Build the board', mode:'together', seg:[2,11,2],
  why:'Everything from nine weeks becomes objects you can move around. Vague futures cannot be prioritised. Cards can.',
  blocks:[
    {k:'note', tone:'warm', text:'Spend the whole nine minutes here. Pull from days 18, 55, 57, 58 and 60. Give every card an owner — yours, theirs, or ours — a kind, and an honest risk level. Add pictures if you have them. Then arrange them so the layout means something: near and far, soon and later, ours and mine.'},
    {k:'widget', w:'boardview', q:'The board.'},
    {k:'ask', id:'board_look', q:'Stand back. What does the board tell you about the two of you?', rows:3, who:'us'},
    {k:'ask', id:'board_miss', q:'What is not on it that should be?', rows:2, who:'both'}
  ]},

{ w:9, d:62, t:'Rank by regret', mode:'together', seg:[2,10,3],
  why:'Do not rank by excitement or by feasibility. Rank by which one you would most regret never attempting.',
  blocks:[
    {k:'ask', id:'rank_a', q:'Your top three cards by regret-if-never-attempted, in order.', hint:'Not the most achievable. The most regretted.', rows:3, who:'both'},
    {k:'ask', id:'rank_agree', q:'Where do your rankings agree?', rows:3, who:'us'},
    {k:'ask', id:'rank_one', q:'Pick the single card that goes first for the two of you. Write why.', hint:'One. Not three. Everything in weeks ten and eleven points at this.', rows:3, who:'us'},
    {k:'board', text:'Move that card from Someday to Named. If anything on the board is genuinely dead, say so out loud and delete it — a board full of dead dreams is just a guilt display.'}
  ]},

{ w:9, d:63, t:'Week nine, read back', mode:'together', seg:[2,9,4],
  why:'You have a picture and a priority. Now it becomes an experiment rather than a leap.',
  blocks:[
    {k:'widget', w:'recap'},
    {k:'widget', w:'ledger'},
    {k:'ask', id:'w9_scared', q:'Which card scares you most, and is that the same one that excites you most?', rows:3, who:'both'},
    {k:'ask', id:'w9_ready', q:'Anything on the board you are not ready to talk about yet? Say so now rather than stalling in week eleven.', rows:3, who:'both'}
  ]}
];

/* ============================================================
   Weeks 10–13 : Two-Way Doors · Deciding · Living It · Keep
   ============================================================ */
const D3 = [
/* ---------------- WEEK 10 — TWO-WAY DOORS ---------------- */
{ w:10, d:64, t:'One-way or two-way', mode:'together', seg:[2,9,4],
  why:'Most of what people freeze on is reversible. Treating a two-way door like a one-way door is the most expensive mistake in this whole tool.',
  blocks:[
    {k:'note', text:'A one-way door is hard or impossible to walk back: having a child, a public resignation, selling something irreplaceable. A two-way door can be undone at a cost you can name. Two-way doors deserve speed. One-way doors deserve the slow version — and a date.'},
    {k:'widget', w:'riskdoor', q:'The card you picked on day 62 — which is it?'},
    {k:'ask', id:'door_evidence', q:'Argue the other side for sixty seconds each. If you said one-way, make the case that it is two-way. What is the evidence?', rows:4, who:'both'},
    {k:'ask', id:'door_final', q:'Final answer, and what that means for how fast you move.', rows:3, who:'us'}
  ]},

{ w:10, d:65, t:'The smallest viable bet', mode:'together', seg:[2,10,3],
  why:'You do not have to decide the whole thing. You have to find the smallest version that produces real information.',
  blocks:[
    {k:'note', text:'The move is almost never "do it" or "do not do it". It is "run the two-week version and find out". A month in the city before the move. Three clients before the resignation. One weekend with the kids of friends. A conversation with someone who did it.'},
    {k:'ask', id:'bet', q:'What is the smallest real-world version of this you could run in the next 30 days?', hint:'It must be real. Reading about it is not a bet. It has to involve your actual body, money, or reputation.', rows:4, who:'us'},
    {k:'ask', id:'bet_cost', q:'What does that version cost — money, days, and pride?', rows:3, who:'us'},
    {k:'ask', id:'bet_stop', q:'What is the version so small it is embarrassing? Could you do that this week?', rows:3, who:'us'}
  ]},

{ w:10, d:66, t:'Design the experiment', mode:'together', seg:[2,11,2],
  why:'An experiment without a written prediction is just a thing that happened.',
  blocks:[
    {k:'ask', id:'ex_what', q:'What exactly will we do, and by when?', ph:'Between the 3rd and the 17th we will...', rows:3, who:'us'},
    {k:'ask', id:'ex_pred', q:'What do we each predict will happen? Write it before you run it.', hint:'Separate predictions. You will both be surprised by something, and you will only know that if you wrote it down first.', rows:3, who:'both'},
    {k:'ask', id:'ex_measure', q:'What are we actually measuring? How will we know?', hint:'Feelings count as data if you name them in advance. "Do I feel lighter on day four" is measurable. "Did it go well" is not.', rows:3, who:'us'},
    {k:'ask', id:'ex_who', q:'Who owns making it happen, and what is their first phone call or email?', rows:3, who:'us'}
  ]},

{ w:10, d:67, t:'What would change our minds', mode:'solo', seg:[2,9,4],
  why:'If nothing could change your mind, you are not deciding. You are defending.',
  blocks:[
    {k:'ask', id:'change_yes', q:'What would have to be true for you to go all in on this?', hint:'Be specific and falsifiable. A number, an event, a person saying a thing.', rows:3, who:'both'},
    {k:'ask', id:'change_no', q:'What would have to be true for you to drop it entirely, without resentment?', rows:3, who:'both'},
    {k:'ask', id:'change_none', q:'If your honest answer to either is "nothing" — what does that tell you?', rows:3, who:'both'},
    {k:'ask', id:'change_read', q:'After revealing: is your partner’s bar for yes reachable? Is theirs for no?', rows:3, who:'both'}
  ]},

{ w:10, d:68, t:'Put it in the calendar', mode:'together', seg:[2,9,4],
  why:'A plan without a calendar entry is a wish with better vocabulary.',
  blocks:[
    {k:'note', tone:'warm', text:'Both of you, phones out. Actually put the dates in. This day fails if nothing gets scheduled.'},
    {k:'ask', id:'cal_when', q:'Date and time the experiment starts.', rows:1, who:'us'},
    {k:'ask', id:'cal_first', q:'First action, and which of us does it. Put it in the calendar now.', rows:2, who:'us'},
    {k:'ask', id:'cal_review', q:'Date we sit down and read the results.', rows:1, who:'us'},
    {k:'ask', id:'cal_block', q:'What is most likely to eat these dates, and what are we doing about that now?', rows:3, who:'us'},
    {k:'dock', text:'Set the decide-by date on the docked decision to the review date. It is no longer floating.'}
  ]},

{ w:10, d:69, t:'Who we have to tell', mode:'together', seg:[2,9,4],
  why:'Other people-s reactions are a real cost. Plan for them instead of being ambushed by them.',
  blocks:[
    {k:'ask', id:'tell_who', q:'Who will have an opinion about this, and what will each of them say?', hint:'Name them. Parents, a sibling, the friend who always has a warning, a boss.', rows:4, who:'us'},

const DAYS = [].concat(D1, D2, D3);

/* ============================================================
   Together / 90 — core engine
   Serverless. Single file. No network. No accounts.
   ============================================================ */
'use strict';

/* ---------- tiny helpers ---------- */
const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => 'x' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
const todayISO = () => new Date().toISOString().slice(0, 10);
const daysBetween = (a, b) => Math.round((new Date(b + 'T00:00') - new Date(a + 'T00:00')) / 86400000);
const fmtDate = iso => { if (!iso) return ''; const d = new Date(iso + 'T00:00'); return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }); };

function toast(msg, ms) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), ms || 2100);
}
function modal(html) {
  closeModal();
  const w = document.createElement('div'); w.id = 'modal';
  w.innerHTML = '<div class="mbox">' + html + '</div>';
  w.addEventListener('click', e => { if (e.target === w) closeModal(); });
  document.body.appendChild(w);
  return w;
}
function closeModal() { const m = $('#modal'); if (m) m.remove(); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* ---------- storage (degrades gracefully) ---------- */
const KEY = 'together90.v1';
const Store = (() => {
  let ok = true;
  try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); }
  catch (e) { ok = false; }
  let mem = null;
  return {
    ok,
    get() {
      if (!ok) return mem;
      try { const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : null; } catch (e) { return null; }
    },
    set(o) {
      if (!ok) { mem = o; return false; }
      try { localStorage.setItem(KEY, JSON.stringify(o)); if (Store.failed) { Store.failed = false; paintStorage(); } return true; }
      catch (e) { mem = o; ok = false; Store.failed = true; paintStorage(); return false; }
    },
    failed: false,
    wipe() { try { localStorage.removeItem(KEY); } catch (e) {} mem = null; }
  };
})();

/* ---------- state ---------- */
function blank() {
  return {
    v: 1, schema: 3, me: 'a', meSet: false,
    couple: { a: 'Partner A', b: 'Partner B', start: todayISO(), setup: false },
    settings: { chime: true, autoTimer: false, defaultMode: 'auto' },
    cur: 1,
    progress: {},          // day -> {done, at, mins}
    answers: {},           // day -> id -> {a,b,us}
    reveal: {},            // day -> true
    board: [],
    dock: [],
    prof: { a: {}, b: {} },
    log: [],
    sec: null,
    bk: {},                // {last,kind,snoozed} — backup health
    turn: {},              // day key -> whose turn on a pass-the-device day
    timer: null,           // persisted session timer
    paused: null,          // {at} if the couple stepped away on purpose
    sessions: [],          // {k, at, mins} — how long a day actually took
    pair: null,            // {seen, at} — the paired folder's last read
    plan: null,            // the schedule: which evenings, what is blocked out, the finish line
    upd: {}                // id -> timestamp, for merge
  };
}
let S = Store.get() || blank();
(function migrate() {
  const b = blank();
  for (const k in b) if (S[k] === undefined) S[k] = b[k];
  if (!S.couple.start) S.couple.start = todayISO();
  if (S.schema !== 3) { const old = Number(S.cur) || 1; S.cur = old <= 2 ? old : old + 2; S.schema = 3; }
})();

let saveT = null;
function save(now) {
  S.savedAt = Date.now();
  if (typeof Live !== 'undefined' && Live.ok) Live.nudge();
  if (typeof Pair !== 'undefined' && Pair.ok) Pair.nudge();
  if (typeof Link !== 'undefined' && Link.live()) Link.nudge();
  if (now) { Store.set(S); return; }
  clearTimeout(saveT);
  saveT = setTimeout(() => Store.set(S), 320);
}
function stamp(k) { S.upd[k] = Date.now(); }

/* ---------- answers ---------- */
function A(day, id) { const k = String(day); return (S.answers[k] && S.answers[k][id]) || {}; }
function setA(day, id, who, val) {
  const k = String(day);
  S.answers[k] = S.answers[k] || {};
  S.answers[k][id] = S.answers[k][id] || {};
  S.answers[k][id][who] = val;
  stamp('ans:' + k + ':' + id + ':' + who);
  save();
}
function other(w) { return w === 'a' ? 'b' : 'a'; }
function nameOf(w) { return w === 'us' ? 'Both of us' : (S.couple[w] || (w === 'a' ? 'Partner A' : 'Partner B')); }

/* ---------- day model ----------
   Two different numbers, deliberately kept apart:
     n   the ordinal position in the run, 1..92 — used for navigation
     k   the stable storage key, never changes — used for answers/progress
   Inserting 3a and 3b shifted every later day's DISPLAYED number by one but
   left its storage key alone, so nothing anyone already wrote moved.        */
DAYS.forEach((d, i) => {
  d.n = i + 1;
  d.k = String(d.d);
  d.lbl = /[a-z]$/i.test(d.k) ? d.k : String(Number(d.k) <= 2 ? Number(d.k) : Number(d.k) + 1);
});
const TOTAL = DAYS.length;
const LASTLBL = DAYS[DAYS.length - 1].lbl;
const BYKEY = {}; DAYS.forEach(d => BYKEY[d.k] = d);
function day(n) { return DAYS[clamp(n, 1, TOTAL) - 1]; }
function dayByKey(k) { return BYKEY[String(k)] || null; }
function labelOf(k) { const d = dayByKey(k); return d ? d.lbl : String(k); }
function ordOf(k) { const d = dayByKey(k); return d ? d.n : 1; }
function weekOf(n) { return WEEKS[day(n).w - 1]; }
function isDone(k) { return !!(S.progress[String(k)] && S.progress[String(k)].done); }
function doneCount() { let c = 0; DAYS.forEach(d => { if (isDone(d.k)) c++; }); return c; }
function suggestedDay() {
  const elapsed = daysBetween(S.couple.start, todayISO());
  return clamp(elapsed + 1, 1, TOTAL);
}
function streak() {
  const dates = new Set();
  for (const k in S.progress) if (S.progress[k].done && S.progress[k].at) dates.add(S.progress[k].at.slice(0, 10));
  let n = 0; const d = new Date();
  for (;;) {
    const iso = d.toISOString().slice(0, 10);
    if (dates.has(iso)) { n++; d.setDate(d.getDate() - 1); }
    else if (n === 0 && iso === todayISO()) { d.setDate(d.getDate() - 1); }
    else break;
    if (n > 400) break;
  }
  return n;
}
function lastSessionAt() {
  let t = 0;
  for (const k in S.progress) { const at = S.progress[k] && S.progress[k].at; if (at) t = Math.max(t, +new Date(at)); }
  return t || null;
}
function fmtAgo(t) {
  const d = Math.floor((Date.now() - t) / 86400000);
  return d <= 0 ? 'today' : d === 1 ? 'yesterday' : d + ' days ago';
}
function fmtMinsAgo(t) {
  const m = Math.floor((Date.now() - t) / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return m + 'm ago';
  const h = Math.floor(m / 60);
  return h < 24 ? h + 'h ago' : Math.floor(h / 24) + 'd ago';
}
function gapDays() { const t = lastSessionAt(); return t ? Math.floor((Date.now() - t) / 86400000) : 0; }
function avgMins() {
  const xs = (S.sessions || []).filter(s => s.mins > 0).map(s => s.mins);
  if (!xs.length) return null;
  return Math.round(xs.reduce((p, c) => p + c, 0) / xs.length);
}
function effMode(d) {
  const s = S.settings.defaultMode;

}

/* ---------- love-language helpers ---------- */
const LL = [
  { k: 'words',   n: 'Words',            d: 'Being told, out loud or in writing, what you mean to them.' },
  { k: 'time',    n: 'Undivided time',   d: 'Their full attention with nothing else competing for it.' },

];
function llRank(who) {

  return LL.map(l => ({ ...l, v: sc[l.k] || 0 })).sort((x, y) => y.v - x.v);
}

function todayTitle() {

/* ---------- top bar ---------- */
function paintTop() {

/* ============================================================
   TIMER
   ============================================================ */
const T = { on: false, seg: 0, left: 0, segs: [2, 9, 4], names: ['Arrive', 'Practice', 'Land'], iv: null, day: 0, spent: 0 };
/* a sitting is Arrive + one block per day of material + Land */
function curSegs() {
  if (typeof planOn === 'function' && planOn()) {
    const s = curSession();
    if (s) return {
      segs: [2].concat(s.days.map(d => (d.seg && d.seg[1]) || 9)).concat([4]),
      names: ['Arrive'].concat(s.days.map(d => d.t)).concat(['Land'])
    };
  }
  const d = day(S.cur);
  return { segs: d.seg || [2, 9, 4], names: ['Arrive', 'Practice', 'Land'] };
}
function segTotal() { return T.segs.reduce((n, x) => n + x, 0); }
function beep(freq, dur) {
  if (!S.settings.chime) return;
  try {
    const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
    T.ac = T.ac || new C();
    if (T.ac.state === 'suspended') T.ac.resume();
    const o = T.ac.createOscillator(), g = T.ac.createGain();
    o.type = 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0, T.ac.currentTime);
    g.gain.linearRampToValueAtTime(.12, T.ac.currentTime + .04);
    g.gain.exponentialRampToValueAtTime(.0001, T.ac.currentTime + dur);
    o.connect(g); g.connect(T.ac.destination); o.start(); o.stop(T.ac.currentTime + dur + .05);
  } catch (e) {}
}
function tSave() { S.timer = T.left > 0 ? { k: day(S.cur).k, seg: T.seg, left: T.left, spent: T.spent, on: T.on, at: Date.now() } : null; save(); }
function tRestore() {
  const p = S.timer; if (!p) return;
  const c = curSegs(); T.segs = c.segs; T.names = c.names;
  T.seg = Math.min(p.seg, T.segs.length - 1); T.spent = p.spent || 0;
  let left = p.left;
  if (p.on) left = p.left - Math.floor((Date.now() - p.at) / 1000);   // it kept running while you were away
  if (left <= 0) { S.timer = null; return; }
  T.left = left; T.on = false;
  tPaint();
}
function tStart() {
  if (!T.on && T.left <= 0) {
    const c = curSegs(); T.segs = c.segs; T.names = c.names;
    T.seg = 0; T.left = T.segs[0] * 60; T.day = S.cur; T.spent = 0;
  }
  T.on = true; beep(660, .18);
  clearInterval(T.iv); T.iv = setInterval(tick, 1000); tPaint(); tSave();
}
function tPause() { T.on = false; clearInterval(T.iv); tPaint(); tSave(); }
function tReset() { T.on = false; clearInterval(T.iv); T.seg = 0; T.left = 0; T.spent = 0; S.timer = null; save(); tPaint(); }
function tick() {
  T.left--; T.spent++;
  if (T.left <= 0) {
    if (T.seg < T.segs.length - 1) { T.seg++; T.left = T.segs[T.seg] * 60; beep(880, .22); setTimeout(() => beep(1100, .22), 240); }
    else { tPause(); T.left = 0; beep(520, .5); setTimeout(() => beep(392, .7), 420); toast('Time. Land it and close the laptop.', 4200); }
  }
  tPaint();
  if (T.spent % 15 === 0) tSave();
}
function tPaint() {
  const names = T.names || ['Arrive', 'Practice', 'Land'];
  const tot = (T.segs[T.seg] || 1) * 60;
  const pct = T.left > 0 ? (1 - T.left / tot) : 0;
  const C = 2 * Math.PI * 14;
  const ring = $('#tdash'); if (ring) ring.setAttribute('stroke-dasharray', (pct * C).toFixed(1) + ' ' + C.toFixed(1));
  const mm = Math.floor(T.left / 60), ss = T.left % 60;
  const planned = (typeof curSegs === 'function') ? curSegs().segs.reduce((n, x) => n + x, 0) : 15;
  const tt = $('#ttime'); if (tt) tt.textContent = T.left > 0 ? (mm + ':' + String(ss).padStart(2, '0')) : String(planned);
  const nm = names[T.seg] || 'Practice';
  const lb = $('#tlabel'); if (lb) lb.innerHTML = '<b>' + (T.left > 0 ? esc(nm.length > 16 ? nm.slice(0, 15) + '…' : nm) : 'Ready') + '</b>' + (T.left > 0 ? (T.on ? 'running' : 'paused') : planned + ' min sitting');
  const pb = $('#tplay'); if (pb) pb.textContent = T.on ? '❙❙' : '▶';
  $$('.seg').forEach((el, i) => el.classList.toggle('active', T.left > 0 && i === T.seg));
}

/* ============================================================

   ============================================================ */
function activeSide(k) { return S.turn[String(k)] || S.me; }
function slotOpen(who, cls, day, hideable) {
  const veiled = hideable && who !== activeSide(day) && !S.reveal[day];
  return '<div class="slot ' + who + ' ' + (cls || '') + '">' +
    (veiled ? '<div class="veil"><div><div class="vt">' + esc(nameOf(who)) + '’s answer is hidden for now.</div><button class="btn sm" data-act="reveal" data-d="' + day + '">Reveal both</button></div></div>' : '') +
    '<div class="nm">' + esc(nameOf(who)) + '</div>';
}
function whoList(b) {
  if (b.who === 'us') return ['us'];
  if (b.who === 'a' || b.who === 'b') return [b.who];
  return ['a', 'b'];
}

/* ---------- photos as a list ----------
   Photos are kept per person, and each slot holds a list, so two people adding
   photos on two devices merge the same way any other answer does. An older
   single shared slot is still read, and its photos can be claimed by either side. */
function photoList(dn, id, w) {
  const v = A(dn, id)[w];
  if (Array.isArray(v)) return v.filter(Boolean);
  return v ? [v] : [];
}
function addPhoto(dn, id, w, url) {
  const list = photoList(dn, id, w);
  if (list.length >= 6) { toast('Six photos per slot is the limit — this all has to fit in the browser.', 4200); return false; }
  list.push(url); setA(dn, id, w, list); return true;
}

      h += '</div>';
    });
    h += '</div>';
  }
  return h + '</div>';
}
