<style>
:root{
  --paper:#F5F7F6; --raise:#FFFFFF; --ink:#15243B; --ink-2:#465770; --ink-3:#7A889A; --rule:rgba(21,36,59,.12); --rule-2:rgba(21,36,59,.22);
  --shoal:#D7E7EC; --shoal-2:#C3DAE2; --brass:#A9852F; --brass-ink:#7A5E1C; --signal:#C2412D; --ok:#2F7A55; --sea:#177F8C; --sea-soft:rgba(23,127,140,.14);
  --serif:'Instrument Serif','Iowan Old Style',Georgia,serif;
  --sans:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="day"]){
    --paper:#0E1A2B; --raise:#142539; --ink:#E7EDF4; --ink-2:#AEBBCB; --ink-3:#8492A6; --rule:rgba(231,237,244,.12); --rule-2:rgba(231,237,244,.24);
    --shoal:#12293F; --shoal-2:#1A3A55; --brass:#D6B25E; --brass-ink:#E3C47E; --signal:#E8705A; --ok:#5BC48C; --sea:#4FB8C4; --sea-soft:rgba(79,184,196,.16); color-scheme:dark;
  }
}
:root[data-theme="night"]{
  --paper:#0E1A2B; --raise:#142539; --ink:#E7EDF4; --ink-2:#AEBBCB; --ink-3:#8492A6; --rule:rgba(231,237,244,.12); --rule-2:rgba(231,237,244,.24);
  --shoal:#12293F; --shoal-2:#1A3A55; --brass:#D6B25E; --brass-ink:#E3C47E; --signal:#E8705A; --ok:#5BC48C; --sea:#4FB8C4; --sea-soft:rgba(79,184,196,.16); color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.55 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:4px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
@media (max-width:640px){.wrap{padding:0 16px}}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

.mast{border-bottom:1px solid var(--rule);background:var(--paper);position:sticky;top:0;z-index:30}
.mast .wrap{display:flex;align-items:center;justify-content:space-between;height:52px;gap:12px}
.back{display:inline-flex;align-items:center;gap:10px;text-decoration:none;font-weight:600;font-size:15px;white-space:nowrap}
.back svg{width:26px;height:26px;flex:none}
.back span{color:var(--ink-3);font-weight:500}
.tbtn{font-size:14px;color:var(--ink-2);border:1px solid var(--rule);border-radius:999px;padding:5px 12px;background:var(--raise);flex:none}
.tbtn:hover{border-color:var(--brass)}

.hero{display:grid;grid-template-columns:1.35fr 1fr;gap:40px;padding-top:44px;padding-bottom:28px;align-items:end}
.kick{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--brass-ink);margin:0 0 10px}
.hero h1{font:400 64px/1.02 var(--serif);letter-spacing:-.01em;margin:0 0 14px;text-wrap:balance}
.hero h1 i{color:var(--brass-ink)}
.lede{margin:0;color:var(--ink-2);font-size:18px;max-width:58ch;text-wrap:pretty}
.big{border:1px solid var(--rule);background:var(--raise);border-radius:16px;padding:22px 24px}
.big b{display:block;font:400 84px/.95 var(--serif);color:var(--brass-ink);letter-spacing:-.02em}
.big p{margin:8px 0 14px;font-size:15px;color:var(--ink-2)}
.pill{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:9px 16px;font-weight:600;font-size:15px;text-decoration:none;background:var(--ink);color:var(--paper)}
.pill:hover{background:var(--brass-ink)}
.pill.ghost{background:none;color:var(--ink);border:1px solid var(--rule-2)}
.pill.ghost:hover{border-color:var(--brass);background:none}
.big .row{display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:820px){.hero{grid-template-columns:1fr;gap:22px;padding-top:28px}.hero h1{font-size:44px}.lede{font-size:16px}.big b{font-size:64px}}

.bar{position:sticky;top:52px;z-index:20;background:var(--paper);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:10px 0}
.bar .wrap{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;font-size:14px;color:var(--ink-2);border:1px solid var(--rule);border-radius:999px;padding:5px 12px;background:var(--raise)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip .c{font-family:var(--mono);font-size:12px;opacity:.7;margin-left:4px}
.find{flex:0 1 220px;min-width:140px;border:1px solid var(--rule);border-radius:999px;padding:6px 14px;background:var(--raise);font-size:14px}
.find:focus{outline:none;border-color:var(--brass)}
@media (max-width:640px){.find{flex:1 1 100%}}

.grp{padding-top:34px}
.grp h2{font:400 34px/1.1 var(--serif);margin:0 0 4px}
.grp .sub{margin:0 0 16px;color:var(--ink-3);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
@media (max-width:640px){.grid{grid-template-columns:1fr}}
.card{border:1px solid var(--rule);background:var(--raise);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.card:hover{border-color:var(--rule-2)}
.art{height:92px;position:relative;display:flex;align-items:flex-end;padding:12px 16px;color:#fff}
.art svg{position:absolute;inset:0;width:100%;height:100%}
.art .g{position:relative;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;background:rgba(0,0,0,.28);padding:3px 9px;border-radius:999px;backdrop-filter:blur(4px)}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.card h3{margin:0;font:400 26px/1.1 var(--serif)}
.st{flex:none;font-size:12px;color:var(--ink-3);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.st i{width:8px;height:8px;border-radius:50%;background:var(--ink-3);opacity:.5}
.st[data-s="up"] i{background:var(--ok);opacity:1;box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent)}
.st[data-s="down"] i{background:var(--signal);opacity:1}
.insp{margin:0;font-size:14px;color:var(--brass-ink);font-weight:500}
.desc{margin:0;font-size:15px;color:var(--ink-2);text-wrap:pretty}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:12px;color:var(--ink-2);background:var(--shoal);border-radius:6px;padding:2px 7px}
.acts{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:6px;flex-wrap:wrap}
.play{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:8px 16px;font-weight:600;font-size:15px;text-decoration:none;background:var(--ink);color:var(--paper)}
.play:hover{background:var(--brass-ink)}
.lnk{font-size:13px;color:var(--ink-3);text-decoration:none;border-bottom:1px solid var(--rule)}
.lnk:hover{color:var(--ink)}
.mk{margin-left:auto;font-size:13px;color:var(--ink-3);border:1px solid var(--rule);border-radius:999px;padding:4px 10px}
.mk[aria-pressed="true"]{color:var(--ok);border-color:var(--ok)}
.when{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.tag.aw{background:color-mix(in srgb,var(--brass) 18%,transparent);color:var(--brass-ink)}
.tool{font-size:12px;color:var(--sea);border:1px solid var(--sea-soft);border-radius:6px;padding:1px 7px}
.hostn{font-size:12px;color:var(--ink-3);font-family:var(--mono);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{margin:0;font-size:13px;color:var(--ink-3);font-style:italic}
.pl{margin:-8px 0 14px!important;font-size:14px!important}
.sep{width:1px;flex:none;background:var(--rule-2);margin:4px 4px}
.chip.fl[aria-pressed="true"]{background:var(--brass-ink);border-color:var(--brass-ink)}
.empty{padding:40px 0;color:var(--ink-3)}
.foot{padding:40px 20px 60px;color:var(--ink-3);font-size:14px;border-top:1px solid var(--rule);margin-top:44px}
.foot p{margin:0 0 10px;max-width:80ch}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.on{opacity:1}
</style>

const FLAGS = { touch: ['Works on touch', g => g.tags.includes('Touch')], multi: ['Multiplayer', g => g.tags.includes('Multiplayer')], award: ['Jam winners', g => !!g.award], claude: ['Built with Claude', g => /claude|opus/i.test(g.tools)], classic: ['Inspired by a classic', g => !!g.insp] };

const KEY = 'watch.arcade.v1';
const S = { genre: 'all', flag: '', q: '', played: {} };
try { const s = JSON.parse(localStorage.getItem(KEY) || '{}'); if (GENRES[s.genre]) S.genre = s.genre; if (FLAGS[s.flag]) S.flag = s.flag; S.played = s.played || {}; } catch (e) { /* storage off */ }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ genre: S.genre, flag: S.flag, played: S.played })); } catch (e) { /* storage off */ } };
const ST = {}; // live status per game: up | down
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const host = u => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return u; } };
const mon = d => new Date(d + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', year: 'numeric' });

function art(g) { // a small generated banner per game: genre colours, shapes seeded by the id
  const [, a, b] = GENRES[g.genre]; let h = 7; for (const c of g.id) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  const r = n => { h = (h * 1103515245 + 12345) >>> 0; return (h % 1000) / 1000 * n; };
  let s = '';
  if (g.genre === 'racing') for (let i = 0; i < 6; i++) { const y = 10 + r(70); s += `<path d="M${-20 + r(60)} ${y} h${80 + r(200)}" stroke="#fff" stroke-opacity="${.12 + r(.25)}" stroke-width="${2 + r(5)}" stroke-linecap="round"/>`; }
  else if (g.genre === 'action') { const x = 220 + r(80), y = 30 + r(30); s += `<circle cx="${x}" cy="${y}" r="26" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="2"/><path d="M${x - 40} ${y}h28M${x + 12} ${y}h28M${x} ${y - 40}v28M${x} ${y + 12}v28" stroke="#fff" stroke-opacity=".35" stroke-width="2"/>`; for (let i = 0; i < 4; i++) s += `<rect x="${r(180)}" y="${50 + r(30)}" width="${20 + r(40)}" height="40" fill="#000" fill-opacity=".14"/>`; }
  else if (g.genre === 'adventure') { s += `<path d="M0 ${70 + r(10)} Q 80 ${40 + r(20)} 160 ${66 + r(10)} T 360 ${55 + r(15)} V 100 H0Z" fill="#fff" fill-opacity=".14"/>`; for (let i = 0; i < 3; i++) s += `<ellipse cx="${40 + r(280)}" cy="${12 + r(28)}" rx="${18 + r(20)}" ry="6" fill="#fff" fill-opacity=".22"/>`; }
  else if (g.genre === 'strategy') { for (let x = 0; x < 360; x += 24) for (let y = 0; y < 92; y += 24) if (r(1) > .62) s += `<rect x="${x + 3}" y="${y + 3}" width="18" height="18" rx="3" fill="#fff" fill-opacity="${.08 + r(.22)}"/>`; }
  else if (g.genre === 'sports') s += `<circle cx="${200 + r(100)}" cy="46" r="${26 + r(10)}" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="2"/><path d="M${r(160)} 0v92M0 46h360" stroke="#fff" stroke-opacity=".16" stroke-width="2"/>`;
  else if (g.genre === 'rpg') for (let i = 0; i < 5; i++) { const x = r(340), y = r(80), z = 10 + r(16); s += `<path d="M${x} ${y - z}L${x + z * .6} ${y}L${x} ${y + z}L${x - z * .6} ${y}Z" fill="#fff" fill-opacity="${.12 + r(.2)}"/>`; }
  else if (g.genre === 'arcade') for (let i = 0; i < 10; i++) { const z = 6 + r(10); s += `<rect x="${Math.round(r(340) / 8) * 8}" y="${Math.round(r(80) / 8) * 8}" width="${z}" height="${z}" fill="#fff" fill-opacity="${.12 + r(.25)}"/>`; }
  else for (let i = 0; i < 7; i++) { const z = 8 + r(20); s += `<rect x="${r(330)}" y="${r(80)}" width="${z}" height="${z}" rx="${z / 4}" fill="#fff" fill-opacity="${.1 + r(.2)}"/>`; }
  return `<svg viewBox="0 0 360 92" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="gr-${g.id}" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="360" height="92" fill="url(#gr-${g.id})"/>${s}</svg>`;
}

function stat(g) {
  const s = ST[g.id];
  const t = s === 'up' ? 'Up now' : s === 'down' ? 'Not answering' : 'Checking…';
  return `<span class="st" data-st="${g.id}" data-s="${s || ''}" title="${s === 'down' ? 'The site didn’t answer from your browser just now. It may be down, or it may block the check — try Play anyway.' : 'Checked from your browser when this page opened.'}"><i></i>${t}</span>`;
}

function card(g) {
  const p = !!S.played[g.id];
  const tags = g.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('') + (g.award ? `<span class="tag aw">🏆 ${esc(g.award)}</span>` : '');
  return `<article class="card" id="g-${g.id}">
    <div class="art">${art(g)}<span class="g">${esc(GENRES[g.genre][0])}</span></div>
    <div class="body">
      <div class="top"><h3>${esc(g.name)}</h3>${stat(g)}</div>
      ${g.insp ? `<p class="insp">Inspired by ${esc(g.insp)}</p>` : ''}
      <p class="desc">${esc(g.desc)}</p>
      ${g.aiplay ? '<p class="note">AI runs the gameplay here, not the code.</p>' : ''}
      <div class="tags">${tags}${g.tools ? `<span class="tool">${esc(g.tools)}</span>` : ''}${g.at ? `<span class="when" title="Estimated from the earliest public post sharing the playable game">~${mon(g.at)}</span>` : ''}</div>
      <div class="acts">
        <a class="play" href="${esc(g.url)}" target="_blank" rel="noopener" data-go="${g.id}">Play ›</a>
        <span class="hostn">${esc(host(g.url))}</span>
        ${g.src ? `<a class="lnk" href="${esc(g.src)}" target="_blank" rel="noopener">Launch post</a>` : ''}
        ${g.code ? `<a class="lnk" href="${esc(g.code)}" target="_blank" rel="noopener">Code</a>` : ''}
        <button class="mk" type="button" data-mk="${g.id}" aria-pressed="${p}">${p ? '✓ Played' : 'Mark played'}</button>
      </div>
    </div>
  </article>`;
}

function pass(g, ignoreGenre) {
  if (!ignoreGenre && S.genre !== 'all' && g.genre !== S.genre) return false;
  if (S.flag && !FLAGS[S.flag][1](g)) return false;
  const q = S.q.trim().toLowerCase();
  return !q || [g.name, g.insp, g.desc, g.tags.join(' '), g.tools, g.award, host(g.url)].join(' ').toLowerCase().includes(q);
}

function listHTML() {
  const vis = GAMES.filter(g => pass(g));
  if (!vis.length) return `<div class="wrap empty">Nothing matches that. <button class="lnk" type="button" data-reset>Show every game</button></div>`;
  return Object.entries(GENRES).map(([k, [n]]) => {
    const set = vis.filter(g => g.genre === k); if (!set.length) return '';
    return `<section class="wrap grp" id="s-${k}"><h2>${n}</h2><p class="sub">${set.length} ${set.length === 1 ? 'game' : 'games'}</p><div class="grid">${set.map(card).join('')}</div></section>`;
  }).join('');
}

function chips() {
  const n = k => GAMES.filter(g => pass(g, true) && (k === 'all' || g.genre === k)).length;
  const g = (k, label) => `<button class="chip" type="button" data-genre="${k}" aria-pressed="${S.genre === k}">${label}<span class="c">${n(k)}</span></button>`;
  const f = Object.entries(FLAGS).map(([k, [l]]) => `<button class="chip fl" type="button" data-flag="${k}" aria-pressed="${S.flag === k}">${l}</button>`).join('');
  return g('all', 'All') + Object.entries(GENRES).map(([k, [l]]) => g(k, l.split(' &')[0])).join('') + '<span class="sep" aria-hidden="true"></span>' + f;
}

function render() {
  const played = Object.keys(S.played).filter(k => S.played[k] && GAMES.some(g => g.id === k)).length;
  $('#app').innerHTML = `
    <section class="wrap hero">
      <div><p class="kick">Tech · The Arcade</p>
        <h1>Games made with AI, <i>playable right now</i></h1>
        <p class="lede">Kart racers and Halo-style team shooters, a Quake port, a flight sim with dogfights, a sailing race around the real world, college football, a bonsai garden, chess where the pieces fight. Every one runs in a browser tab — nothing to install — and most were built in days with Claude, GPT or Codex writing much of the code.</p></div>
      <div class="big"><b class="mono" id="upN">${GAMES.length}</b><p id="upT">games, each linked live. The dot on every card shows whether the game answered from your browser just now.</p>${played ? `<p class="pl">You’ve played ${played}.</p>` : ''}
        <div class="row"><button class="pill" type="button" id="rand">Play a random one ›</button></div></div>
    </section>
    <div class="bar"><div class="wrap"><div class="chips" id="chips">${chips()}</div><input class="find" id="find" type="search" placeholder="Search games, tools, jams" aria-label="Search games" value="${esc(S.q)}"></div></div>
    <div id="list">${listHTML()}</div>
    <footer class="wrap foot">
      <p>Drawn from two community lists on GitHub, <a href="${LISTS[0][1]}" target="_blank" rel="noopener">${LISTS[0][0]}</a> and <a href="${LISTS[1][1]}" target="_blank" rel="noopener">${LISTS[1][0]}</a>, merged and written up by The Watch on ${new Date(UPDATED + 'T12:00:00').toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' })}. Launch months are estimates from the earliest public post sharing each game. AI credits come from the creators’ own notes and jam pages; “built with AI” rarely means one prompt, and not every asset is AI-made.</p>
      <p>These are other people’s games on other people’s sites; The Watch only links to them. Games marked unofficial are not from the franchise owners. Some are desktop-only, WebGPU ones need a recent browser and GPU, and multiplayer servers come and go. Left out on purpose: browser ports that serve a commercial game’s own files, and games taken down over copyright notices.</p>
      <p>The status dot is a quick request from your own browser when the page opens. A red dot can mean a site that blocks such checks rather than one that’s down — Play still works if the game is up.</p>
      <p><a href="../../#/s/tech">The Watch · Tech</a> · <a href="../scrollos/">ScrollOS</a> · <a href="../moe-box/">The 256GB Box</a> · <a href="../../#/s/hobbies">Hobbies</a></p>
    </footer>`;
  updUp();
}
function relist() { $('#list').innerHTML = listHTML(); $('#chips').innerHTML = chips(); }
function updUp() { const up = GAMES.filter(g => ST[g.id] === 'up').length, done = GAMES.filter(g => ST[g.id]).length; const t = $('#upT'); if (!t || done < GAMES.length || !up) return; $('#upN').textContent = up; t.textContent = `of ${GAMES.length} games answered from your browser just now. Each one is linked live below.`; }
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2200); }

// live check: an opaque request resolves if the server answers at all, and fails on a dead domain or a refused connection
function check(g) {
  const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 9000);
  return fetch(g.url, { mode: 'no-cors', cache: 'no-store', signal: ctl.signal, referrerPolicy: 'no-referrer' })
    .then(() => 'up', () => 'down').then(s => { clearTimeout(to); ST[g.id] = s; document.querySelectorAll(`[data-st="${g.id}"]`).forEach(e => e.outerHTML = stat(g)); updUp(); });
}
function checkAll() { let i = 0; const next = () => i < GAMES.length ? check(GAMES[i++]).then(next) : null; for (let k = 0; k < 8; k++) next(); }

document.addEventListener('click', e => {
  const t = e.target.closest('button,a'); if (!t) return;
  if (t.dataset.genre) { S.genre = t.dataset.genre; save(); relist(); return; }
  if (t.dataset.flag) { S.flag = S.flag === t.dataset.flag ? '' : t.dataset.flag; save(); relist(); return; }
  if (t.hasAttribute('data-reset')) { S.genre = 'all'; S.flag = ''; S.q = ''; $('#find').value = ''; save(); relist(); return; }
  if (t.dataset.mk) { const k = t.dataset.mk; if (S.played[k]) delete S.played[k]; else S.played[k] = true; save(); t.setAttribute('aria-pressed', !!S.played[k]); t.textContent = S.played[k] ? '✓ Played' : 'Mark played'; return; }
  if (t.dataset.go) { if (!S.played[t.dataset.go]) { S.played[t.dataset.go] = true; save(); const b = document.querySelector(`[data-mk="${t.dataset.go}"]`); if (b) { b.setAttribute('aria-pressed', 'true'); b.textContent = '✓ Played'; } } return; }
  if (t.id === 'rand') {
    const pool = GAMES.filter(g => pass(g)).filter(g => ST[g.id] !== 'down'); const fresh = pool.filter(g => !S.played[g.id]); const from = fresh.length ? fresh : pool;
    const pick = from[Math.floor(Math.random() * from.length)];
    if (!pick) { toast('No game matches the filters.'); return; }
    const el = document.getElementById('g-' + pick.id); if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); el.style.borderColor = 'var(--brass)'; setTimeout(() => el.style.borderColor = '', 2400); }
    toast(`Try ${pick.name}`); return;
  }
});
document.addEventListener('input', e => { if (e.target.id === 'find') { S.q = e.target.value; relist(); const f = $('#find'); f.focus(); } });

(function () { const b = $('#theme'); const set = () => { b.textContent = document.documentElement.dataset.theme === 'night' ? 'Day' : 'Night'; }; set();
  b.addEventListener('click', () => { const t = document.documentElement.dataset.theme === 'night' ? 'day' : 'night'; document.documentElement.dataset.theme = t;
    try { const p = JSON.parse(localStorage.getItem('watch.v1') || '{}'); p.theme = t; localStorage.setItem('watch.v1', JSON.stringify(p)); } catch (e) { /* storage off */ } set(); }); })();

render();
checkAll();
</script>
</body>
</html>
