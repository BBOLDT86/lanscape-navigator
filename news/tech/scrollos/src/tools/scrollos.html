<!-- @meta {"id":"scrollos","name":"ScrollOS Desktop","scroll":"core","tagline":"The desktop: seven Scrolls in a dock, one prompt bar on top. Type a thought and it opens the right tool with your words already in it.","description":"The ScrollOS desktop: a dock of the seven Scrolls and one prompt bar on top. Type a thought — plan a trip, make cards from this, what's for dinner, chart these numbers — and it opens the right tool with your words already in it. Everything runs in your browser against your own local model."} -->
<style>
body{overflow:hidden;height:100vh;display:flex;flex-direction:column}
.top{display:none}.foot{display:none}
.os{flex:1;display:grid;grid-template-columns:64px minmax(0,1fr);height:100vh;min-height:0;width:100%;max-width:100vw;min-width:0}
.main,.dock,.bar,.view{min-width:0}
.bar form{min-width:0}.bar input{min-width:0;width:0}
.dock{background:var(--s1);border-right:1px solid var(--rule);display:flex;flex-direction:column;align-items:center;padding:12px 0 10px;gap:8px}
.dock button{width:42px;height:42px;border-radius:13px;border:0;display:grid;place-items:center;font-size:1.05rem;color:#0a0a0e;position:relative;transition:transform .15s;background:var(--c)}
.dock button:hover{transform:scale(1.1)}
.dock button[aria-pressed="true"]::after{content:'';position:absolute;left:-11px;top:14px;width:3px;height:14px;border-radius:2px;background:var(--ink)}
.dock button.home{background:var(--s3);color:var(--ink)}
.dock button.cfg{background:var(--s3);color:var(--ink2);margin-top:auto;width:36px;height:36px;font-size:.9rem}
.dock .tip{position:absolute;left:52px;top:50%;transform:translateY(-50%);background:var(--s4);color:var(--ink);font:600 12px var(--font);padding:5px 9px;border-radius:7px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s;z-index:5}
.dock button:hover .tip{opacity:1}
.main{display:flex;flex-direction:column;min-height:0}
.bar{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--rule);background:rgba(13,13,19,.7);backdrop-filter:blur(12px)}
.bar form{flex:1;display:flex;gap:8px;align-items:center;background:var(--s2);border:1px solid var(--rule2);border-radius:12px;padding:4px 6px 4px 14px}
.bar form:focus-within{border-color:var(--core);box-shadow:0 0 0 3px rgba(200,168,255,.12)}
.bar form span.g{color:var(--core);font-weight:600}
.bar input{flex:1;background:none;border:0;outline:none;font-size:15px;padding:8px 0}
.bar .btn.sm{border-radius:9px}
.view{flex:1;min-height:0;position:relative}
.view iframe{width:100%;height:100%;border:0;background:var(--bg)}
.home{height:100%;overflow:auto;padding:28px 28px 40px}
.home h1{font:400 clamp(1.8rem,3.5vw,2.6rem)/1.1 var(--serif);letter-spacing:-.02em}
.home .sub{color:var(--ink3);font-size:14px;margin:6px 0 24px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tile{text-align:left;padding:16px;border-radius:16px;border:1px solid var(--rule);background:var(--s1);cursor:pointer;transition:transform .2s,border-color .2s;position:relative;overflow:hidden}
.tile:hover{transform:translateY(-2px);border-color:var(--c)}
.tile::before{content:'';position:absolute;inset:0;background:radial-gradient(240px 120px at 0% 0%,color-mix(in srgb,var(--c) 14%,transparent),transparent 70%)}
.tile i{width:38px;height:38px;border-radius:12px;background:var(--c);display:grid;place-items:center;color:#0a0a0e;font-style:normal;font-size:1rem;margin-bottom:10px;position:relative}
.tile b{display:block;font:600 15px var(--font);position:relative}
.tile small{display:block;font:500 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--c);margin-top:1px;position:relative}
.tile p{font-size:12.5px;color:var(--ink2);margin-top:8px;line-height:1.5;position:relative}
.tile .ex{font:500 11px var(--mono);color:var(--ink3);margin-top:8px;position:relative}
.status{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-top:26px;padding:14px 16px;border-radius:14px;border:1px solid var(--rule);background:var(--s1);font:500 12px var(--mono);color:var(--ink3)}
.status b{color:var(--ink2);font-weight:500}
.status .dot{width:8px;height:8px;border-radius:50%;background:var(--ink4);display:inline-block;margin-right:6px}
.status[data-st="ok"] .dot{background:var(--green);box-shadow:0 0 8px rgba(48,209,88,.6)}
.status[data-st="no"] .dot{background:var(--red)}
.clock{font:400 2rem/1 var(--serif);color:var(--ink);letter-spacing:-.02em}
@media (max-width:700px){.os{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) 58px}.bar #openHub{display:none}.status{gap:10px}.dock{flex-direction:row;border-right:0;border-top:1px solid var(--rule);padding:8px 10px;justify-content:space-around;order:2}.dock button{width:38px;height:38px}.dock button.cfg{margin:0}.dock .tip{display:none}.dock button[aria-pressed="true"]::after{left:50%;top:-7px;transform:translateX(-50%);width:14px;height:3px}.home{padding:18px 14px 30px}}
</style>
<div class="os">
  <nav class="dock" id="dock" aria-label="Scrolls"></nav>
  <div class="main">
    <div class="bar"><form id="f"><span class="g">⟐</span><input id="q" placeholder="Ask anything about your life, your work, your world…" autocomplete="off"><button type="submit" class="btn pri sm">Go</button></form><button type="button" class="btn ghost sm" id="openHub" title="The ScrollOS hub on The Watch">Hub ›</button></div>
    <div class="view" id="view"><div class="home" id="home"></div></div>
  </div>
</div>
<script>
const APPS = [
  { id: 'goals', scroll: 'Dream', name: 'Goals', g: '✦', c: '#f59e0b', p: 'An ambition in, a plan out: milestones, actions, habits.', ex: '"run a half marathon by May"', kw: ['goal', 'plan', 'ambition', 'habit', 'milestone', 'resolution', 'want to', 'by next', 'this year', 'dream', 'learn to', 'save for', 'train for'] },
  { id: 'flashcards', scroll: 'Discover', name: 'Flashcards', g: '◉', c: '#e05a48', p: 'Paste anything, study it as spaced-repetition cards.', ex: '"make cards from this chapter"', kw: ['card', 'flashcard', 'study', 'memor', 'quiz', 'learn this', 'revise', 'exam', 'test me', 'vocab', 'remember this', 'anki'] },
  { id: 'meals', scroll: 'Unwind', name: 'Meals', g: '♫', c: '#d8608c', p: 'Fridge in, dinner out, with a pairing.', ex: '"what can I cook with salmon in 30 minutes"', kw: ['cook', 'dinner', 'lunch', 'breakfast', 'recipe', 'meal', 'fridge', 'pantry', 'eat', 'hungry', 'ingredient', 'bake', 'what can i make'] },
  { id: 'charts', scroll: 'Create', name: 'Charts', g: '◆', c: '#9b59b6', p: 'Paste a table, get the right chart and its headline.', ex: '"chart these quarterly numbers"', kw: ['chart', 'graph', 'plot', 'csv', 'table', 'data', 'visuali', 'bar chart', 'line chart', 'numbers', 'spreadsheet', 'trend'] },
  { id: 'replies', scroll: 'Connect', name: 'Replies', g: '⬡', c: '#48c870', p: 'Three replies in your voice to whatever they sent.', ex: '"reply to this email, say yes but not until Thursday"', kw: ['reply', 'respond', 'email', 'message', 'text back', 'write back', 'answer them', 'slack', 'linkedin', 'decline', 'follow up', 'follow-up', 'thank'] },
  { id: 'docs', scroll: 'Produce', name: 'Docs', g: '▣', c: '#5898e8', p: 'A writing surface with a co-writer that read the whole thing.', ex: '"draft a one-page proposal for the barn"', kw: ['write', 'draft', 'document', 'doc', 'essay', 'report', 'memo', 'proposal', 'rewrite', 'edit', 'summar', 'article', 'blog', 'letter', 'outline', 'notes'] },
  { id: 'lab', scroll: 'Grow', name: 'AI Lab', g: '△', c: '#38c8d8', p: 'Test the machine, compare models, tune the Scrolls.', ex: '"how fast is this model"', kw: ['model', 'prompt', 'benchmark', 'speed', 'tok', 'compare', 'temperature', 'system prompt', 'ollama', 'gpu', 'lab', 'test the'] }
];
let cur = 'home';
const dock = $('#dock');
dock.innerHTML = `<button type="button" class="home" data-app="home" aria-pressed="true" title="Home">⟐<span class="tip">Home</span></button>` + APPS.map(a => `<button type="button" data-app="${a.id}" style="--c:${a.c}" title="${a.name}">${a.g}<span class="tip">${a.scroll} · ${a.name}</span></button>`).join('') + `<button type="button" class="cfg" data-app="cfg" title="Model settings">⚙<span class="tip">Model</span></button>`;
$$('#dock button').forEach(b => b.onclick = () => { if (b.dataset.app === 'cfg') { openSheet(); return; } show(b.dataset.app); });
function show(id, q, go) {
  cur = id; $$('#dock button').forEach(b => b.setAttribute('aria-pressed', b.dataset.app === id));
  const v = $('#view');
  if (id === 'home') { v.innerHTML = '<div class="home" id="home"></div>'; renderHome(); return; }
  const src = id + '.html' + (q ? '#q=' + encodeURIComponent(q) + (go ? '&go=1' : '') : '');
  v.innerHTML = `<iframe src="${src}" title="${id}" allow="clipboard-write"></iframe>`;
}
function renderHome() {
  const h = $('#home'); if (!h) return;
  const hr = new Date().getHours(), greet = hr < 5 ? 'Still up' : hr < 12 ? 'Good morning' : hr < 17 ? 'Good afternoon' : 'Good evening';
  h.innerHTML = `<div class="row" style="align-items:flex-end;gap:20px;margin-bottom:4px"><div class="clock" id="clock"></div><div style="flex:1"><h1>${greet}.</h1></div></div><p class="sub">Seven Scrolls, one model, nothing leaving this machine. Type above or pick a tool.</p>
    <div class="tiles">${APPS.map(a => `<button type="button" class="tile" style="--c:${a.c}" data-open="${a.id}"><i>${a.g}</i><b>${a.name}</b><small>${a.scroll}</small><p>${a.p}</p><div class="ex">${esc(a.ex)}</div></button>`).join('')}</div>
    <div class="status" id="st" data-st="${SOS.state}"><span><span class="dot"></span><b id="stm">${SOS.state === 'ok' ? esc(SOS.cfg.model) : SOS.state === 'no' ? 'no local model' : 'looking for a model…'}</b></span><span>${SOS.models.length} model${SOS.models.length === 1 ? '' : 's'} on this machine</span>${SOS.version ? `<span>Ollama ${esc(SOS.version)}</span>` : ''}<span class="sp"></span><button type="button" class="btn ghost sm" data-open-sheet>Settings</button><a class="btn ghost sm" href="${HUB}" target="_top">The hub ›</a></div>`;
  $$('[data-open]', h).forEach(b => b.onclick = () => show(b.dataset.open));
  tick();
}
function tick() { const c = $('#clock'); if (c) c.textContent = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }
setInterval(tick, 15000);
function routeLocal(q) { const s = q.toLowerCase(); let best = null, score = 0; for (const a of APPS) { let n = 0; for (const k of a.kw) if (s.includes(k)) n += k.length; if (n > score) { score = n; best = a; } } return best; }
async function route(q) {
  let a = routeLocal(q);
  if (!a && SOS.ready()) { try { const r = await SOS.chat({ system: 'You route requests to tools. Answer with one word.', messages: [{ role: 'user', content: `Which tool fits this request? Reply with exactly one of: goals, flashcards, meals, charts, replies, docs, lab.\n\nRequest: ${q}` }], temperature: 0, options: { num_predict: 8 } }); const w = (r.text.toLowerCase().match(/goals|flashcards|meals|charts|replies|docs|lab/) || [])[0]; a = APPS.find(x => x.id === w); } catch (e) { /* fall through */ } }
  if (!a) a = APPS.find(x => x.id === 'docs');
  toast(`${a.scroll} · ${a.name}`); show(a.id, q, true);
}
$('#f').onsubmit = e => { e.preventDefault(); const q = $('#q').value.trim(); if (!q) return; route(q); $('#q').value = ''; };
$('#openHub').onclick = () => { window.top.location.href = HUB; };
document.addEventListener('keydown', e => { if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); $('#q').focus(); } });
document.addEventListener('sos:state', () => { const st = $('#st'); if (st) { st.dataset.st = SOS.state; $('#stm').textContent = SOS.state === 'ok' ? SOS.cfg.model : SOS.state === 'no' ? 'no local model' : 'looking for a model…'; } });
mountChrome();
renderHome();
const q0 = hashParam('q'); if (q0) route(q0);
</script>
