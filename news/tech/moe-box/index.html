/* ================= ENGINE ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const usd = v => v == null ? '–' : '$' + Math.round(v).toLocaleString('en-US');
const f1 = v => v == null ? '–' : (v >= 100 ? Math.round(v).toString() : v.toFixed(1));
const pc = v => (v > 0 ? '+' : '') + Math.round(v) + '%';
const P = id => PLATS.find(p => p.id === id), G = id => GPUS.find(g => g.id === id), M = n => MODELS.find(m => m.n === n);

/* --- the formula (Method) --- */
const peakPerSocket = p => p.ch * p.mts * 8 / 1000;                        // GB/s, one socket: decode does not scale across sockets
const stream = p => p.kind === 'epyc' ? K.streamEpyc : K.streamIntel;
const effBW = p => peakPerSocket(p) * stream(p) * K.eta;                  // what decode actually sees
const retention = (p, g) => p.sockets === 2 ? (g.vram >= 24 ? K.ret2big : K.ret2small) : (g.vram >= 24 ? K.ret1big : K.ret1small);
const inVram = (m, g) => m.dense && m.gb + K.vramSpare <= g.vram;
function tps(m, p, g, ctx) {                                                // modelled decode tok/s; ctx: 0 = empty, 16 = 16k loaded
  if (m.gb > K.ceiling + K.tight) return null;                              // does not fit
  if (inVram(m, g)) return g.bw * K.gpuEff / (m.active * m.bpp) * (ctx ? K.vramRet : 1);
  const frac = m.dense ? 1 : K.fRam;                                         // a dense model reads every weight from RAM
  return effBW(p) / (m.active * m.bpp * frac) * (ctx ? retention(p, g) : 1);
}
const fits = m => m.gb <= K.ceiling ? 'fits' : m.gb <= K.ceiling + K.tight ? 'tight' : 'no';
const buildCost = b => P(b.plat).price + G(b.gpu).price;
const buildCostAug = b => b.aug;

function svgFrame(W, H, pad, xs, ys, xl, yl, body) {
  const [x0, x1] = xs, [y0, y1] = ys, X = v => pad.l + (v - x0) / (x1 - x0) * (W - pad.l - pad.r), Y = v => H - pad.b - (v - y0) / (y1 - y0) * (H - pad.t - pad.b);
  let g = '';
  for (const t of yl.ticks) g += `<line class="gl" x1="${pad.l}" x2="${W - pad.r}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${pad.l - 6}" y="${Y(t) + 4}" text-anchor="end">${t}</text>`;
  for (const t of xl.ticks) g += `<text x="${X(t)}" y="${H - pad.b + 16}" text-anchor="middle">${xl.fmt(t)}</text>`;
  g += `<text x="${(pad.l + W - pad.r) / 2}" y="${H - 4}" text-anchor="middle">${xl.label}</text><text x="12" y="${pad.t + (H - pad.t - pad.b) / 2}" transform="rotate(-90 12 ${pad.t + (H - pad.t - pad.b) / 2})" text-anchor="middle">${yl.label}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${g}${body(X, Y)}</svg>`;
}

  const xmax = Math.ceil(Math.max(...pts.map(p => p.x)) / 1000) * 1000;
  return svgFrame(520, 300, { l: 48, r: 22, t: 14, b: 44 }, [0, xmax], [30, 95], { ticks: [0, 2000, 4000, 6000, 8000, 10000, 12000].filter(t => t <= xmax), fmt: t => '$' + t / 1000 + 'k', label: 'total build cost (dashed line: the $5,000 ceiling)' }, { ticks: [30, 45, 60, 75, 90], label: 'GB/s' },
    (X, Y) => `<line x1="${X(5000)}" x2="${X(5000)}" y1="14" y2="256" stroke="var(--signal)" stroke-dasharray="4 4" stroke-opacity=".6"/>` + pts.map(p => `<circle class="pt${p.b.id === REF.id ? ' ref' : p.b.id === 'B9' ? ' bad' : ''}" cx="${X(p.x)}" cy="${Y(p.y)}" r="7"><title>${p.b.id} ${p.b.name}: ${usd(p.x)}, ${f1(p.y)} GB/s</title></circle><text x="${X(p.x) + (p.b.id === 'B9' ? -10 : 9)}" y="${Y(p.y) + ({ B3: 18, B4: -10, B5: 18, B1: 18, B9: -10 }[p.b.id] || 4)}" text-anchor="${p.b.id === 'B9' ? 'end' : 'start'}" style="font-weight:600">${p.b.id}</text>`).join(''));

const LBL = { 'MiniMax-M2': -9, 'Qwen3.5-397B-A17B': -6, 'GLM-5.3': 7, 'DeepSeek-V4-Flash': 6, 'Qwen3-235B-A22B-2507': -5, 'DeepSeek-V3.2': 6 };

/* --- method --- */
function method() {
  return `<section class="wrap sec" id="method"><p class="sl">07 · Read before trusting a number</p><h2 class="sec-h">Method, calibration and what this cannot tell you</h2>
    <p class="sub">Every tokens-per-second figure here is a calculation, not a measurement of that machine. It is the standard bandwidth-bound decode estimate, with peak bandwidth taken per socket because published scaling studies show token generation gains only 0–10% from a second socket while prompt processing gains 46–82%.</p>
    <div class="formula">tok/s = (peak_bandwidth_per_socket × stream_efficiency × η) ÷ (active_params × bytes_per_param × f_ram) × context_retention</div>
    <div class="tw" style="margin-top:14px"><table><thead><tr><th>Parameter</th><th>Value</th><th>Basis</th></tr></thead><tbody>
      <tr><td>Peak bandwidth</td><td class="mono">channels × MT/s × 8 bytes, per socket</td><td>Decode does not scale across sockets</td></tr>
      <tr><td>STREAM efficiency, Intel DDR4</td><td class="mono">${K.streamIntel}</td><td>Measured 217 GB/s on a dual 6-channel DDR4-2933 Xeon vs 281.6 theoretical</td></tr>
      <tr><td>STREAM efficiency, EPYC Rome</td><td class="mono">${K.streamEpyc}</td><td>Measured 113.7 GB/s NPS1 and ~148 NPS4 on 8-channel Rome parts</td></tr>
      <tr><td>Realisation factor η</td><td class="mono">${K.eta}</td><td>Fitted between the calibration anchors below; right for the 24–40 core parts here</td></tr>
      <tr><td>Fraction of active weight in RAM</td><td class="mono">${K.fRam}</td><td>The rest (attention, shared expert) sits on the card. Dense models in RAM use 1.0</td></tr>
      <tr><td>Bytes per parameter</td><td class="mono">Q4 ≈ 0.56 · IQ4_XS ≈ 0.53 · MXFP4 ≈ 0.55 · Q8 ≈ 1.06 · IQ2_M ≈ 0.34</td><td>Includes quant metadata overhead</td></tr>
      <tr><td>16k retention</td><td class="mono">2S: ${K.ret2small} (12–16GB card), ${K.ret2big} (24GB+) · 1S: ${K.ret1small}, ${K.ret1big}</td><td>Interpolated from the published context sweeps below</td></tr>
      <tr><td>Dense model in VRAM</td><td class="mono">card GB/s × ${K.gpuEff}, × ${K.vramRet} at 16k</td><td>Applies when weights + ${K.vramSpare}GB fit on the card</td></tr>
    </tbody></table></div>
    <div class="two" style="margin-top:14px">
      <div class="tw"><table><thead><tr><th colspan="5">Calibration anchors for η</th></tr><tr><th>Machine</th><th>Model</th><th class="n">STREAM</th><th class="n">tok/s</th><th class="n">η</th></tr></thead><tbody>
        ${[['i5-12600K, 2ch DDR5-6000, RTX 4070', 'gpt-oss-120b', 81.6, 28.0, 0.82], ['EPYC 7702 1S, 8ch DDR4-2400', 'DeepSeek-V3 Q4_K_XL', 99.8, 3.39, 0.60], ['EPYC 9654 1S, 12ch DDR5-4800', 'DeepSeek-R1 Q4_K_S', 359.9, 8.48, 0.42], ['Xeon 6980P 1S, 12ch DDR5-6400', 'DeepSeek-R1 Q2_K_XL', 479.2, 9.94, 0.20]].map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td><td class="n">${r[2]}</td><td class="n">${r[3]}</td><td class="n">${r[4]}</td></tr>`).join('')}
      </tbody></table></div>
      <div class="tw"><table><thead><tr><th colspan="3">Context retention, measured</th></tr><tr><th>Machine</th><th>Model</th><th>Kept vs empty</th></tr></thead><tbody>
        ${[['Xeon 8480 1S DDR5-4800 + RTX PRO 6000 96GB', 'DeepSeek-R1 Q4_K_XL', '8k 96% · 16k 93% · 32k 89%'], ['Xeon 8480 1S + RTX 5090', 'Qwen3-Coder-480B IQ5_K', '8k 86% · 16k 74%'], ['Dual Xeon Skylake DDR4-2666 + 4× 3090, q8_0 KV', 'GLM-4.5 Q3_K_XL', '8k 62% · 16k 45%'], ['2× Xeon 8480 + RTX 5090', 'Qwen3-Coder-480B IQ5_K', '8k 94% · 16k 90%'], ['Ryzen 9 7950X + RTX PRO 6000', 'GLM-4.5 UD-Q3_K_XL', '8k 96% · 12k 96%']].map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}
      </tbody></table></div>
    </div>
    <div class="chg" style="margin-top:14px">
      <div class="card"><h3>η is the loose number</h3><p>It spans 0.20 to 0.82 across the anchors because thread-synchronisation overhead grows once cores far outnumber memory channels. A machine at the bottom of that range would be about three times slower than the grid says. Trust the ordering between builds far more than any absolute figure.</p></div>
      <div class="card"><h3>One split for every model</h3><p>The 85% of active weight in RAM is one assumption, calibrated from one measured case. Models with a large shared expert or unusual attention will deviate; nobody publishes the split per model. It is the biggest unquantified error in the grid.</p></div>
      <div class="card"><h3>What was left out</h3><ul>${EXCLUDED.map(x => `<li><b>${esc(x[0])}</b> — ${x[1]}</li>`).join('')}</ul></div>
    </div>
  </section>`;
}
function foot() {
  return `<footer class="wrap foot">
    <p><b>Rev ${REV.no}</b>, ${esc(REV.date)}. Prices are asking prices in U.S. dollars excluding shipping. Throughput figures are modelled estimates, not measurements of these configurations. Benchmark scores are vendor self-reported. Nothing here has been validated by building one of these machines.</p>
    <p>Sources: ${SOURCES.map(s => `<a href="${esc(s[1])}" target="_blank" rel="noopener">${esc(s[0])}</a>`).join(' · ')}</p>
    <p><a href="../../#/s/tech">The Watch · Tech</a> · <a href="../scrollos/#build">ScrollOS: the smaller machines</a> · <a href="../../#/shop">Shopping</a> · <a href="../../../shop/#/s/tech">Finds · Tech</a></p>
  </footer>`;
}

/* ================= wiring ================= */
function render() {
  $('#app').innerHTML = hero() + changed() + why() + cfg() + builds() + fitTable() + prefill() + buy() + method() + foot();
  $('#out').innerHTML = outHTML();
}
function refreshCfg() { $('#out').innerHTML = outHTML(); document.querySelectorAll('#presets [data-preset]').forEach(b => { const x = BUILDS.find(y => y.id === b.dataset.preset); b.setAttribute('aria-pressed', x.plat === S.plat && x.gpu === S.gpu); }); $('#kPlat').value = S.plat; $('#kGpu').value = S.gpu; $('#kModel').value = S.model; $('#gridWrap').innerHTML = gridHTML(); save(); }
function refreshShop() { $('#shopWrap').innerHTML = shopHTML(); document.querySelectorAll('#buyPick [data-buy]').forEach(b => b.setAttribute('aria-pressed', b.dataset.buy === S.buy)); save(); }
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'kPlat') { S.plat = t.value; refreshCfg(); }
  else if (t.id === 'kGpu') { S.gpu = t.value; refreshCfg(); }
  else if (t.id === 'kModel') { S.model = t.value; refreshCfg(); }
  else if (t.dataset.got) { if (t.checked) S.got[t.dataset.got] = 1; else delete S.got[t.dataset.got]; refreshShop(); }
  else if (t.dataset.ask) { if (t.checked) S.ask[t.dataset.ask] = 1; else delete S.ask[t.dataset.ask]; save(); }
  else if (t.dataset.tgt) { const v = Math.round(+t.value); if (v > 0) S.tgt[t.dataset.tgt] = v; else delete S.tgt[t.dataset.tgt]; refreshShop(); }
});
document.addEventListener('click', e => {
  const t = e.target.closest('button,a'); if (!t) return;
  if (t.dataset.preset) { const b = BUILDS.find(x => x.id === t.dataset.preset); S.plat = b.plat; S.gpu = b.gpu; refreshCfg(); if (!t.closest('#presets')) $('#build').scrollIntoView({ behavior: 'smooth' }); return; }
  if (t.dataset.ctx != null) { S.ctx = +t.dataset.ctx; document.querySelectorAll('#kCtx button').forEach(b => b.setAttribute('aria-pressed', b === t)); refreshCfg(); return; }
  if (t.dataset.g != null) { S.grid = +t.dataset.g; $('#gridWrap').innerHTML = gridHTML(); save(); return; }
  if (t.dataset.buy) { S.buy = t.dataset.buy; refreshShop(); return; }
  if (t.id === 'share') { const url = location.href.split('#')[0] + '#b=' + [S.plat, S.gpu, S.model, S.ctx].map(encodeURIComponent).join(','); (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(() => toast('Link copied. It opens this build.'), () => prompt('Copy this link', url)); return; }
  if (t.id === 'print') { window.print(); return; }
  if (t.id === 'copyList') { const { b, p, g, parts } = buyParts(S.buy); const txt = [`${b.id === 'custom' ? '' : b.id + ' '}${b.name} — The 256GB Box, Rev ${REV.no}`, ...parts.map(x => `[${S.got[S.buy + ':' + x.k] ? 'x' : ' '}] ${x.t} — ${usd(x.px)}${x.est ? ' (est.)' : ''}${S.tgt[S.buy + ':' + x.k] ? ' · target ' + usd(S.tgt[S.buy + ':' + x.k]) : ''}\n    ${ebay(x.q)}`), '', 'Ask the seller:', ...ASK.filter(a => !a.only || a.only(p, g)).map(a => '- ' + a.t + ' ' + a.d(p, g).replace(/<[^>]+>/g, ''))].join('\n');
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast('Shopping list copied.'), () => prompt('Copy the list', txt)); return; }
});
(function () { const b = $('#theme'); const set = () => { b.textContent = document.documentElement.dataset.theme === 'night' ? 'Day' : 'Night'; }; set();
  b.addEventListener('click', () => { const t = document.documentElement.dataset.theme === 'night' ? 'day' : 'night'; document.documentElement.dataset.theme = t;
    try { const p = JSON.parse(localStorage.getItem('watch.v1') || '{}'); p.theme = t; localStorage.setItem('watch.v1', JSON.stringify(p)); } catch (e) { /* storage off */ } set(); }); })();

load();
if (location.hash.startsWith('#b=')) { const [pl, gp, md, cx] = location.hash.slice(3).split(',').map(decodeURIComponent); if (P(pl)) S.plat = pl; if (G(gp)) S.gpu = gp; if (M(md)) S.model = md; S.ctx = +cx ? 16 : 0; history.replaceState(null, '', location.pathname + '#build'); }
render();
if (location.hash === '#build') setTimeout(() => $('#build').scrollIntoView(), 0);

</script>
</body>
</html>
