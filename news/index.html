<style>
:root{
  --paper:#F5F7F6; --raise:#FFFFFF; --ink:#15243B; --ink-2:#465770; --ink-3:#8492A3; --rule:rgba(21,36,59,.12);
  --shoal:#D7E7EC; --shoal-2:#C3DAE2; --brass:#A9852F; --brass-ink:#7A5E1C; --signal:#C2412D; --scrim:rgba(14,26,43,.42);
  --serif:'Instrument Serif','Iowan Old Style',Georgia,serif;
  --sans:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="day"]){
    --paper:#0E1A2B; --raise:#142539; --ink:#E7EDF4; --ink-2:#AEBBCB; --ink-3:#7F8EA3; --rule:rgba(231,237,244,.12);
    --shoal:#12293F; --shoal-2:#1A3A55; --brass:#D6B25E; --brass-ink:#E3C47E; --signal:#E8705A; --scrim:rgba(4,9,16,.6); color-scheme:dark;
  }
}
:root[data-theme="night"]{
  --paper:#0E1A2B; --raise:#142539; --ink:#E7EDF4; --ink-2:#AEBBCB; --ink-3:#7F8EA3; --rule:rgba(231,237,244,.12);
  --shoal:#12293F; --shoal-2:#1A3A55; --brass:#D6B25E; --brass-ink:#E3C47E; --signal:#E8705A; --scrim:rgba(4,9,16,.6); color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:64px}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.5 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:3px}
img{display:block}
.wrap{max-width:1240px;margin:0 auto;padding:0 32px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- masthead: the watch dial is the one loud thing on the page */
.mast{display:flex;align-items:center;gap:26px;padding-top:22px;padding-bottom:18px}
.dial{width:164px;height:164px;flex:none;overflow:visible}
.dial .arc{fill:var(--rule);transition:fill .15s}
.dial .arc.past{fill:var(--shoal-2);cursor:pointer}
.dial .arc.past:hover,.dial .arc.past:focus-visible{fill:var(--ink-3);outline:none}
.dial .arc.yday{fill:var(--shoal);cursor:pointer}
.dial .arc.yday:hover,.dial .arc.yday:focus-visible{fill:var(--ink-3);outline:none}
.dial .arc.now{fill:var(--brass)}
.dial .arc.reading{fill:var(--ink)}
.dial .tick{stroke:var(--ink-3);stroke-width:1}
.dial .tick.major{stroke:var(--ink);stroke-width:1.6}
.dial .hr{font:600 14px var(--sans);fill:var(--ink-2)}
.dial .needle{stroke:var(--brass);stroke-width:2.4;stroke-linecap:round}
.dial .hub{fill:var(--brass)}
.dial .c1{font:400 34px var(--serif);fill:var(--ink)}
.dial .c2{font:500 13px var(--sans);fill:var(--ink-2)}
.brand{min-width:0}
.brand h1{font:400 68px/.86 var(--serif);letter-spacing:-.012em;margin:0}
.ed{margin:10px 0 0;font:500 15px/1.45 var(--sans);color:var(--ink-2)}
.ed b{color:var(--ink);font-weight:600}
.ed .nwc{color:var(--brass-ink);font-weight:600}
.tools{margin-left:auto;display:flex;gap:8px;align-items:center;align-self:flex-start;padding-top:6px}
.search{position:relative}
.search input{width:250px;font:500 15px var(--sans);color:var(--ink);background:var(--raise);border:1px solid var(--rule);border-radius:999px;padding:9px 14px 9px 36px}
.search input::placeholder{color:var(--ink-3)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--ink-3)}
.tbtn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--rule);background:var(--raise);border-radius:999px;padding:8px 13px;font:600 14px var(--sans)}
.tbtn svg{width:17px;height:17px}
.tbtn:hover{border-color:var(--ink-3)}
.tbtn .code{font:700 12.5px var(--sans);letter-spacing:.04em}
.langmenu{position:absolute;z-index:30;min-width:190px;background:var(--raise);border:1px solid var(--rule);border-radius:12px;box-shadow:0 18px 50px rgba(14,26,43,.22);padding:6px}
.langmenu button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:14px;border:0;background:none;border-radius:8px;padding:10px 12px;font:600 15px var(--sans);text-align:left}
.langmenu button:hover,.langmenu button[aria-checked="true"]{background:var(--shoal)}
.langmenu small{font:700 11.5px var(--sans);color:var(--ink-3);letter-spacing:.05em}

/* ---------- desks bar */
.bar{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
.bar .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.bar .wrap::-webkit-scrollbar{display:none}
.bar button{flex:none;border:0;background:none;padding:13px 11px 11px;font:600 15px var(--sans);color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px}
.bar button:hover{color:var(--ink)}
.bar button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--brass)}
.bar .you{color:var(--brass-ink)}

/* ---------- stories */
.st{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;padding:14px 0;align-items:start}
.st + .st{border-top:1px solid var(--rule)}
.st .th{grid-column:2;grid-row:1 / span 2;width:116px;height:78px;object-fit:cover;border-radius:4px;background:var(--shoal)}
.st h3{margin:0;font:600 17px/1.32 var(--sans);letter-spacing:-.003em}
.st h3 a{text-decoration:none}
.st h3 a:hover{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.st .sn{margin:5px 0 0;color:var(--ink-2);font-size:15px;line-height:1.48;max-width:64ch}
.mt{display:flex;flex-wrap:wrap;gap:3px 12px;margin:6px 0 0;font:500 13px/1.35 var(--sans);color:var(--ink-2)}
.mt .ou{color:var(--ink);font-weight:600}
.mt .cv{color:var(--brass-ink);font-weight:600}
.mt .nw{color:var(--brass-ink);display:inline-flex;align-items:center;gap:5px}
.mt .nw::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--brass)}
.why{margin:5px 0 0;font:italic 400 16px/1.25 var(--serif);color:var(--brass-ink)}
.st.read h3,.lead.read h2,.rise.read h3{color:var(--ink-3)}
.st.read h3{font-weight:500}
.st.top{grid-template-columns:1fr}
.st.top .th{grid-column:1;grid-row:1;width:100%;height:auto;aspect-ratio:16/9;margin-bottom:8px;border-radius:5px}

/* ---------- the front */
.front{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,4fr);gap:44px;padding-top:30px;padding-bottom:38px}
.lead .fig{display:block;border-radius:6px;overflow:hidden;background:var(--shoal);aspect-ratio:2/1;margin-top:20px}
.lead .fig img{width:100%;height:100%;object-fit:cover}
.lead h2{margin:0 0 12px;font:400 clamp(34px,4.3vw,56px)/1.03 var(--serif);letter-spacing:-.006em;max-width:22ch}
.lead h2 a{text-decoration:none}
.lead h2 a:hover{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:6px}
.lead .sn{margin:0;font-size:18px;line-height:1.5;color:var(--ink-2);max-width:62ch}
.lead .covers{margin:14px 0 0;font:500 15px/1.45 var(--sans);color:var(--ink-2)}
.lead .covers b{color:var(--brass-ink);font-weight:600}
.lead .covers button{border:0;background:none;padding:0;color:var(--ink);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.toplist h2,.sec-h{font:400 30px/1 var(--serif);margin:0 0 6px;letter-spacing:-.004em}
.toplist ol{list-style:none;margin:0;padding:0;counter-reset:rank 1}
.toplist li{counter-increment:rank;display:grid;grid-template-columns:30px minmax(0,1fr);gap:0 6px}
.toplist li::before{content:counter(rank);font:400 30px/1 var(--serif);color:var(--brass);padding-top:13px}
.toplist li .st{border:0}
.toplist li + li{border-top:1px solid var(--rule)}

.bearing{background:var(--shoal);padding:32px 0 34px}
.bearing .hd{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:6px}
.bearing h2{font:400 40px/1 var(--serif);margin:0;letter-spacing:-.006em}
.bearing .sub{margin:0;color:var(--ink-2);font-size:15px}
.bearing .more{margin-left:auto;font:600 15px var(--sans);color:var(--ink);background:var(--raise);border:1px solid var(--rule);border-radius:999px;padding:7px 14px;text-decoration:none}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 44px}
.cols .st:nth-child(2){border-top:0}
.cols .st{border-color:color-mix(in srgb,var(--ink) 12%,transparent)}
.cold{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px;align-items:center}
.cold span{font-size:15px;color:var(--ink-2);margin-right:4px;flex-basis:100%}
.chip{border:1px solid var(--rule);background:var(--raise);border-radius:999px;padding:6px 12px;font:600 14px var(--sans);color:var(--ink);display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.chip:hover{border-color:var(--ink-3)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip .x{opacity:.6;font-weight:500}

.rising{padding-top:34px;padding-bottom:6px}
.rise-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px 32px;margin-top:10px}
.rise{border-left:3px solid var(--signal);padding:2px 0 2px 14px}
.rise h3{margin:0;font:600 16px/1.32 var(--sans)}
.rise h3 a{text-decoration:none}
.rise h3 a:hover{text-decoration:underline}
.rise p{margin:6px 0 0;font:500 13px var(--sans);color:var(--ink-2)}
.rise p b{color:var(--signal);font-weight:600}

.shelves{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:44px;padding-top:38px;padding-bottom:30px}
.shelf .sh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:8px}
.shelf .sh a{font:600 14px var(--sans);color:var(--brass-ink);text-decoration:none;white-space:nowrap}
.shelf .sh a:hover{text-decoration:underline}

/* ---------- desk, topic and search pages */
.page{padding-top:28px;padding-bottom:40px;max-width:860px}
.page-h{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:10px}
.page-h h1{font:400 52px/1 var(--serif);margin:0;letter-spacing:-.008em}
.page-h p{margin:0;color:var(--ink-2)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:999px;padding:3px;background:var(--raise);margin-left:auto}
.seg button{border:0;background:none;border-radius:999px;padding:5px 12px;font:600 14px var(--sans);color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.loadmore{margin:18px 0 0;border:1px solid var(--rule);background:var(--raise);border-radius:999px;padding:9px 18px;font:600 15px var(--sans)}
.mt .lg{font:700 10.5px var(--sans);letter-spacing:.05em;border:1px solid var(--rule);border-radius:4px;padding:0 4px;color:var(--ink-2)}
.endnote{margin:26px 0 0;font:italic 400 19px/1.35 var(--serif);color:var(--ink-2)}
.archived{background:var(--ink);color:var(--paper);font:500 15px var(--sans)}
.archived .wrap{display:flex;gap:14px;align-items:center;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
.archived button{border:0;border-radius:999px;background:var(--brass);color:#15243B;font:600 14px var(--sans);padding:6px 14px}

/* ---------- drawer: one story and how everyone is covering it; also the compass */
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(580px,100%);background:var(--raise);z-index:50;transform:translateX(102%);transition:transform .26s cubic-bezier(.2,.7,.2,1);overflow-y:auto;overscroll-behavior:contain;box-shadow:-18px 0 50px rgba(14,26,43,.18)}
body.dopen .scrim{opacity:1;pointer-events:auto}
body.dopen .drawer{transform:none}
body.dopen{overflow:hidden}
.dr{padding:20px 28px 40px}
.dr .close{position:sticky;top:0;display:flex;justify-content:flex-end;padding:10px 0;background:linear-gradient(var(--raise) 70%,transparent);margin:-20px 0 0}
.dr .close button{border:1px solid var(--rule);background:var(--raise);border-radius:999px;width:36px;height:36px;display:grid;place-items:center}
.dr .hero{border-radius:6px;width:100%;aspect-ratio:2/1;object-fit:cover;background:var(--shoal);margin-bottom:16px}
.dr .src{font:600 14px var(--sans);color:var(--ink-2);display:flex;gap:12px;flex-wrap:wrap}
.dr .src b{color:var(--ink)}
.dr h2{font:400 36px/1.06 var(--serif);margin:10px 0 12px;letter-spacing:-.005em}
.dr .sn{font-size:17px;line-height:1.55;color:var(--ink-2);margin:0 0 18px}
.go{display:inline-flex;align-items:center;gap:9px;background:var(--ink);color:var(--paper);text-decoration:none;border-radius:999px;padding:11px 20px;font:600 16px var(--sans)}
.go svg{width:15px;height:15px}
.go:hover{background:color-mix(in srgb,var(--ink) 85%,var(--brass))}
.fb{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 0}
.fb button{border:1px solid var(--rule);background:var(--raise);border-radius:999px;padding:7px 13px;font:600 14px var(--sans);color:var(--ink-2)}
.fb button:hover{color:var(--ink);border-color:var(--ink-3)}
.dr h3.lbl{font:400 24px/1.1 var(--serif);margin:30px 0 4px}
.dr .tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.cov{list-style:none;margin:6px 0 0;padding:0}
.cov li{padding:11px 0;border-top:1px solid var(--rule)}
.cov li:first-child{border-top:0}
.cov a{text-decoration:none;font:600 15.5px/1.35 var(--sans)}
.cov a:hover{text-decoration:underline}
.cov .m{display:block;margin-top:3px;font:500 13px var(--sans);color:var(--ink-2)}
.cov .m b{color:var(--ink);font-weight:600}
.cov .sn2{display:block;margin-top:3px;color:var(--ink-2);font-size:14px}

.rose{display:block;margin:8px auto 2px;width:100%;max-width:330px;height:auto;overflow:visible}
.rose .ring{fill:none;stroke:var(--rule)}
.rose .spoke{stroke:var(--rule)}
.rose .area{fill:color-mix(in srgb,var(--brass) 26%,transparent);stroke:var(--brass);stroke-width:1.6;stroke-linejoin:round}
.rose .pt{fill:var(--brass)}
.rose text{font:600 10.5px var(--sans);fill:var(--ink-2)}
.rose text.on{fill:var(--ink)}
.rose .needle{stroke:var(--ink);stroke-width:2.2;stroke-linecap:round}
.wt{display:grid;grid-template-columns:minmax(0,1fr) 90px auto;gap:8px 12px;align-items:center;margin-top:8px}
.wt .nm{font:600 15px var(--sans);background:none;border:0;padding:0;text-align:left;text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:3px}
.wt .bar2{height:6px;border-radius:3px;background:var(--rule);overflow:hidden}
.wt .bar2 i{display:block;height:100%;background:var(--brass)}
.wt .acts{display:flex;gap:6px}
.wt .acts button{border:1px solid var(--rule);background:var(--raise);border-radius:999px;padding:3px 10px;font:600 12.5px var(--sans);color:var(--ink-2)}
.wt .acts button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.note{font-size:14.5px;color:var(--ink-2);line-height:1.55}
.danger{border:1px solid color-mix(in srgb,var(--signal) 45%,transparent);color:var(--signal);background:none;border-radius:999px;padding:8px 16px;font:600 14px var(--sans);margin-top:10px}

.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--paper);border-radius:999px;padding:10px 12px 10px 18px;font:600 14.5px var(--sans);display:flex;gap:12px;align-items:center;z-index:70;transition:opacity .18s,transform .18s;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{border:0;background:var(--brass);color:#15243B;border-radius:999px;padding:5px 12px;font:600 13.5px var(--sans)}
.toast.plain{padding-right:18px}

.foot{display:block;border-top:1px solid var(--rule);padding:26px 0 46px;margin-top:10px;color:var(--ink-2);font-size:14px;line-height:1.6}
.foot .wrap{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:32px}
.foot h4{font:400 22px var(--serif);color:var(--ink);margin:0 0 6px}
.foot p{margin:0 0 10px;max-width:70ch}
.foot details summary{cursor:pointer;color:var(--ink);font-weight:600}
.state{padding-top:90px;padding-bottom:90px;text-align:center}
.state h2{font:400 40px var(--serif);margin:0 0 8px}
.state p{color:var(--ink-2);margin:0 0 18px}
.state button{border:0;background:var(--ink);color:var(--paper);border-radius:999px;padding:10px 20px;font:600 15px var(--sans)}


/* ---------- markets */
:root{--up:#1C7A4C;--dn:#C2412D;--dem:#2F5FA8;--rep:#B83B36}
:root[data-theme="night"]{--up:#5BC48C;--dn:#E8705A;--dem:#7AA3E6;--rep:#E57D77}
@media (prefers-color-scheme:dark){:root:not([data-theme="day"]){--up:#5BC48C;--dn:#E8705A;--dem:#7AA3E6;--rep:#E57D77}}
.up{--d:var(--up)}.dn{--d:var(--dn)}.fl{--d:var(--ink-2)}
.tape{display:flex;gap:6px;overflow-x:auto;padding-top:14px;scrollbar-width:none}
.tape::-webkit-scrollbar{display:none}
.tk{flex:none;border:1px solid var(--rule);background:var(--raise);border-radius:999px;padding:6px 12px;font:500 13.5px var(--sans);display:inline-flex;gap:7px;align-items:baseline;font-variant-numeric:tabular-nums;color:var(--ink);text-decoration:none}
.tk b{font-weight:600}.tk i{font-style:normal;font-weight:700;color:var(--d)}

.sci img{width:100%;height:100%;object-fit:cover;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.sc:hover .sci img{transform:scale(1.045)}
.sci.mosaic{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr 1fr;gap:2px}
.sci.mosaic img:first-child{grid-row:1/4}
.sc.big .sci{aspect-ratio:300/400}
.sc::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,9,15,0) 38%,rgba(5,9,15,.86) 100%);pointer-events:none}
.scx{position:absolute;left:0;right:0;bottom:0;z-index:1;padding:12px 13px 13px;display:flex;flex-direction:column;gap:2px}
.sck{font:700 11px var(--sans);letter-spacing:.07em;text-transform:uppercase;color:#E3C47E}
.sct{font:400 21px/1.08 var(--serif);text-wrap:balance}.sc.big .sct{font-size:30px}
.scn{font:600 12.5px var(--sans);color:rgba(255,255,255,.78);margin-top:3px}
.sc.vid .sci::before{content:'▶';position:absolute;z-index:2;top:10px;right:10px;width:30px;height:30px;border-radius:50%;background:rgba(5,9,15,.6);display:grid;place-items:center;font-size:12px;color:#fff}
.scgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:14px;margin-top:12px}
.phero{margin-top:18px}.phero .sc{width:100%}.phero .sc.big .sci{aspect-ratio:16/7}.phero .sc.big .sct{font-size:44px}
.ssban{display:flex;gap:12px;flex-wrap:wrap;margin:0 0 14px}
.wkpromo{display:flex;gap:14px;align-items:center;text-decoration:none;color:inherit;border:1px solid var(--rule);background:var(--raise);border-radius:14px;padding:12px 16px;margin:0 0 16px}
.wkpromo b{display:block;font:600 16px/1.3 var(--sans)}.wkpromo span span{display:block;font-size:14px;color:var(--ink2);margin-top:2px}
.t90f{display:flex;gap:20px;align-items:center;text-decoration:none;color:inherit;border:1px solid var(--rule);background:var(--raise);border-radius:16px;padding:18px 22px;margin:0 0 18px}
.t90f:hover{border-color:var(--brass)}.t90v{flex:none;width:132px}.t90v svg{display:block;width:100%;height:auto}.t90v text{font:italic 30px var(--serif);fill:var(--ink)}
.t90t{min-width:0}.t90t .k{display:block;font:600 12px/1.3 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--brass)}
.t90t b{display:block;font:400 28px/1.15 var(--serif);margin:4px 0 6px}.t90t .d{display:block;font-size:15px;line-height:1.5;color:var(--ink2);max-width:62ch}
.t90t .go{display:inline-block;margin-top:10px;font:600 14px var(--sans);color:var(--brass)}
@media (max-width:620px){.t90f{flex-direction:column;align-items:flex-start;gap:10px}.t90v{width:96px}.t90t b{font-size:24px}}
/* ---------- plans: Weekender, Finds and Vision inside The Watch */
.pl-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:12px}
.pl-h .note{margin:3px 0 0;max-width:72ch}
.pl-more{font:600 14px var(--sans);color:var(--brass-ink);text-decoration:none;white-space:nowrap}.pl-more:hover{text-decoration:underline}
.pl-row{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 10px;scrollbar-width:thin;overscroll-behavior-x:contain}
.pl-c{flex:0 0 236px;scroll-snap-align:start;border:1px solid var(--rule);background:var(--raise);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.pl-ph{position:relative;display:block;aspect-ratio:4/3;background:var(--shoal);overflow:hidden}
.pl-ph img{width:100%;height:100%;object-fit:cover}
.pl-ph::after{content:'';position:absolute;left:0;right:0;bottom:0;height:62%;background:linear-gradient(transparent,rgba(8,14,24,.66));pointer-events:none}
.pl-cn{position:absolute;left:12px;bottom:10px;z-index:1;color:#fff;font:400 27px/1 var(--serif)}
.pl-now{position:absolute;right:9px;top:9px;z-index:1;display:inline-flex;gap:4px;align-items:center;background:rgba(255,255,255,.92);color:#15243B;border-radius:999px;padding:3px 9px 3px 6px;font:600 13px var(--sans)}
.pl-now svg{width:16px;height:16px}
.pl-b{padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px;flex:1}
.pl-t{margin:0;font:600 14.5px/1.35 var(--sans)}.pl-t a{text-decoration:none}.pl-t a:hover{text-decoration:underline}
.pl-fc{margin:0;display:flex;gap:5px;flex-wrap:wrap}
.pl-fc span{display:inline-flex;align-items:center;gap:3px;background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:2px 7px;font-size:12.5px;white-space:nowrap}
.pl-fc svg{width:14px;height:14px}.pl-fc small{color:var(--ink-3);font-size:11.5px}
.pl-m{margin:auto 0 0;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--ink-3)}
.vpin{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--rule);background:var(--raise);border-radius:999px;padding:4px 11px 4px 8px;font:600 12.5px var(--sans);color:var(--ink-2);white-space:nowrap}
.vpin svg{width:14px;height:14px;flex:none}
.vpin:hover{border-color:#C2785C;color:var(--ink)}
.vpin[aria-pressed="true"]{background:#C2785C;border-color:#C2785C;color:#fff}
.pl-fly{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;border:1px solid var(--rule);background:var(--raise);border-radius:14px;padding:14px 16px;margin:8px 0 16px}
.pl-fly label{display:flex;flex-direction:column;gap:3px;font:600 11.5px var(--sans);color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
.pl-fly input,.pl-fly select{font:500 15px var(--sans);color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:8px 10px;min-width:0;text-transform:none;letter-spacing:0}
.pl-fly input[name=from]{width:84px;text-transform:uppercase}
.pl-fh{font:400 25px/1.1 var(--serif);margin-right:8px;align-self:center}
.pl-fly .chip{padding:9px 15px}
.pl-go{background:var(--ink)!important;color:var(--paper)!important;border-color:var(--ink)!important}
.pl-pts{display:grid;grid-template-columns:minmax(190px,250px) minmax(0,1fr);gap:18px;align-items:start;border-top:1px solid var(--rule);padding-top:14px;margin-bottom:16px}
.pl-ptl{text-decoration:none}.pl-ptl b{display:block;font:400 25px/1.1 var(--serif)}.pl-ptl span{font-size:14px;color:var(--ink-2)}
.pl-pts ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.pl-pts li{font-size:14.5px;line-height:1.4}.pl-pts li a{text-decoration:none;font-weight:600}.pl-pts li a:hover{text-decoration:underline}.pl-pts small{color:var(--ink-3);margin-left:4px}
.pl-f{flex:0 0 178px;scroll-snap-align:start;border:1px solid var(--rule);background:var(--raise);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.pl-fp{position:relative;display:block;aspect-ratio:1;background:#fff;overflow:hidden}
.pl-fp img{width:100%;height:100%;object-fit:cover}
.pl-off{position:absolute;left:8px;top:8px;background:var(--signal);color:#fff;border-radius:999px;padding:2px 8px;font:700 11.5px var(--sans)}
.pl-off.u{background:#1E2329}
.pl-fb{padding:9px 10px 10px;display:flex;flex-direction:column;gap:5px;flex:1}
.pl-fn{margin:0;font:600 13.5px/1.3 var(--sans);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.pl-fn a{text-decoration:none}
.pl-fm{margin:0;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3)}
.pl-fm b{color:var(--ink);font-size:14px}.pl-fm s{color:var(--ink-3)}
.pl-why{margin:0;font-size:13px;color:var(--ink-2);line-height:1.45;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.pl-fb .vpin{margin-top:auto;align-self:flex-start}
.pl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:12px}
.pl-grid .pl-f{flex:none}
.pl-st{margin:4px 0 22px}
.pl-st .sec-h,.pl-tr .sec-h{margin:0}
.pl-tr{margin:0 0 8px}
.pl-trend{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:24px;align-items:start}
.pl-trend ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.pl-trend li a{font:600 15px/1.35 var(--sans);text-decoration:none}.pl-trend li a:hover{text-decoration:underline}.pl-trend li small{display:block;color:var(--ink-3);font-size:13px;margin-top:2px}
.pl-secs{display:flex;flex-wrap:wrap;gap:8px}
.pl-fr{margin-top:34px}.pl-lazy{min-height:330px}
.pl-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.pl-t3{display:flex;flex-direction:column;text-decoration:none;color:inherit;border:1px solid var(--rule);background:var(--raise);border-radius:16px;overflow:hidden;min-width:0}
.pl-t3:hover{border-color:var(--brass)}
.pl-t3 .im{position:relative;aspect-ratio:16/9;background:var(--shoal);overflow:hidden;display:flex;align-items:center;justify-content:center}.pl-t3 .im img{width:100%;height:100%;object-fit:cover}
.pl-t3 .im svg{width:46%;height:auto}
.pl-t3 .im text{font:italic 34px var(--serif);fill:var(--ink)}
.pl-t3 .tx{padding:12px 15px 15px;display:flex;flex-direction:column;gap:5px}
.pl-t3 .k{font:600 12px/1.3 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--brass-ink)}
.pl-t3 b{font:400 23px/1.15 var(--serif)}
.pl-t3 .d{font-size:14px;color:var(--ink-2);line-height:1.45}
.pl-nudge{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--ink-2);margin:2px 0 16px}
.pl-nudge svg{width:26px;height:17px;flex:none}
.pl-nudge a{font-weight:600;color:var(--brass-ink);text-decoration:none}
.toast a.tlink{color:var(--paper);font:600 13.5px var(--sans);margin-left:12px;text-decoration:underline;text-underline-offset:3px}
@media (max-width:820px){.pl-3{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px}.pl-t3{flex:0 0 80%;scroll-snap-align:start}.pl-pts,.pl-trend{grid-template-columns:1fr}.pl-c{flex-basis:208px}.pl-f{flex-basis:156px}.pl-fly{padding:12px}.pl-fh{width:100%}}
.wkp-b{flex:none;width:42px;height:42px;border-radius:10px;background:#1E2329;color:#F5BE41;display:grid;place-items:center;font-size:20px}.wkp-go{margin-left:auto;font-size:22px;color:var(--ink3)}
.ssban button{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--rule);background:var(--raise);border-radius:999px;padding:5px 14px 5px 5px;font:600 14px var(--sans)}
.ssban img{width:30px;height:30px;border-radius:50%;object-fit:cover;background:var(--shoal)}
.ssban button:hover{border-color:var(--ink-3)}

/* ---------- video desk */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:22px 18px;margin-top:20px}
.vgrid.shorts{grid-template-columns:repeat(auto-fill,minmax(165px,1fr))}
.vrow{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 10px;margin-top:10px;scrollbar-width:thin}
.vrow .vc{flex:0 0 150px;scroll-snap-align:start}.vrow .vc h3{font-size:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.vrow .vc .mt span:nth-child(3),.vrow .vrel{display:none}
.vc h3{margin:9px 0 2px;font:600 16.5px/1.3 var(--sans)}
.vc h3 button{border:0;background:none;padding:0;text-align:left;font:inherit;color:inherit}
.vc h3 button:hover{text-decoration:underline;text-underline-offset:3px}
.vt{display:block;position:relative;width:100%;border:0;padding:0;border-radius:10px;overflow:hidden;aspect-ratio:16/9;background:#0b1320}
.vc.short .vt{aspect-ratio:9/16}
.vt img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.vt:hover img{transform:scale(1.04)}
.pb{position:absolute;left:10px;bottom:10px;width:38px;height:38px;border-radius:50%;background:rgba(5,9,15,.72);color:#fff;display:grid;place-items:center;font-size:14px}
.vs{position:absolute;top:8px;left:8px;background:#C2412D;color:#fff;font:700 11px var(--sans);border-radius:4px;padding:2px 6px;letter-spacing:.04em;text-transform:uppercase}
.vrel{margin:4px 0 0;font-size:13.5px;color:var(--ink-2);line-height:1.4}.vrel a{color:var(--ink)}
.dvid{margin:18px 0 6px}.dvid .vframe{border-radius:10px;overflow:hidden}
.vframe{position:relative;aspect-ratio:16/9;width:100%;background:#000}
.vframe img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vframe iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vplay{position:absolute;inset:0;margin:auto;width:76px;height:76px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#0E1A2B;display:grid;place-items:center;font-size:26px;box-shadow:0 10px 40px rgba(0,0,0,.35);transition:transform .15s}
.vplay span{margin-left:5px}.vplay:hover{transform:scale(1.07)}

/* ---------- the viewer */
body.ssopen{overflow:hidden}
.ss{position:fixed;inset:0;z-index:35;background:#04070c;color:#fff;overflow:hidden;--cap:400px;-webkit-tap-highlight-color:transparent}
.ss:focus{outline:none}
.ss button{color:inherit}
.ssstage{position:absolute;inset:0;touch-action:none;user-select:none;-webkit-user-select:none}
.sl{position:absolute;inset:0;overflow:hidden}
.slbg{position:absolute;inset:-60px;width:calc(100% + 120px);height:calc(100% + 120px);object-fit:cover;filter:blur(34px) brightness(.5) saturate(1.25);transform:scale(1.05)}
.slmedia{position:absolute;display:flex;align-items:center;justify-content:center}
.slim{max-width:100%;max-height:100%;object-fit:contain;animation:kb 9s ease-out both;box-shadow:0 18px 60px rgba(0,0,0,.45)}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.06)}}
.slcap{position:absolute;z-index:2}
.slk{margin:0 0 6px;font:700 11.5px var(--sans);letter-spacing:.07em;text-transform:uppercase;color:#E3C47E}
.slcap h2{margin:0 0 8px;font:400 31px/1.06 var(--serif);letter-spacing:-.005em;text-wrap:balance}
.sld{margin:0 0 8px;font-size:15.5px;line-height:1.48;color:rgba(255,255,255,.86);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.slsrc{margin:0 0 12px;font:500 12.5px var(--sans);color:rgba(255,255,255,.62)}
.slacts{display:flex;flex-wrap:wrap;gap:8px;margin:0}
.ss .go{background:#fff;color:#0E1A2B;padding:10px 18px;font-size:15px}
.ss .go:hover{background:#E3C47E}
.ss .chip{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.35);color:#fff;backdrop-filter:blur(6px)}
.ss .chip:hover{border-color:#fff}
.sl.noimg .slmedia{display:none}
.sl.noimg{background:linear-gradient(160deg,#15243B,#0b1424 60%,#2a2414)}
.sl.end{background:linear-gradient(160deg,#15243B,#070c15)}
.sl.end .slcap{inset:auto 0 0 0;top:auto}
.ssnext{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:8px}
.ssnext .sc .sci{aspect-ratio:4/3}.ssnext .sct{font-size:18px}
.ssbars{position:absolute;z-index:5;display:flex;gap:3px;pointer-events:none}
.ssbars i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.28);overflow:hidden}
.ssbars b{display:block;height:100%;width:0;background:#fff}
.ssbars i.done b{width:100%}
.ssbars i.now b{animation:ssbar 6500ms linear forwards}
.ss.many .ssbars{display:none}
@keyframes ssbar{from{width:0}to{width:100%}}
.sstop{position:absolute;z-index:6;display:flex;align-items:center;gap:6px}
.ssh{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.ssk{font:700 10.5px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:#E3C47E}
.sst{font:600 14.5px var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ssc{font:600 12.5px var(--sans);color:rgba(255,255,255,.7);font-variant-numeric:tabular-nums;margin-right:4px;white-space:nowrap}
.ssb{width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.12);display:grid;place-items:center;font:700 17px var(--sans);backdrop-filter:blur(8px)}
.ssb:hover{background:rgba(255,255,255,.24)}
.ssnav{position:absolute;z-index:4;top:50%;width:54px;height:54px;margin-top:-27px;border-radius:50%;border:0;background:rgba(255,255,255,.12);font:300 34px/1 var(--sans);display:none;place-items:center;padding-bottom:4px;backdrop-filter:blur(8px)}
.ssnav:hover{background:rgba(255,255,255,.26)}.ssnav:disabled{opacity:0;pointer-events:none}
.ssstrip{position:absolute;z-index:4;left:0;right:0;bottom:0;display:none;gap:8px;overflow-x:auto;padding:12px 22px 16px;scrollbar-width:none}
.ssstrip::-webkit-scrollbar{display:none}
.ssstrip button{flex:0 0 96px;height:60px;border-radius:6px;overflow:hidden;border:0;padding:0;opacity:.45;position:relative;background:#1d2b3e;transition:opacity .15s}
.ssstrip button.on{opacity:1;outline:2px solid #E3C47E;outline-offset:2px}.ssstrip button:hover{opacity:.85}
.ssstrip img{width:100%;height:100%;object-fit:cover}
.ssstrip span{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;text-shadow:0 1px 4px #000}

/* the story layout: a phone's whole screen, or a phone-shaped column on a big one */
.ss.tall{--w:min(100vw,calc(100dvh * .5625))}
.ss.tall .ssstage,.ss.tall .ssbars,.ss.tall .sstop{left:calc(50% - var(--w) / 2);width:var(--w)}
.ss.tall .ssbars{top:calc(8px + env(safe-area-inset-top));padding:0 10px}
.ss.tall .sstop{top:calc(18px + env(safe-area-inset-top));padding:0 10px 0 14px}
.ss.tall .slmedia{left:0;right:0;top:calc(66px + env(safe-area-inset-top));height:52%}
.ss.tall .slcap{left:0;right:0;bottom:0;padding:70px 18px calc(22px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(4,7,12,0),rgba(4,7,12,.82) 34%,rgba(4,7,12,.94))}
.ss.tall .sl.noimg .slcap,.ss.tall .sl.end .slcap{top:0;display:flex;flex-direction:column;justify-content:center;background:none}
.ss.tall .sl.noimg h2{font-size:40px}
.ss.tall .sl.video .slmedia{top:calc(66px + env(safe-area-inset-top));height:auto;left:10px;right:10px}
.ss.tall .sl.video.short .slmedia{left:0;right:0;top:0;bottom:0;height:auto;padding:58px 0 0}
.ss.tall .sl.video.short .vframe{aspect-ratio:9/16;height:100%;width:auto;max-width:100%}
.ss.tall .sl.video.short .slcap{padding-top:40px}
.ss.tall .sl.video.short .sld{display:none}
.ss.tall .vframe{border-radius:10px;overflow:hidden}

/* the wide layout: the picture large, the words beside it, a filmstrip below */
.ss.wide .ssbars{top:62px;left:0;right:0;padding:0 22px;gap:2px}
.ss.wide .ssbars i{height:2px}
.ss.wide .sstop{top:12px;left:22px;right:16px}
.ss.wide .sst{font:400 22px var(--serif)}
.ss.wide .ssstage{top:72px;bottom:92px}
.ss.wide .slmedia{left:0;top:0;bottom:0;right:var(--cap);padding:18px 84px}
.ss.wide .slmedia img.slim{border-radius:3px}
.ss.wide .slcap{top:0;bottom:0;right:0;width:var(--cap);padding:0 44px 0 6px;display:flex;flex-direction:column;justify-content:center}
.ss.wide .slcap h2{font-size:40px}
.ss.wide .sld{-webkit-line-clamp:8;font-size:16.5px}
.ss.wide .sl.video .vframe{max-height:100%;width:100%;max-width:calc((100vh - 200px) * 16 / 9)}
.ss.wide .sl.video.short .vframe{aspect-ratio:9/16;height:100%;width:auto}
.ss.wide .sl.noimg .slcap,.ss.wide .sl.end .slcap{left:0;right:0;width:auto;max-width:760px;margin:0 auto;padding:0 32px}
.ss.wide .sl.noimg .slcap h2{font-size:56px}
.ss.wide .ssnav{display:grid}
.ss.wide .ssnav.prev{left:18px}.ss.wide .ssnav.next{right:calc(var(--cap) + 14px)}
.ss.wide .ssstrip{display:flex}
.ss.wide .ssnext{grid-template-columns:repeat(4,minmax(0,1fr))}

/* fast transitions */
.sl.in-next{animation:slInN .22s cubic-bezier(.2,.8,.2,1) both}
.sl.in-prev{animation:slInP .22s cubic-bezier(.2,.8,.2,1) both}

/* ================= markets: a snapshot at each edition (news/data/markets.json) ================= */
let MK = null;
const CENTS = new Set(['ZC=F']);
const fnum = (v, d) => v == null || isNaN(v) ? '–' : Number(v).toLocaleString(LOC(), { minimumFractionDigits: d, maximumFractionDigits: d });
const sgn = v => (v > 0 ? '+' : v < 0 ? '−' : '');
const dirc = v => v > 0 ? 'up' : v < 0 ? 'dn' : 'fl';
function mkRow(sym) {
  if (!MK) return null;
  for (const g of MK.board || []) for (const r of g.rows) if (r.s === sym) return r;
  return (MK.sectors || []).find(r => r.s === sym) || (MK.stocks || []).find(r => r.s === sym) || null;
}
function fprice(r) {
  const p = r.p, k = r.kind || 'usd';
  if (p == null) return '–';
  if (k === 'pct') return fnum(p, 2) + '%';
  if (k === 'usdper') return '$' + fnum(p, 4);
  if (k === 'per') return fnum(p, p < 20 ? 3 : 2);
  if (k === 'idx') return fnum(p, 2);
  if (CENTS.has(r.s)) return fnum(p, 2) + '¢';
  return '$' + fnum(p, p >= 10000 ? 0 : 2);
}
function fchg(r) { // a day's move: yields in points, everything else in percent
  if (r.cp == null) return '';
  if (r.kind === 'pct') return sgn(r.c) + fnum(Math.abs(r.c), 2);
  return sgn(r.cp) + fnum(Math.abs(r.cp), 2) + '%';
}
const fpct = v => v == null ? '–' : sgn(v) + fnum(Math.abs(v), 1) + '%';
function spark(arr, w, h, base, cls) {
  const xs = (arr || []).filter(v => v != null);
  if (xs.length < 2) return '';
  let lo = Math.min(...xs), hi = Math.max(...xs);
  if (base != null) { lo = Math.min(lo, base); hi = Math.max(hi, base); }
  const pad = (hi - lo) * 0.1 || Math.abs(hi) * 0.01 || 1; lo -= pad; hi += pad;
  const X = i => (i / (xs.length - 1)) * w, Y = v => h - ((v - lo) / (hi - lo)) * h;
  const d = xs.map((v, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1)).join('');
  const b = base != null ? `<line class="base" x1="0" x2="${w}" y1="${Y(base).toFixed(1)}" y2="${Y(base).toFixed(1)}"/>` : '';
  return `<svg class="spk ${cls || ''}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">${b}<path d="${d}" vector-effect="non-scaling-stroke"/></svg>`;
}
const fmtWeekday = new Intl.DateTimeFormat(LOC(), { timeZone: 'America/New_York', weekday: 'long' });

let io = null, ioTimers = new Map(), seenThisVisit = new Set();
function watchImpressions() {
  if (!('IntersectionObserver' in window)) return;
  if (io) io.disconnect();
  io = new IntersectionObserver(entries => {
    for (const e of entries) {
      const id = e.target.dataset.id;
      if (e.isIntersecting) {
        if (!ioTimers.has(id) && !seenThisVisit.has(id)) ioTimers.set(id, setTimeout(() => {
          seenThisVisit.add(id); ioTimers.delete(id);
          const s = P.seen[id] || { n: 0 }; s.n++; s.t = Date.now(); P.seen[id] = s; save();
        }, 1400));
      } else if (ioTimers.has(id)) { clearTimeout(ioTimers.get(id)); ioTimers.delete(id); }
    }
  }, { threshold: 0.6 });
  $$('#main .st[data-id], #main .lead[data-id]').forEach(el => io.observe(el));
}

/* ---------- Vision: the board two people share */
function visionState() { try { const s = JSON.parse(localStorage.getItem('vision.v1') || 'null'); return s && s.v === 1 && s.items ? s : null; } catch (e) { return null; } }
const VSN = {
  inbox() { try { const q = JSON.parse(localStorage.getItem('vision.inbox') || '[]'); return Array.isArray(q) ? q : []; } catch (e) { return []; } },
  onBoard(k) { const s = visionState(); return !!(s && Object.values(s.items).some(it => it.key === k && !it.del)); },
  keys() { const k = new Set(), s = visionState(); if (s) for (const it of Object.values(s.items)) if (it.key && !it.del) k.add(it.key); for (const p of this.inbox()) { if (p.unpin) k.delete(p.key); else k.add(p.key); } return k; },
  toggle(p) {
    const on = this.keys().has(p.key), q = this.inbox().filter(x => x.key !== p.key);
    if (!on) q.push(Object.assign({ at: Date.now() }, p)); else if (this.onBoard(p.key)) q.push({ key: p.key, unpin: true, at: Date.now() });

function fPick(list, n, rank) { // picks first, then markdowns, then the rest, shuffled by the day; no more than two in a row from one store

      ${s.rows.map((r, i) => `<tr><td>${i + 1}</td><td><input inputmode="decimal" data-dr="m" data-i="${i}" value="${esc(r.m)}" aria-label="${T('Mark for box {n}', { n: i + 1 })}"></td>
        <td><select data-dr="c" data-i="${i}" aria-label="${T('Coefficient for box {n}', { n: i + 1 })}">${[1, 2, 3, 4].map(c => `<option value="${c}"${+r.c === c ? ' selected' : ''}>×${c}</option>`).join('')}</select></td>
        <td class="r" data-drp="${i}"></td><td><button type="button" class="lnk" data-drx="${i}" aria-label="${T('Remove box {n}', { n: i + 1 })}">×</button></td></tr>`).join('')}</tbody></table>
      <div class="hobrow"><button type="button" class="chip" data-dradd="1">${T('Add a box')}</button><button type="button" class="chip" data-drclr="1">${T('Clear')}</button>
        <label>${T('Points off for errors')} <input inputmode="decimal" data-dr="ded" value="${esc(s.ded)}"></label></div>
      <div class="hobout" id="drOut" aria-live="polite"></div>`;
  }
  if (k === 'woodworking') {
    const s = HOBT.ww = HOBT.ww || { rows: [{ q: 2, t: '8/4', w: 8, l: 8 }, { q: 4, t: '4/4', w: 6, l: 6 }], price: '', waste: 20 };
    const TH = ['4/4', '5/4', '6/4', '8/4', '10/4', '12/4', '16/4'];
    return `<h2 class="sec-h">${T('Board feet')}</h2><p class="sub2">${T('Rough lumber is sold by the board foot: 1 inch thick, 12 inches wide and 12 inches long. Thickness is in quarters, so 8/4 is 2 inches.')}</p>
      <table class="hobtab"><thead><tr><th>${T('Pieces')}</th><th>${T('Thick')}</th><th>${T('Wide (in)')}</th><th>${T('Long (ft)')}</th><th class="r">${T('Board ft')}</th><th></th></tr></thead><tbody>
      ${s.rows.map((r, i) => `<tr><td><input inputmode="numeric" data-ww="q" data-i="${i}" value="${esc(r.q)}" aria-label="${T('Pieces')}"></td>
        <td><select data-ww="t" data-i="${i}" aria-label="${T('Thick')}">${TH.map(t => `<option${r.t === t ? ' selected' : ''}>${t}</option>`).join('')}</select></td>
        <td><input inputmode="decimal" data-ww="w" data-i="${i}" value="${esc(r.w)}" aria-label="${T('Wide (in)')}"></td><td><input inputmode="decimal" data-ww="l" data-i="${i}" value="${esc(r.l)}" aria-label="${T('Long (ft)')}"></td>
        <td class="r" data-wwp="${i}"></td><td><button type="button" class="lnk" data-wwx="${i}" aria-label="${T('Remove')}">×</button></td></tr>`).join('')}</tbody></table>
      <div class="hobrow"><button type="button" class="chip" data-wwadd="1">${T('Add boards')}</button>
        <label>${T('Price per board foot')} <input inputmode="decimal" data-ww="price" value="${esc(s.price)}" placeholder="$"></label>
        <label>${T('Waste')} <input inputmode="numeric" data-ww="waste" value="${esc(s.waste)}">%</label></div>
      <div class="hobout" id="wwOut" aria-live="polite"></div>`;
  }
  if (k === 'poker') {
    const s = HOBT.pk = HOBT.pk || { pot: 1000, bet: 500, st: 30000, sb: 500, bb: 1000, an: 1000, bba: true, pl: 9 };
    const f = (key, label) => `<label>${T(label)} <input inputmode="decimal" data-pk="${key}" value="${esc(s[key])}"></label>`;
    return `<h2 class="sec-h">${T('Pot odds and stacks')}</h2>
      <h3 class="glb">${T('Facing a bet')}</h3><div class="hobrow">${f('pot', 'Pot before the bet')}${f('bet', 'The bet')}</div><div class="hobout" id="pkOdds" aria-live="polite"></div>
      <h3 class="glb">${T('Your stack')}</h3><div class="hobrow">${f('st', 'Chips')}${f('sb', 'Small blind')}${f('bb', 'Big blind')}${f('an', 'Ante')}${f('pl', 'Players')}
        <label class="ck"><input type="checkbox" data-pk="bba"${s.bba ? ' checked' : ''}> ${T('Big blind ante')}</label></div>
      <div class="hobout" id="pkStack" aria-live="polite"></div>`;
  }
  return '';
}
function hobToolCalc(k) {
  if (k === 'dressage') {
    const s = HOBT.dr; let pts = 0, max = 0, n = 0;
    s.rows.forEach((r, i) => { const m = hn(r.m), c = +r.c || 1, cell = $(`[data-drp="${i}"]`);
      const ok = m != null && m >= 0 && m <= 10;
      if (ok) { pts += m * c; max += 10 * c; n++; }
      if (cell) cell.textContent = ok ? fnum(m * c, m * c % 1 ? 1 : 0) : (m != null ? T('0 to 10') : ''); });
    const ded = Math.max(0, hn(s.ded) || 0), o = $('#drOut'); if (!o) return;
    if (!n) { o.innerHTML = `<p class="note">${T('Marks run from 0 to 10, in halves.')}</p>`; return; }
    const p = (pts - ded) / max, avg = pts / max * 10; // the average mark, each box weighted by its coefficient
    o.innerHTML = `<p class="hobbig">${pct(p, 2)}</p><p>${T('{pts} of {max} points from {n} boxes', { pts: fnum(pts - ded, (pts - ded) % 1 ? 1 : 0), max: fnum(max, 0), n })}${ded ? ' ' + T('({d} off for errors)', { d: fnum(ded, ded % 1 ? 1 : 0) }) : ''}.</p>
      <p class="note">${T('An average mark of {m}: “{word}” on the judges’ scale.', { m: fnum(avg, 1), word: T(DR_SCALE[Math.max(0, Math.min(10, Math.round(avg)))]) })}</p>`;
  } else if (k === 'woodworking') {
    const s = HOBT.ww; let bf = 0;
    s.rows.forEach((r, i) => { const q = hn(r.q) || 0, t = { '4/4': 1, '5/4': 1.25, '6/4': 1.5, '8/4': 2, '10/4': 2.5, '12/4': 3, '16/4': 4 }[r.t] || 1, w = hn(r.w) || 0, l = hn(r.l) || 0;
      const b = q * t * w * l * 12 / 144; bf += b; const c = $(`[data-wwp="${i}"]`); if (c) c.textContent = b ? fnum(b, 2) : ''; });
    const waste = Math.max(0, hn(s.waste) || 0) / 100, price = hn(s.price), buy = bf * (1 + waste), o = $('#wwOut'); if (!o) return;
    o.innerHTML = `<p class="hobbig">${fnum(buy, 1)} ${T('board feet to buy')}</p><p>${T('{bf} in the cut list, plus {w}% for defects, end checks and mistakes.', { bf: fnum(bf, 2), w: fnum(waste * 100, 0) })}</p>
      ${price ? `<p class="note">${T('About {cost} at {p} a board foot.', { cost: usd(buy * price), p: '$' + fnum(price, price % 1 ? 2 : 0) })}</p>` : `<p class="note">${T('Add the yard’s price per board foot for a total.')}</p>`}`;
  } else if (k === 'poker') {
    const s = HOBT.pk, P0 = hn(s.pot), B = hn(s.bet), a = $('#pkOdds'), b = $('#pkStack');
    if (a) a.innerHTML = P0 > 0 && B > 0 ? `<p class="hobbig">${pct(B / (P0 + 2 * B), 1)}</p><p>${T('The equity a call needs: you put in {b} to win a pot of {w}. Pot odds of {r} to 1.', { b: fnum(B, 0), w: fnum(P0 + 2 * B, 0), r: fnum((P0 + B) / B, 2) })}</p>
      <p class="note">${T('Minimum defense: continue with {m} of your range so a bluff doesn’t profit automatically. The bettor’s bluff needs to work {x} of the time.', { m: pct(P0 / (P0 + B), 0), x: pct(B / (P0 + B), 0) })}</p>` : `<p class="note">${T('Type the pot and the bet.')}</p>`;
    const st = hn(s.st), sb = hn(s.sb) || 0, bb = hn(s.bb), an = hn(s.an) || 0, pl = Math.max(2, Math.round(hn(s.pl) || 9));
    const orbit = sb + (bb || 0) + (s.bba ? an : an * pl);
    if (b) b.innerHTML = st > 0 && bb > 0 ? `<p class="hobbig">${fnum(st / bb, 1)} ${T('big blinds')}</p><p>${T('M of {m}: the orbits you can sit through before the blinds and antes take your stack ({o} a round).', { m: fnum(st / orbit, 1), o: fnum(orbit, 0) })}</p>
      <p class="note">${(m => m < 1 ? T('Dead zone (M under 1): all in at the first chance; waiting only shrinks the stack.') : m < 6 ? T('Red zone (M under 6, in Dan Harrington’s system): move all in or fold.') : m < 10 ? T('Orange zone (M 6 to 10): a standard raise commits you; all in becomes the main weapon.') : m < 20 ? T('Yellow zone (M 10 to 20): speculative hands lose value; steal and re-steal.') : T('Green zone (M 20 or more): deep enough for every play.'))(st / orbit)}</p>` : `<p class="note">${T('Type your chips and the blinds.')}</p>`;
  }
}
function bindHobTool(k) {
  const box = $('#hobTool'); if (!box) return;
  hobToolCalc(k);
  const onIn = e => {
    const t = e.target, ds = t.dataset, v = t.type === 'checkbox' ? t.checked : t.value;
    if (ds.dr) { if (ds.dr === 'ded') HOBT.dr.ded = v; else HOBT.dr.rows[+ds.i][ds.dr] = v; }
    else if (ds.ww) { if (ds.ww === 'price' || ds.ww === 'waste') HOBT.ww[ds.ww] = v; else HOBT.ww.rows[+ds.i][ds.ww] = v; }
    else if (ds.pk) HOBT.pk[ds.pk] = v;
    else return;
    hobtSave(); hobToolCalc(k);
  };
  box.addEventListener('input', onIn); box.addEventListener('change', onIn); // a select or a checkbox may only say change
  box.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return; const ds = b.dataset;
    if (ds.dradd) HOBT.dr.rows.push({ m: '', c: 1 });
    else if (ds.drclr) HOBT.dr = { rows: Array.from({ length: 10 }, () => ({ m: '', c: 1 })), ded: '' };
    else if (ds.drx != null) { HOBT.dr.rows.splice(+ds.drx, 1); if (!HOBT.dr.rows.length) HOBT.dr.rows.push({ m: '', c: 1 }); }
    else if (ds.wwadd) HOBT.ww.rows.push({ q: 1, t: '4/4', w: 6, l: 8 });
    else if (ds.wwx != null) { HOBT.ww.rows.splice(+ds.wwx, 1); if (!HOBT.ww.rows.length) HOBT.ww.rows.push({ q: 1, t: '4/4', w: 6, l: 8 }); }
    else return;
    hobtSave(); box.innerHTML = hobToolHTML(k); hobToolCalc(k);
  });
}
document.addEventListener('input', e => {
  if (!e.target || e.target.id !== 'hobQ') return;
  const q = e.target.value.trim().toLowerCase();
  $$('#hobGl > div').forEach(d => { d.hidden = !!q && !d.dataset.q.includes(q); });
});

async function renderHobbyFeature(id) {
  $('#main').innerHTML = `<div class="wrap state"><h2>${T('Opening the feature…')}</h2></div>`;
  ensureHob();
  let a = HFC[id];
  if (!a) { try { a = HFC[id] = await getJSON('hobbies/features/' + encodeURIComponent(id) + '.json'); } catch (e) { a = null; } }
  if (view.t !== 'hf' || view.id !== id) return;
  if (!a || !a.body) { $('#main').innerHTML = `<div class="wrap state"><h2>${T('That feature isn’t here')}</h2><p><a href="#/s/hobbies">${T('All hobbies')}</a></p></div>`; return; }
  await ensureHob(); if (view.t !== 'hf' || view.id !== id) return;
  const n = (a.sources || []).length, L0 = artL(a), L = artOrig ? {} : L0, body = L.body || a.body, words = (body.match(/\S+/g) || []).length;
  bump(P.sec, 'hobbies', 0.6); if (a.hobby) bump(P.kw, '#' + a.hobby, 0.8);
  $('#main').innerHTML = `<article class="wrap art"${L.body ? ` lang="${LOC()}"` : LANG !== 'en' ? ' lang="en"' : ''}>
    <p class="ak"><a href="#/s/hobbies">${T('Hobbies')}</a> · <a href="#/hobby/${esc(a.hobby)}">${esc(hobName(a.hobby))}</a> · ${T('The Watch feature')}</p>
    <h1 id="artTitle">${esc(L.title || a.title)}</h1>
    <p class="adek">${esc(L.dek || a.dek)}</p>
    <p class="aby">${byline(a)}. ${T('{n} min read.', { n: Math.max(1, Math.round(words / 230)) })} <button type="button" class="chip ashare" data-share="hf" data-sid="${esc(a.id)}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7.5 7.5L12 3l4.5 4.5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>${T('Share')}</button></p>
    <p class="adis">${T('This feature was written by an AI model, Claude, from the published reporting and records listed at the end. Read the originals for anything you rely on.')}${L0.body ? ` ${T(artOrig ? 'You are reading the English original.' : 'Translated from English by Claude ({model}).', { model: esc(L0.model || a.model) })} <button type="button" class="lnk" data-artorig="1">${T(artOrig ? 'Read it in your language' : 'Read the English original')}</button>` : ''}</p>
    <div class="abody">${md(body, n)}</div>
    <section class="asrc"><h2>${T('Sources')}</h2><ol>${(a.sources || []).map((s, i) => `<li id="src-${i + 1}"><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a> <span>${esc(s.outlet)}${s.date ? ', ' + esc(s.date) : ''}</span></li>`).join('')}</ol></section>
    <p class="aby" style="margin-top:28px"><a href="#/hobby/${esc(a.hobby)}">${T('More on {hobby}', { hobby: hobName(a.hobby) })} →</a></p>
  </article>`;
  document.title = (L.title || a.title) + ' · The Watch';
  $$('.art .adis [data-artorig]').forEach(b => b.addEventListener('click', () => { artOrig = !artOrig; renderHobbyFeature(id); }));
}

/* ================= loading ================= */
async function loadLatest(scrollTop) {
  try {
    const [ed, mk, art, md] = await Promise.all([getJSON('data/edition.json'), getJSON('data/markets.json').catch(() => null), getJSON('articles/index.json').catch(() => null), getJSON('data/media.json').catch(() => null)]);
    if (md && md.v) MEDIA = md;
    MK = mk && mk.board ? mk : null;
    if (art && art.articles) ART = art;
    LATEST = { id: ed.id, at: ed.at, archive: ed.archive };
    useEdition(ed, false);
    render(!scrollTop);
  } catch (err) {
    $('#main').innerHTML = `<div class="wrap state"><h2>The paper didn’t arrive</h2><p>The edition couldn’t be loaded (${esc(err.message || err)}). Check your connection and try again.</p><button type="button" onclick="location.reload()">Try again</button></div>`;
    $('#edline').textContent = 'No edition loaded.';
  }
}
async function loadArchive(id) {
  if (LATEST && id === LATEST.id) { if (viewingArchive) loadLatest(true); return; }
  try {
    const ed = await getJSON('data/editions/' + id + '.json');
    useEdition(ed, true);
    go('#/'); render();
  } catch (e) { toast('That edition is no longer kept.'); }
}
async function poll() { // a new watch while the page is open
  if (!LATEST) return;
  try {
    const l = await getJSON('data/latest.json');
    if (l && l.id && l.id !== LATEST.id) {
      const t = $('#toast');
      t.className = 'toast on';
      t.innerHTML = `<span>The ${esc(l.label)} is out.</span><button type="button" id="loadNew">Read it</button>`;
      $('#loadNew').onclick = () => { t.className = 'toast'; loadLatest(true); };
      clearTimeout(toastT);
    }
  } catch (e) { /* try again next time */ }
}
setInterval(poll, 10 * 60000);
setInterval(() => { if (E) drawDial(); }, 60000);
applyTheme();
loadLang().then(() => { applyTheme(); L10N.watch(); langButton(); loadLatest(true); });
})();
</script>
