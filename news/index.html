<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Watch</title>
<meta name="description" content="The Watch: the news six times a day, one edition per ship's watch, from about 120 live sources. It learns what you read and brings you more of it, privately, in your browser.">
<meta name="theme-color" content="#F5F7F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1A2B" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="The Watch">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%2315243B'/%3E%3Ccircle cx='32' cy='32' r='21' fill='none' stroke='%23D6B25E' stroke-width='6' stroke-dasharray='19 3'/%3E%3Cpath d='M32 32 L46 14' stroke='%23F5F7F6' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5F7F6; --raise:#FFFFFF; --ink:#15243B; --ink-2:#465770; --ink-3:#8492A3; --rule:rgba(21,36,59,.12);
  --shoal:#D7E7EC; --shoal-2:#C3DAE2; --brass:#A9852F; --brass-ink:#7A5E1C; --signal:#C2412D; --scrim:rgba(14,26,43,.42);
  --serif:'Instrument Serif','Iowan Old Style',Georgia,serif;
  --sans:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="day"]){
    --paper:#0E1A2B; --raise:#142539; --ink:#E7EDF4; --ink-2:#AEBBCB; --ink-3:#7F8EA3; --rule:rgba(231,237,244,.12);
    --shoal:#12293F; --shoal-2:#1A3A55; --brass:#D6B25E; --brass-ink:#E3C47E; --signal:#E8705A; --scrim:rgba(4,9,16,.6); color-scheme:dark;
  }
}
:root[data-theme="night"]{
  --paper:#0E1A2B; --raise:#142539; --ink:#E7EDF4; --ink-2:#AEBBCB; --ink-3:#7F8EA3; --rule:rgba(231,237,244,.12);
  --shoal:#12293F; --shoal-2:#1A3A55; --brass:#D6B25E; --brass-ink:#E3C47E; --signal:#E8705A; --scrim:rgba(4,9,16,.6); color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:64px}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.5 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:3px}
img{display:block}
.wrap{max-width:1240px;margin:0 auto;padding:0 32px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- masthead: the watch dial is the one loud thing on the page */
.mast{display:flex;align-items:center;gap:26px;padding-top:22px;padding-bottom:18px}
.dial{width:164px;height:164px;flex:none;overflow:visible}
.dial .arc{fill:var(--rule);transition:fill .15s}
.dial .arc.past{fill:var(--shoal-2);cursor:pointer}
.dial .arc.past:hover,.dial .arc.past:focus-visible{fill:var(--ink-3);outline:none}
.dial .arc.yday{fill:var(--shoal);cursor:pointer}
.dial .arc.yday:hover,.dial .arc.yday:focus-visible{fill:var(--ink-3);outline:none}
.dial .arc.now{fill:var(--brass)}
.dial .arc.reading{fill:var(--ink)}
.dial .tick{stroke:var(--ink-3);stroke-width:1}
.dial .tick.major{stroke:var(--ink);stroke-width:1.6}
.dial .hr{font:600 14px var(--sans);fill:var(--ink-2)}
.dial .needle{stroke:var(--brass);stroke-width:2.4;stroke-linecap:round}
.dial .hub{fill:var(--brass)}
.dial .c1{font:400 34px var(--serif);fill:var(--ink)}
.dial .c2{font:500 13px var(--sans);fill:var(--ink-2)}
.brand{min-width:0}
.brand h1{font:400 68px/.86 var(--serif);letter-spacing:-.012em;margin:0}
.ed{margin:10px 0 0;font:500 15px/1.45 var(--sans);color:var(--ink-2)}
.ed b{color:var(--ink);font-weight:600}
.ed .nwc{color:var(--brass-ink);font-weight:600}
.tools{margin-left:auto;display:flex;gap:8px;align-items:center;align-self:flex-start;padding-top:6px}
.search{position:relative}
.search input{width:250px;font:500 15px var(--sans);color:var(--ink);background:var(--raise);border:1px solid var(--rule);border-radius:999px;padding:9px 14px 9px 36px}
.search input::placeholder{color:var(--ink-3)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--ink-3)}
.tbtn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--rule);background:var(--raise);border-radius:999px;padding:8px 13px;font:600 14px var(--sans)}
.tbtn svg{width:17px;height:17px}
.tbtn:hover{border-color:var(--ink-3)}

/* ---------- desks bar */
.bar{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
.bar .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.bar .wrap::-webkit-scrollbar{display:none}
.bar button{flex:none;border:0;background:none;padding:13px 11px 11px;font:600 15px var(--sans);color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px}
.bar button:hover{color:var(--ink)}
.bar button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--brass)}
.bar .you{color:var(--brass-ink)}

/* ---------- stories */
.st{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;padding:14px 0;align-items:start}
.st + .st{border-top:1px solid var(--rule)}
.st .th{grid-column:2;grid-row:1 / span 2;width:116px;height:78px;object-fit:cover;border-radius:4px;background:var(--shoal)}
.st h3{margin:0;font:600 17px/1.32 var(--sans);letter-spacing:-.003em}
.st h3 a{text-decoration:none}
.st h3 a:hover{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.st .sn{margin:5px 0 0;color:var(--ink-2);font-size:15px;line-height:1.48;max-width:64ch}
.mt{display:flex;flex-wrap:wrap;gap:3px 12px;margin:6px 0 0;font:500 13px/1.35 var(--sans);color:var(--ink-2)}
.mt .ou{color:var(--ink);font-weight:600}
.mt .cv{color:var(--brass-ink);font-weight:600}
.mt .nw{color:var(--brass-ink);display:inline-flex;align-items:center;gap:5px}
.mt .nw::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--brass)}
.why{margin:5px 0 0;font:italic 400 16px/1.25 var(--serif);color:var(--brass-ink)}
.st.read h3,.lead.read h2,.rise.read h3{color:var(--ink-3)}
.st.read h3{font-weight:500}
.st.top{grid-template-columns:1fr}
.st.top .th{grid-column:1;grid-row:1;width:100%;height:auto;aspect-ratio:16/9;margin-bottom:8px;border-radius:5px}

/* ---------- the front */
.front{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,4fr);gap:44px;padding-top:30px;padding-bottom:38px}
.lead .fig{display:block;border-radius:6px;overflow:hidden;background:var(--shoal);aspect-ratio:2/1;margin-top:20px}
.lead .fig img{width:100%;height:100%;object-fit:cover}
.lead h2{margin:0 0 12px;font:400 clamp(34px,4.3vw,56px)/1.03 var(--serif);letter-spacing:-.006em;max-width:22ch}
.lead h2 a{text-decoration:none}
.lead h2 a:hover{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:6px}
.lead .sn{margin:0;font-size:18px;line-height:1.5;color:var(--ink-2);max-width:62ch}
.lead .covers{margin:14px 0 0;font:500 15px/1.45 var(--sans);color:var(--ink-2)}
.lead .covers b{color:var(--brass-ink);font-weight:600}
.lead .covers button{border:0;background:none;padding:0;color:var(--ink);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.toplist h2,.sec-h{font:400 30px/1 var(--serif);margin:0 0 6px;letter-spacing:-.004em}
.toplist ol{list-style:none;margin:0;padding:0;counter-reset:rank 1}
.toplist li{counter-increment:rank;display:grid;grid-template-columns:30px minmax(0,1fr);gap:0 6px}
.toplist li::before{content:counter(rank);font:400 30px/1 var(--serif);color:var(--brass);padding-top:13px}
.toplist li .st{border:0}
.toplist li + li{border-top:1px solid var(--rule)}

.bearing{background:var(--shoal);padding:32px 0 34px}
.bearing .hd{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:6px}
.bearing h2{font:400 40px/1 var(--serif);margin:0;letter-spacing:-.006em}
.bearing .sub{margin:0;color:var(--ink-2);font-size:15px}
.bearing .more{margin-left:auto;font:600 15px var(--sans);color:var(--ink);background:var(--raise);border:1px solid var(--rule);border-radius:999px;padding:7px 14px;text-decoration:none}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 44px}
.cols .st:nth-child(2){border-top:0}
.cols .st{border-color:color-mix(in srgb,var(--ink) 12%,transparent)}
.cold{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px;align-items:center}
.cold span{font-size:15px;color:var(--ink-2);margin-right:4px;flex-basis:100%}
.chip{border:1px solid var(--rule);background:var(--raise);border-radius:999px;padding:6px 12px;font:600 14px var(--sans);color:var(--ink);display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.chip:hover{border-color:var(--ink-3)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip .x{opacity:.6;font-weight:500}

.rising{padding-top:34px;padding-bottom:6px}
.rise-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px 32px;margin-top:10px}
.rise{border-left:3px solid var(--signal);padding:2px 0 2px 14px}
.rise h3{margin:0;font:600 16px/1.32 var(--sans)}
.rise h3 a{text-decoration:none}
.rise h3 a:hover{text-decoration:underline}
.rise p{margin:6px 0 0;font:500 13px var(--sans);color:var(--ink-2)}
.rise p b{color:var(--signal);font-weight:600}

.shelves{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:44px;padding-top:38px;padding-bottom:30px}
.shelf .sh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:8px}
.shelf .sh a{font:600 14px var(--sans);color:var(--brass-ink);text-decoration:none;white-space:nowrap}
.shelf .sh a:hover{text-decoration:underline}

/* ---------- desk, topic and search pages */
.page{padding-top:28px;padding-bottom:40px;max-width:860px}
.page-h{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:10px}
.page-h h1{font:400 52px/1 var(--serif);margin:0;letter-spacing:-.008em}
.page-h p{margin:0;color:var(--ink-2)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:999px;padding:3px;background:var(--raise);margin-left:auto}
.seg button{border:0;background:none;border-radius:999px;padding:5px 12px;font:600 14px var(--sans);color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.loadmore{margin:18px 0 0;border:1px solid var(--rule);background:var(--raise);border-radius:999px;padding:9px 18px;font:600 15px var(--sans)}
.endnote{margin:26px 0 0;font:italic 400 19px/1.35 var(--serif);color:var(--ink-2)}
.archived{background:var(--ink);color:var(--paper);font:500 15px var(--sans)}
.archived .wrap{display:flex;gap:14px;align-items:center;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
.archived button{border:0;border-radius:999px;background:var(--brass);color:#15243B;font:600 14px var(--sans);padding:6px 14px}

/* ---------- drawer: one story and how everyone is covering it; also the compass */
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(580px,100%);background:var(--raise);z-index:50;transform:translateX(102%);transition:transform .26s cubic-bezier(.2,.7,.2,1);overflow-y:auto;overscroll-behavior:contain;box-shadow:-18px 0 50px rgba(14,26,43,.18)}
body.dopen .scrim{opacity:1;pointer-events:auto}
body.dopen .drawer{transform:none}
body.dopen{overflow:hidden}
.dr{padding:20px 28px 40px}
.dr .close{position:sticky;top:0;display:flex;justify-content:flex-end;padding:10px 0;background:linear-gradient(var(--raise) 70%,transparent);margin:-20px 0 0}
.dr .close button{border:1px solid var(--rule);background:var(--raise);border-radius:999px;width:36px;height:36px;display:grid;place-items:center}
.dr .hero{border-radius:6px;width:100%;aspect-ratio:2/1;object-fit:cover;background:var(--shoal);margin-bottom:16px}
.dr .src{font:600 14px var(--sans);color:var(--ink-2);display:flex;gap:12px;flex-wrap:wrap}
.dr .src b{color:var(--ink)}
.dr h2{font:400 36px/1.06 var(--serif);margin:10px 0 12px;letter-spacing:-.005em}
.dr .sn{font-size:17px;line-height:1.55;color:var(--ink-2);margin:0 0 18px}
.go{display:inline-flex;align-items:center;gap:9px;background:var(--ink);color:var(--paper);text-decoration:none;border-radius:999px;padding:11px 20px;font:600 16px var(--sans)}
.go svg{width:15px;height:15px}
.go:hover{background:color-mix(in srgb,var(--ink) 85%,var(--brass))}
.fb{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 0}
.fb button{border:1px solid var(--rule);background:var(--raise);border-radius:999px;padding:7px 13px;font:600 14px var(--sans);color:var(--ink-2)}
.fb button:hover{color:var(--ink);border-color:var(--ink-3)}
.dr h3.lbl{font:400 24px/1.1 var(--serif);margin:30px 0 4px}
.dr .tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.cov{list-style:none;margin:6px 0 0;padding:0}
.cov li{padding:11px 0;border-top:1px solid var(--rule)}
.cov li:first-child{border-top:0}
.cov a{text-decoration:none;font:600 15.5px/1.35 var(--sans)}
.cov a:hover{text-decoration:underline}
.cov .m{display:block;margin-top:3px;font:500 13px var(--sans);color:var(--ink-2)}
.cov .m b{color:var(--ink);font-weight:600}
.cov .sn2{display:block;margin-top:3px;color:var(--ink-2);font-size:14px}

.rose{display:block;margin:8px auto 2px;width:100%;max-width:330px;height:auto;overflow:visible}
.rose .ring{fill:none;stroke:var(--rule)}
.rose .spoke{stroke:var(--rule)}
.rose .area{fill:color-mix(in srgb,var(--brass) 26%,transparent);stroke:var(--brass);stroke-width:1.6;stroke-linejoin:round}
.rose .pt{fill:var(--brass)}
.rose text{font:600 10.5px var(--sans);fill:var(--ink-2)}
.rose text.on{fill:var(--ink)}
.rose .needle{stroke:var(--ink);stroke-width:2.2;stroke-linecap:round}
.wt{display:grid;grid-template-columns:minmax(0,1fr) 90px auto;gap:8px 12px;align-items:center;margin-top:8px}
.wt .nm{font:600 15px var(--sans);background:none;border:0;padding:0;text-align:left;text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:3px}
.wt .bar2{height:6px;border-radius:3px;background:var(--rule);overflow:hidden}
.wt .bar2 i{display:block;height:100%;background:var(--brass)}
.wt .acts{display:flex;gap:6px}
.wt .acts button{border:1px solid var(--rule);background:var(--raise);border-radius:999px;padding:3px 10px;font:600 12.5px var(--sans);color:var(--ink-2)}
.wt .acts button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.note{font-size:14.5px;color:var(--ink-2);line-height:1.55}
.danger{border:1px solid color-mix(in srgb,var(--signal) 45%,transparent);color:var(--signal);background:none;border-radius:999px;padding:8px 16px;font:600 14px var(--sans);margin-top:10px}

.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--paper);border-radius:999px;padding:10px 12px 10px 18px;font:600 14.5px var(--sans);display:flex;gap:12px;align-items:center;z-index:70;transition:opacity .18s,transform .18s;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{border:0;background:var(--brass);color:#15243B;border-radius:999px;padding:5px 12px;font:600 13.5px var(--sans)}
.toast.plain{padding-right:18px}

.foot{display:block;border-top:1px solid var(--rule);padding:26px 0 46px;margin-top:10px;color:var(--ink-2);font-size:14px;line-height:1.6}
.foot .wrap{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:32px}
.foot h4{font:400 22px var(--serif);color:var(--ink);margin:0 0 6px}
.foot p{margin:0 0 10px;max-width:70ch}
.foot details summary{cursor:pointer;color:var(--ink);font-weight:600}
.state{padding-top:90px;padding-bottom:90px;text-align:center}
.state h2{font:400 40px var(--serif);margin:0 0 8px}
.state p{color:var(--ink-2);margin:0 0 18px}
.state button{border:0;background:var(--ink);color:var(--paper);border-radius:999px;padding:10px 20px;font:600 15px var(--sans)}


/* ---------- markets */
:root{--up:#1C7A4C;--dn:#C2412D;--dem:#2F5FA8;--rep:#B83B36}
:root[data-theme="night"]{--up:#5BC48C;--dn:#E8705A;--dem:#7AA3E6;--rep:#E57D77}
@media (prefers-color-scheme:dark){:root:not([data-theme="day"]){--up:#5BC48C;--dn:#E8705A;--dem:#7AA3E6;--rep:#E57D77}}
.up{--d:var(--up)}.dn{--d:var(--dn)}.fl{--d:var(--ink-2)}
.tape{display:flex;gap:6px;overflow-x:auto;padding-top:14px;scrollbar-width:none}
.tape::-webkit-scrollbar{display:none}
.tk{flex:none;border:1px solid var(--rule);background:var(--raise);border-radius:999px;padding:6px 12px;font:500 13.5px var(--sans);display:inline-flex;gap:7px;align-items:baseline;font-variant-numeric:tabular-nums;color:var(--ink);text-decoration:none}
.tk b{font-weight:600}.tk i{font-style:normal;font-weight:700;color:var(--d)}
.tk:hover{border-color:var(--ink-3)}.tk.more{color:var(--brass-ink);font-weight:600}
.mk{padding-top:28px;padding-bottom:40px}
.mk .lede{font:400 27px/1.3 var(--serif);max-width:60ch;margin:6px 0 26px;letter-spacing:-.003em}
.bigs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:26px}
.big{display:grid;grid-template-columns:1fr auto;grid-template-areas:"n c" "p c" "s s";text-align:left;border:1px solid var(--rule);background:var(--raise);border-radius:8px;padding:14px 16px 10px;gap:2px 10px;font-variant-numeric:tabular-nums}
.big:hover{border-color:var(--ink-3)}
.big .bn{grid-area:n;font:600 15px var(--sans);color:var(--ink-2)}
.big .bp{grid-area:p;font:600 29px/1.1 var(--sans);letter-spacing:-.01em}
.big .bc{grid-area:c;align-self:center;text-align:right;font:600 15px/1.3 var(--sans);color:var(--d)}
.big .bc i{display:block;font-style:normal;font-size:18px}
.big .spk{grid-area:s;width:100%;height:64px;margin-top:8px}
.spk{display:block;overflow:visible}.spk path{fill:none;stroke:var(--d,var(--ink-2));stroke-width:1.6;stroke-linejoin:round}
.spk .base{stroke:var(--ink-3);stroke-dasharray:3 3;stroke-width:1;vector-effect:non-scaling-stroke;opacity:.6}
.spk.ink path{stroke:var(--brass)}
.boards{columns:3 285px;column-gap:32px}
.bd{break-inside:avoid;margin-bottom:24px}
.bd h3{font:600 13.5px var(--sans);color:var(--ink-2);margin:0;padding-bottom:6px;border-bottom:1px solid var(--rule)}
.br{display:grid;grid-template-columns:minmax(0,1fr) auto 66px 64px;gap:10px;align-items:center;width:100%;border:0;border-bottom:1px solid var(--rule);background:none;padding:8px 2px;text-align:left;font:500 14.5px var(--sans);font-variant-numeric:tabular-nums}
.br:hover{background:color-mix(in srgb,var(--shoal) 55%,transparent)}
.br .bn{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.br .bp{text-align:right}.br .bc{text-align:right;color:var(--d);font-weight:700}
.br .spk{width:64px;height:22px}
.blk{margin-top:40px}
.blk .sub2{margin:2px 0 14px;color:var(--ink-2);font-size:14.5px;max-width:72ch}
.blk.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:34px}

<script>
(() => {
'use strict';
const PUBLIC = 'https://bboldt86.github.io/lanscape-navigator/news/';
const SLOW = new Set(['cars', 'travel', 'food', 'longreads']);
const WATCHES = [['middle', 'Middle Watch', 0], ['morning', 'Morning Watch', 4], ['forenoon', 'Forenoon Watch', 8], ['afternoon', 'Afternoon Watch', 12], ['dog', 'Dog Watch', 16], ['first', 'First Watch', 20]];
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ICON_OUT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5h11v11"/><path d="M19 5L6 18"/></svg>';

/* ================= what The Watch has learned (this browser only) ================= */
const KEY = 'watch.v1', OLD_KEY = 'sextant.v1'; // the site was called Sextant on its first day
function blank() { return { v: 1, sec: {}, src: {}, kw: {}, follow: {}, mute: { kw: {}, src: {} }, read: {}, seen: {}, last: 0, t: Date.now(), n: 0, theme: 'auto', pending: null }; }
let P;
try { P = JSON.parse(localStorage.getItem(KEY) || localStorage.getItem(OLD_KEY) || 'null'); } catch (e) { P = null; }
if (!P || P.v !== 1) P = blank();
for (const k of Object.keys(blank())) if (P[k] === undefined) P[k] = blank()[k];
let saveT = 0;
function save() { clearTimeout(saveT); saveT = setTimeout(() => { try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (e) { /* private window: learn for this visit only */ } }, 300); }
(function decay() { // interests fade by half every two weeks unless you keep reading about them
  const days = (Date.now() - (P.t || Date.now())) / 864e5;
  if (days > 0.02) {
    const f = Math.pow(0.5, days / 14);
    for (const m of [P.sec, P.src, P.kw]) for (const k in m) { m[k] *= f; if (Math.abs(m[k]) < 0.04) delete m[k]; }
  }
  P.t = Date.now();
  const wk = Date.now() - 7 * 864e5;
  for (const id in P.read) if (P.read[id] < wk) delete P.read[id];
  for (const id in P.seen) if ((P.seen[id].t || 0) < wk) delete P.seen[id];
})();
let prevLast = 0;
try { const s = sessionStorage.getItem('watch.prev'); prevLast = s != null ? +s : (P.last || 0); sessionStorage.setItem('watch.prev', String(prevLast)); } catch (e) { prevLast = P.last || 0; }
P.last = Math.floor(Date.now() / 60000); save();

const W = { // how much each thing you do counts, by section, outlet and topic
  peek: [0.6, 0.35, 0.8], open: [1.5, 1.2, 1.6], dwell: [1.0, 0.8, 1.3], more: [1.6, 0.4, 3.2], less: [-1.2, -0.3, -3.2] };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function learn(it, kind) {
  if (!it) return;
  const w = W[kind]; if (!w) return;
  P.sec[it.c] = clamp((P.sec[it.c] || 0) + w[0], -12, 30);
  P.src[it.o] = clamp((P.src[it.o] || 0) + w[1], -12, 30);
  for (const k of (it.k || []).slice(0, 5)) P.kw[k] = clamp((P.kw[k] || 0) + w[2], -14, 30);
  if (kind === 'peek' || kind === 'open') P.read[it.i] = Date.now();
  P.n++; save();
}
function bump(map, k, v) { map[k] = clamp((map[k] || 0) + v, -14, 30); P.n++; save(); }

/* ================= the edition ================= */
let E = null, LATEST = null, byId = new Map(), DF = {}, viewingArchive = false;
const outlet = o => (E && E.outlets[o]) || o;
const secName = k => ((E && E.sections.find(s => s.k === k)) || { name: k }).name;
const kwLabel = k => k.startsWith('#') ? ((E && E.topics[k.slice(1)]) || k.slice(1)) : ((E && E.kw[k]) || k);
const clusterOf = it => (it && it.g != null && E) ? E.clusters[it.g] : null;
const refMin = () => viewingArchive ? E.atMin : Math.floor(Date.now() / 60000);

async function getJSON(path) {
  const tries = /^https?:$/.test(location.protocol) ? [path, PUBLIC + path] : [PUBLIC + path];
  let last;
  for (const u of tries) {
    try {
      const r = await fetch(u + (u.includes('?') ? '&' : '?') + 'v=' + Math.floor(Date.now() / 120000), { cache: 'no-cache' });
      if (r.ok) return await r.json();
      last = new Error(r.status + ' at ' + u);
    } catch (e) { last = e; }
  }
  throw last || new Error('unreachable');
}
function useEdition(ed, archived) {
  E = ed; viewingArchive = !!archived;
  byId = new Map(E.items.map(it => [it.i, it]));
  DF = {};
  for (const it of E.items) for (const k of it.k || []) DF[k] = (DF[k] || 0) + 1;
}

/* ================= time ================= */
const fmtTime = new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', hour: 'numeric', minute: '2-digit' });
const fmtDay = new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', weekday: 'long', month: 'long', day: 'numeric' });
const fmtShort = new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', month: 'short', day: 'numeric' });
const fmtParts = new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', year: 'numeric', month: '2-digit', day: '2-digit', hour: 'numeric', minute: 'numeric', hourCycle: 'h23' });
function et(d) { const p = {}; for (const x of fmtParts.formatToParts(d)) p[x.type] = x.value; return { h: +p.hour % 24, m: +p.minute, date: `${p.year}-${p.month}-${p.day}` }; }
function ago(pm) {
  const m = refMin() - pm;
  if (m < 2) return 'Just now';
  if (m < 60) return m + 'm ago';
  if (m < 60 * 24) return Math.round(m / 60) + 'h ago';
  return fmtShort.format(new Date(pm * 60000));
}
const clock = iso => fmtTime.format(new Date(iso)).replace(':00 ', ' ');

/* ================= ranking: what's big, what's yours ================= */
const kwWeight = k => 1 / (1 + Math.log(1 + (DF[k] || 1) / 12)); // a word in every story says little about you
function affinity(it) {
  let a = 0, best = 0, why = '';
  const s = (P.sec[it.c] || 0) * 0.5; a += s; if (s > best) { best = s; why = `You read a lot of ${secName(it.c)}`; }
  const o = (P.src[it.o] || 0) * 0.45; a += o; if (o > best) { best = o; why = `You often open ${outlet(it.o)}`; }
  for (const k of it.k || []) {
    let v = (P.kw[k] || 0) * kwWeight(k);
    if (P.follow[k]) v += 4;
    a += v;
    if (v > best) { best = v; why = P.follow[k] ? `You follow ${kwLabel(k)}` : `Because you read about ${kwLabel(k)}`; }
  }
  return { a, why: best >= 0.8 ? why : '' };
}
function base(it) {
  const age = Math.max(0, (refMin() - it.p) / 60);
  const c = clusterOf(it);
  return Math.exp(-age / (SLOW.has(it.c) ? 60 : 16)) * (1 + 0.45 * Math.log2(c ? c.n : 1)) * (SERVICE.test(it.t) ? 0.35 : 1);
}
const SERVICE = /\b(where to watch|how to watch|live ?stream|start time|tv channel|odds,? (picks|predictions)|predictions?,? odds|live (results|updates|blog|scores?)|play-by-play)\b/i;
const muted = it => !!(P.mute.src[it.o] || (it.k || []).some(k => P.mute.kw[k]));
function score(it, warm = warmProfile()) {
  if (muted(it)) return -1;
  let s = base(it);
  if (warm) s *= Math.max(0.12, 1 + 1.6 * Math.tanh(affinity(it).a / 5));
  const seen = (P.seen[it.i] && P.seen[it.i].n) || 0;
  if (!P.read[it.i] && seen > 1) s *= Math.pow(0.86, seen - 1); // scrolled past it a few times: let it sink
  if (P.read[it.i]) s *= 0.08;
  return s;
}
const warmProfile = () => P.n >= 3;
function rep(c) { // for a shared story, show the version from the outlet you open most
  let best = byId.get(c.lead);
  if (!best) best = byId.get(c.ids[0]);
  let bv = (P.src[best.o] || 0) + 1;
  for (const id of c.ids) {
    const it = byId.get(id);
    if (!it || P.mute.src[it.o]) continue;
    const v = P.src[it.o] || 0;
    if (v > bv) { best = it; bv = v; }
  }
  return best;
}
function units(filter) { // one entry per story: a shared story counts once
  const out = [], done = new Set();
  for (const it of E.items) {
    if (filter && !filter(it)) continue;
    const c = clusterOf(it);
    if (c) { if (done.has(c.id)) continue; done.add(c.id); const r = rep(c); out.push(filter && !filter(r) ? it : r); }
    else out.push(it);
  }
  return out;
}
function deskUnits(k) {
  const out = [], done = new Set();
  for (const it of E.items) {
    const c = clusterOf(it);
    if (c) {
      if (done.has(c.id) || c.sec !== k) continue;
      done.add(c.id); out.push(rep(c));
    } else if (it.c === k) out.push(it);
  }

  const vals = secs.map(s => Math.max(0, P.sec[s.k] || 0));
  const mx = Math.max(1, ...vals);
  const N = secs.length, R = 108, cx = 160, cy = 150;
  const pt = (i, r) => { const a = (i / N) * Math.PI * 2 - Math.PI / 2; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; };
  let rose = `<svg class="rose" viewBox="0 0 320 300" role="img" aria-label="Sections you read, by how much">`;
  for (const f of [0.33, 0.66, 1]) rose += `<circle class="ring" cx="${cx}" cy="${cy}" r="${R * f}"/>`;
  secs.forEach((s, i) => { const [x, y] = pt(i, R); rose += `<line class="spoke" x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>`; });
  const any = vals.some(v => v > 0);
  if (any) {
    const poly = vals.map((v, i) => pt(i, 8 + (R - 8) * (v / mx)).map(n => n.toFixed(1)).join(',')).join(' ');
    rose += `<polygon class="area" points="${poly}"/>`;
    const top = vals.indexOf(Math.max(...vals));
    const [nx, ny] = pt(top, R * 0.9);
    rose += `<line class="needle" x1="${cx}" y1="${cy}" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}"/><circle class="pt" cx="${cx}" cy="${cy}" r="4"/>`;
  }
  secs.forEach((s, i) => { const [x, y] = pt(i, R + 18); rose += `<text class="${vals[i] > 0 ? 'on' : ''}" x="${x.toFixed(1)}" y="${(y + 3.5).toFixed(1)}" text-anchor="${x < cx - 8 ? 'end' : x > cx + 8 ? 'start' : 'middle'}">${esc(s.name)}</text>`; });
  rose += '</svg>';
  const kws = Object.entries(P.kw).filter(([k, v]) => v > 0.3 && !P.mute.kw[k]).sort((a, b) => b[1] - a[1]).slice(0, 14);
  for (const k of Object.keys(P.follow)) if (!kws.find(x => x[0] === k)) kws.unshift([k, P.kw[k] || 4]);
  const kmax = Math.max(1, ...kws.map(x => x[1]));
  const srcs = Object.entries(P.src).filter(([o, v]) => v > 0.3 && !P.mute.src[o]).sort((a, b) => b[1] - a[1]).slice(0, 6);
  const smax = Math.max(1, ...srcs.map(x => x[1]));
  const hiddenK = Object.keys(P.mute.kw), hiddenS = Object.keys(P.mute.src);
  const readN = Object.keys(P.read).length;
  openDrawer(`
    <h2 id="drTitle">Your compass</h2>
    <p class="note">What The Watch has picked up from your reading${readN ? `, ${readN} ${readN === 1 ? 'story' : 'stories'} this week` : ''}. It points “For you” and the order of the sections on the front.</p>
    ${rose}
    ${any ? '' : '<p class="note" style="text-align:center">This fills in as you read.</p>'}
    <h3 class="lbl">Topics you read about</h3>
    ${kws.length ? `<div class="wt">${kws.map(([k, v]) => `<button type="button" class="nm" data-topic="${esc(k)}">${esc(kwLabel(k))}</button><span class="bar2"><i style="width:${Math.round(100 * Math.max(0.06, v / kmax))}%"></i></span>
      <span class="acts"><button type="button" data-follow="${esc(k)}" aria-pressed="${!!P.follow[k]}">${P.follow[k] ? 'Following' : 'Follow'}</button><button type="button" data-mute="${esc(k)}" aria-pressed="false">Hide</button></span>`).join('')}</div>` : '<p class="note">None yet. Open stories you care about, or use More like this.</p>'}
    <h3 class="lbl">Outlets you open most</h3>
    ${srcs.length ? `<div class="wt">${srcs.map(([o, v]) => `<span class="nm" style="text-decoration:none">${esc(outlet(o))}</span><span class="bar2"><i style="width:${Math.round(100 * Math.max(0.06, v / smax))}%"></i></span><span class="acts"><button type="button" data-hide="${esc(o)}">Hide</button></span>`).join('')}</div>` : '<p class="note">None yet.</p>'}
    ${hiddenK.length || hiddenS.length ? `<h3 class="lbl">Hidden</h3><div class="tags">${hiddenK.map(k => `<button type="button" class="chip" data-unmute="${esc(k)}">${esc(kwLabel(k))} <span class="x">Show again</span></button>`).join('')}${hiddenS.map(o => `<button type="button" class="chip" data-unhide="${esc(o)}">${esc(outlet(o))} <span class="x">Show again</span></button>`).join('')}</div>` : ''}
    <h3 class="lbl">Privacy</h3>
    <p class="note">This lives only in this browser’s storage. It isn’t sent anywhere, and another device starts fresh. Interests fade by half every two weeks unless you keep reading about them.</p>
    <button type="button" class="danger" id="resetAll">Start over</button>
  `, 'Your compass');
}

/* ================= reading signals ================= */
let io = null, ioTimers = new Map(), seenThisVisit = new Set();
function watchImpressions() {
  if (!('IntersectionObserver' in window)) return;
  if (io) io.disconnect();
  io = new IntersectionObserver(entries => {
    for (const e of entries) {
      const id = e.target.dataset.id;
      if (e.isIntersecting) {
        if (!ioTimers.has(id) && !seenThisVisit.has(id)) ioTimers.set(id, setTimeout(() => {
          seenThisVisit.add(id); ioTimers.delete(id);
          const s = P.seen[id] || { n: 0 }; s.n++; s.t = Date.now(); P.seen[id] = s; save();
        }, 1400));
      } else if (ioTimers.has(id)) { clearTimeout(ioTimers.get(id)); ioTimers.delete(id); }
    }
  }, { threshold: 0.6 });
  $$('#main .st[data-id], #main .lead[data-id]').forEach(el => io.observe(el));
}
function wentOut(it) { // you opened the outlet's page; if you stay a while, it counts as a real read
  if (!counted.has('open' + it.i)) { counted.add('open' + it.i); learn(it, 'open'); }
  P.pending = { id: it.i, t: Date.now() }; save();
}
function cameBack() {
  const p = P.pending;
  if (!p || document.visibilityState !== 'visible') return;
  const away = Date.now() - p.t;
  if (away > 1500) { P.pending = null; save(); }
  if (away > 35000 && away < 45 * 60000) { const it = byId.get(p.id); if (it) learn(it, 'dwell'); }
}
document.addEventListener('visibilitychange', cameBack);
window.addEventListener('focus', cameBack);
setInterval(() => { // time spent on a section's page counts toward it
  if (document.visibilityState === 'visible' && view.t === 'desk' && !document.body.classList.contains('dopen')) { P.sec[view.k] = clamp((P.sec[view.k] || 0) + 0.15, -12, 30); save(); }
}, 20000);

/* ================= toasts ================= */
let toastT = 0;
function toast(msg, undo) {
  const t = $('#toast');
  t.className = 'toast on' + (undo ? '' : ' plain');
  t.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button type="button" id="undo">Undo</button>' : ''}`;
  if (undo) $('#undo').onclick = () => { undo(); t.className = 'toast'; };
  clearTimeout(toastT); toastT = setTimeout(() => { t.className = 'toast'; }, undo ? 6000 : 2600);
}

/* ================= events ================= */
document.addEventListener('click', e => {
  const a = e.target.closest('a,button,[data-ed],tr[data-tick]');
  if (!a) return;
  const ds = a.dataset;
  if (ds.ed) { loadArchive(ds.ed); return; }
  if (ds.tick) { e.preventDefault(); tickerDrawer(ds.tick); return; }
  if (ds.range) { chartRange = ds.range; const r = mkRow((drawerFor || '').replace('tick:', '')); if (r) { $('#bigChart').innerHTML = bigChart(r, chartRange); $$('[data-range]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.range === chartRange))); } return; }
  if (ds.ssort) { const k = ds.ssort; stockSort = stockSort.k === k ? (stockSort.dir < 0 ? { k, dir: 1 } : { k: null, dir: -1 }) : { k, dir: -1 }; $('#stkWrap').innerHTML = stockTable(); return; }
  if (ds.go) { e.preventDefault(); go(ds.go); return; }
  if (ds.open) {
    const it = byId.get(ds.open);
    if (!it) return;
    if (a.tagName === 'A' && (e.metaKey || e.ctrlKey || e.shiftKey || e.button === 1)) { wentOut(it); return; } // straight to the outlet
    e.preventDefault(); storyDrawer(it); return;
  }
  if (ds.out) { const it = byId.get(ds.out); if (it) wentOut(it); return; }
  if (ds.close != null) { closeDrawer(); return; }
  if (ds.more) { const it = byId.get(ds.more); learn(it, 'more'); toast('Got it. More stories like this.'); return; }
  if (ds.less) {
    const it = byId.get(ds.less); const before = JSON.stringify([P.sec, P.src, P.kw]);
    learn(it, 'less');
    toast('Got it. Fewer stories like this.', () => { const b = JSON.parse(before); P.sec = b[0]; P.src = b[1]; P.kw = b[2]; save(); });
    return;
  }
  if (ds.hide) {
    const o = ds.hide; P.mute.src[o] = 1; save();
    toast(`${outlet(o)} hidden.`, () => { delete P.mute.src[o]; save(); refreshDrawer(); render(true); });
    refreshDrawer(); render(true); return;
  }
  if (ds.unhide) { delete P.mute.src[ds.unhide]; save(); refreshDrawer(); return; }
  if (ds.follow) {
    const k = ds.follow;
    if (P.follow[k]) { delete P.follow[k]; toast(`Stopped following ${kwLabel(k)}.`); }
    else { P.follow[k] = 1; delete P.mute.kw[k]; bump(P.kw, k, 2); toast(`Following ${kwLabel(k)}.`); }
    save(); refreshDrawer(); if (view.t === 'topic') render(true); return;
  }
  if (ds.mute) {
    const k = ds.mute;
    if (P.mute.kw[k]) delete P.mute.kw[k];
    else { P.mute.kw[k] = 1; delete P.follow[k]; toast(`${kwLabel(k)} hidden.`, () => { delete P.mute.kw[k]; save(); refreshDrawer(); render(true); }); }
    save(); refreshDrawer(); render(true); return;
  }
  if (ds.unmute) { delete P.mute.kw[ds.unmute]; save(); refreshDrawer(); render(true); return; }
  if (ds.topic) { e.preventDefault(); bump(P.kw, ds.topic, 0.5); if (document.body.classList.contains('dopen')) { document.body.classList.remove('dopen'); drawerFor = null; history.replaceState(null, ''); } go('#/t/' + encodeURIComponent(ds.topic)); return; }
  if (ds.seed) { const k = ds.seed; const on = (P.sec[k] || 0) > 0; P.sec[k] = on ? 0 : 3; P.n += on ? -1 : 1; save(); render(true); return; }
  if (ds.sort) { deskSort = ds.sort; render(true); return; }
  if (a.id === 'more') { pageLimit += 40; render(true); return; }
  if (a.id === 'stkAll') { stockAll = true; $('#stkWrap').innerHTML = stockTable(); return; }
  if (a.id === 'resetAll') {
    if (confirm('Forget everything The Watch has learned about your reading in this browser?')) { const t = P.theme; P = blank(); P.theme = t; save(); closeDrawer(); toast('Starting fresh.'); }
    return;
  }
  if (a.id === 'backLatest') { loadLatest(true); return; }
  if (a.id === 'compassBtn') { compassDrawer(); return; }
  if (a.id === 'themeBtn') { P.theme = { auto: 'day', day: 'night', night: 'auto' }[P.theme] || 'auto'; save(); applyTheme(); return; }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.body.classList.contains('dopen')) { closeDrawer(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.dataset && e.target.dataset.ed) { e.preventDefault(); loadArchive(e.target.dataset.ed); return; }
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.tick && e.target.tagName === 'TR') { tickerDrawer(e.target.dataset.tick); return; }
  if (e.key === '/' && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); $('#q').focus(); }
});
$('#scrim').addEventListener('click', () => closeDrawer());
window.addEventListener('popstate', () => { if (document.body.classList.contains('dopen')) closeDrawer(true); });
window.addEventListener('hashchange', () => { pageLimit = 40; render(); });
function refreshDrawer() {
  if (!document.body.classList.contains('dopen')) return;
  if ($('#drTitle') && $('#drTitle').textContent === 'Your compass') { const st = $('#drawer').scrollTop; compassDrawer(); $('#drawer').scrollTop = st; }
}
let qT = 0;
$('#q').addEventListener('input', e => {
  clearTimeout(qT);
  const v = e.target.value.trim();
  qT = setTimeout(() => { const h = v ? '#/q/' + encodeURIComponent(v) : '#/'; if (location.hash !== h) history.replaceState(null, '', h); render(true); }, 180);
});
$('#q').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const v = e.target.value.trim().toLowerCase();
  if (!v || !E) return;
  for (const k of Object.keys(DF)) if (kwLabel(k).toLowerCase() === v || k === v) bump(P.kw, k, 1.2); // searching for it is a strong hint
  e.target.blur();
});
function applyTheme() {
  let t = P.theme || 'auto';
  $('#themeLbl').textContent = { auto: 'Auto', day: 'Day', night: 'Night' }[t];
  $('#themeBtn').setAttribute('aria-label', `Paper: ${$('#themeLbl').textContent}. Change it.`);
  if (t === 'auto') { const h = et(new Date()).h; t = (h >= 20 || h < 4) ? 'night' : (matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'day'); }
  document.documentElement.dataset.theme = t;
}

/* ================= loading ================= */
async function loadLatest(scrollTop) {
  try {
    const [ed, mk] = await Promise.all([getJSON('data/edition.json'), getJSON('data/markets.json').catch(() => null)]);
    MK = mk && mk.board ? mk : null;
    LATEST = { id: ed.id, at: ed.at, archive: ed.archive };
    useEdition(ed, false);
    render(!scrollTop);
  } catch (err) {
    $('#main').innerHTML = `<div class="wrap state"><h2>The paper didn’t arrive</h2><p>The edition couldn’t be loaded (${esc(err.message || err)}). Check your connection and try again.</p><button type="button" onclick="location.reload()">Try again</button></div>`;
    $('#edline').textContent = 'No edition loaded.';
  }
}
async function loadArchive(id) {
  if (LATEST && id === LATEST.id) { if (viewingArchive) loadLatest(true); return; }
  try {
    const ed = await getJSON('data/editions/' + id + '.json');
    useEdition(ed, true);
    go('#/'); render();
  } catch (e) { toast('That edition is no longer kept.'); }
}
async function poll() { // a new watch while the page is open
  if (!LATEST) return;
  try {
    const l = await getJSON('data/latest.json');
    if (l && l.id && l.id !== LATEST.id) {
      const t = $('#toast');
      t.className = 'toast on';
      t.innerHTML = `<span>The ${esc(l.label)} is out.</span><button type="button" id="loadNew">Read it</button>`;
      $('#loadNew').onclick = () => { t.className = 'toast'; loadLatest(true); };
      clearTimeout(toastT);
    }
  } catch (e) { /* try again next time */ }
}
setInterval(poll, 10 * 60000);
setInterval(() => { if (E) drawDial(); }, 60000);
applyTheme();
loadLatest(true);
})();
</script>
