<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Watch</title>
<meta name="description" content="The Watch: the news six times a day, one edition per ship's watch, from about 120 live sources. It learns what you read and brings you more of it, privately, in your browser.">
<meta name="theme-color" content="#F5F7F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1A2B" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="The Watch">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%2315243B'/%3E%3Ccircle cx='32' cy='32' r='21' fill='none' stroke='%23D6B25E' stroke-width='6' stroke-dasharray='19 3'/%3E%3Cpath d='M32 32 L46 14' stroke='%23F5F7F6' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5F7F6; --raise:#FFFFFF; --ink:#15243B; --ink-2:#465770; --ink-3:#8492A3; --rule:rgba(21,36,59,.12);
  --shoal:#D7E7EC; --shoal-2:#C3DAE2; --brass:#A9852F; --brass-ink:#7A5E1C; --signal:#C2412D; --scrim:rgba(14,26,43,.42);
  --serif:'Instrument Serif','Iowan Old Style',Georgia,serif;
  --sans:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="day"]){
    --paper:#0E1A2B; --raise:#142539; --ink:#E7EDF4; --ink-2:#AEBBCB; --ink-3:#7F8EA3; --rule:rgba(231,237,244,.12);
    --shoal:#12293F; --shoal-2:#1A3A55; --brass:#D6B25E; --brass-ink:#E3C47E; --signal:#E8705A; --scrim:rgba(4,9,16,.6); color-scheme:dark;
  }
}
:root[data-theme="night"]{
  --paper:#0E1A2B; --raise:#142539; --ink:#E7EDF4; --ink-2:#AEBBCB; --ink-3:#7F8EA3; --rule:rgba(231,237,244,.12);
  --shoal:#12293F; --shoal-2:#1A3A55; --brass:#D6B25E; --brass-ink:#E3C47E; --signal:#E8705A; --scrim:rgba(4,9,16,.6); color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:64px}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.5 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:3px}
img{display:block}
.wrap{max-width:1240px;margin:0 auto;padding:0 32px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- masthead: the watch dial is the one loud thing on the page */
.mast{display:flex;align-items:center;gap:26px;padding-top:22px;padding-bottom:18px}
.dial{width:164px;height:164px;flex:none;overflow:visible}
.dial .arc{fill:var(--rule);transition:fill .15s}
.dial .arc.past{fill:var(--shoal-2);cursor:pointer}
.dial .arc.past:hover,.dial .arc.past:focus-visible{fill:var(--ink-3);outline:none}
.dial .arc.yday{fill:var(--shoal);cursor:pointer}
.dial .arc.yday:hover,.dial .arc.yday:focus-visible{fill:var(--ink-3);outline:none}
.dial .arc.now{fill:var(--brass)}
.dial .arc.reading{fill:var(--ink)}
.dial .tick{stroke:var(--ink-3);stroke-width:1}
.dial .tick.major{stroke:var(--ink);stroke-width:1.6}
.dial .hr{font:600 14px var(--sans);fill:var(--ink-2)}
.dial .needle{stroke:var(--brass);stroke-width:2.4;stroke-linecap:round}
.dial .hub{fill:var(--brass)}
.dial .c1{font:400 34px var(--serif);fill:var(--ink)}
.dial .c2{font:500 13px var(--sans);fill:var(--ink-2)}
.brand{min-width:0}
.brand h1{font:400 68px/.86 var(--serif);letter-spacing:-.012em;margin:0}
.ed{margin:10px 0 0;font:500 15px/1.45 var(--sans);color:var(--ink-2)}
.ed b{color:var(--ink);font-weight:600}
.ed .nwc{color:var(--brass-ink);font-weight:600}
.tools{margin-left:auto;display:flex;gap:8px;align-items:center;align-self:flex-start;padding-top:6px}
.search{position:relative}
.search input{width:250px;font:500 15px var(--sans);color:var(--ink);background:var(--raise);border:1px solid var(--rule);border-radius:999px;padding:9px 14px 9px 36px}
.search input::placeholder{color:var(--ink-3)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--ink-3)}
.tbtn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--rule);background:var(--raise);border-radius:999px;padding:8px 13px;font:600 14px var(--sans)}
.tbtn svg{width:17px;height:17px}
.tbtn:hover{border-color:var(--ink-3)}

/* ---------- desks bar */
.bar{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
.bar .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.bar .wrap::-webkit-scrollbar{display:none}
.bar button{flex:none;border:0;background:none;padding:13px 11px 11px;font:600 15px var(--sans);color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px}
.bar button:hover{color:var(--ink)}
.bar button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--brass)}
.bar .you{color:var(--brass-ink)}

/* ---------- stories */
.st{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;padding:14px 0;align-items:start}
.st + .st{border-top:1px solid var(--rule)}
.st .th{grid-column:2;grid-row:1 / span 2;width:116px;height:78px;object-fit:cover;border-radius:4px;background:var(--shoal)}
.st h3{margin:0;font:600 17px/1.32 var(--sans);letter-spacing:-.003em}
.st h3 a{text-decoration:none}
.st h3 a:hover{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.st .sn{margin:5px 0 0;color:var(--ink-2);font-size:15px;line-height:1.48;max-width:64ch}
.mt{display:flex;flex-wrap:wrap;gap:3px 12px;margin:6px 0 0;font:500 13px/1.35 var(--sans);color:var(--ink-2)}
.mt .ou{color:var(--ink);font-weight:600}
.mt .cv{color:var(--brass-ink);font-weight:600}
.mt .nw{color:var(--brass-ink);display:inline-flex;align-items:center;gap:5px}
.mt .nw::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--brass)}
.why{margin:5px 0 0;font:italic 400 16px/1.25 var(--serif);color:var(--brass-ink)}
.st.read h3,.lead.read h2,.rise.read h3{color:var(--ink-3)}
.st.read h3{font-weight:500}
.st.top{grid-template-columns:1fr}
.st.top .th{grid-column:1;grid-row:1;width:100%;height:auto;aspect-ratio:16/9;margin-bottom:8px;border-radius:5px}

/* ---------- the front */
.front{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,4fr);gap:44px;padding-top:30px;padding-bottom:38px}
.lead .fig{display:block;border-radius:6px;overflow:hidden;background:var(--shoal);aspect-ratio:2/1;margin-top:20px}
.lead .fig img{width:100%;height:100%;object-fit:cover}
.lead h2{margin:0 0 12px;font:400 clamp(34px,4.3vw,56px)/1.03 var(--serif);letter-spacing:-.006em;max-width:22ch}
.lead h2 a{text-decoration:none}
.lead h2 a:hover{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:6px}
.lead .sn{margin:0;font-size:18px;line-height:1.5;color:var(--ink-2);max-width:62ch}
.lead .covers{margin:14px 0 0;font:500 15px/1.45 var(--sans);color:var(--ink-2)}
.lead .covers b{color:var(--brass-ink);font-weight:600}
.lead .covers button{border:0;background:none;padding:0;color:var(--ink);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.toplist h2,.sec-h{font:400 30px/1 var(--serif);margin:0 0 6px;letter-spacing:-.004em}
.toplist ol{list-style:none;margin:0;padding:0;counter-reset:rank 1}
.toplist li{counter-increment:rank;display:grid;grid-template-columns:30px minmax(0,1fr);gap:0 6px}
.toplist li::before{content:counter(rank);font:400 30px/1 var(--serif);color:var(--brass);padding-top:13px}
.toplist li .st{border:0}
.toplist li + li{border-top:1px solid var(--rule)}

.bearing{background:var(--shoal);padding:32px 0 34px}
.bearing .hd{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:6px}
.bearing h2{font:400 40px/1 var(--serif);margin:0;letter-spacing:-.006em}
.bearing .sub{margin:0;color:var(--ink-2);font-size:15px}
.bearing .more{margin-left:auto;font:600 15px var(--sans);color:var(--ink);background:var(--raise);border:1px solid var(--rule);border-radius:999px;padding:7px 14px;text-decoration:none}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 44px}
.cols .st:nth-child(2){border-top:0}
.cols .st{border-color:color-mix(in srgb,var(--ink) 12%,transparent)}
.cold{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px;align-items:center}
.cold span{font-size:15px;color:var(--ink-2);margin-right:4px;flex-basis:100%}
.chip{border:1px solid var(--rule);background:var(--raise);border-radius:999px;padding:6px 12px;font:600 14px var(--sans);color:var(--ink);display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.chip:hover{border-color:var(--ink-3)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip .x{opacity:.6;font-weight:500}

.rising{padding-top:34px;padding-bottom:6px}
.rise-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px 32px;margin-top:10px}
.rise{border-left:3px solid var(--signal);padding:2px 0 2px 14px}
.rise h3{margin:0;font:600 16px/1.32 var(--sans)}
.rise h3 a{text-decoration:none}
.rise h3 a:hover{text-decoration:underline}
.rise p{margin:6px 0 0;font:500 13px var(--sans);color:var(--ink-2)}
.rise p b{color:var(--signal);font-weight:600}

.shelves{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:44px;padding-top:38px;padding-bottom:30px}
.shelf .sh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:8px}
.shelf .sh a{font:600 14px var(--sans);color:var(--brass-ink);text-decoration:none;white-space:nowrap}
.shelf .sh a:hover{text-decoration:underline}

/* ---------- desk, topic and search pages */
.page{padding-top:28px;padding-bottom:40px;max-width:860px}
.page-h{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:10px}
.page-h h1{font:400 52px/1 var(--serif);margin:0;letter-spacing:-.008em}
.page-h p{margin:0;color:var(--ink-2)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:999px;padding:3px;background:var(--raise);margin-left:auto}
.seg button{border:0;background:none;border-radius:999px;padding:5px 12px;font:600 14px var(--sans);color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.loadmore{margin:18px 0 0;border:1px solid var(--rule);background:var(--raise);border-radius:999px;padding:9px 18px;font:600 15px var(--sans)}
.endnote{margin:26px 0 0;font:italic 400 19px/1.35 var(--serif);color:var(--ink-2)}
.archived{background:var(--ink);color:var(--paper);font:500 15px var(--sans)}
.archived .wrap{display:flex;gap:14px;align-items:center;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
.archived button{border:0;border-radius:999px;background:var(--brass);color:#15243B;font:600 14px var(--sans);padding:6px 14px}

/* ---------- drawer: one story and how everyone is covering it; also the compass */
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(580px,100%);background:var(--raise);z-index:50;transform:translateX(102%);transition:transform .26s cubic-bezier(.2,.7,.2,1);overflow-y:auto;overscroll-behavior:contain;box-shadow:-18px 0 50px rgba(14,26,43,.18)}
body.dopen .scrim{opacity:1;pointer-events:auto}
body.dopen .drawer{transform:none}
body.dopen{overflow:hidden}
.dr{padding:20px 28px 40px}
.dr .close{position:sticky;top:0;display:flex;justify-content:flex-end;padding:10px 0;background:linear-gradient(var(--raise) 70%,transparent);margin:-20px 0 0}
.dr .close button{border:1px solid var(--rule);background:var(--raise);border-radius:999px;width:36px;height:36px;display:grid;place-items:center}
.dr .hero{border-radius:6px;width:100%;aspect-ratio:2/1;object-fit:cover;background:var(--shoal);margin-bottom:16px}
.dr .src{font:600 14px var(--sans);color:var(--ink-2);display:flex;gap:12px;flex-wrap:wrap}
.dr .src b{color:var(--ink)}
.dr h2{font:400 36px/1.06 var(--serif);margin:10px 0 12px;letter-spacing:-.005em}
.dr .sn{font-size:17px;line-height:1.55;color:var(--ink-2);margin:0 0 18px}
.go{display:inline-flex;align-items:center;gap:9px;background:var(--ink);color:var(--paper);text-decoration:none;border-radius:999px;padding:11px 20px;font:600 16px var(--sans)}
.go svg{width:15px;height:15px}
.go:hover{background:color-mix(in srgb,var(--ink) 85%,var(--brass))}
.fb{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 0}
.fb button{border:1px solid var(--rule);background:var(--raise);border-radius:999px;padding:7px 13px;font:600 14px var(--sans);color:var(--ink-2)}
.fb button:hover{color:var(--ink);border-color:var(--ink-3)}
.dr h3.lbl{font:400 24px/1.1 var(--serif);margin:30px 0 4px}
.dr .tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.cov{list-style:none;margin:6px 0 0;padding:0}
.cov li{padding:11px 0;border-top:1px solid var(--rule)}
.cov li:first-child{border-top:0}
.cov a{text-decoration:none;font:600 15.5px/1.35 var(--sans)}
.cov a:hover{text-decoration:underline}
.cov .m{display:block;margin-top:3px;font:500 13px var(--sans);color:var(--ink-2)}
.cov .m b{color:var(--ink);font-weight:600}
.cov .sn2{display:block;margin-top:3px;color:var(--ink-2);font-size:14px}

.rose{display:block;margin:8px auto 2px;width:100%;max-width:330px;height:auto;overflow:visible}
.rose .ring{fill:none;stroke:var(--rule)}
.rose .spoke{stroke:var(--rule)}
.rose .area{fill:color-mix(in srgb,var(--brass) 26%,transparent);stroke:var(--brass);stroke-width:1.6;stroke-linejoin:round}
.rose .pt{fill:var(--brass)}
.rose text{font:600 10.5px var(--sans);fill:var(--ink-2)}
.rose text.on{fill:var(--ink)}
.rose .needle{stroke:var(--ink);stroke-width:2.2;stroke-linecap:round}
.wt{display:grid;grid-template-columns:minmax(0,1fr) 90px auto;gap:8px 12px;align-items:center;margin-top:8px}
.wt .nm{font:600 15px var(--sans);background:none;border:0;padding:0;text-align:left;text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:3px}
.wt .bar2{height:6px;border-radius:3px;background:var(--rule);overflow:hidden}
.wt .bar2 i{display:block;height:100%;background:var(--brass)}
.wt .acts{display:flex;gap:6px}
.wt .acts button{border:1px solid var(--rule);background:var(--raise);border-radius:999px;padding:3px 10px;font:600 12.5px var(--sans);color:var(--ink-2)}
.wt .acts button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.note{font-size:14.5px;color:var(--ink-2);line-height:1.55}
.danger{border:1px solid color-mix(in srgb,var(--signal) 45%,transparent);color:var(--signal);background:none;border-radius:999px;padding:8px 16px;font:600 14px var(--sans);margin-top:10px}

.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--paper);border-radius:999px;padding:10px 12px 10px 18px;font:600 14.5px var(--sans);display:flex;gap:12px;align-items:center;z-index:70;transition:opacity .18s,transform .18s;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{border:0;background:var(--brass);color:#15243B;border-radius:999px;padding:5px 12px;font:600 13.5px var(--sans)}
.toast.plain{padding-right:18px}

.foot{display:block;border-top:1px solid var(--rule);padding:26px 0 46px;margin-top:10px;color:var(--ink-2);font-size:14px;line-height:1.6}
.foot .wrap{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:32px}
.foot h4{font:400 22px var(--serif);color:var(--ink);margin:0 0 6px}
.foot p{margin:0 0 10px;max-width:70ch}
.foot details summary{cursor:pointer;color:var(--ink);font-weight:600}
.state{padding-top:90px;padding-bottom:90px;text-align:center}
.state h2{font:400 40px var(--serif);margin:0 0 8px}
.state p{color:var(--ink-2);margin:0 0 18px}
.state button{border:0;background:var(--ink);color:var(--paper);border-radius:999px;padding:10px 20px;font:600 15px var(--sans)}


/* ---------- markets */
:root{--up:#1C7A4C;--dn:#C2412D;--dem:#2F5FA8;--rep:#B83B36}
:root[data-theme="night"]{--up:#5BC48C;--dn:#E8705A;--dem:#7AA3E6;--rep:#E57D77}
@media (prefers-color-scheme:dark){:root:not([data-theme="day"]){--up:#5BC48C;--dn:#E8705A;--dem:#7AA3E6;--rep:#E57D77}}
.up{--d:var(--up)}.dn{--d:var(--dn)}.fl{--d:var(--ink-2)}
.tape{display:flex;gap:6px;overflow-x:auto;padding-top:14px;scrollbar-width:none}
.tape::-webkit-scrollbar{display:none}
.tk{flex:none;border:1px solid var(--rule);background:var(--raise);border-radius:999px;padding:6px 12px;font:500 13.5px var(--sans);display:inline-flex;gap:7px;align-items:baseline;font-variant-numeric:tabular-nums;color:var(--ink);text-decoration:none}
.tk b{font-weight:600}.tk i{font-style:normal;font-weight:700;color:var(--d)}
.tk:hover{border-color:var(--ink-3)}.tk.more{color:var(--brass-ink);font-weight:600}
.mk{padding-top:28px;padding-bottom:40px}
.mk .lede{font:400 27px/1.3 var(--serif);max-width:60ch;margin:6px 0 26px;letter-spacing:-.003em}
.bigs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:26px}
.big{display:grid;grid-template-columns:1fr auto;grid-template-areas:"n c" "p c" "s s";text-align:left;border:1px solid var(--rule);background:var(--raise);border-radius:8px;padding:14px 16px 10px;gap:2px 10px;font-variant-numeric:tabular-nums}
.big:hover{border-color:var(--ink-3)}
.big .bn{grid-area:n;font:600 15px var(--sans);color:var(--ink-2)}
.big .bp{grid-area:p;font:600 29px/1.1 var(--sans);letter-spacing:-.01em}
.big .bc{grid-area:c;align-self:center;text-align:right;font:600 15px/1.3 var(--sans);color:var(--d)}
.big .bc i{display:block;font-style:normal;font-size:18px}
.big .spk{grid-area:s;width:100%;height:64px;margin-top:8px}
.spk{display:block;overflow:visible}.spk path{fill:none;stroke:var(--d,var(--ink-2));stroke-width:1.6;stroke-linejoin:round}
.spk .base{stroke:var(--ink-3);stroke-dasharray:3 3;stroke-width:1;vector-effect:non-scaling-stroke;opacity:.6}
.spk.ink path{stroke:var(--brass)}
.boards{columns:3 285px;column-gap:32px}
.bd{break-inside:avoid;margin-bottom:24px}
.bd h3{font:600 13.5px var(--sans);color:var(--ink-2);margin:0;padding-bottom:6px;border-bottom:1px solid var(--rule)}
.br{display:grid;grid-template-columns:minmax(0,1fr) auto 66px 64px;gap:10px;align-items:center;width:100%;border:0;border-bottom:1px solid var(--rule);background:none;padding:8px 2px;text-align:left;font:500 14.5px var(--sans);font-variant-numeric:tabular-nums}
.br:hover{background:color-mix(in srgb,var(--shoal) 55%,transparent)}
.br .bn{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.br .bp{text-align:right}.br .bc{text-align:right;color:var(--d);font-weight:700}
.br .spk{width:64px;height:22px}
.blk{margin-top:40px}
.blk .sub2{margin:2px 0 14px;color:var(--ink-2);font-size:14.5px;max-width:72ch}
.blk.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:34px}
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.ht{border:0;border-radius:6px;padding:12px 13px;text-align:left;color:var(--ink);background:color-mix(in srgb,var(--d) calc(var(--heat,.1) * 100%),var(--raise));display:flex;flex-direction:column;gap:2px;font-variant-numeric:tabular-nums}
.ht.hot{color:#fff}
.ht b{font:600 14px var(--sans)}.ht span{font:600 21px var(--sans)}.ht small{font:500 12.5px var(--sans);opacity:.85}
.mv{display:grid;grid-template-columns:minmax(0,1fr) auto 72px;gap:12px;width:100%;border:0;border-bottom:1px solid var(--rule);background:none;padding:10px 2px;text-align:left;font:500 15px var(--sans);font-variant-numeric:tabular-nums}
.mv:hover{background:color-mix(in srgb,var(--shoal) 55%,transparent)}
.mv i{font-style:normal;text-align:right;font-weight:700;color:var(--d)}
.blk-h{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
.flt input{font:500 14px var(--sans);border:1px solid var(--rule);background:var(--raise);color:var(--ink);border-radius:999px;padding:7px 14px;width:250px}
.stk-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.stk{width:100%;border-collapse:collapse;font:500 14.5px var(--sans);font-variant-numeric:tabular-nums}
.stk th,.stk td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--rule);white-space:nowrap}
.stk .l{text-align:left}.stk thead th{font:600 12.5px var(--sans);color:var(--ink-2);position:sticky;top:0;background:var(--paper)}
.stk thead button{border:0;background:none;font:inherit;color:inherit;padding:0}
.stk thead button[aria-pressed="true"]{color:var(--ink)}
.stk tbody tr{cursor:pointer}.stk tbody tr:hover,.stk tbody tr:focus-visible{background:color-mix(in srgb,var(--shoal) 55%,transparent);outline:none}
.stk th.l b{font-weight:600}.stk th.l span{color:var(--ink-3);font-weight:500;margin-left:6px;font-size:12.5px}
.stk td.up,.stk td.dn{color:var(--d);font-weight:600}
.stk .sp .spk{width:90px;height:22px;margin-left:auto}
.econ{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:12px}
.ec{display:flex;flex-direction:column;gap:3px;border:1px solid var(--rule);background:var(--raise);border-radius:8px;padding:14px 15px;text-decoration:none}
.ec:hover{border-color:var(--ink-3)}
.ec .en{font:600 14px var(--sans);color:var(--ink-2)}.ec .ev{font:600 27px/1.1 var(--sans);font-variant-numeric:tabular-nums}
.ec .ew{font:500 13px var(--sans);color:var(--ink-2)}.ec .spk{width:100%;height:34px;margin:8px 0 6px}
.ec .ex{font-size:13.5px;color:var(--ink-2);line-height:1.45}
.cal{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:18px 30px}
.cday h4{font:400 23px var(--serif);margin:0 0 4px}
.cev{list-style:none;margin:0;padding:0}
.cev li{display:grid;grid-template-columns:54px minmax(0,1fr);gap:1px 10px;padding:7px 0;border-bottom:1px solid var(--rule);font-size:14px}
.cev .ct{font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums}.cev .cn{font-weight:600}
.cev .cc{grid-column:2;color:var(--ink-2);font-size:13px}.cev .cc b{color:var(--ink)}.cev .none{display:block;color:var(--ink-2)}
.cearn{font-size:14px;color:var(--ink-2);margin:10px 0 0;line-height:1.5}.cearn b{color:var(--ink)}.cearn span{color:var(--ink-3)}
.blk.news .page-h{margin-bottom:0}.narrow{max-width:860px}
.mkerr{margin-top:28px;font-size:13px;color:var(--ink-2)}.mkerr summary{cursor:pointer}
.qt{font-variant-numeric:tabular-nums;margin:2px 0 10px}.qt .qp{font:600 36px var(--sans);letter-spacing:-.01em}.qt .qc{font:600 17px var(--sans);color:var(--d)}
.rng{margin:8px 0 12px}
.chart svg{width:100%;height:auto;display:block;touch-action:pan-y;overflow:visible}
.chart .ln{fill:none;stroke-width:2;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.bc.up .ln{stroke:var(--up)}.bc.dn .ln{stroke:var(--dn)}
.bc.up .area{fill:color-mix(in srgb,var(--up) 13%,transparent)}.bc.dn .area{fill:color-mix(in srgb,var(--dn) 13%,transparent)}
.chart .base{stroke:var(--ink-3);stroke-dasharray:4 4}.chart .cross{stroke:var(--ink-3)}.chart .dot{fill:var(--ink)}
.chart .ax{display:flex;justify-content:space-between;gap:8px;font:500 12.5px var(--sans);color:var(--ink-2);margin-top:6px;font-variant-numeric:tabular-nums}
.chart .rd{color:var(--ink);font-weight:600;text-align:center}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 16px;margin:20px 0 0}
.stats div{min-width:0}.stats .wide{grid-column:span 3}
.stats dt{font:500 12.5px var(--sans);color:var(--ink-2)}.stats dd{margin:2px 0 0;font:600 15px var(--sans);font-variant-numeric:tabular-nums}
.stats dd.up,.stats dd.dn{color:var(--d)}
.r52{display:block;position:relative;height:6px;border-radius:3px;background:var(--rule);margin-top:8px}
.r52 i{position:absolute;top:-3px;width:3px;height:12px;background:var(--ink);border-radius:2px;transform:translateX(-50%)}

/* ---------- elections, read from the Election Desk and the Brazil desk */
.fe{padding-top:4px;padding-bottom:30px}
.elx{display:grid;grid-template-columns:1fr;gap:18px;margin-bottom:8px}
.elx.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.elx.full.two{grid-template-columns:1fr}
.ecard{border:1px solid var(--rule);background:var(--raise);border-radius:10px;padding:18px 20px 16px;min-width:0}
.ecard h3{font:400 32px/1.05 var(--serif);margin:0 0 6px;letter-spacing:-.004em}
.edate{margin:0 0 10px;color:var(--ink-2);font-size:14.5px;line-height:1.5}
.eh{margin:10px 0 2px;font-size:15px;line-height:1.5}.eh span{color:var(--ink-2)}
.vbar{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;margin:6px 0 8px}.vbar span{display:block;min-width:2px}
.cands{list-style:none;padding:0;margin:6px 0}
.cands li{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:2px 10px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--rule)}
.cands i{width:10px;height:10px;border-radius:50%;align-self:center}.cands b{font-weight:600}.cands span{color:var(--ink-2);font-size:13px;margin-left:6px}
.cands em{font-style:normal;font:600 20px var(--sans);font-variant-numeric:tabular-nums}.cands small{grid-column:2 / 4;color:var(--ink-2);font-size:13px}
.esrc{font-size:12.5px;color:var(--ink-2);margin:8px 0 0;line-height:1.5}
.ecal{list-style:none;margin:12px 0 0;padding:0;font-size:14px;color:var(--ink-2)}.ecal li{padding:4px 0}.ecal b{color:var(--ink);font-weight:600;margin-right:6px}
.elinks{margin:14px 0 0;display:flex;gap:8px;flex-wrap:wrap}
.elinks a{font:600 14px var(--sans);text-decoration:none;border:1px solid var(--rule);border-radius:999px;padding:6px 13px;background:var(--paper)}
.elinks a:first-child{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.eh4{font:400 23px var(--serif);margin:20px 0 6px}
.races{overflow-x:auto;-webkit-overflow-scrolling:touch}
.races table{width:100%;border-collapse:collapse;font:500 14px var(--sans);font-variant-numeric:tabular-nums}
.races th,.races td{padding:8px 9px;border-bottom:1px solid var(--rule);text-align:right;white-space:nowrap}
.races .l{text-align:left}.races thead th{font:600 12.5px var(--sans);color:var(--ink-2)}
.races .pd{font-weight:600}
.desk-top{padding-top:26px}

/* ---------- reports */
.rep{display:flex;flex-direction:column;gap:6px;text-decoration:none;border-top:1px solid var(--rule);padding:20px 0 22px;max-width:860px}
.rep .rk{font:600 12.5px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--brass-ink)}
.rep .rt{font:400 32px/1.1 var(--serif);letter-spacing:-.005em}
.rep:hover .rt{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px}
.rep .rd{font-size:17px;color:var(--ink-2);line-height:1.5;max-width:68ch}
.rep .rb{font:500 13.5px var(--sans);color:var(--ink-3)}
.rep.big{border:1px solid var(--rule);background:var(--raise);border-radius:10px;padding:22px 26px 24px;max-width:none}
.rep.big .rt{font-size:40px}
.repfront{margin-top:34px}.repfront .note{margin:10px 0 0}
.art{max-width:760px;padding-top:34px;padding-bottom:30px}
.art .ak{font:600 12.5px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--brass-ink);margin:0 0 10px}
.art .ak a{text-decoration:none}
.art h1{font:400 54px/1.04 var(--serif);margin:0 0 14px;letter-spacing:-.01em}
.art .adek{font:400 23px/1.35 var(--serif);color:var(--ink-2);margin:0 0 16px}
.art .aby{font:500 14.5px var(--sans);color:var(--ink-2);margin:0}
.art .adis{font-size:14px;color:var(--ink-3);border-left:3px solid var(--brass);padding:2px 0 2px 12px;margin:16px 0 26px}
.abody{font:400 19px/1.66 var(--serif);font-family:Georgia,'Iowan Old Style',serif;font-size:18.5px}
.abody p{margin:0 0 1.05em}
.abody h2{font:400 31px/1.15 var(--serif);margin:1.5em 0 .45em}
.abody h3{font:600 18px var(--sans);margin:1.4em 0 .4em}
.abody blockquote{margin:1.2em 0;padding:2px 0 2px 18px;border-left:3px solid var(--rule);color:var(--ink-2);font-style:italic}
.abody ul,.abody ol{padding-left:1.3em;margin:0 0 1.05em}.abody li{margin:.3em 0}
.abody a{text-underline-offset:3px}
.cite{font:700 11px var(--sans);line-height:0;margin-left:1px}
.cite a{text-decoration:none;color:var(--brass-ink);padding:0 2px}
.asrc{margin-top:36px;border-top:1px solid var(--rule);padding-top:8px}
.asrc ol{padding-left:1.4em;margin:6px 0 0}.asrc li{margin:7px 0;font-size:15px;line-height:1.45;border-radius:4px;transition:background .4s}
.asrc li span{color:var(--ink-3)}
.asrc li.hit{background:color-mix(in srgb,var(--brass) 22%,transparent)}

/* ---------- home */
.hsearch{margin-top:14px;max-width:900px}
#hq{width:100%;font:500 22px var(--sans);border:1.5px solid var(--ink-3);background:var(--raise);color:var(--ink);border-radius:12px;padding:15px 18px}
#hq:focus{border-color:var(--ink);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--brass) 35%,transparent)}
.tags{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 0}
.tags.ex .chip{font-weight:500;font-size:13.5px;padding:5px 11px;color:var(--ink-2)}
.hs{margin-top:18px;border:1px solid var(--rule);background:var(--raise);border-radius:10px;padding:16px 18px 18px}
.hs h3{font:400 25px/1.2 var(--serif);margin:0}
.hs .tags .chip{background:var(--shoal);border-color:transparent}
.hm{font-size:17px;line-height:1.55;margin:14px 0 0;max-width:72ch}
.hm .note{display:block;margin-top:4px;font-size:13px}
.hsave{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:16px 0 0}
.hsave .note{flex:1 1 300px;font-size:13.5px}
.lst{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:10px}
.li{display:flex;flex-direction:column;gap:2px;border:1px solid var(--rule);border-radius:8px;padding:12px 13px;text-decoration:none;background:var(--paper)}
.li:hover{border-color:var(--ink-3)}
.li b{font:600 21px var(--sans);font-variant-numeric:tabular-nums}.li span{font-size:14.5px}.li .la{color:var(--ink-2)}.li small{color:var(--ink-3);font-size:12.5px}

/* ---------- the Epstein files */
.fcount{display:flex;flex-wrap:wrap;gap:12px 34px;align-items:center;margin:20px 0 6px;padding:18px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.fcount div{display:flex;flex-direction:column}.fcount b{font:400 40px/1 var(--serif)}.fcount span{font:500 13.5px var(--sans);color:var(--ink-2)}
.fcount .go{margin-left:auto}
.fstories{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.fs{display:flex;flex-direction:column;gap:5px;border:1px solid var(--rule);background:var(--raise);border-radius:8px;padding:15px 16px;text-decoration:none}
.fs:hover{border-color:var(--ink-3)}
.fs .rk{font:600 11.5px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--brass-ink)}
.fs b{font:400 23px/1.15 var(--serif);font-weight:400}.fs span{font-size:14.5px;color:var(--ink-2);line-height:1.45}.fs small{color:var(--ink-3);font-size:12.5px;margin-top:auto}
.ftl{list-style:none;margin:0;padding:0;border-left:2px solid var(--rule)}
.ftl li{position:relative;padding:0 0 12px 16px;font-size:15px;line-height:1.45}
.ftl li::before{content:'';position:absolute;left:-6px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--paper);border:2px solid var(--brass)}
.ftl b{font-variant-numeric:tabular-nums;margin-right:4px}
.fyears{display:flex;align-items:flex-end;gap:3px;height:140px;padding-top:6px}
.fyears div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;align-items:center;gap:4px}
.fyears span{width:100%;background:var(--ink-2);border-radius:2px 2px 0 0;min-height:2px}
.fyears small{font:500 10.5px var(--sans);color:var(--ink-3)}
.fpeople{list-style:none;margin:0;padding:0;columns:2;column-gap:24px}
.fpeople li{break-inside:avoid;padding:6px 0;border-bottom:1px solid var(--rule);font-size:14.5px}
.fpeople a{text-decoration:none}.fpeople span{color:var(--ink-2);font-size:13px}.fpeople small{display:block;color:var(--ink-3);font-size:12.5px;line-height:1.4;margin-top:2px}
.fm .mt a{font-weight:600;text-decoration:none;color:var(--brass-ink)}

/* ---------- slideshow cards */
.pstrip{margin-top:34px}
.pstrip .sh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.pstrip .sh a{font:600 14px var(--sans);text-decoration:none;color:var(--ink-2)}
.scrow{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 10px;scrollbar-width:thin;overscroll-behavior-x:contain}
.scrow .sc{flex:0 0 168px;scroll-snap-align:start}.scrow .sc.big{flex-basis:300px}
.sc{display:block;border:0;padding:0;background:none;text-align:left;color:#fff;cursor:pointer;position:relative;border-radius:12px;overflow:hidden;isolation:isolate}
.sci{display:block;aspect-ratio:3/4;background:#1d2b3e;position:relative}
.sci img{width:100%;height:100%;object-fit:cover;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.sc:hover .sci img{transform:scale(1.045)}
.sci.mosaic{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr 1fr;gap:2px}
.sci.mosaic img:first-child{grid-row:1/4}
.sc.big .sci{aspect-ratio:300/400}
.sc::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,9,15,0) 38%,rgba(5,9,15,.86) 100%);pointer-events:none}
.scx{position:absolute;left:0;right:0;bottom:0;z-index:1;padding:12px 13px 13px;display:flex;flex-direction:column;gap:2px}
.sck{font:700 11px var(--sans);letter-spacing:.07em;text-transform:uppercase;color:#E3C47E}
.sct{font:400 21px/1.08 var(--serif);text-wrap:balance}.sc.big .sct{font-size:30px}
.scn{font:600 12.5px var(--sans);color:rgba(255,255,255,.78);margin-top:3px}
.sc.vid .sci::before{content:'▶';position:absolute;z-index:2;top:10px;right:10px;width:30px;height:30px;border-radius:50%;background:rgba(5,9,15,.6);display:grid;place-items:center;font-size:12px;color:#fff}
.scgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:14px;margin-top:12px}
.phero{margin-top:18px}.phero .sc{width:100%}.phero .sc.big .sci{aspect-ratio:16/7}.phero .sc.big .sct{font-size:44px}
.ssban{display:flex;gap:12px;flex-wrap:wrap;margin:0 0 14px}
.ssban button{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--rule);background:var(--raise);border-radius:999px;padding:5px 14px 5px 5px;font:600 14px var(--sans)}
.ssban img{width:30px;height:30px;border-radius:50%;object-fit:cover;background:var(--shoal)}
.ssban button:hover{border-color:var(--ink-3)}

/* ---------- video desk */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:22px 18px;margin-top:20px}
.vgrid.shorts{grid-template-columns:repeat(auto-fill,minmax(165px,1fr))}
.vrow{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 10px;margin-top:10px;scrollbar-width:thin}
.vrow .vc{flex:0 0 150px;scroll-snap-align:start}.vrow .vc h3{font-size:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.vrow .vc .mt span:nth-child(3),.vrow .vrel{display:none}
.vc h3{margin:9px 0 2px;font:600 16.5px/1.3 var(--sans)}
.vc h3 button{border:0;background:none;padding:0;text-align:left;font:inherit;color:inherit}
.vc h3 button:hover{text-decoration:underline;text-underline-offset:3px}
.vt{display:block;position:relative;width:100%;border:0;padding:0;border-radius:10px;overflow:hidden;aspect-ratio:16/9;background:#0b1320}
.vc.short .vt{aspect-ratio:9/16}
.vt img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.vt:hover img{transform:scale(1.04)}
.pb{position:absolute;left:10px;bottom:10px;width:38px;height:38px;border-radius:50%;background:rgba(5,9,15,.72);color:#fff;display:grid;place-items:center;font-size:14px}
.vs{position:absolute;top:8px;left:8px;background:#C2412D;color:#fff;font:700 11px var(--sans);border-radius:4px;padding:2px 6px;letter-spacing:.04em;text-transform:uppercase}
.vrel{margin:4px 0 0;font-size:13.5px;color:var(--ink-2);line-height:1.4}.vrel a{color:var(--ink)}
.dvid{margin:18px 0 6px}.dvid .vframe{border-radius:10px;overflow:hidden}
.vframe{position:relative;aspect-ratio:16/9;width:100%;background:#000}
.vframe img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vframe iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vplay{position:absolute;inset:0;margin:auto;width:76px;height:76px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#0E1A2B;display:grid;place-items:center;font-size:26px;box-shadow:0 10px 40px rgba(0,0,0,.35);transition:transform .15s}
.vplay span{margin-left:5px}.vplay:hover{transform:scale(1.07)}

/* ---------- the viewer */
body.ssopen{overflow:hidden}
.ss{position:fixed;inset:0;z-index:35;background:#04070c;color:#fff;overflow:hidden;--cap:400px;-webkit-tap-highlight-color:transparent}
.ss:focus{outline:none}
.ss button{color:inherit}
.ssstage{position:absolute;inset:0;touch-action:none;user-select:none;-webkit-user-select:none}
.sl{position:absolute;inset:0;overflow:hidden}
.slbg{position:absolute;inset:-60px;width:calc(100% + 120px);height:calc(100% + 120px);object-fit:cover;filter:blur(34px) brightness(.5) saturate(1.25);transform:scale(1.05)}
.slmedia{position:absolute;display:flex;align-items:center;justify-content:center}
.slim{max-width:100%;max-height:100%;object-fit:contain;animation:kb 9s ease-out both;box-shadow:0 18px 60px rgba(0,0,0,.45)}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.06)}}
.slcap{position:absolute;z-index:2}
.slk{margin:0 0 6px;font:700 11.5px var(--sans);letter-spacing:.07em;text-transform:uppercase;color:#E3C47E}
.slcap h2{margin:0 0 8px;font:400 31px/1.06 var(--serif);letter-spacing:-.005em;text-wrap:balance}
.sld{margin:0 0 8px;font-size:15.5px;line-height:1.48;color:rgba(255,255,255,.86);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.slsrc{margin:0 0 12px;font:500 12.5px var(--sans);color:rgba(255,255,255,.62)}
.slacts{display:flex;flex-wrap:wrap;gap:8px;margin:0}
.ss .go{background:#fff;color:#0E1A2B;padding:10px 18px;font-size:15px}
.ss .go:hover{background:#E3C47E}
.ss .chip{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.35);color:#fff;backdrop-filter:blur(6px)}
.ss .chip:hover{border-color:#fff}
.sl.noimg .slmedia{display:none}

<script>
(() => {
'use strict';

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ICON_OUT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5h11v11"/><path d="M19 5L6 18"/></svg>';

/* ================= what The Watch has learned (this browser only) ================= */
const KEY = 'watch.v1', OLD_KEY = 'sextant.v1'; // the site was called Sextant on its first day
function blank() { return { v: 1, sec: {}, src: {}, kw: {}, follow: {}, mute: { kw: {}, src: {} }, read: {}, seen: {}, last: 0, t: Date.now(), n: 0, theme: 'auto', pending: null }; }
let P;
try { P = JSON.parse(localStorage.getItem(KEY) || localStorage.getItem(OLD_KEY) || 'null'); } catch (e) { P = null; }
if (!P || P.v !== 1) P = blank();
for (const k of Object.keys(blank())) if (P[k] === undefined) P[k] = blank()[k];
let saveT = 0;
function save() { clearTimeout(saveT); saveT = setTimeout(() => { try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (e) { /* private window: learn for this visit only */ } }, 300); }
(function decay() { // interests fade by half every two weeks unless you keep reading about them
  const days = (Date.now() - (P.t || Date.now())) / 864e5;
  if (days > 0.02) {
    const f = Math.pow(0.5, days / 14);
    for (const m of [P.sec, P.src, P.kw]) for (const k in m) { m[k] *= f; if (Math.abs(m[k]) < 0.04) delete m[k]; }

  const wk = Date.now() - 7 * 864e5;
  for (const id in P.read) if (P.read[id] < wk) delete P.read[id];

let prevLast = 0;

const W = { // how much each thing you do counts, by section, outlet and topic
  peek: [0.6, 0.35, 0.8], view: [0.3, 0.12, 0.4], open: [1.5, 1.2, 1.6], dwell: [1.0, 0.8, 1.3], more: [1.6, 0.4, 3.2], less: [-1.2, -0.3, -3.2] };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function learn(it, kind) {

  const w = W[kind]; if (!w) return;

  P.src[it.o] = clamp((P.src[it.o] || 0) + w[1], -12, 30);

}
function bump(map, k, v) { map[k] = clamp((map[k] || 0) + v, -14, 30); P.n++; save(); }

/* ================= the edition ================= */
let E = null, LATEST = null, byId = new Map(), DF = {}, viewingArchive = false;
const outlet = o => (E && E.outlets[o]) || o;
const DESK_NAMES = { household: 'Household', home: 'Home', files: 'Epstein files' };
const secName = k => ((E && E.sections.find(s => s.k === k)) || { name: DESK_NAMES[k] || k }).name;
const kwLabel = k => k.startsWith('#') ? ((E && E.topics[k.slice(1)]) || k.slice(1)) : ((E && E.kw[k]) || k);
const clusterOf = it => (it && it.g != null && E) ? E.clusters[it.g] : null;
const refMin = () => viewingArchive ? E.atMin : Math.floor(Date.now() / 60000);

async function getJSON(path) {
  const tries = /^https?:$/.test(location.protocol) ? [path, PUBLIC + path] : [PUBLIC + path];
  let last;
  for (const u of tries) {
    try {
      const r = await fetch(u + (u.includes('?') ? '&' : '?') + 'v=' + Math.floor(Date.now() / 120000), { cache: 'no-cache' });

      last = new Error(r.status + ' at ' + u);
    } catch (e) { last = e; }

}
function useEdition(ed, archived) {
  E = ed; viewingArchive = !!archived;
  byId = new Map(E.items.map(it => [it.i, it]));
  DF = {};
  for (const it of E.items) for (const k of it.k || []) DF[k] = (DF[k] || 0) + 1;
}

/* ================= time ================= */
const fmtTime = new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', hour: 'numeric', minute: '2-digit' });
const fmtDay = new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', weekday: 'long', month: 'long', day: 'numeric' });
const fmtShort = new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', month: 'short', day: 'numeric' });
const fmtParts = new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', year: 'numeric', month: '2-digit', day: '2-digit', hour: 'numeric', minute: 'numeric', hourCycle: 'h23' });
function et(d) { const p = {}; for (const x of fmtParts.formatToParts(d)) p[x.type] = x.value; return { h: +p.hour % 24, m: +p.minute, date: `${p.year}-${p.month}-${p.day}` }; }
function ago(pm) {
  const m = refMin() - pm;
  if (m < 2) return 'Just now';
  if (m < 60) return m + 'm ago';
  if (m < 60 * 24) return Math.round(m / 60) + 'h ago';
  return fmtShort.format(new Date(pm * 60000));
}
const clock = iso => fmtTime.format(new Date(iso)).replace(':00 ', ' ');

/* ================= ranking: what's big, what's yours ================= */
const kwWeight = k => 1 / (1 + Math.log(1 + (DF[k] || 1) / 12)); // a word in every story says little about you
function affinity(it) {
  let a = 0, best = 0, why = '';
  const s = (P.sec[it.c] || 0) * 0.5; a += s; if (s > best) { best = s; why = `You read a lot of ${secName(it.c)}`; }
  const o = (P.src[it.o] || 0) * 0.45; a += o; if (o > best) { best = o; why = `You often open ${outlet(it.o)}`; }
  for (const k of it.k || []) {
    let v = (P.kw[k] || 0) * kwWeight(k);
    if (P.follow[k]) v += 4;
    a += v;
    if (v > best) { best = v; why = P.follow[k] ? `You follow ${kwLabel(k)}` : `Because you read about ${kwLabel(k)}`; }
  }
  return { a, why: best >= 0.8 ? why : '' };
}
function base(it) {
  const age = Math.max(0, (refMin() - it.p) / 60);
  const c = clusterOf(it);
  return Math.exp(-age / (SLOW.has(it.c) ? 60 : 16)) * (1 + 0.45 * Math.log2(c ? c.n : 1)) * (SERVICE.test(it.t) ? 0.35 : 1);
}
const SERVICE = /\b(where to watch|how to watch|live ?stream|start time|tv channel|odds,? (picks|predictions)|predictions?,? odds|live (results|updates|blog|scores?)|play-by-play)\b/i;
const muted = it => !!(P.mute.src[it.o] || (it.k || []).some(k => P.mute.kw[k]));
function score(it, warm = warmProfile()) {
  if (muted(it)) return -1;
  let s = base(it);
  if (warm) s *= Math.max(0.12, 1 + 1.6 * Math.tanh(affinity(it).a / 5));
  const seen = (P.seen[it.i] && P.seen[it.i].n) || 0;
  if (!P.read[it.i] && seen > 1) s *= Math.pow(0.86, seen - 1); // scrolled past it a few times: let it sink
  if (P.read[it.i]) s *= 0.08;
  return s;
}
const warmProfile = () => P.n >= 3;
function rep(c) { // for a shared story, show the version from the outlet you open most
  let best = byId.get(c.lead);
  if (!best) best = byId.get(c.ids[0]);
  let bv = (P.src[best.o] || 0) + 1;
  for (const id of c.ids) {
    const it = byId.get(id);
    if (!it || P.mute.src[it.o]) continue;
    const v = P.src[it.o] || 0;
    if (v > bv) { best = it; bv = v; }
  }
  return best;
}
function units(filter) { // one entry per story: a shared story counts once
  const out = [], done = new Set();
  for (const it of E.items) {
    if (filter && !filter(it)) continue;
    const c = clusterOf(it);
    if (c) { if (done.has(c.id)) continue; done.add(c.id); const r = rep(c); out.push(filter && !filter(r) ? it : r); }

}
function deskUnits(k) {
  const out = [], done = new Set();
  for (const it of E.items) {
    const c = clusterOf(it);
    if (c) {
      if (done.has(c.id) || c.sec !== k) continue;

}
const unitKey = it => it.g != null ? 'c' + it.g : 'i' + it.i;
function coverWhy(it) {

function polar(r, h) { const a = (h / 24) * Math.PI * 2 - Math.PI / 2; return [110 + r * Math.cos(a), 110 + r * Math.sin(a)]; }

}
function drawDial() {

    const major = h % 4 === 0;
    const [x0, y0] = polar(major ? 92 : 95, h), [x1, y1] = polar(101, h);
    s += `<line class="tick${major ? ' major' : ''}" x1="${x0.toFixed(1)}" y1="${y0.toFixed(1)}" x2="${x1.toFixed(1)}" y2="${y1.toFixed(1)}"/>`;
  }
  ['12a', '4a', '8a', '12p', '4p', '8p'].forEach((t, i) => {
    const [x, y] = polar(116, i * 4);
    s += `<text class="hr" x="${x.toFixed(1)}" y="${(y + 5).toFixed(1)}" text-anchor="middle">${t}</text>`;
  });

    const ed = [...arch].reverse().find(a => a.id.endsWith('-' + key));
    let cls = 'arc', title = `${label}, ${h0 === 0 ? '12' : h0 > 12 ? h0 - 12 : h0} ${h0 < 12 ? 'a.m.' : 'p.m.'} edition`;
    let tab = '';

      cls += isLatest ? ' now' : isToday ? ' past' : ' yday';
      if (ed.id === E.id && viewingArchive) cls += ' reading';
      title = `${isToday ? '' : 'Yesterday’s '}${label}, out at ${clock(ed.at)}${isLatest ? ' (latest)' : ''}`;
      tab = ` tabindex="0" role="button" data-ed="${ed.id}" aria-label="${esc(title)}"`;
    }
    s += `<path class="${cls}" d="${arcPath(h0, h0 + 4, 70, 88)}"${tab}><title>${esc(title)}</title></path>`;
  }
  const nh = now.h + now.m / 60;
  const [nx, ny] = polar(101, nh), [mx, my] = polar(62, nh);
  s += `<line class="needle" x1="${mx.toFixed(1)}" y1="${my.toFixed(1)}" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}"/><circle class="hub" cx="${nx.toFixed(1)}" cy="${ny.toFixed(1)}" r="4"/>`;

  svg.innerHTML = s;
  svg.setAttribute('aria-label', `The six watches of the day. You are reading the ${w[1]}.`);
}

    const b = block.trim(); if (!b) continue;

    if (/^>\s?/.test(b)) { out.push(`<blockquote>${inline(b.replace(/^>\s?/gm, ''))}</blockquote>`); continue; }

    <button type="button" class="ssnav prev" data-ss="prev" aria-label="Previous">‹</button><button type="button" class="ssnav next" data-ss="next" aria-label="Next">›</button>
    <div class="ssstrip">${show.slides.map((sl, i) => `<button type="button" data-ssgo="${i}" aria-label="Slide ${i + 1} of ${n}"><img src="${esc(sl.kind === 'video' ? ytThumb(sl.v.v, 'mqdefault') : sl.orig)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.visibility='hidden'">${sl.kind === 'video' ? '<span>▶</span>' : ''}</button>`).join('')}</div>`;
  SS.el = el;
  if (!document.body.classList.contains('ssopen')) { document.body.classList.add('ssopen'); history.pushState({ sx: 'ss' }, ''); }
  SS.t0 = 0; clearTimeout(SS.timer);
  ssBind(el);
  ssShow(SS.i, 0);
  setTimeout(() => el.focus({ preventScroll: true }), 20);
}
function closeShow(fromPop) {
  if (!SS.el) return;
  ssHalt(); ssCount();
  SS.el.remove(); SS.el = null; SS.show = null;
  document.body.classList.remove('ssopen');
  if (!fromPop && history.state && history.state.sx === 'ss') { skipPop = true; history.back(); }
}
function ssCount() { // a slide you stayed on for a couple of seconds counts, lightly, toward your picks
  const sl = SS.show && SS.show.slides[SS.i];
  if (sl && sl.kind === 'story' && sl.it && SS.viewT && performance.now() - SS.viewT > 2500 && !counted.has('view' + sl.it.i)) { counted.add('view' + sl.it.i); learn(sl.it, 'view'); }
  if (sl && sl.kind === 'video' && SS.viewT && performance.now() - SS.viewT > 4000 && !counted.has('vview' + sl.v.v)) { counted.add('vview' + sl.v.v); bump(P.sec, sl.v.c, 0.3); }
  SS.viewT = 0;
}
function slideHTML(sl, i) {
  const n = SS.show.slides.length;
  if (sl.kind === 'video') {
    const v = sl.v, c = v.g != null ? E.clusters[v.g] : null, lead = c ? byId.get(c.lead) : null;
    return `<div class="sl video${v.s ? ' short' : ''}"><img class="slbg" src="${esc(ytThumb(v.v))}" alt="" referrerpolicy="no-referrer">
      <div class="slmedia"><div class="vframe" data-v="${esc(v.v)}"><img src="${esc(ytThumb(v.v, v.s ? 'hq720' : 'maxresdefault'))}" data-orig="${esc(ytThumb(v.v))}" alt="" referrerpolicy="no-referrer" onerror="if(this.src!==this.dataset.orig){this.src=this.dataset.orig}">
        <button type="button" class="vplay" data-ss="playvid" aria-label="Play video: ${esc(v.t)}"><span>▶</span></button></div></div>
      <div class="slcap"><p class="slk">Video · ${esc(v.ch)} · ${ago(vidMin(v))}</p><h2>${esc(v.t)}</h2>${v.d ? `<p class="sld">${esc(v.d)}</p>` : ''}
        <p class="slacts"><button type="button" class="go" data-ss="playvid">▶ Play</button><a class="chip" href="https://www.youtube.com/watch?v=${encodeURIComponent(v.v)}" target="_blank" rel="noopener">Watch on YouTube</a>${lead ? `<button type="button" class="chip" data-open="${lead.i}">The story${c.n > 1 ? `, ${c.n} outlets` : ''}</button>` : ''}</p></div></div>`;
  }
  const it = sl.it, c = clusterOf(it);
  return `<div class="sl story"><img class="slbg" src="${esc(sl.orig)}" alt="" referrerpolicy="no-referrer">
    <div class="slmedia"><img class="slim" src="${esc(sl.img)}" data-orig="${esc(sl.orig)}" alt="" referrerpolicy="no-referrer" onerror="ssImgErr(this)"></div>
    <div class="slcap"><p class="slk">${esc(secName(it.c))}${c && c.n > 1 ? ` · ${c.n} outlets` : ''} · ${ago(it.p)}</p>
      <h2>${esc(it.t)}</h2>${it.d ? `<p class="sld">${esc(it.d)}</p>` : ''}
      <p class="slsrc">Picture and story: ${esc(outlet(it.o))}</p>
      <p class="slacts"><a class="go" href="${esc(it.u)}" target="_blank" rel="noopener" data-out="${it.i}">Read it ${ICON_OUT}</a>${c && c.n > 1 ? `<button type="button" class="chip" data-open="${it.i}">Compare ${c.n} outlets</button>` : `<button type="button" class="chip" data-open="${it.i}">More</button>`}${sl.vid ? `<button type="button" class="chip" data-ss="vidof">▶ Watch</button>` : ''}</p></div></div>`;
}
window.ssImgErr = img => { // the larger size didn't exist: fall back to the feed's picture, then to type alone
  if (img.dataset.orig && img.src !== img.dataset.orig) { img.src = img.dataset.orig; return; }
  const sl = img.closest('.sl'); if (sl) sl.classList.add('noimg'); img.remove();
};
const stageHas = () => !!(SS.el && SS.el.querySelector('.ssstage .sl.cur'));
function endHTML() {
  const others = allShows().filter(s => s.id !== SS.show.id).slice(0, 4);
  return `<div class="sl end"><div class="slcap"><p class="slk">${esc(SS.show.kicker || '')}</p><h2>That’s ${esc(SS.show.title.replace(/^The /, 'the '))}.</h2>
    <p class="slacts"><button type="button" class="go" data-ssgo="0">Start again</button><button type="button" class="chip" data-ss="close">Back to the news</button></p>
    ${others.length ? `<p class="slk" style="margin-top:26px">Up next</p><div class="ssnext">${others.map(s => showCard(s)).join('')}</div>` : ''}</div></div>`;
}
function ssShow(i, dir) {
  const show = SS.show, el = SS.el; if (!show || !el) return;
  ssCount();
  const n = show.slides.length;
  if (i > n) i = n;
  if (i < 0) i = 0;
  if (i === SS.i && dir && stageHas()) return; // already there (the first or the last)
  SS.i = i;
  const stage = el.querySelector('.ssstage');
  const old = stage.querySelector('.sl.cur');
  stage.insertAdjacentHTML('beforeend', i === n ? endHTML() : slideHTML(show.slides[i], i));
  const neu = stage.lastElementChild;
  neu.classList.add('cur');
  if (old) {
    old.classList.remove('cur');
    if (dir) { neu.classList.add(dir > 0 ? 'in-next' : 'in-prev'); old.classList.add(dir > 0 ? 'out-next' : 'out-prev'); }
    old.querySelectorAll('iframe').forEach(f => f.remove());
    setTimeout(() => old.remove(), 230);
  }
  const sl = show.slides[i] || { kind: 'end' };
  el.querySelector('.ssc').textContent = i === n ? 'The end' : `${i + 1} / ${n}`;
  el.querySelectorAll('.ssbars i').forEach((b, k) => { b.className = k < i ? 'done' : k === i ? 'now' : ''; });
  el.querySelectorAll('.ssstrip button').forEach((b, k) => { b.classList.toggle('on', k === i); if (k === i) b.scrollIntoView({ block: 'nearest', inline: 'center' }); });
  el.querySelector('.prev').disabled = i === 0;
  el.querySelector('.next').disabled = i === n;
  for (const k of [i + 1, i + 2]) { const s2 = show.slides[k]; if (s2) { const im = new Image(); im.referrerPolicy = 'no-referrer'; im.src = s2.kind === 'video' ? ytThumb(s2.v.v) : s2.img; } }
  SS.viewT = performance.now();
  if (sl.kind === 'video' && SS.autoVid) ssPlayVid(neu, sl.v);
  ssTime(true);
}
function ssHalt() { clearTimeout(SS.timer); if (SS.t0) { SS.left = Math.max(200, SS.left - (performance.now() - SS.t0)); SS.t0 = 0; } }
function ssTime(fresh) { // the autoplay clock: the bar's animation and a timer that agree
  ssHalt();
  const el = SS.el; if (!el || !SS.show) return;
  const end = SS.i >= SS.show.slides.length;
  const sl = SS.show.slides[SS.i];
  const wait = end || (sl && sl.kind === 'video'); // a video waits for you
  if (fresh) SS.left = SS_MS;
  const run = SS.playing && !SS.held && !wait && !document.body.classList.contains('dopen') && document.visibilityState === 'visible';
  el.classList.toggle('paused', !SS.playing);
  const pb = el.querySelector('[data-ss="play"]');
  if (pb) { pb.innerHTML = SS.playing ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="4" width="5" height="16" rx="1"/><rect x="14" y="4" width="5" height="16" rx="1"/></svg>' : '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4l13 8-13 8z"/></svg>'; pb.setAttribute('aria-label', SS.playing ? 'Pause' : 'Play'); }
  const bar = el.querySelector('.ssbars i.now b');
  if (bar) {
    if (fresh) { bar.style.animation = 'none'; void bar.offsetWidth; bar.style.animation = ''; bar.style.animationDuration = SS_MS + 'ms'; }
    bar.style.animationPlayState = run ? 'running' : 'paused';
  }
  if (run) { SS.t0 = performance.now(); SS.timer = setTimeout(() => ssShow(SS.i + 1, 1), SS.left); }
}
function ssPause(on) { if (!SS.el || SS.held === on) return; SS.held = on; ssTime(false); } // hold to pause; let go to carry on
function ssPlayVid(slideEl, v) {
  const f = slideEl.querySelector('.vframe'); if (!f || f.querySelector('iframe')) return;
  f.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(v.v)}?autoplay=1&playsinline=1&rel=0&modestbranding=1" title="${esc(v.t)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
  SS.autoVid = true; SS.playing = false; ssTime(false);
}
function ssBind(el) {
  const stage = el.querySelector('.ssstage');
  let sx = 0, sy = 0, st = 0, hold = 0, moved = false, down = false;
  stage.addEventListener('pointerdown', e => {
    if (e.target.closest('a,button,iframe,.vframe')) return;
    down = true; moved = false; sx = e.clientX; sy = e.clientY; st = performance.now();
    if (!SS.wide) hold = setTimeout(() => ssPause(true), 220);
  });
  stage.addEventListener('pointermove', e => { if (down && (Math.abs(e.clientX - sx) > 12 || Math.abs(e.clientY - sy) > 12)) moved = true; });
  const up = e => {
    if (!down) return; down = false; clearTimeout(hold);
    const dx = e.clientX - sx, dy = e.clientY - sy, wasHeld = SS.held;
    if (wasHeld) { ssPause(false); if (!moved) return; }
    if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) { ssShow(SS.i + (dx < 0 ? 1 : -1), dx < 0 ? 1 : -1); return; }
    if (dy > 90 && Math.abs(dy) > Math.abs(dx) && !SS.wide) { closeShow(); return; }
    if (moved || performance.now() - st > 600) return;
    if (e.target.closest('a,button,iframe,.vframe')) return;
    const r = stage.getBoundingClientRect();
    if (SS.wide) { if (e.target.closest('.slmedia')) ssShow(SS.i + 1, 1); return; }
    ssShow(SS.i + (e.clientX - r.left < r.width * 0.3 ? -1 : 1), e.clientX - r.left < r.width * 0.3 ? -1 : 1);
  };
  stage.addEventListener('pointerup', up);
  stage.addEventListener('pointercancel', () => { down = false; clearTimeout(hold); ssPause(false); });
  stage.addEventListener('contextmenu', e => { if (!SS.wide) e.preventDefault(); });
}
function ssAction(a) {
  if (!SS.el) return;
  if (a === 'close') return closeShow();
  if (a === 'next') return ssShow(SS.i + 1, 1);
  if (a === 'prev') return ssShow(SS.i - 1, -1);
  if (a === 'play') { SS.playing = !SS.playing; if (SS.playing && SS.i >= SS.show.slides.length) return ssShow(0, 1); ssTime(false); return; }
  if (a === 'layout') { P.ssLayout = SS.wide ? 'tall' : 'wide'; save(); ssHalt(); const s = SS.show, i = Math.min(SS.i, s.slides.length - 1); SS.el.remove(); SS.el = null; openShow(s, i); return; }
  if (a === 'playvid') { const sl = SS.show.slides[SS.i]; if (sl.kind === 'video') ssPlayVid(SS.el.querySelector('.sl.cur'), sl.v); return; }
  if (a === 'vidof') { const sl = SS.show.slides[SS.i]; if (sl.vid) { const cur = SS.el.querySelector('.sl.cur'); const m = cur.querySelector('.slmedia'); m.innerHTML = `<div class="vframe" data-v="${esc(sl.vid.v)}"></div>`; cur.classList.add('video'); ssPlayVid(cur, sl.vid); } }
}
document.addEventListener('keydown', e => {
  if (!SS.el || document.body.classList.contains('dopen')) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); ssShow(SS.i + 1, 1); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); ssShow(SS.i - 1, -1); }
  else if (e.key === ' ' || e.key === 'k') { if (!/INPUT|TEXTAREA|BUTTON|A/.test(document.activeElement.tagName) || document.activeElement === SS.el) { e.preventDefault(); ssAction('play'); } }
  else if (e.key === 'Escape') { e.stopImmediatePropagation(); closeShow(); }
  else if (e.key === 'Home') ssShow(0, -1);
  else if (e.key === 'End') ssShow(SS.show.slides.length - 1, 1);
}, true);
document.addEventListener('visibilitychange', () => { if (SS.el) { if (document.visibilityState !== 'visible') ssPause(true); else ssPause(false); } });

function deskBanner(k) {
  const shows = allShows(), s = shows.find(x => x.desk === k), vs = VIDS().filter(v => v.c === k);
  if (!s && !vs.length) return '';
  return `<div class="ssban">${s ? `<button type="button" data-show="${esc(s.id)}"><img src="${esc(coverImg(s))}" alt="" referrerpolicy="no-referrer">${esc(s.title)} · ${s.slides.length}</button>` : ''}${vs.length ? `<button type="button" data-show="vids-${esc(k)}"><img src="${esc(ytThumb(vs[0].v, 'mqdefault'))}" alt="" referrerpolicy="no-referrer">▶ ${vs.length} video${vs.length > 1 ? 's' : ''}</button>` : ''}</div>`;
}
function frontReport() {
  const a = ART && ART.articles && ART.articles[0];
  if (!a || Date.now() - new Date(a.written) > 4 * 864e5) return '';
  return `<section class="wrap repfront"><h2 class="sec-h">Today’s report</h2>${reportCard(a, true)}<p class="note"><a href="#/reports">All reports</a></p></section>`;
}

/* ================= loading ================= */
async function loadLatest(scrollTop) {
  try {
    const [ed, mk, art, md] = await Promise.all([getJSON('data/edition.json'), getJSON('data/markets.json').catch(() => null), getJSON('articles/index.json').catch(() => null), getJSON('data/media.json').catch(() => null)]);
    if (md && md.v) MEDIA = md;
    MK = mk && mk.board ? mk : null;
    if (art && art.articles) ART = art;
    LATEST = { id: ed.id, at: ed.at, archive: ed.archive };
    useEdition(ed, false);
    render(!scrollTop);
  } catch (err) {
    $('#main').innerHTML = `<div class="wrap state"><h2>The paper didn’t arrive</h2><p>The edition couldn’t be loaded (${esc(err.message || err)}). Check your connection and try again.</p><button type="button" onclick="location.reload()">Try again</button></div>`;
    $('#edline').textContent = 'No edition loaded.';
  }
}
async function loadArchive(id) {
  if (LATEST && id === LATEST.id) { if (viewingArchive) loadLatest(true); return; }
  try {
    const ed = await getJSON('data/editions/' + id + '.json');
    useEdition(ed, true);
    go('#/'); render();
  } catch (e) { toast('That edition is no longer kept.'); }
}
async function poll() { // a new watch while the page is open
  if (!LATEST) return;
  try {
    const l = await getJSON('data/latest.json');
    if (l && l.id && l.id !== LATEST.id) {
      const t = $('#toast');
      t.className = 'toast on';
      t.innerHTML = `<span>The ${esc(l.label)} is out.</span><button type="button" id="loadNew">Read it</button>`;
      $('#loadNew').onclick = () => { t.className = 'toast'; loadLatest(true); };
      clearTimeout(toastT);
    }
  } catch (e) { /* try again next time */ }
}
setInterval(poll, 10 * 60000);
setInterval(() => { if (E) drawDial(); }, 60000);
applyTheme();
loadLatest(true);
})();
</script>
