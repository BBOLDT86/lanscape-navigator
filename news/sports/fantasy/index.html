  if (d.sg) { const box = t.closest('.sugg'); box.hidden = true; const inp = box.parentElement.querySelector('input'); if (box._pick) box._pick(d.sg); if (inp) inp.value = ''; return; }
  if (d.sgt) { t.closest('.sugg').hidden = true; $('#q').value = ''; go('#/nfl/' + d.sgt); return; }
  if (d.p && !t.matches('a[href]')) { e.preventDefault(); openPlayer(d.p); return; }
  if (d.game) { showGame(d.game); return; }
  if ('close' in d) { closeDrawer(); return; }
  if (d.go) { if (d.go.startsWith('../')) location.href = d.go; else go(d.go); return; }
  if (d.mine) { const i = P.roster.indexOf(d.mine); if (i >= 0) P.roster.splice(i, 1); else P.roster.push(d.mine); save(); toast(i >= 0 ? 'Removed from your team' : 'Added to your team'); lastMain = null; route(); return; }
  if (d.watch) { if (P.watch[d.watch]) delete P.watch[d.watch]; else P.watch[d.watch] = Date.now(); save(); route(); showPlayer(BY[d.watch]); return; }
  if (d.cmp) { const i = P.cmp.indexOf(d.cmp); if (i >= 0) P.cmp.splice(i, 1); else { P.cmp.push(d.cmp); if (P.cmp.length > 4) P.cmp.shift(); } save(); renderTray(); showPlayer(BY[d.cmp]); return; }
  if ('cmpclear' in d) { P.cmp = []; save(); renderTray(); return; }
  if (d.pv) { PS.v = d.pv; if (d.pv !== 'passing' && PS.pos === 'QB' && PS.v !== 'fantasy') PS.pos = 'ALL'; PS.sort = PV[PS.v][1].find(c => c[2])[0]; PS.dir = -1; vPlayers(); return; }
  if (d.pp) { PS.pos = d.pp; if (PS.v === 'passing' && d.pp !== 'QB') PS.v = 'fantasy'; vPlayers(); return; }
  if (d.ps) { if (PS.sort === d.ps) PS.dir = -PS.dir; else { PS.sort = d.ps; PS.dir = -1; } vPlayers(); return; }
  if ('pn' in d) { PS.n = 2000; vPlayers(); return; }
  if (d.mk) { MS.k = d.mk; vMatchups(); return; }
  if (d.msort) { MS.sort = d.msort; vMatchups(); return; }
  if (d.mpos) { MS.pos = d.mpos; vMatchups(); return; }
  if (d.trm) { const [k, id] = d.trm.split(':'); const T = tradeState(); T[k] = T[k].filter(x => x !== id); save(); vTrade(); return; }
  if (d.rrm) { P.roster = P.roster.filter(x => x !== d.rrm); save(); lastMain = null; route(); return; }
  if ('clearroster' in d) { if (confirm('Clear your roster from this browser?')) { P.roster = []; save(); lastMain = null; route(); } return; }
  if ('parse' in d) { const got = parseRoster($('#paste').value); $('#parsed').innerHTML = got.length ? `<p class="note">Found ${plural(got.length, 'player')}:</p><div class="side">${got.map(q => `<div class="pick">${pname(q, { face: false })}<span class="faint">${q.p}</span><span></span></div>`).join('')}</div><p style="margin-top:10px"><button class="btn pri" type="button" data-addparsed="${esc(got.map(q => q.id).join(','))}">Use these as my roster</button></p>` : '<p class="note">No players found. Try copying the whole team page, or type one name per line.</p>'; return; }
  if (d.addparsed) { P.roster = d.addparsed.split(',').filter(id => BY[id]); save(); toast(`Your roster: ${P.roster.length} players`); lastMain = null; route(); return; }
  if ('sleeper' in d) { const u = $('#slUser').value.trim(); if (u) sleeperImport(u); return; }
  if (d.sllg) { sleeperLeague(d.sllg, d.slu); return; }
  if (d.fromp) { P.custom = Object.assign({}, BASE, PRESETS[d.fromp][1]); vScoringFill(P.custom); return; }
  if ('savesc' in d) { const c = Object.assign({}, BASE); for (const el of $$('[data-sf]')) c[el.dataset.sf] = +el.value || 0; c.dpa = SC().dpa.map((x, i) => [x[0], +($(`[data-dpa="${i}"]`).value) || 0]); P.custom = c; P.sc = 'custom'; save(); fillScoring(); toast('Custom scoring saved'); rerender(); return; }
  if (d.ans) { const [i, j] = d.ans.split(':').map(Number); answer(i, j); return; }
  if ('bt' in d) { runBacktest(); return; }
  if ('newquiz' in d) { vQuiz(); window.scrollTo(0, 0); return; }
  if ('flip' in d || t.closest('[data-flip]')) { CARD.flip = !CARD.flip; vCards(); return; }
  if (d.card) { const b = P.study.cards[CARD.t] || 1; P.study.cards[CARD.t] = d.card === 'ok' ? Math.min(5, b + 1) : 1; save(); CARD = null; vCards(); return; }
  if (d.ns) { NS = d.ns; vNews(); return; }
  if (t.id === 'themeBtn' || t.closest('#themeBtn')) { cycleTheme(); return; }
});
function vScoringFill(c) { for (const el of $$('[data-sf]')) el.value = c[el.dataset.sf]; c.dpa.forEach((x, i) => { const el = $(`[data-dpa="${i}"]`); if (el) el.value = x[1]; }); }
document.addEventListener('change', e => {
  const t = e.target, d = t.dataset;
  if (t.id === 'scoring') { if (t.value === 'custom' && !P.custom) { P.custom = Object.assign({}, SC()); } P.sc = t.value; save(); rerender(); if (t.value === 'custom' && view.t !== 'scoring') go('#/scoring'); return; }
  if ('pt' in d) { PS.team = t.value; vPlayers(); return; }
  if ('pm' in d) { PS.min = +t.value; vPlayers(); return; }
  if ('pa' in d && t.type === 'checkbox') { PS.avail = t.checked; vPlayers(); return; }
  if ('own' in d) { P.own = +t.value; save(); vWaivers(); return; }
  if (d.lg) { P.league[d.lg] = +t.value; save(); rerender(); return; }
  if (d.slot) { P.league.slots[d.slot] = +t.value; save(); rerender(); return; }
  if (d.hw) { const w = WK.study; P.study.hw = { [w]: Object.assign({}, P.study.hw[w] || {}, { [d.hw]: t.checked }) }; save(); vHomework(); return; }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') { suggest(t, id => openPlayer(id)); return; }
  if (t.matches('[data-pq]')) { PS.q = t.value; clearTimeout(vPlayers.t); vPlayers.t = setTimeout(() => { vPlayers(); const el = $('[data-pq]'); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }, 200); return; }
  if (t.classList.contains('tq')) {
    const side = t.dataset.side;
    suggest(t, id => { if (side === 'roster') { if (!P.roster.includes(id)) P.roster.push(id); save(); lastMain = null; route(); } else { const T = tradeState(); if (!T[side].includes(id)) T[side].push(id); save(); vTrade(); } });
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if ($('#drawer').classList.contains('on')) closeDrawer(); $$('.sugg').forEach(b => { b.hidden = true; }); return; }
  const inp = e.target; if (!(inp.id === 'q' || (inp.classList && inp.classList.contains('tq')))) return;
  const box = inp.parentElement.querySelector('.sugg'); if (!box || box.hidden) return;
  const items = $$('button', box), i = items.findIndex(b => b.classList.contains('on'));
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); const j = clamp(i + (e.key === 'ArrowDown' ? 1 : -1), 0, items.length - 1); items.forEach((b, k) => b.classList.toggle('on', k === j)); }
  if (e.key === 'Enter' && items[i]) { e.preventDefault(); items[i].click(); }
});
$('#scrim').addEventListener('click', closeDrawer);
window.addEventListener('hashchange', route);
window.addEventListener('popstate', route);
// hover tips: every mark carries its own (data-tip); on touch, a tap shows it for a moment
(function tips() {
  const tip = $('#tip'); let cur = null;
  const show = (el, x, y) => { const s = el.getAttribute('data-tip'); if (!s) return; if (el.dataset.html) tip.innerHTML = s; else tip.textContent = s; tip.classList.add('on'); place(x, y); cur = el; };
  const place = (x, y) => { const r = tip.getBoundingClientRect(); let L = x + 14, T = y + 14; if (L + r.width > innerWidth - 8) L = x - r.width - 14; if (T + r.height > innerHeight - 8) T = y - r.height - 14; tip.style.left = Math.max(8, L) + 'px'; tip.style.top = Math.max(8, T) + 'px'; };
  document.addEventListener('mouseover', e => { const el = e.target.closest('[data-tip]'); if (el && el !== cur) show(el, e.clientX, e.clientY); else if (!el && cur) { tip.classList.remove('on'); cur = null; } });
  document.addEventListener('mousemove', e => { if (cur) place(e.clientX, e.clientY); });
  document.addEventListener('focusin', e => { const el = e.target.closest('[data-tip]'); if (el) { const r = el.getBoundingClientRect(); show(el, r.left, r.bottom); } });
  document.addEventListener('touchstart', e => { const el = e.target.closest('[data-tip]'); if (el) { const t = e.touches[0]; show(el, t.clientX, t.clientY - 60); clearTimeout(tips.t); tips.t = setTimeout(() => { tip.classList.remove('on'); cur = null; }, 2600); } }, { passive: true });
})();

/* ================= theme: shared with The Watch ================= */
function cycleTheme() {
  let w = {}; try { w = JSON.parse(localStorage.getItem('watch.v1') || '{}') || {}; } catch (e) { /* none */ }
  w.theme = { auto: 'day', day: 'night', night: 'auto' }[w.theme || 'auto'] || 'auto';
  if (!w.v) Object.assign(w, { v: 1, sec: {}, src: {}, kw: {}, follow: {}, mute: { kw: {}, src: {} }, read: {}, seen: {}, last: 0, t: Date.now(), n: 0, pending: null });
  try { localStorage.setItem('watch.v1', JSON.stringify(w)); } catch (e) { /* private mode */ }
  applyTheme(w.theme);
}
function applyTheme(t) {
  if (!t) { try { t = (JSON.parse(localStorage.getItem('watch.v1') || '{}') || {}).theme || 'auto'; } catch (e) { t = 'auto'; } }
  $('#themeLbl').textContent = { auto: 'Auto', day: 'Day', night: 'Night' }[t];
  if (t === 'auto') { const h = +new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', hour: 'numeric', hourCycle: 'h23' }).format(new Date()); t = (h >= 20 || h < 4) ? 'night' : (matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'day'); }
  document.documentElement.dataset.theme = t;
}

/* ================= live scores: ESPN's public scoreboard, when it answers this browser ================= */
const ESPN_T = { WSH: 'WAS', LAR: 'LA', JAC: 'JAX' };
async function liveScores() {
  const games = liveRemaining(); if (!games.length || document.visibilityState !== 'visible') return;
  const soon = games.some(g => Date.parse(g.k) - Date.now() < 3 * 36e5); if (!soon) return;
  try {
    const j = await (await fetch('https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard')).json();
    let any = false;
    for (const ev of j.events || []) {
      const c = ev.competitions && ev.competitions[0]; if (!c) continue;
      const tm = x => { const a = x.team.abbreviation; return ESPN_T[a] || a; };
      const home = c.competitors.find(x => x.homeAway === 'home'), away = c.competitors.find(x => x.homeAway === 'away');
      const g = games.find(z => z.h === tm(home) && z.a === tm(away)); if (!g) continue;
      const st = ev.status && ev.status.type, tv = (c.broadcasts || []).flatMap(b => b.names || []).join(', ');
      const el = $(`[data-live="${g.id}"]`);
      if (el) el.innerHTML = st && st.state !== 'pre' ? `<b style="color:var(--ink)">${away.score}–${home.score}</b> · ${esc(st.shortDetail || '')}${tv ? ' · ' + esc(tv) : ''}` : `${esc(kickTxt(g))}${tv ? ' · ' + esc(tv) : ''}`;
      if (st && st.state === 'in') any = true;
    }
    clearTimeout(liveScores.t); liveScores.t = setTimeout(liveScores, any ? 60000 : 300000);
  } catch (e) { /* the page works without it */ }
}

/* ================= boot ================= */
function fillScoring() { $('#scoring').innerHTML = Object.entries(PRESETS).map(([k, [l]]) => `<option value="${k}"${k === P.sc ? ' selected' : ''}>${esc(l)}</option>`).join(''); }
function renderFoot() {
  const src = `<a href="https://github.com/nflverse" target="_blank" rel="noopener">nflverse</a> (play-by-play, stats, snaps, injuries, rosters, depth charts and the schedule with Vegas lines; CC-BY 4.0), <a href="https://github.com/ffverse/ffopportunity" target="_blank" rel="noopener">ffverse ffopportunity</a> (expected points), <a href="https://github.com/dynastyprocess/data" target="_blank" rel="noopener">DynastyProcess</a> (FantasyPros expert consensus, rostered shares and dynasty values)${D.sleeper ? ', <a href="https://docs.sleeper.com" target="_blank" rel="noopener">Sleeper</a> (trending players and projections)' : ''}, Open-Meteo (forecasts) and ESPN's scoreboard (live scores)`;
  $('#foot').innerHTML = `<p><b>Film Room</b> is part of <a href="../../">The Watch</a>. Data from ${src}. The updater reads them through the day; this copy was built ${esc(fmtDay.format(new Date(D.at)))} at ${esc(fmtTime.format(new Date(D.at)))} ET${D.ecr && D.ecr.weekly ? `, with consensus ranks from ${esc(D.ecr.weekly)}` : ''}.</p>
    <p>Projections, matchups, tiers, replacement levels and every verdict here are Film Room's own math on that public data, described in the <a href="#/study/projections">Study hall</a>. They are a starting point, not advice, and nothing here is affiliated with the NFL, its teams, Yahoo, ESPN, Sleeper or FantasyPros. Your settings, roster and progress stay in this browser.</p>
    ${D.errors && D.errors.length ? `<p class="faint">Sources that didn't answer the last update: ${esc(D.errors.map(x => x.split(':')[0]).filter((v, i, a) => a.indexOf(v) === i).join(', '))}.</p>` : ''}`;
}
async function load(quiet) {
  const r = await fetch('data/film.json', { cache: 'no-cache' });
  if (!r.ok) throw new Error('film.json ' + r.status);
  D = await r.json();
  index(); compute();
  if (!quiet) { fillScoring(); applyTheme(); }
  renderEd(); renderFoot(); lastMain = null; route();
  liveScores();
}
async function poll() { // a new copy of the data lands with each update
  try { const j = await (await fetch('data/latest.json', { cache: 'no-cache' })).json(); if (D && j.at && j.at !== D.at) { await load(true); toast('Film Room updated'); } } catch (e) { /* try again later */ }
}
load().catch(e => { $('#main').innerHTML = `<div class="empty">Film Room's data didn't load (${esc(e.message)}). Try again in a minute.</div>`; console.error(e); });
setInterval(poll, 10 * 60000);
setInterval(() => { if (D) { const n = weeksNow(); if (n.study !== WK.study || n.live !== WK.live) { WK = n; rerender(); } } }, 5 * 60000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && D) { poll(); liveScores(); } });
</script>
