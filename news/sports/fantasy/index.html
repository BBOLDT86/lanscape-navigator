<script>
// The Watch's paper (day, night, or follow the watch), read from its own setting so the two pages match
(function(){try{var p=JSON.parse(localStorage.getItem('watch.v1')||'{}');var t=p.theme||'auto';var h=+new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',hour:'numeric',hourCycle:'h23'}).format(new Date());
if(t==='auto'){t=(h>=20||h<4)?'night':(matchMedia('(prefers-color-scheme: dark)').matches?'night':'day')}document.documentElement.dataset.theme=t;}catch(e){}})();
</script>
<style>
:root{
  --paper:#F5F7F6; --raise:#FFFFFF; --ink:#15243B; --ink-2:#465770; --ink-3:#7A889A; --rule:rgba(21,36,59,.12); --rule-2:rgba(21,36,59,.2);
  --shoal:#D7E7EC; --shoal-2:#C3DAE2; --brass:#A9852F; --brass-ink:#7A5E1C; --signal:#C2412D; --scrim:rgba(14,26,43,.42);
  --serif:'Instrument Serif','Iowan Old Style',Georgia,serif;
  --sans:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  /* data: categorical slots in fixed order, a one-hue sequential ramp, a blue<->red diverging pair */
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
  --q0:#EEF2F1; --q1:#d6e6fa; --q2:#9ec5f4; --q3:#5598e7; --q4:#256abf; --q5:#104281;
  --g3:#256abf; --g2:#6da7ec; --g1:#c3dbf7; --n0:#E9EDEC; --r1:#f5cdcc; --r2:#e88b8a; --r3:#c43a3a;
  --good:#0ca30c; --warn:#fab219; --bad:#d03b3b;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="day"]){
    --paper:#0E1A2B; --raise:#142539; --ink:#E7EDF4; --ink-2:#AEBBCB; --ink-3:#8494A9; --rule:rgba(231,237,244,.12); --rule-2:rgba(231,237,244,.22);
    --shoal:#12293F; --shoal-2:#1A3A55; --brass:#D6B25E; --brass-ink:#E3C47E; --signal:#E8705A; --scrim:rgba(4,9,16,.6);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
    --q0:#132438; --q1:#17304d; --q2:#1c4677; --q3:#256abf; --q4:#3987e5; --q5:#86b6ef;
    --g3:#3987e5; --g2:#245a9c; --g1:#1f4672; --n0:#223349; --r1:#5a2a33; --r2:#8a3a3f; --r3:#e66767; color-scheme:dark;
  }
}
:root[data-theme="night"]{
  --paper:#0E1A2B; --raise:#142539; --ink:#E7EDF4; --ink-2:#AEBBCB; --ink-3:#8494A9; --rule:rgba(231,237,244,.12); --rule-2:rgba(231,237,244,.22);
  --shoal:#12293F; --shoal-2:#1A3A55; --brass:#D6B25E; --brass-ink:#E3C47E; --signal:#E8705A; --scrim:rgba(4,9,16,.6);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --q0:#132438; --q1:#17304d; --q2:#1c4677; --q3:#256abf; --q4:#3987e5; --q5:#86b6ef;
  --g3:#3987e5; --g2:#245a9c; --g1:#1f4672; --n0:#223349; --r1:#5a2a33; --r2:#8a3a3f; --r3:#e66767; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:64px}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.5 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-variant-numeric:tabular-nums}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:3px}
img{display:block}
.wrap{max-width:1240px;margin:0 auto;padding:0 32px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)} .num{text-align:right;white-space:nowrap}
.k{font:700 12px/1.3 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--brass-ink)}

/* ---------- masthead */
.top{display:flex;align-items:center;gap:10px;padding-top:14px;font:600 14px var(--sans);color:var(--ink-2)}
.top a{text-decoration:none}.top a:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.mast{display:flex;align-items:flex-end;gap:24px;padding-top:8px;padding-bottom:16px}
.brand h1{font:400 64px/.9 var(--serif);letter-spacing:-.012em;margin:0;display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 16px}
.brand h1 i{font-style:italic;color:var(--brass-ink);font-size:30px;letter-spacing:0}
.brand .ed{margin:8px 0 0;font:500 15px/1.45 var(--sans);color:var(--ink-2)}
.brand .ed b{color:var(--ink);font-weight:600}
.tools{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.search{position:relative}
.search input{width:240px;font:500 15px var(--sans);background:var(--raise);border:1px solid var(--rule);border-radius:999px;padding:9px 14px 9px 36px}
.search input::placeholder{color:var(--ink-3)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--ink-3)}
.sugg{position:absolute;right:0;top:calc(100% + 6px);z-index:40;width:340px;max-height:60vh;overflow:auto;background:var(--raise);border:1px solid var(--rule);border-radius:12px;box-shadow:0 18px 50px rgba(14,26,43,.22);padding:6px}
.sugg button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;border-radius:8px;padding:8px 10px;text-align:left}
.sugg button:hover,.sugg button.on{background:var(--shoal)}
.tbtn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--rule);background:var(--raise);border-radius:999px;padding:8px 13px;font:600 14px var(--sans)}
.tbtn:hover{border-color:var(--ink-3)}
.tbtn svg{width:16px;height:16px}
.tbtn select{border:0;background:none;font:600 14px var(--sans);padding:0;appearance:none;-webkit-appearance:none;cursor:pointer}

/* ---------- tabs */
.bar{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
.bar .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.bar .wrap::-webkit-scrollbar{display:none}
.bar a{flex:none;text-decoration:none;padding:13px 11px 11px;font:600 15px var(--sans);color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px}
.bar a:hover{color:var(--ink)}
.bar a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--brass)}
.bar a.mine{color:var(--brass-ink)}

/* ---------- page furniture */
main{padding-top:26px;padding-bottom:60px;min-height:60vh}
.ph{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:18px}
.ph h2{font:400 44px/1 var(--serif);margin:0;letter-spacing:-.005em}
.ph .sub{margin:6px 0 0;color:var(--ink-2);font-size:15.5px;max-width:72ch}
.ph .ctl{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
h3.sh{font:400 28px/1.1 var(--serif);margin:34px 0 4px}
h3.sh + .sub{margin:0 0 14px;color:var(--ink-2);font-size:15px;max-width:76ch}
.card{background:var(--raise);border:1px solid var(--rule);border-radius:12px;padding:16px 18px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,4fr);gap:34px}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:999px;padding:3px;background:var(--raise);flex-wrap:wrap}
.seg button,.seg a{border:0;background:none;border-radius:999px;padding:6px 12px;font:600 14px var(--sans);color:var(--ink-2);text-decoration:none}
.seg button[aria-pressed="true"],.seg a[aria-current="true"]{background:var(--ink);color:var(--paper)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule-2);background:var(--raise);border-radius:999px;padding:7px 14px;font:600 14px var(--sans);text-decoration:none}
.btn:hover{border-color:var(--ink-3)}
.btn.pri{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.sm{padding:4px 10px;font-size:13px}
.lnk{border:0;background:none;padding:0;font:inherit;color:var(--ink);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;cursor:pointer}
input.fld,select.fld,textarea.fld{border:1px solid var(--rule-2);background:var(--raise);border-radius:8px;padding:7px 10px;font:500 15px var(--sans)}
textarea.fld{width:100%;min-height:150px;resize:vertical;font:500 14px/1.45 var(--sans)}
label.f{display:flex;flex-direction:column;gap:4px;font:600 13px var(--sans);color:var(--ink-2)}
.note{font-size:14px;color:var(--ink-2);margin:10px 0 0;max-width:80ch}
.empty{padding:28px;text-align:center;color:var(--ink-2);border:1px dashed var(--rule-2);border-radius:12px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 8px;font:700 11.5px/1.6 var(--sans);letter-spacing:.03em;white-space:nowrap;border:1px solid var(--rule-2);color:var(--ink-2)}
.pill.q{border-color:transparent;background:rgba(250,178,25,.22);color:var(--ink)}
.pill.o{border-color:transparent;background:rgba(208,59,59,.18);color:var(--ink)}
.pill.ir{border-color:transparent;background:rgba(208,59,59,.28);color:var(--ink)}
.pill.up{border-color:transparent;background:rgba(12,163,12,.16);color:var(--ink)}
.pill.bye{border-style:dashed}
.pill.new{border-color:transparent;background:var(--shoal);color:var(--ink)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}

/* team chip: the team's colour as a stripe, the letters in ink */
.tm{display:inline-flex;align-items:center;gap:5px;font:700 12.5px var(--sans);letter-spacing:.03em;white-space:nowrap}
.tm::before{content:"";width:4px;height:13px;border-radius:2px;background:var(--tc,#888)}
a.tm,button.tm{border:0;background:none;padding:0;text-decoration:none;cursor:pointer;color:inherit}
a.tm:hover,button.tm:hover{text-decoration:underline;text-underline-offset:3px}
.pos{display:inline-block;min-width:26px;text-align:center;border-radius:5px;padding:0 4px;font:700 11.5px/1.65 var(--sans);letter-spacing:.03em;color:var(--ink);background:var(--shoal)}

/* player name cell */
.pn{display:flex;align-items:center;gap:10px;min-width:0}
.pn img,.pn .ph0{width:34px;height:34px;border-radius:50%;object-fit:cover;object-position:top;background:var(--shoal);flex:none}
.pn .nm{min-width:0}
.pn .nm b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.pn .nm b button{border:0;background:none;padding:0;font:inherit;cursor:pointer;text-align:left}
.pn .nm b button:hover{text-decoration:underline;text-underline-offset:3px}
.pn .nm span{display:flex;gap:6px;align-items:center;font:500 12.5px var(--sans);color:var(--ink-2)}

/* ---------- tables */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--rule);border-radius:12px;background:var(--raise)}
table.t{width:100%;border-collapse:collapse;font-size:14.5px}
table.t th{position:sticky;top:0;background:var(--raise);z-index:1;text-align:left;font:700 12px/1.25 var(--sans);letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);padding:10px 10px;border-bottom:1px solid var(--rule-2);white-space:nowrap}
table.t th.num{text-align:right}
table.t th button{border:0;background:none;padding:0;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;cursor:pointer}
table.t th button[aria-sort]::after{content:" ↓";color:var(--brass-ink)}
table.t th button[aria-sort="ascending"]::after{content:" ↑"}
table.t td{padding:8px 10px;border-bottom:1px solid var(--rule);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t tbody tr:hover td{background:color-mix(in srgb,var(--shoal) 45%,transparent)}
table.t tr.tier td{background:var(--paper);font:700 12px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--brass-ink);padding:6px 10px}
table.t tr.mine td:first-child{box-shadow:inset 3px 0 0 var(--brass)}
table.t td.rk{color:var(--ink-3);font-weight:600;width:1%}
table.t .big{font-weight:700;font-size:15.5px}
table.t.compact td{padding:6px 9px}

/* heat cells: diverging (blue = good for the offense, red = tough), always with the number on it */
.hc{display:inline-flex;align-items:center;justify-content:center;min-width:44px;border-radius:6px;padding:2px 6px;font:600 13px/1.5 var(--sans);color:var(--ink)}
.hc.g3{background:var(--g3);color:#fff}.hc.g2{background:var(--g2)}.hc.g1{background:var(--g1)}.hc.n0{background:var(--n0)}
.hc.r1{background:var(--r1)}.hc.r2{background:var(--r2)}.hc.r3{background:var(--r3);color:#fff}
.hc.bye{background:none;border:1px dashed var(--rule-2);color:var(--ink-3)}
:root[data-theme="night"] .hc.g2{color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="day"]) .hc.g2{color:#fff}}
/* weekly strip: sequential, one hue */
.strip{display:flex;gap:2px}
.strip i{display:inline-flex;align-items:center;justify-content:center;width:26px;height:22px;border-radius:4px;font:600 11px var(--sans);font-style:normal;background:var(--q0);color:var(--ink)}
.strip i.q1{background:var(--q1)}.strip i.q2{background:var(--q2)}.strip i.q3{background:var(--q3);color:#fff}.strip i.q4{background:var(--q4);color:#fff}.strip i.q5{background:var(--q5);color:#fff}
.strip i.b{background:none;border:1px dashed var(--rule-2);color:var(--ink-3)}
.strip i.x{background:none;color:var(--ink-3)}
:root[data-theme="night"] .strip i.q5{color:#0E1A2B}
@media (prefers-color-scheme:dark){:root:not([data-theme="day"]) .strip i.q5{color:#0E1A2B}}
/* a range bar: floor to ceiling, with the projection marked */
.rng{position:relative;width:96px;height:8px;border-radius:4px;background:var(--q0);display:inline-block;vertical-align:middle}
.rng b{position:absolute;top:0;bottom:0;border-radius:4px;background:var(--q2)}
.rng i{position:absolute;top:-3px;width:3px;height:14px;border-radius:2px;background:var(--ink)}
.meter{height:6px;border-radius:3px;background:var(--q0);overflow:hidden}
.meter b{display:block;height:100%;background:var(--s1);border-radius:3px}

/* ---------- board */
.hero{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,4fr);gap:30px;align-items:start}
.lede h2{font:400 clamp(34px,4.3vw,54px)/1.03 var(--serif);margin:0 0 10px;letter-spacing:-.006em;max-width:20ch}
.lede p{margin:0;font-size:17.5px;line-height:1.5;color:var(--ink-2);max-width:62ch}
.cd{display:flex;gap:16px;margin-top:18px;flex-wrap:wrap}
.cd div{background:var(--raise);border:1px solid var(--rule);border-radius:12px;padding:10px 14px;min-width:120px}
.cd b{display:block;font:400 34px/1 var(--serif)}
.cd span{font:600 12.5px var(--sans);color:var(--ink-2)}
.live{border:1px solid var(--rule);border-radius:12px;background:var(--raise);padding:14px 16px}
.live h4{margin:0 0 8px;font:700 12px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--signal);display:flex;gap:8px;align-items:center}
.live h4::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--signal)}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.gm{background:var(--raise);border:1px solid var(--rule);border-radius:12px;padding:12px 14px;text-align:left;width:100%;cursor:pointer}
.gm:hover{border-color:var(--ink-3)}
.gm .wh{display:flex;justify-content:space-between;gap:8px;font:600 12.5px var(--sans);color:var(--ink-2);margin-bottom:8px}
.gm .wh span:last-child{white-space:nowrap;text-align:right}
.gm .row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:3px 0}
.gm .row .it{font:700 15px var(--sans)}
.gm .bar2{height:6px;border-radius:3px;background:var(--q0);width:70px;overflow:hidden}
.gm .bar2 b{display:block;height:100%;background:var(--s1)}
.gm .ft{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;font:500 12.5px var(--sans);color:var(--ink-2)}
.gm .sc{font:700 15px var(--sans)}
.five{counter-reset:five;display:grid;gap:12px}
.five .card{display:grid;grid-template-columns:34px minmax(0,1fr);gap:4px 12px}
.five .card::before{counter-increment:five;content:counter(five);grid-row:1 / span 3;font:400 34px/1 var(--serif);color:var(--brass)}
.five h4{margin:0;font:600 16.5px/1.35 var(--sans)}
.five p{margin:0;font-size:15px;color:var(--ink-2)}
.five .why{font:italic 400 16px/1.3 var(--serif);color:var(--brass-ink)}
.mini{display:grid;gap:0}
.mini .r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--rule)}
.mini .r:first-child{border-top:0}
.hl{display:block;padding:10px 0;border-top:1px solid var(--rule);text-decoration:none}
.hl:first-child{border-top:0}
.hl b{display:block;font:600 15.5px/1.35 var(--sans)}
.hl:hover b{text-decoration:underline;text-underline-offset:3px}
.hl span{font:500 12.5px var(--sans);color:var(--ink-2)}

/* ---------- drawer: the player card */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100vw);background:var(--paper);z-index:51;transform:translateX(102%);transition:transform .22s ease;overflow-y:auto;box-shadow:-20px 0 60px rgba(14,26,43,.25);overscroll-behavior:contain}
.drawer.on{transform:none}
.drawer .in{padding:20px 26px 60px}
.drawer .x{position:sticky;top:10px;float:right;z-index:3;width:38px;height:38px;border-radius:50%;border:1px solid var(--rule);background:var(--raise);font-size:20px;line-height:1}
.pc-h{display:flex;gap:16px;align-items:center;margin:4px 0 14px}
.pc-h img,.pc-h .ph0{width:84px;height:84px;border-radius:50%;object-fit:cover;object-position:top;background:var(--shoal);flex:none}
.pc-h h2{font:400 40px/1 var(--serif);margin:0}
.pc-h .m{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:6px;font:500 14px var(--sans);color:var(--ink-2);align-items:center}
.stat4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:12px 0}
.stat4 div{background:var(--raise);border:1px solid var(--rule);border-radius:10px;padding:10px 12px}
.stat4 b{display:block;font:400 30px/1.05 var(--serif)}
.stat4 span{font:600 12px var(--sans);color:var(--ink-2)}
.wkbox{border:1px solid var(--rule);border-radius:12px;background:var(--raise);padding:14px 16px;margin:10px 0}
.wkbox .l{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font:500 14.5px var(--sans);color:var(--ink-2)}
.wkbox .l b{color:var(--ink)}
.comp{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font:500 13.5px var(--sans);color:var(--ink-2)}
.comp b{color:var(--ink);font-weight:700}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .ax{stroke:var(--rule-2);stroke-width:1}
.chart .gl{stroke:var(--rule);stroke-width:1}
.chart text{font:500 11.5px var(--sans);fill:var(--ink-2)}
.chart text.v{font-weight:700;fill:var(--ink)}
.chart .bar{fill:var(--s1)}
.chart .bar.alt{fill:var(--q2)}
.chart .xp{stroke:var(--ink);stroke-width:2.5;stroke-linecap:round}
.chart .ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .pt{stroke:var(--raise);stroke-width:2}
.chart .hit{fill:transparent}
.chart .po{fill:var(--brass);opacity:.12}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font:600 12.5px var(--sans);color:var(--ink-2);margin:6px 0 0}
.leg span{display:inline-flex;align-items:center;gap:6px}
.leg i{width:12px;height:12px;border-radius:3px;display:inline-block}
.leg i.tick{height:3px;border-radius:2px;background:var(--ink)}
.tip{position:fixed;z-index:80;pointer-events:none;background:var(--ink);color:var(--paper);font:500 13px/1.4 var(--sans);padding:7px 10px;border-radius:8px;max-width:280px;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;transition:opacity .08s}
.tip.on{opacity:1}
.tip b{font-weight:700}

/* compare tray */
.tray{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:45;background:var(--ink);color:var(--paper);border-radius:999px;padding:6px 6px 6px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 12px 40px rgba(0,0,0,.3);font:600 14px var(--sans);max-width:calc(100vw - 24px)}
.tray .who{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tray button{border:0;border-radius:999px;padding:8px 14px;font:700 14px var(--sans);background:var(--brass);color:#15243B}
.tray button.cl{background:none;color:var(--paper);padding:8px 10px}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%) translateY(20px);z-index:90;background:var(--ink);color:var(--paper);border-radius:10px;padding:10px 16px;font:600 14px var(--sans);opacity:0;transition:.2s;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}

/* ---------- study hall */
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.lesson{display:flex;flex-direction:column;gap:6px;text-decoration:none;background:var(--raise);border:1px solid var(--rule);border-radius:12px;padding:16px 18px;position:relative}
.lesson:hover{border-color:var(--ink-3)}
.lesson h4{margin:0;font:400 24px/1.1 var(--serif)}
.lesson p{margin:0;font-size:14.5px;color:var(--ink-2)}
.lesson .st{position:absolute;top:14px;right:14px}
.prose{max-width:70ch;font-size:17px;line-height:1.62}
.prose p{margin:0 0 14px}
.prose h3{font:400 28px/1.15 var(--serif);margin:28px 0 8px}
.prose ul{padding-left:20px;margin:0 0 14px}
.prose li{margin:4px 0}
.prose .pull{font:italic 400 22px/1.35 var(--serif);color:var(--brass-ink);border-left:3px solid var(--brass);padding-left:16px;margin:18px 0}
.ex{margin:16px 0 22px}
.ex .cap{font:600 13px var(--sans);color:var(--ink-2);margin-top:8px}
.quiz .q{margin:18px 0;padding:16px 18px;background:var(--raise);border:1px solid var(--rule);border-radius:12px}
.quiz .q h4{margin:0 0 10px;font:600 17px/1.4 var(--sans)}
.quiz .opts{display:grid;gap:8px}
.quiz .opts button{text-align:left;border:1px solid var(--rule-2);background:var(--paper);border-radius:10px;padding:10px 14px;font:500 15.5px var(--sans)}
.quiz .opts button:hover:not([disabled]){border-color:var(--ink-3)}
.quiz .opts button.ok{border-color:var(--good);background:rgba(12,163,12,.12)}
.quiz .opts button.no{border-color:var(--bad);background:rgba(208,59,59,.1)}
.quiz .ans{margin:10px 0 0;font-size:15px;color:var(--ink-2)}
.quiz .ans b{color:var(--ink)}
.fc{perspective:1200px;max-width:560px;margin:10px auto}
.fc .face{min-height:260px;border-radius:16px;border:1px solid var(--rule);background:var(--raise);padding:28px;display:flex;flex-direction:column;justify-content:center;gap:10px;text-align:center;cursor:pointer}
.fc .face h4{margin:0;font:400 38px/1.1 var(--serif)}
.fc .face p{margin:0;font-size:17px;line-height:1.5;color:var(--ink-2)}
.hw{display:grid;gap:8px}
.hw label{display:grid;grid-template-columns:22px 130px minmax(0,1fr);gap:10px;align-items:start;padding:10px 12px;background:var(--raise);border:1px solid var(--rule);border-radius:10px;cursor:pointer}
.hw label b{font-weight:700}
.hw input{margin-top:4px;accent-color:var(--brass)}
.hw label.done{opacity:.6}
.hw label.done span{text-decoration:line-through}

/* ---------- my team */
.slot{display:grid;grid-template-columns:52px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:9px 12px;border-top:1px solid var(--rule)}
.slot:first-child{border-top:0}
.slot .sl{font:700 12px var(--sans);letter-spacing:.05em;color:var(--ink-2)}
.side{display:grid;gap:8px}
.side .pick{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--rule);border-radius:10px;background:var(--paper)}
.side .pick button{border:0;background:none;color:var(--ink-3);font-size:18px}
.verdict{font:400 30px/1.15 var(--serif);margin:0}

/* ---------- foot */
footer{border-top:1px solid var(--rule);padding:22px 0 50px;color:var(--ink-2);font-size:14px}
footer p{margin:0 0 8px;max-width:96ch}

@media (max-width:980px){
  .hero,.split{grid-template-columns:1fr}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:760px){
  .wrap{padding:0 16px}
  .mast{flex-direction:column;align-items:stretch;gap:12px}
  .brand h1{font-size:46px}
  .brand h1 i{font-size:24px}
  .tools{justify-content:flex-start}
  .search input{width:100%}
  .search{flex:1 1 100%}
  .sugg{width:100%}
  .ph h2{font-size:36px}
  .ph .ctl{margin-left:0}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .stat4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .drawer .in{padding:14px 16px 60px}
  .pc-h h2{font-size:32px}
  .hw label{grid-template-columns:22px minmax(0,1fr)}
  .hw label em{grid-column:2}
  .pn .nm b{max-width:150px}
  table.t{font-size:14px}
  .hm{display:none}
  .chart text{font-size:19px}
  .five .card{grid-template-columns:24px minmax(0,1fr)}
}
@media print{.bar,.tools,.tray,.drawer,.scrim{display:none}}
/* phones: a text field under 16px makes iPhone Safari zoom the page when it is tapped */
@media (pointer:coarse){input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=color]):not([type=file]),select,textarea{font-size:max(16px,1em)!important}}

<script>
'use strict';
/* =====================================================================================================================
   Film Room. Reads data/film.json (written by news/updater/fantasy.py from nflverse, ffverse, DynastyProcess and
   Sleeper) and does everything that depends on a scoring setting here, in the browser: fantasy points, expected
   points, matchups, projections, tiers, replacement level, the lineup and the trade math. The reader's settings,
   roster, watchlist and study progress live in this browser ('film.v1'); nothing is sent anywhere.
   ===================================================================================================================== */
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sum = a => { let s = 0; for (const x of a) s += x; return s; };
const avg = a => a.length ? sum(a) / a.length : 0;
const sdev = a => { if (a.length < 2) return 0; const m = avg(a); return Math.sqrt(sum(a.map(x => (x - m) ** 2)) / (a.length - 1)); };
const median = a => { if (!a.length) return 0; const b = [...a].sort((x, y) => x - y), h = b.length >> 1; return b.length % 2 ? b[h] : (b[h - 1] + b[h]) / 2; };
const f1 = v => v == null || !isFinite(v) ? '–' : (Math.round(v * 10) / 10).toFixed(1);
const f0 = v => v == null || !isFinite(v) ? '–' : String(Math.round(v));
const pc = (v, d = 0) => v == null || !isFinite(v) ? '–' : (v * 100).toFixed(d) + '%';
const sg = v => v == null || !isFinite(v) ? '–' : (v > 0 ? '+' : v < 0 ? '−' : '±') + Math.abs(Math.round(v * 10) / 10).toFixed(1);
const ord = n => n + (n % 100 >= 11 && n % 100 <= 13 ? 'th' : ['th', 'st', 'nd', 'rd'][n % 10] || 'th');
const plural = (n, a, b) => `${n} ${n === 1 ? a : (b || a + 's')}`;

const TEAMS = { ARI: ['Arizona', 'Cardinals', '#97233F'], ATL: ['Atlanta', 'Falcons', '#A71930'], BAL: ['Baltimore', 'Ravens', '#241773'], BUF: ['Buffalo', 'Bills', '#00338D'],
  CAR: ['Carolina', 'Panthers', '#0085CA'], CHI: ['Chicago', 'Bears', '#C83803'], CIN: ['Cincinnati', 'Bengals', '#FB4F14'], CLE: ['Cleveland', 'Browns', '#FF3C00'],
  DAL: ['Dallas', 'Cowboys', '#003594'], DEN: ['Denver', 'Broncos', '#FB4F14'], DET: ['Detroit', 'Lions', '#0076B6'], GB: ['Green Bay', 'Packers', '#203731'],
  HOU: ['Houston', 'Texans', '#A71930'], IND: ['Indianapolis', 'Colts', '#002C5F'], JAX: ['Jacksonville', 'Jaguars', '#006778'], KC: ['Kansas City', 'Chiefs', '#E31837'],
  LA: ['Los Angeles', 'Rams', '#003594'], LAC: ['Los Angeles', 'Chargers', '#0080C6'], LV: ['Las Vegas', 'Raiders', '#A5ACAF'], MIA: ['Miami', 'Dolphins', '#008E97'],
  MIN: ['Minnesota', 'Vikings', '#4F2683'], NE: ['New England', 'Patriots', '#002244'], NO: ['New Orleans', 'Saints', '#D3BC8D'], NYG: ['New York', 'Giants', '#0B2265'],
  NYJ: ['New York', 'Jets', '#125740'], PHI: ['Philadelphia', 'Eagles', '#004C54'], PIT: ['Pittsburgh', 'Steelers', '#FFB612'], SEA: ['Seattle', 'Seahawks', '#69BE28'],
  SF: ['San Francisco', '49ers', '#AA0000'], TB: ['Tampa Bay', 'Buccaneers', '#D50A0A'], TEN: ['Tennessee', 'Titans', '#4B92DB'], WAS: ['Washington', 'Commanders', '#5A1414'] };
const TEAM_ALIAS = { LAR: 'LA', JAC: 'JAX', WSH: 'WAS', KCC: 'KC', GBP: 'GB', NOS: 'NO', NEP: 'NE', TBB: 'TB', SFO: 'SF', LVR: 'LV', OAK: 'LV', SD: 'LAC', STL: 'LA' };
// open-air and retractable-roof stadiums, for the kickoff forecast (domes need none)
const STADIUMS = { "Levi's Stadium": [37.4033, -121.9694], 'Acrisure Stadium': [40.4468, -80.0158], 'Bank of America Stadium': [35.2258, -80.8528],
  'Empower Field at Mile High': [39.7439, -105.0201], 'EverBank Stadium': [30.3239, -81.6373], 'GEHA Field at Arrowhead Stadium': [39.0489, -94.4839],
  'Gillette Stadium': [42.0909, -71.2643], 'Hard Rock Stadium': [25.958, -80.2389], 'Highmark Stadium': [42.7765, -78.7869], 'Huntington Bank Field': [41.5061, -81.6995],
  'Lambeau Field': [44.5013, -88.0622], 'Lincoln Financial Field': [39.9008, -75.1675], 'Lumen Field': [47.5952, -122.3316], 'M&T Bank Stadium': [39.278, -76.6227],
  'MetLife Stadium': [40.8135, -74.0745], 'Nissan Stadium': [36.1665, -86.7713], 'Northwest Stadium': [38.9077, -76.8645], 'Paycor Stadium': [39.0955, -84.5161],
  'Raymond James Stadium': [27.9759, -82.5033], 'Soldier Field': [41.8623, -87.6167], 'Tottenham Hotspur Stadium': [51.6043, -0.0664], 'Wembley Stadium': [51.556, -0.2796],
  'Estadio Banorte': [19.3029, -99.1505], 'Maracana Stadium': [-22.9121, -43.2302], 'Stade de France': [48.9245, 2.3601], 'Melbourne Cricket Ground': [-37.82, 144.9834] };
const RETRACT = new Set(['AT&T Stadium', 'Lucas Oil Stadium', 'Mercedes-Benz Stadium', 'Reliant Stadium', 'NRG Stadium', 'State Farm Stadium', 'Bernabeu']);
const POS = ['QB', 'RB', 'WR', 'TE', 'K', 'DEF'];
const FLEXP = ['RB', 'WR', 'TE'];

/* ---------------- scoring ---------------- */
const BASE = { py: 0.04, ptd: 4, pint: -1, two: 2, ry: 0.1, rtd: 6, rec: 0.5, te: 0, cy: 0.1, ctd: 6, fl: -2, ret: 6,
  fg0: 3, fg4: 4, fg5: 5, xpm: 1, fgmiss: 0, xpmiss: 0, dsk: 1, dint: 2, dfr: 2, dtd: 6, dsf: 2, dblk: 2,
  dpa: [[0, 10], [6, 7], [13, 4], [20, 1], [27, 0], [34, -1], [999, -4]] };
const PRESETS = {
  half: ['Half-PPR (Yahoo default)', {}],
  ppr: ['PPR', { rec: 1 }],
  std: ['Standard (no PPR)', { rec: 0 }],
  espn: ['PPR, −2 per INT (ESPN)', { rec: 1, pint: -2 }],
  six: ['Half-PPR, 6-pt pass TD', { ptd: 6 }],
  tep: ['PPR + TE premium', { rec: 1, te: 0.5 }],
  custom: ['Custom…', {}],
};
const SCORE_FIELDS = [['py', 'Passing yard'], ['ptd', 'Passing TD'], ['pint', 'Interception'], ['ry', 'Rushing yard'], ['rtd', 'Rushing TD'],
  ['rec', 'Reception'], ['te', 'Extra per TE reception'], ['cy', 'Receiving yard'], ['ctd', 'Receiving TD'], ['fl', 'Fumble lost'], ['two', '2-pt conversion'],
  ['ret', 'Return TD'], ['fg0', 'FG 0–39'], ['fg4', 'FG 40–49'], ['fg5', 'FG 50+'], ['xpm', 'PAT made'], ['fgmiss', 'FG missed'], ['xpmiss', 'PAT missed'],
  ['dsk', 'DEF sack'], ['dint', 'DEF interception'], ['dfr', 'DEF fumble recovery'], ['dtd', 'DEF/ST touchdown'], ['dsf', 'DEF safety'], ['dblk', 'DEF blocked kick']];

/* ---------------- the reader's settings ---------------- */
const PKEY = 'film.v1';
function blankPrefs() {
  return { v: 1, sc: 'half', custom: null, league: { teams: 12, slots: { QB: 1, RB: 2, WR: 2, TE: 1, FLEX: 1, SF: 0, K: 1, DEF: 1, BN: 6 }, faab: 100, po: 15, poEnd: 17 },
    roster: [], watch: {}, cmp: [], own: 50, study: { les: {}, quiz: { best: 0, n: 0, last: null }, cards: {}, hw: {} } };
}
let P = blankPrefs();
try { const s = JSON.parse(localStorage.getItem(PKEY) || 'null'); if (s && s.v === 1) P = Object.assign(blankPrefs(), s, { league: Object.assign(blankPrefs().league, s.league || {}), study: Object.assign(blankPrefs().study, s.study || {}) }); } catch (e) { /* a fresh start */ }
function save() { try { localStorage.setItem(PKEY, JSON.stringify(P)); } catch (e) { /* private mode: settings last this visit */ } }
function SC() { return Object.assign({}, BASE, P.sc === 'custom' ? (P.custom || {}) : PRESETS[P.sc] ? PRESETS[P.sc][1] : {}); }
function scLabel() { return P.sc === 'custom' ? 'Custom scoring' : (PRESETS[P.sc] || PRESETS.half)[0]; }

/* ---------------- data ---------------- */
let D = null, PL = [], BY = {}, TW = {}, GW = {}, BYE = {}, WK = null, SCK = '', LIVE = { espn: null, at: 0 }, SLP = null;
const objOf = (fields, a) => { const o = {}; for (let i = 0; i < fields.length; i++) o[fields[i]] = a[i]; return o; };
function teamName(t) { return TEAMS[t] ? TEAMS[t][0] + ' ' + TEAMS[t][1] : t; }
function nick(t) { return TEAMS[t] ? TEAMS[t][1] : t; }
function otherTeam(g, t) { return g ? (g.h === t ? g.a : g.h) : null; }

function index() {
  PL = []; BY = {}; TW = {}; GW = {}; BYE = {};
  for (const g of D.games) {
    if (g.gt !== 'REG') continue;
    (GW[g.h] = GW[g.h] || {})[g.w] = g; (GW[g.a] = GW[g.a] || {})[g.w] = g;
  }
  const weeks = [...new Set(D.games.filter(g => g.gt === 'REG').map(g => g.w))].sort((a, b) => a - b);
  for (const t of Object.keys(TEAMS)) BYE[t] = weeks.find(w => !(GW[t] || {})[w]) || null;
  for (const [t, v] of Object.entries(D.teams)) TW[t] = v.o.map(a => objOf(D.fields.tw, a));
  for (const p of D.players) {
    const g = p.g.map(a => objOf(D.fields.pw, a));
    for (const r of g) { const gm = (GW[r.opp] || {})[r.w]; r.tm = otherTeam(gm, r.opp) || p.t; }
    const q = Object.assign({}, p, { g, kind: 'p' });
    PL.push(q); BY[q.id] = q;
  }
  for (const t of Object.keys(TEAMS)) {
    const td = D.teams[t] || { d: [] };
    const q = { id: 'DST:' + t, n: TEAMS[t][1] + ' D/ST', p: 'DEF', t, kind: 'd', g: td.d.map(a => Object.assign(objOf(D.fields.dw, a), { tm: t })), ecr: td.ecr, img: null, ids: {} };
    PL.push(q); BY[q.id] = q;
  }
  WK = weeksNow();
  SCK = '';
}
// the week to study and the week being played, worked out from the schedule and the clock (same rule as the updater)
function weeksNow(now = Date.now()) {
  const by = {};
  for (const g of D.games) if (g.gt === 'REG') (by[g.w] = by[g.w] || []).push(g);
  const wk = Object.keys(by).map(Number).sort((a, b) => a - b);
  let study = null, live = null, done = 0;
  for (const w of wk) {
    const ks = by[w].filter(g => g.k).map(g => ({ t: Date.parse(g.k), d: g.day }));
    const lock = Math.max(...(ks.filter(x => x.d !== 'Monday').map(x => x.t).concat(ks.length && ks.every(x => x.d === 'Monday') ? ks.map(x => x.t) : [])));
    if (study == null && lock > now) study = w;
    if (live == null && by[w].some(g => g.hs == null)) live = w;
    if (by[w].every(g => g.hs != null)) done = w;
  }
  const last = wk[wk.length - 1];
  return { study: study || last, live: live || last, done, last, by };
}
const gameOf = (t, w) => (GW[t] || {})[w] || null;
function lineFor(g, t) { // the team's implied points and point spread (positive = favoured) from the Vegas line
  if (!g || g.sp == null || g.tot == null) return null;
  const home = g.h === t, s = home ? g.sp : -g.sp;
  return { imp: (g.tot + s) / 2, sp: s, tot: g.tot };
}

  const rk = (k, hiGood = true) => { const v = Object.keys(TEAMS).map(tt => [tt, TEAMX[tt][k]]).filter(z => z[1] != null).sort((a, b) => hiGood ? b[1] - a[1] : a[1] - b[1]); const i = v.findIndex(z => z[0] === t); return i >= 0 ? ord(i + 1) : '–'; };
  const ppl = PL.filter(q => q.kind === 'p' && q.g.some(r => r.tm === t));

/* ================= Matchups ================= */

    ${teams.map(t => `<tr><td>${tmChip(t)}</td>${weeks.map(w => { const g = gameOf(t, w); if (!g) return '<td class="num"><span class="hc bye">BYE</span></td>'; const op = otherTeam(g, t), gr = grade(op, pos); return `<td class="num"><span class="hc ${gr ? gr.cls : 'n0'}" data-tip="${esc(`Week ${w}: ${g.h === t ? 'vs' : 'at'} ${teamName(op)}${gr ? ' — ' + gradeTip(op, pos, gr) : ''}`)}">${g.h === t ? '' : '@'}${op}</span></td>`; }).join('')}<td class="num">${sg((ease(t) - 1) * 100)}%</td><td class="num">${sg((pease(t) - 1) * 100)}%</td></tr>`).join('')}</tbody></table></div>

/* ================= Waivers ================= */
function waiverList() {
  const th = P.own, n = Math.max(1, (P.league.poEnd || 17) - WK.study + 1);
  const lst = PL.filter(q => q.kind === 'p' && q.t && ['QB', 'RB', 'WR', 'TE'].includes(q.p) && !P.roster.includes(q.id) && q.st !== 'RES' && !(q.ecr && q.ecr.own >= th) && q.gp + (q.dc ? 1 : 0) > 0);
  const out = [];
  for (const q of lst) {
    const vpw = (q.ros - (REPL[q.p] || 0)) / n, tr = q.trend ? q.trend.sh * 18 + q.trend.sp / 12 : 0, hot = q.tra ? Math.log10(q.tra + 1) * 0.9 : 0;
    const s = vpw + 0.45 * tr + hot + 0.25 * ((q.pj ? q.pj.pts : 0) - (REPL.wk[q.p] || 0));
    if (s < -6) continue;
    out.push({ q, s, own: q.ecr ? q.ecr.own : null, why: whyAdd(q) });
  }
  return out.sort((a, b) => b.s - a.s);
}
function whyAdd(q) {
  const t = [], last = q.g[q.g.length - 1];
  if (q.trend && q.trend.sp >= 12) t.push(`Snaps ${f0(q.trend.spB)}% → ${f0(q.trend.spA)}%`);
  if (q.trend && q.trend.sh >= 0.05) t.push(`${q.p === 'RB' ? 'Opportunity' : 'Target'} share ${pc(q.trend.shB)} → ${pc(q.trend.shA)}`);
  if (last && last.w >= WK.study - 2) { if (last.tg >= 7) t.push(`${last.tg} targets in Week ${last.w}`); if (last.ra >= 14) t.push(`${last.ra} carries in Week ${last.w}`); }
  const mates = PL.filter(m => m.t === q.t && m.p === q.p && m.id !== q.id && m.rosRk < q.rosRk && (m.st === 'RES' || (availability(m, WK.study).a || 1) < 0.5));
  if (mates.length) t.push(`Fills in for ${mates[0].n} (${availability(mates[0], WK.study).tag || 'out'})`);
  if (q.tra) t.push(`${q.tra >= 1000 ? f1(q.tra / 1000) + 'k' : q.tra} adds on Sleeper in a day`);
  if (q.xdiff != null && q.xdiff <= -2.5 && q.gp >= 3) t.push(`Scoring ${f1(-q.xdiff)} a game below his workload`);
  if (q.pj && q.pj.opp) { const g = grade(q.pj.opp, q.p); if (g && g.rk <= 6) t.push(`Week ${WK.study}: ${g.word.toLowerCase()} matchup`); }
  if (!t.length && last && last.fp >= 14) t.push(`${f1(last.fp)} points in Week ${last.w}`);
  if (!t.length && q.gp) t.push(q.p === 'QB' ? `${f1(q.ppg)} points a game` : q.p === 'RB' ? `${f1(q.oppg)} carries + targets a game` : `${f1(q.tgpg)} targets a game, ${pc(q.ts)} share`);
  return t.slice(0, 4);
}
function faab(i) { const b = P.league.faab || 100, r = i === 0 ? [0.18, 0.3] : i <= 2 ? [0.1, 0.18] : i <= 6 ? [0.04, 0.1] : i <= 14 ? [0.01, 0.04] : [0, 0.01]; return `$${Math.round(r[0] * b)}–${Math.max(1, Math.round(r[1] * b))}`; }
function vWaivers() {
  const w = WK.study, lst = waiverList();
  let h = pageHead('Waivers', `Players rostered in under <select class="fld" data-own style="padding:2px 6px">${[25, 35, 50, 65, 80].map(n => `<option${n === P.own ? ' selected' : ''}>${n}</option>`).join('')}</select>% of leagues (FantasyPros' average of ESPN and Yahoo), ranked by rest-of-season value over what's left on your wire, how fast their role is growing, and how many people are adding them. FAAB ranges are a rule of thumb for a $${P.league.faab} budget.`);
  h += `<div class="tw"><table class="t"><thead><tr><th></th><th>Player</th><th>Why</th><th class="num">Wk ${w}</th><th class="num">Rest of season</th><th class="num">Rost.</th><th class="num">FAAB</th></tr></thead><tbody>
    ${lst.slice(0, 40).map((x, i) => `<tr><td class="rk">${i + 1}</td><td>${pname(x.q)}</td><td style="font-size:13.5px;color:var(--ink-2);max-width:360px">${x.why.map(esc).join(' · ') || '—'}</td><td class="num big">${f1(x.q.pj.pts)}</td><td class="num">${f0(x.q.ros)} <span class="faint">${x.q.p}${x.q.rosRk}</span></td><td class="num">${x.own == null ? '<span class="faint" data-tip="Not in the rostered data: almost certainly available">–</span>' : f0(x.own) + '%'}</td><td class="num">${faab(i)}</td></tr>`).join('')}</tbody></table></div>`;
  // streamers

  const ta = PL.filter(q => q.tra).sort((a, b) => b.tra - a.tra).slice(0, 12), td = PL.filter(q => q.trd).sort((a, b) => b.trd - a.trd).slice(0, 12);

  const fall = PL.filter(q => q.kind === 'p' && q.ecr && q.ecr.own >= 60 && q.trend && q.trend.sh <= -0.05 && q.rosRk > (q.p === 'QB' || q.p === 'TE' ? 14 : 36)).sort((a, b) => a.trend.sh - b.trend.sh).slice(0, 10);
  if (fall.length) h += `<h3 class="sh">Roles shrinking</h3><p class="sub">Widely rostered players losing work; candidates to drop or sell before everyone notices.</p><div class="tw"><table class="t compact"><tbody>${fall.map(q => `<tr><td>${pname(q)}</td><td class="muted" style="font-size:13.5px">${q.p === 'RB' ? 'Opportunity' : 'Target'} share ${pc(q.trend.shB)} → ${pc(q.trend.shA)} · snaps ${f0(q.trend.spB)}% → ${f0(q.trend.spA)}%</td><td class="num">${f0(q.ecr.own)}% rost.</td></tr>`).join('')}</tbody></table></div>`;
  $('#main').innerHTML = h;
}

/* ================= Trade ================= */
function tradeState() { P.trade = P.trade || { give: [], get: [] }; P.trade.give = P.trade.give.filter(id => BY[id]); P.trade.get = P.trade.get.filter(id => BY[id]); return P.trade; }
function sideValue(ids) { return { ros: sum(ids.map(id => BY[id].ros)), vor: sum(ids.map(id => Math.max(0, BY[id].vor))), po: sum(ids.map(id => BY[id].rosPO)) }; }
function rosLineup(ids) { let t = 0; for (let w = WK.study; w <= (P.league.poEnd || 17); w++) t += lineup(ids, w).total; return t; }
function vTrade() {
  const T = tradeState(), g = sideValue(T.give), r = sideValue(T.get);
  const side = (k, title) => `<div class="card"><div class="k">${title}</div><div class="search" style="margin:10px 0"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input class="tq" data-side="${k}" type="search" placeholder="Add a player" autocomplete="off" style="width:100%"><div class="sugg" hidden></div></div>
    <div class="side">${T[k].map(id => { const q = BY[id]; return `<div class="pick">${pname(q, { face: false })}<span class="num"><b>${f0(q.ros)}</b> <span class="faint">ROS · ${sg(q.vor)} vs repl.</span></span><button type="button" data-trm="${k}:${id}" aria-label="Remove">×</button></div>`; }).join('') || '<p class="muted" style="margin:0">Nobody yet.</p>'}</div></div>`;
  let h = pageHead('Trade analyzer', `Rest-of-season value through Week ${P.league.poEnd || 17}: each player's projected points, week by week against his schedule, minus what a ${P.league.teams}-team league leaves on waivers at his position. A player below that line is worth about nothing, because you could pick his equal up for free. <a href="#/study/replacement">Replacement level ›</a>`);
  h += `<div class="grid g2">${side('give', 'You give')}${side('get', 'You get')}</div>`;
  if (T.give.length && T.get.length) {
    const d = r.vor - g.vor, big = Math.abs(d) < 8 ? 'about even' : d > 0 ? `in your favour by ${f0(d)} points of value` : `against you by ${f0(-d)} points of value`;
    let more = '';

      <p class="note">Expert rest-of-season ranks (FantasyPros, PPR): ${T.give.concat(T.get).map(id => { const q = BY[id]; return `${esc(q.n)} ${q.ecr && q.ecr.ros ? q.p + Math.round(q.ecr.ros) : '–'}`; }).join(', ')}. ${T.give.concat(T.get).some(id => BY[id].dv) ? `Dynasty values (DynastyProcess, 1QB): ${T.give.concat(T.get).filter(id => BY[id].dv).map(id => `${esc(BY[id].n)} ${BY[id].dv.toLocaleString()}`).join(', ')}.` : ''}</p></div>`;
  }
  $('#main').innerHTML = h;

    const b = q && q.base, c = q && q.pj.c;
    return `<p>Every projection here starts from the player's own season, game by game. The most recent game counts most and each earlier one a little less (each is worth 85% of the one after it). A game he left early, or played for another team, counts for much less, so one injury exit doesn't sink a projection.</p>
      <p>Then volume and efficiency are handled separately, because they behave differently. <b>Volume</b> (pass attempts, carries, targets) is what repeats week to week, so it's taken almost as is. <b>Efficiency</b> (yards per target, touchdowns per carry) is noisy, so it's blended with <a href="#/study/opportunity">expected points</a>: what those same targets and carries usually produce, given where on the field and how far downfield they came. Yardage leans 60/40 on the player's own rate; touchdowns lean 60/40 the other way, on the expected rate, because <a href="#/study/touchdowns">touchdowns regress</a>.</p>
      <p>Three things about this week move it from there. The <b>Vegas line</b>: the team's implied points against its season average scale touchdowns fully and yardage partly. The <b>point spread</b>: underdogs throw more and favorites run more, up to about 12% either way. And the <b>matchup</b>: how the defense treats the position, adjusted for the offenses it has faced, trusted more as the season goes on and never more than 18% either way. Players with under about three games of film are blended with what their depth-chart role (RB1, WR3 …) usually produces. Last, availability: out or on injured reserve is zero, doubtful is a quarter, questionable is 85%.</p>
      ${q ? `<div class="ex card"><div class="k">Worked example: the top-projected running back, ${esc(q.n)}</div><p style="margin:8px 0 0">Recent workload: <b>${f1(b.ra)}</b> carries and <b>${f1(b.tg)}</b> targets a game. This week: <b>${f1(c.ra)}</b> carries for <b>${f1(c.ry)}</b> yards, <b>${f1(c.tg)}</b> targets, <b>${f1(c.rc)}</b> catches for <b>${f1(c.cy)}</b> yards and <b>${f1(c.rtd + c.ctd)}</b> touchdowns, against ${esc(teamName(q.pj.opp))}${q.pj.ln ? ` with an implied ${f1(q.pj.ln.imp)} points (environment ×${q.pj.env.toFixed(2)})` : ''} and a matchup factor of ×${q.pj.m.toFixed(2)}. That's <b>${f1(q.pj.pts)}</b> points in ${esc(scLabel())}, with a range of ${f1(q.pj.lo)} to ${f1(q.pj.hi)}.</p></div>` : ''}
      <p class="pull">A projection is a median, not a promise. The range is the honest part: most weeks land inside it, and plenty don't.</p>
      <div class="ex card"><div class="k">Check the model yourself</div><p style="margin:6px 0 10px">This replays the season: each week from Week 4 on is projected using only the games before it, then compared with what happened, alongside two simple guesses (the season average so far, and the last three games). It runs here in your browser, in your scoring, and takes a few seconds.</p><button class="btn pri" type="button" data-bt>Run the backtest</button><div id="bt"></div></div>`; },
    quiz: [() => ({ q: 'Which part of a player’s stat line does Film Room trust most from week to week?', o: ['Volume: targets, carries and attempts', 'Touchdowns', 'Yards per catch', 'Long plays'], a: 0, e: 'Volume is the most repeatable thing in fantasy football. Efficiency is noisy, so it’s blended with what that volume is usually worth.' }),
      () => ({ q: 'A team is a 7-point underdog. What does game script suggest?', o: ['More passing than usual', 'More running than usual', 'No change', 'Fewer plays overall'], a: 0, e: 'Teams that fall behind throw to catch up; favorites run to burn clock. Film Room shifts pass and rush volume up to about 12% for it.' })] },
  { s: 'opportunity', t: 'Volume first: expected points', b: 'Fantasy points come from opportunities. Expected points measure the work, and the work is what repeats.', body() {
    const st = stability(), qs = skillQs(['RB', 'WR', 'TE']).filter(q => q.xppg != null);
    const pts = qs.filter(q => q.xppg > 4).map(q => ({ x: q.xppg, y: q.ppg, id: q.id, tip: `<b>${esc(q.n)}</b> ${q.p}, ${q.t}<br>${f1(q.ppg)} a game on ${f1(q.xppg)} expected`, d: q.ppg - q.xppg }));
    const lab = pts.slice().sort((a, b) => Math.abs(b.d) - Math.abs(a.d)).slice(0, 7); lab.forEach(p => { p.lab = BY[p.id].n.split(' ').slice(-1)[0]; });
    return `<p>Every target and every carry has a value before anything happens on it: a target in the end zone is worth far more than a checkdown at midfield, and a carry from the 2-yard line far more than one from your own 30. Add those values up over a game and you get <b>expected fantasy points</b>: what an average player would have scored with exactly that workload. Film Room uses the <a href="https://github.com/ffverse/ffopportunity" target="_blank" rel="noopener">ffopportunity</a> model, trained on years of play-by-play.</p>
      <p>Why bother? Because the work is far more repeatable than the results. Here is this season's evidence: for ${st[0] ? st[0].n : 'the'} running backs, receivers and tight ends with games in both odd and even weeks, how well each stat in odd weeks predicts the same stat in even weeks (a correlation, from 0 for no relationship to 1 for a perfect one).</p>
      <div class="ex">${hbar(st.map((x, i) => ({ lab: x.lab, v: x.v, c: 0, tip: `r = ${x.v.toFixed(2)}` })), { fmt: v => v.toFixed(2), max: 1 })}<p class="cap">Split-half correlation, ${D.season} season through week ${WK.done || '—'}.</p></div>
      <p>Below, every back, receiver and tight end with three or more games: expected points a game across, actual down. The players far above the dashed line have been scoring more than their work explains; that tends to fade. The ones below it have had the work without the points; that tends to turn.</p>
      <div class="ex">${scatter(pts, { label: 'Expected vs actual fantasy points per game', xl: 'Expected points a game' })}</div>`; },
    quiz: [() => { const st = stability(); const pick = st.filter(x => ['Targets + carries', 'Touchdowns', 'Yards per touch', 'Fantasy points'].includes(x.lab)); const best = pick.slice().sort((a, b) => b.v - a.v)[0]; return { q: 'Which of these was the most stable from odd weeks to even weeks this season?', o: pick.map(x => x.lab), a: pick.indexOf(best), e: pick.map(x => `${x.lab}: r = ${x.v.toFixed(2)}`).join(' · ') + '.' }; },
      () => ({ q: 'What does “expected fantasy points” measure?', o: ['What an average player would score with the same targets and carries', 'A projection for next week', 'Points scored against an average defense', 'The consensus ranking'], a: 0, e: 'It prices the workload itself: field position, distance to the end zone and depth of target.' })] },
  { s: 'targets', t: 'Targets, air yards and WOPR', b: 'Share of the team’s targets, share of how far downfield the team throws, and the one number that combines them.', body() {
    const qs = skillQs(['WR', 'TE']).sort((a, b) => b.wopr - a.wopr).slice(0, 15);
    return `<p>For receivers, <b>target share</b> (his share of the team's targets) is the foundation. <b>Air-yards share</b> adds how far downfield those targets travel: a receiver with 20% of the targets but 35% of the air yards is getting the valuable looks. <b>WOPR</b> (weighted opportunity rating, from Josh Hermsmeyer) puts them together: 1.5 × target share + 0.7 × air-yards share. Around 0.70 is a true WR1 role; under about 0.35 you need touchdowns to matter.</p>
      <p>Shares beat raw counts because they don't care about pace or game script, and they show changes in role a week or two before the box score does. Shares here are of the team's targets in the games the player played.</p>
      <div class="ex">${tbl(qs, [['Tgt share', q => pc(q.ts)], ['Air yd share', q => pc(q.ays)], ['WOPR', q => q.wopr.toFixed(2)], ['Deep tgts', q => q.dpt], ['End zone', q => q.ezt], ['Pts/G', q => f1(q.ppg)]])}<p class="cap">The 15 highest WOPRs this season, receivers and tight ends with three or more games.</p></div>`; },
    quiz: [() => ({ q: 'WOPR is…', o: ['1.5 × target share + 0.7 × air-yards share', 'Targets per route run', 'Catches over targets', 'Air yards per target'], a: 0, e: 'Weighted opportunity rating weights target share more heavily than air-yards share.' }), () => quizTop('wopr', ['WR', 'TE'], 'Which of these receivers has the highest WOPR this season?', q => q.wopr.toFixed(2))] },
  { s: 'backfield', t: 'Running backs: carries, targets and the goal line', b: 'Not all touches are equal. A target is worth about two carries, and a carry inside the 10 is worth several.', body() {
    const rb = skillQs(['RB']); let ct = 0, cp = 0, tt = 0, tp = 0;
    const S = SC();
    for (const q of rb) for (const r of q.g) { ct += r.ra; cp += r.ry * S.ry + r.rtd * S.rtd; tt += r.tg; tp += r.rc * S.rec + r.cy * S.cy + r.ctd * S.ctd; }
    const vc = ct ? cp / ct : 0, vt = tt ? tp / tt : 0;
    const lst = rb.sort((a, b) => b.oppg - a.oppg).slice(0, 15);
    return `<p>This season, in ${esc(scLabel())}, the average running back carry has been worth <b>${vc.toFixed(2)}</b> fantasy points and the average running back target <b>${vt.toFixed(2)}</b>: a target is worth about ${vt && vc ? (vt / vc).toFixed(1) : '–'} carries. That's why a pass-catching back with twelve touches can outscore a grinder with twenty.</p>
      <p>The other premium touch is the goal-line carry. Touchdowns are six points, and most rushing touchdowns come from inside the 10. A back who gets those carries keeps a floor even in a bad game; a back who leaves the field near the goal line doesn't. Watch the <b>inside-10</b> and <b>inside-5</b> columns.</p>
      <div class="ex">${tbl(lst, [['Car/G', q => f1(q.rapg)], ['Tgt/G', q => f1(q.tgpg)], ['Rush share', q => pc(q.rs)], ['Inside 10', q => sum(q.g.map(r => r.i10c))], ['Inside 5', q => sum(q.g.map(r => r.i5c))], ['Pts/G', q => f1(q.ppg)]])}<p class="cap">The 15 busiest backs by carries plus targets a game.</p></div>`; },
    quiz: [() => quizTop(q => sum(q.g.map(r => r.i10c)), ['RB'], 'Which of these backs has the most carries inside the 10 this season?', q => sum(q.g.map(r => r.i10c)) + ' carries'),
      () => ({ q: 'In PPR-style scoring, a running back target is usually worth…', o: ['More than a carry', 'Less than a carry', 'The same as a carry', 'Nothing unless caught for a touchdown'], a: 0, e: 'Catches score in PPR and receiving yards come in bigger chunks; that makes a target worth roughly two carries.' })] },
  { s: 'snaps', t: 'Snap share and changing roles', b: 'Who’s on the field, and who’s on it more than two weeks ago. Usage moves before points do.', body() {
    const up = skillQs(['RB', 'WR', 'TE'], 4).filter(q => q.trend).sort((a, b) => (b.trend.sh + b.trend.sp / 150) - (a.trend.sh + a.trend.sp / 150)).slice(0, 10);
    const dn = skillQs(['RB', 'WR', 'TE'], 4).filter(q => q.trend && q.trend.spB > 40).sort((a, b) => (a.trend.sh + a.trend.sp / 150) - (b.trend.sh + b.trend.sp / 150)).slice(0, 10);
    const cols = [['Snaps then', q => f0(q.trend.spB) + '%'], ['Snaps now', q => f0(q.trend.spA) + '%'], ['Share then', q => pc(q.trend.shB)], ['Share now', q => pc(q.trend.shA)]];
    return `<p>A player can't score from the sideline. Snap share (the share of his team's offensive plays he was on the field for) is the first filter: a receiver under about 60% or a back under about 40% needs something special to pay off. But snaps alone flatter blocking tight ends and decoys, so read them with the share of the team's <a href="#/study/targets">targets</a> (or, for backs, carries plus targets).</p>
      <p>The most useful thing snaps show is <b>change</b>. A role that grows over two games usually keeps growing; injuries, depth-chart moves and coaching decisions show up there before they show up in fantasy points, and before the waiver wire catches on. "Then" below is the player's games before the last two; "now" is the last two.</p>
      <h3>Roles growing</h3><div class="ex">${tbl(up, cols)}</div><h3>Roles shrinking</h3><div class="ex">${tbl(dn, cols)}</div>`; },
    quiz: [() => { const a = skillQs(['RB'], 3); const lw = Math.max(...weeksPlayed()); const teams = {}; for (const q of a) { const r = q.g.find(r => r.w === lw); if (r && r.sp) (teams[r.tm] = teams[r.tm] || []).push([q, r]); } const t = Object.values(teams).filter(l => l.length >= 2).sort(() => rnd() - 0.5)[0]; if (!t) return null; const [x, y] = t.sort((m, n) => n[1].sp - m[1].sp); const o = rnd() < 0.5 ? [x, y] : [y, x];
      return { q: `In Week ${lw}, who played the higher share of ${nick(x[1].tm)}' snaps?`, o: o.map(z => z[0].n), a: o.indexOf(x), e: `${x[0].n} ${f0(x[1].sp)}%, ${y[0].n} ${f0(y[1].sp)}%.` }; }] },
  { s: 'touchdowns', t: 'Touchdowns regress', b: 'The players scoring well above (or below) their expected touchdowns are your sell-highs and buy-lows.', body() {
    const qs = skillQs(['RB', 'WR', 'TE']).filter(q => q.xtd != null);
    const hot = qs.slice().sort((a, b) => (b.td - b.xtd) - (a.td - a.xtd)).slice(0, 10), cold = qs.slice().sort((a, b) => (a.td - a.xtd) - (b.td - b.xtd)).slice(0, 10);
    const st = stability(), td = st.find(x => x.lab === 'Touchdowns'), vol = st.find(x => x.lab === 'Targets + carries');
    const cols = [['TD', q => q.td], ['Expected', q => f1(q.xtd)], ['Diff', q => sg(q.td - q.xtd)], ['RZ looks', q => q.rzo], ['Pts/G', q => f1(q.ppg)]];
    return `<p>Touchdowns are the most random thing in a fantasy box score. This season, a player's touchdowns in odd weeks have predicted his touchdowns in even weeks with a correlation of ${td ? td.v.toFixed(2) : '–'}; his targets plus carries, ${vol ? vol.v.toFixed(2) : '–'}. The work carries over and the scoring mostly doesn't.</p>
      <p>Expected touchdowns come from the same model as expected points: each target and carry priced by how often plays like it have ended in the end zone. A player well above his expected total has been finishing at a rate that rarely lasts; a player well below has been getting the chances without the luck. Neither is a lock. A great red-zone receiver can beat expectation for years, but over the rest of a season, the gap usually closes.</p>
      <h3>Above expectation: sell high</h3><div class="ex">${tbl(hot, cols)}</div><h3>Below expectation: buy low</h3><div class="ex">${tbl(cold, cols)}</div>`; },
    quiz: [() => { const qs = skillQs(['RB', 'WR', 'TE']).filter(q => q.xtd != null && Math.abs(q.td - q.xtd) >= 2); const q = qs[Math.floor(rnd() * qs.length)]; if (!q) return null; const hi = q.td > q.xtd;
      return { q: `${q.n} has ${plural(q.td, 'touchdown')} on ${f1(q.xtd)} expected. Over the rest of the season, his touchdown rate is more likely to…`, o: ['Fall toward his expected rate', 'Rise further', 'Stay exactly where it is'].map((x, i) => i === 0 ? (hi ? 'Fall toward his expected rate' : 'Rise toward his expected rate') : i === 1 ? (hi ? 'Rise further' : 'Fall further') : x), a: 0, e: 'Touchdown rates regress toward what the workload usually produces.' }; }] },
  { s: 'vegas', t: 'Vegas implied totals', b: 'The betting line is the best public forecast of how many points each team will score. Here’s how to read it and how well it’s done.', body() {
    const v = vegasCheck(), w = WK.study, ln = (WK.by[w] || []).flatMap(g => [g.h, g.a].map(t => ({ t, l: lineFor(g, t) }))).filter(x => x.l).sort((a, b) => b.l.imp - a.l.imp);
    return `<p>A point spread and a total together tell you how many points the market expects each team to score. The favorite's <b>implied total</b> is half the total plus half the spread; the underdog's, half the total minus half the spread. A 48-point total with a team favored by 6 means 27 for the favorite and 21 for the underdog.</p>
      <p>Implied totals are the single best way to stream quarterbacks, tight ends, kickers and defenses: more expected points means more touchdowns to go around, and a low implied total for the opponent means a good day for your defense. This season, across ${v.n} team-games, implied totals have correlated with actual points at r = ${v.r != null ? v.r.toFixed(2) : '–'}. Teams implied under 20 have scored ${f1(v.lo)} a game on average (${v.nlo} games); 20 to 25, ${f1(v.mid)} (${v.nmid}); 25 and up, ${f1(v.hi)} (${v.nhi}).</p>
      <h3>Week ${w} implied totals</h3><div class="ex">${hbar(ln.map(x => ({ lab: `${x.t} ${esc(nick(x.t))}`, v: x.l.imp, c: 0, tip: `${x.l.sp > 0 ? 'Favored by ' + f1(x.l.sp) : x.l.sp < 0 ? 'Underdog by ' + f1(-x.l.sp) : 'Pick ’em'}; total ${f1(x.l.tot)}` })), { fmt: v => f1(v), max: 35 })}</div>`; },
    quiz: [() => ({ q: 'The total is 47 and the home team is favored by 5. What is the home team’s implied total?', o: ['26', '21', '23.5', '28.5'], a: 0, e: '(47 + 5) ÷ 2 = 26. The away team is implied for (47 − 5) ÷ 2 = 21.' }), () => { const w = WK.study, l = (WK.by[w] || []).flatMap(g => [g.h, g.a].map(t => [t, lineFor(g, t)])).filter(x => x[1]); if (l.length < 4) return null; const o = shuffle(l).slice(0, 4), best = o.slice().sort((a, b) => b[1].imp - a[1].imp)[0];
      return { q: `Which of these teams has the highest implied total in Week ${w}?`, o: o.map(x => teamName(x[0])), a: o.indexOf(best), e: o.map(x => `${nick(x[0])} ${f1(x[1].imp)}`).join(' · ') }; }] },
  { s: 'matchups', t: 'Reading matchups', b: 'Points allowed lie about defenses that have played good (or bad) offenses. Adjust, shrink, and don’t overreact.', body() {
    const soft = Object.keys(TEAMS).sort((a, b) => DVP[a].WR.ratioRk - DVP[b].WR.ratioRk), rb = Object.keys(TEAMS).sort((a, b) => DVP[a].RB.ratioRk - DVP[b].RB.ratioRk);
    const row = (t, pos) => `<tr><td>${tmChip(t)} ${esc(nick(t))}</td><td class="num">${f1(DVP[t][pos].ppg)}</td><td class="num">${sg(DVP[t][pos].adj)}</td><td class="num">${(DVP[t][pos].ratio * 100).toFixed(0)}%</td></tr>`;
    const th = '<thead><tr><th>Defense</th><th class="num">Allowed/G</th><th class="num">vs normal</th><th class="num">Ratio</th></tr></thead>';
    return `<p>"Fantasy points allowed" tables are everywhere and mostly misleading. A defense that has played three of the league's best receiving corps will have allowed a lot of points to receivers without being bad at defending them. So Film Room compares what each defense allowed with what those same offenses score against everyone else. A ratio of 120% means opponents scored 20% more against this defense than they usually do.</p>
      <p>Even adjusted, early-season matchup numbers are noisy: a single long touchdown can swing a defense's ranking. So the projection trusts them more as games accumulate and caps the effect at 18% either way. Use matchups to break ties between similar players, not to bench your best ones.</p>
      <div class="grid g2"><div><h3>Softest and toughest vs WRs</h3><div class="tw"><table class="t compact">${th}<tbody>${soft.slice(0, 5).map(t => row(t, 'WR')).join('')}<tr class="tier"><td colspan="4">Toughest</td></tr>${soft.slice(-5).reverse().map(t => row(t, 'WR')).join('')}</tbody></table></div></div>
      <div><h3>Softest and toughest vs RBs</h3><div class="tw"><table class="t compact">${th}<tbody>${rb.slice(0, 5).map(t => row(t, 'RB')).join('')}<tr class="tier"><td colspan="4">Toughest</td></tr>${rb.slice(-5).reverse().map(t => row(t, 'RB')).join('')}</tbody></table></div></div></div>
      <p class="note"><a href="#/matchups">Every defense, every position, and the schedule ahead ›</a></p>`; },
    quiz: [() => { const pos = ['RB', 'WR', 'TE'][Math.floor(rnd() * 3)], o = shuffle(Object.keys(TEAMS)).slice(0, 4), best = o.slice().sort((a, b) => DVP[a][pos].ratioRk - DVP[b][pos].ratioRk)[0];
      return { q: `Adjusted for the offenses faced, which of these defenses has been the softest against ${pos}s?`, o: o.map(teamName), a: o.indexOf(best), e: o.map(t => `${nick(t)} ${ord(DVP[t][pos].ratioRk)}`).join(' · ') }; },
      () => ({ q: 'Why adjust “points allowed” for the offenses a defense has faced?', o: ['A defense that has played strong offenses looks worse than it is', 'Home teams score more', 'Points allowed already includes it', 'Because of bye weeks'], a: 0, e: 'Schedule strength pollutes raw points allowed, especially early in the season.' })] },
  { s: 'pace', t: 'Pace and pass rate over expected', b: 'More plays mean more chances; more passing means more of the valuable ones.', body() {
    const ts = Object.keys(TEAMS).filter(t => TEAMX[t].proe != null), pr = ts.slice().sort((a, b) => TEAMX[b].proe - TEAMX[a].proe), sp = ts.slice().sort((a, b) => TEAMX[a].spp - TEAMX[b].spp);
    return `<p>Two team traits shape every player's opportunity. <b>Pace</b> is how quickly an offense snaps the ball when the game is close (Film Room measures the seconds between snaps on the same drive with the win probability between 20% and 80%); faster teams run more plays. <b>Pass rate over expected</b> (PROE) is how much more often a team throws than an average team would in the same situations (down, distance, field position, score, time). It strips out game script, so it shows a coaching staff's real preference.</p>
      <p>High pace and high PROE together are the best environment for quarterbacks and receivers; slow, run-first teams cap them. These change less than individual stats, so they're good for reading the rest of the season.</p>
      <div class="grid g2"><div><h3>Most pass-happy</h3>${hbar(pr.slice(0, 8).map(t => ({ lab: `${t} ${esc(nick(t))}`, v: TEAMX[t].proe, c: 0 })), { fmt: v => sg(v) + '%', max: Math.max(1, TEAMX[pr[0]].proe) })}<h3>Most run-heavy</h3>${hbar(pr.slice(-8).reverse().map(t => ({ lab: `${t} ${esc(nick(t))}`, v: -TEAMX[t].proe, c: 1 })), { fmt: v => sg(-v) + '%', max: Math.max(1, -TEAMX[pr[pr.length - 1]].proe) })}</div>
      <div><h3>Fastest</h3>${hbar(sp.slice(0, 8).map(t => ({ lab: `${t} ${esc(nick(t))}`, v: TEAMX[t].spp, c: 0 })), { fmt: v => f1(v) + 's', max: 40 })}<h3>Slowest</h3>${hbar(sp.slice(-8).reverse().map(t => ({ lab: `${t} ${esc(nick(t))}`, v: TEAMX[t].spp, c: 1 })), { fmt: v => f1(v) + 's', max: 40 })}</div></div>`; },
    quiz: [() => { const o = shuffle(Object.keys(TEAMS).filter(t => TEAMX[t].proe != null)).slice(0, 4), best = o.slice().sort((a, b) => TEAMX[b].proe - TEAMX[a].proe)[0]; return { q: 'Which of these offenses has the highest pass rate over expected?', o: o.map(teamName), a: o.indexOf(best), e: o.map(t => `${nick(t)} ${sg(TEAMX[t].proe)}%`).join(' · ') }; },
      () => ({ q: 'Pass rate over expected adjusts for…', o: ['The game situation: down, distance, field position, score and time', 'The weather', 'The quarterback’s salary', 'Nothing; it is the raw pass rate'], a: 0, e: 'That’s what makes it a read on coaching preference rather than game script.' })] },
  { s: 'redzone', t: 'Red-zone and end-zone looks', b: 'Where the touchdowns come from, and who’s getting the chances.', body() {
    const ez = skillQs(['WR', 'TE', 'RB']).sort((a, b) => (b.rzo) - (a.rzo)).slice(0, 15);
    return `<p>The red zone (inside the opponent's 20) is where most touchdowns happen, and inside the 10 is where most rushing touchdowns happen. <b>End-zone targets</b> (passes thrown into the end zone) are the most valuable targets there are. These counts are small, so they're noisy for any one player; but a player who keeps getting them will keep scoring, and a player who scores without them won't.</p>
      <div class="ex">${tbl(ez, [['RZ targets', q => sum(q.g.map(r => r.rzt))], ['RZ carries', q => sum(q.g.map(r => r.rzc))], ['Inside 10', q => q.i10], ['End-zone tgts', q => q.ezt], ['TD', q => q.td]])}<p class="cap">The 15 players with the most red-zone carries plus targets.</p></div>`; },
    quiz: [() => quizTop('ezt', ['WR', 'TE'], 'Which of these pass catchers has the most end-zone targets this season?', q => q.ezt + ' end-zone targets')] },
  { s: 'replacement', t: 'Replacement level, VOR and trades', b: 'A player’s value is what he scores above the best player you could pick up for free.', body() {
    const top = PL.filter(q => q.t && q.vor > 0).sort((a, b) => b.vor - a.vor).slice(0, 15);

  const t = e.target.closest('button,a,[data-p],[data-flip],input'); if (!t) { if (!e.target.closest('.sugg,.search')) $$('.sugg').forEach(b => { b.hidden = true; }); return; }
