<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Create · Felt</title>
<meta name="description" content="A bankroll and session log for live and online poker: cash and tournaments, buy-ins and cash-outs, hours, stakes and rooms, with the graph, hourly rate, standard deviation and risk of ruin. Hand notes attach to sessions. Share with a study partner by code.">
<link rel="canonical" href="https://bboldt86.github.io/lanscape-navigator/news/create/apps/felt/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Create">
<meta property="og:title" content="Create · Felt">
<meta property="og:description" content="Every session. Every stake. The real number. A poker bankroll and session log that syncs phone to phone. No app, no account, no server.">
<meta property="og:url" content="https://bboldt86.github.io/lanscape-navigator/news/create/apps/felt/">
<meta property="og:image" content="https://bboldt86.github.io/lanscape-navigator/news/create/share.png">

<meta name="theme-color" content="#F8F7F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191613" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Felt">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%233D7A55'/%3E%3Cpath d='M32 12c-4 8-16 15-16 25a9 9 0 0 0 14 7l-3 9h10l-3-9a9 9 0 0 0 14-7c0-10-12-17-16-25z' fill='%23F8F7F4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F8F7F4; --raise:#FFFFFF; --sunk:#EFEBE4; --ink:#2A251F; --ink2:#62594F; --ink3:#968B7E; --rule:rgba(42,37,31,.12); --rule2:rgba(42,37,31,.22);
  --a:#C2785C; --a-soft:rgba(194,120,92,.15); --b:#5B7FA1; --b-soft:rgba(91,127,161,.15); --gold:#8B7355; --gold-soft:rgba(139,115,85,.16); --lens:#A88A5E;
  --ok:#3D7A55; --warn:#B4532F; --scrim:rgba(30,25,20,.45); --on:#fff;
  --shadow:0 1px 2px rgba(42,37,31,.05),0 8px 24px rgba(42,37,31,.07);
  --serif:'Instrument Serif','Iowan Old Style',Georgia,serif;
  --sans:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --felt:#3D7A55; --felt-soft:rgba(61,122,85,.14); --red:#B4532F;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#191613; --raise:#24201B; --sunk:#131110; --ink:#F2EDE6; --ink2:#C6BCAF; --ink3:#918679; --rule:rgba(242,237,230,.12); --rule2:rgba(242,237,230,.24);
    --a:#E39B7F; --a-soft:rgba(227,155,127,.17); --b:#8FB1D2; --b-soft:rgba(143,177,210,.17); --gold:#CDB089; --gold-soft:rgba(205,176,137,.17); --lens:#BFA27A;
    --ok:#7EC39B; --warn:#F08C66; --scrim:rgba(0,0,0,.62); --on:#191613; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.34);
    --felt:#7EC39B; --felt-soft:rgba(126,195,155,.16); --red:#F08C66; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#191613; --raise:#24201B; --sunk:#131110; --ink:#F2EDE6; --ink2:#C6BCAF; --ink3:#918679; --rule:rgba(242,237,230,.12); --rule2:rgba(242,237,230,.24);
  --a:#E39B7F; --a-soft:rgba(227,155,127,.17); --b:#8FB1D2; --b-soft:rgba(143,177,210,.17); --gold:#CDB089; --gold-soft:rgba(205,176,137,.17); --lens:#BFA27A;
  --ok:#7EC39B; --warn:#F08C66; --scrim:rgba(0,0,0,.62); --on:#191613; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.34);
  --felt:#7EC39B; --felt-soft:rgba(126,195,155,.16); --red:#F08C66; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
body.landing{padding-bottom:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
.in{max-width:960px;margin:0 auto;padding:0 16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3{font-family:var(--serif);font-weight:400;margin:0}
h2{font-size:28px;line-height:1.1}
h3{font-size:21px;line-height:1.15}
.up{color:var(--ok)}.dn{color:var(--red)}
.mono{font-variant-numeric:tabular-nums}

/* ---------- top bar */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--rule);padding-top:env(safe-area-inset-top)}
.top .in{display:flex;align-items:center;gap:10px;height:56px}
.logo{display:flex;align-items:baseline;gap:8px;text-decoration:none;flex:none;min-width:0}
.logo b{font:400 27px/1 var(--serif);letter-spacing:-.01em;color:var(--felt)}
.logo small{font:600 11px/1 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}
.tools{display:flex;align-items:center;gap:8px;flex:none;margin-left:auto}
.pill{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--rule2);background:var(--raise);font-size:13.5px;font-weight:600;white-space:nowrap;max-width:150px}
.pill span{overflow:hidden;text-overflow:ellipsis}
.pill i{width:8px;height:8px;border-radius:50%;background:transparent;border:1.5px solid var(--ink3);flex:none}
.pill.on i{background:var(--ok);border-color:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 22%,transparent)}
.pill.wait i{background:var(--gold);border-color:var(--gold);animation:pulse 1.4s infinite}
.pill.away i{background:var(--ink3);border-color:var(--ink3)}
@keyframes pulse{50%{opacity:.35}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--rule2);background:var(--raise);font-size:15px;font-weight:600;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--ink3)}
.btn.p{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.g{background:var(--felt);border-color:var(--felt);color:#fff}
.btn.sm{height:36px;padding:0 13px;font-size:14px}
.btn.big{height:64px;font-size:19px;padding:0 28px;width:100%;border-radius:20px}
.btn.danger{color:var(--warn)}
.btn svg{width:16px;height:16px}
.ic{width:40px;height:40px;border-radius:50%;border:1px solid var(--rule2);background:var(--raise);display:inline-flex;align-items:center;justify-content:center;padding:0;flex:none}
.ic svg{width:18px;height:18px}
.lk{background:none;border:0;padding:0;color:var(--gold);font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* ---------- nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom)}
.nav .in{display:flex;height:60px}
.nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--ink3);padding:0}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--felt)}
.landing .nav{display:none}

/* ---------- cards and layout */
.card{background:var(--raise);border:1px solid var(--rule);border-radius:18px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card+.card,.card+.sec,.sec+.card{margin-top:12px}
.sec{margin-top:18px}
.sec h2{font-size:24px;margin:0 0 8px}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.kpi div{min-width:0}
.kpi b{display:block;font:400 32px/1.05 var(--serif);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi span{font-size:12.5px;color:var(--ink3);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.kpi.s b{font-size:24px}
.kpi.k3{grid-template-columns:1fr 1fr 1fr}
.big-n{font:400 56px/1 var(--serif);letter-spacing:-.02em;margin:4px 0 2px}
.lab{font-size:12.5px;color:var(--ink3);font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.sb{justify-content:space-between}
.hint{font-size:13.5px;color:var(--ink3);margin:6px 0 0}
.empty{border:1.5px dashed var(--rule2);border-radius:18px;padding:28px 20px;text-align:center}
.empty h3{font-size:26px;color:var(--felt)}
.empty p{margin:8px auto 14px;max-width:46ch;color:var(--ink2);font-size:15px}
.empty .row{justify-content:center}

/* ---------- live session */
.live{background:var(--felt);color:#fff;border-radius:22px;padding:18px;box-shadow:var(--shadow)}
.live .lab{color:rgba(255,255,255,.7)}
.live .t{font:400 58px/1 var(--serif);letter-spacing:-.01em;margin:2px 0 4px;font-variant-numeric:tabular-nums}
.live .m{font-size:15px;opacity:.9}
.live .ctl{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.live .ctl button{height:56px;border-radius:16px;border:1.5px solid rgba(255,255,255,.45);background:rgba(255,255,255,.14);color:#fff;font-size:17px;font-weight:700}
.live .ctl button.end{grid-column:1/-1;background:#fff;color:var(--felt);border-color:#fff;height:62px;font-size:19px}
:root[data-theme="dark"] .live,:root[data-dark] .live{color:#121a15}
:root[data-dark] .live .lab{color:rgba(18,26,21,.7)}
:root[data-dark] .live .ctl button{color:#121a15;border-color:rgba(18,26,21,.35);background:rgba(18,26,21,.1)}
:root[data-dark] .live .ctl button.end{background:#121a15;color:var(--felt);border-color:#121a15}

/* ---------- graph */
.graph{width:100%;height:auto;display:block;overflow:visible}
.graph .ax{stroke:var(--rule2);stroke-width:1}
.graph .zero{stroke:var(--ink3);stroke-width:1;stroke-dasharray:3 3}
.graph .ln{fill:none;stroke:var(--felt);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.graph .ar{fill:var(--felt);fill-opacity:.12}
.graph .lb{font:600 11px var(--sans);fill:var(--ink3)}
.graph .pt{fill:var(--felt);stroke:var(--raise);stroke-width:1.5}
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:minmax(72px,1fr) 2fr auto;gap:10px;align-items:center;font-size:14px}
.bar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .tr{height:18px;background:var(--sunk);border-radius:6px;position:relative;overflow:hidden}
.bar .tr i{position:absolute;top:0;bottom:0;border-radius:6px}
.bar .tr i.up{background:var(--felt)}.bar .tr i.dn{background:var(--red)}
.bar .tr em{position:absolute;top:0;bottom:0;width:1px;background:var(--ink3);opacity:.5}
.bar .v{font-weight:650;white-space:nowrap;font-variant-numeric:tabular-nums}
.bar small{display:block;color:var(--ink3);font-weight:500;font-size:12px}

/* ---------- lists */
.list{display:flex;flex-direction:column;gap:8px}
.ses{display:flex;gap:12px;align-items:center;background:var(--raise);border:1px solid var(--rule);border-radius:14px;padding:12px 14px;text-align:left;width:100%;cursor:pointer;min-width:0}
.ses .d{flex:none;width:44px;text-align:center}
.ses .d b{display:block;font:400 22px/1 var(--serif)}
.ses .d small{font-size:11px;color:var(--ink3);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.ses .mid{flex:1;min-width:0}
.ses .mid b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ses .mid small{display:block;color:var(--ink3);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ses .r{flex:none;text-align:right;font-weight:650;font-size:17px;font-variant-numeric:tabular-nums}
.ses .r small{display:block;font-weight:500;color:var(--ink3);font-size:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 2px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--rule2);background:var(--raise);font-size:14px;font-weight:550;white-space:nowrap;flex:none}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.x{border-style:dashed}
.chip .rm{margin:0 -6px 0 2px;width:22px;height:22px;border-radius:50%;border:0;background:var(--sunk);font-size:14px;line-height:1;display:inline-flex;align-items:center;justify-content:center;padding:0}
.tot{display:flex;flex-direction:column;gap:6px}
.tot div{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:1px solid var(--rule);padding:6px 0;font-size:15px}
.tot div b{font-variant-numeric:tabular-nums}
.tot div small{color:var(--ink3);font-size:13px;margin-left:6px}
.hand{background:var(--raise);border:1px solid var(--rule);border-radius:14px;padding:12px 14px;text-align:left;width:100%;cursor:pointer}
.hand .hh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13.5px;color:var(--ink2)}
.hand .hh b{color:var(--ink);font-weight:650}
.hand .tx{margin:6px 0 0;font-size:14.5px;color:var(--ink2);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.tag{font-size:12px;font-weight:650;background:var(--sunk);border-radius:999px;padding:2px 9px;color:var(--ink2)}
.tag.bluff{background:var(--b-soft);color:var(--b)}.tag.value{background:var(--felt-soft);color:var(--felt)}.tag.cooler{background:var(--gold-soft);color:var(--gold)}.tag.mistake{background:var(--a-soft);color:var(--a)}
.cards{display:inline-flex;gap:3px;align-items:center;margin:6px 0 0;flex-wrap:wrap}
.cd{display:inline-flex;align-items:center;justify-content:center;width:30px;height:40px;border-radius:5px;background:#fff;border:1px solid rgba(0,0,0,.18);color:#222;font:700 14px/1 var(--sans);box-shadow:0 1px 2px rgba(0,0,0,.12);flex-direction:column;gap:0}
.cd.r{color:#C8302E}
.cd span{font-size:11px;line-height:1}
.cd.gap{width:8px;border:0;background:none;box-shadow:none}
.cm{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--rule)}
.cm .av{width:28px;height:28px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700}
.av.a{background:var(--a)}.av.b{background:var(--b)}
.cm div{min-width:0;flex:1}
.cm b{font-size:13.5px}
.cm small{color:var(--ink3);margin-left:6px;font-size:12.5px}
.cm p{margin:2px 0 0;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}

/* ---------- forms */
.stack{display:flex;flex-direction:column;gap:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.g2>*,.g3>*{min-width:0}
.g2,.g3{align-items:end}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld label,.fld .lb{font-size:13px;font-weight:650;color:var(--ink2)}
.fld input,.fld select,.fld textarea{height:46px;border-radius:12px;border:1px solid var(--rule2);background:var(--raise);padding:0 13px;font-size:16px;width:100%;min-width:0}
.fld textarea{height:auto;min-height:80px;padding:10px 13px;resize:vertical;line-height:1.45}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--felt);box-shadow:0 0 0 3px var(--felt-soft)}
.fld input.hero{height:60px;font-size:28px;font-family:var(--serif);text-align:center}
.seg{display:flex;border:1px solid var(--rule2);border-radius:999px;padding:3px;gap:3px;background:var(--raise)}
.seg button{flex:1;border:0;background:transparent;height:38px;padding:0 10px;border-radius:999px;font-weight:600;font-size:14px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.srch{display:flex;gap:8px}
.srch input{flex:1;height:46px;border-radius:12px;border:1px solid var(--rule2);background:var(--raise);padding:0 13px;font-size:16px;min-width:0}

/* ---------- landing */
.land{padding-top:28px}
.eyebrow{margin:0 0 10px;font-size:13px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--felt)}
.land h1{font:400 clamp(44px,8vw,76px)/.98 var(--serif);letter-spacing:-.02em}
.land h1 em{color:var(--felt);font-style:italic}
.lede{margin:14px 0 22px;font-size:17px;color:var(--ink2);max-width:54ch}
.land .card{max-width:560px}
.rooms{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.formula{font:400 20px/1.3 var(--serif);background:var(--sunk);border-radius:12px;padding:10px 14px;margin:8px 0}

/* ---------- sheet, toast */
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:41;left:0;right:0;bottom:0;max-height:92vh;max-height:92dvh;background:var(--bg);border-radius:22px 22px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.2);transform:translateY(104%);transition:transform .26s cubic-bezier(.2,.8,.2,1);overflow-y:auto;overscroll-behavior:contain;padding:0 0 calc(24px + env(safe-area-inset-bottom))}
.sheet.on{transform:none}
.shh{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:14px 16px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--rule)}
.shh h2{flex:1;font-size:26px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shb{padding:16px}
.box{border:1px solid var(--rule);background:var(--raise);border-radius:16px;padding:16px;margin-bottom:12px}
.box h3{font-size:19px;margin:0 0 4px}
.box p{margin:4px 0;color:var(--ink2);font-size:15px}
.code{font:400 50px/1 var(--serif);letter-spacing:.08em;text-align:center;margin:8px 0 4px}
.qr{width:180px;height:180px;margin:10px auto;background:#fff;border-radius:12px;padding:8px}
.qr svg{width:100%;height:100%;display:block}
.status{margin:10px 0 0;font-size:14px;font-weight:600;text-align:center}
.status.ok{color:var(--ok)}.status.bad{color:var(--warn)}
.menu-l{display:flex;flex-direction:column}
.menu-l button,.menu-l label{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;border:0;background:transparent;padding:12px 4px;border-bottom:1px solid var(--rule);font-weight:600;font-size:16px;cursor:pointer;width:100%}
.menu-l small{font-weight:400;color:var(--ink3);font-size:13.5px}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;visibility:hidden;pointer-events:none;z-index:60;background:var(--ink);color:var(--bg);padding:11px 14px 11px 18px;border-radius:999px;display:flex;gap:12px;align-items:center;font-size:15px;font-weight:550;box-shadow:0 10px 30px rgba(0,0,0,.25);transition:transform .25s,opacity .25s,visibility .25s;max-width:calc(100% - 32px)}
.toast.on{transform:translate(-50%,0);opacity:1;visibility:visible;pointer-events:auto}
.toast button{background:none;border:0;color:var(--bg);font-weight:700;text-decoration:underline;padding:0 4px}

@media (min-width:760px){
  .in{padding:0 24px}
  .top .in{height:62px}
  .logo b{font-size:30px}
  body{padding-bottom:40px}
  .nav{position:sticky;top:62px;bottom:auto;border-top:0;border-bottom:1px solid var(--rule)}
  .nav .in{height:48px;justify-content:flex-start;gap:4px}

const cleanCode = s => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
const okCode = c => c.length === 6 && [...c].every(ch => ALPH.includes(ch));

  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',

const PRESETS = ['$1/$2 NLH', '$1/$3 NLH', '$2/$5 NLH', '$5/$10 NLH', 'PLO $1/$2', 'Tournaments'];
const GAMES = ['NLH', 'PLO', 'Mixed'];
const TAGS = ['bluff', 'value', 'cooler', 'mistake'];
const POS = ['UTG', 'UTG+1', 'MP', 'LJ', 'HJ', 'CO', 'BTN', 'SB', 'BB'];

/* ================= state ================= */
let S = null;

const other = () => S.me === 'a' ? 'b' : 'a';
const nameOf = slot => (S.names[slot] || '').trim() || (slot === S.me ? 'You' : 'Your partner');
const myName = () => nameOf(S.me), theirName = () => nameOf(other());
function setMeta(f) { const t = stamp(); for (const k of Object.keys(f)) { S[k] = f[k]; S._t[k] = t; } }

}

/* ================= stats ================= */
function bbOf(st) { const m = String(st || '').match(/\$?([\d.]+)\s*\/\s*\$?([\d.]+)/); return m ? parseFloat(m[2]) : 0; }

/* ================= P2P ================= */

function askAccept(d) {

/* ---------- backup, link, csv */
const b64u = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');

function readSession() {

const ROOMS = ['Horseshoe', 'Rivers', 'MGM National Harbor', 'Hollywood', 'Bellagio', 'Ignition'];
function sampleSession() {
  const d = new Date(); d.setDate(d.getDate() - Math.floor(Math.random() * 90));
  const buyin = 200 + Math.round(Math.random() * 30) * 10, res = -400 + Math.round(Math.random() * 110) * 10;
  const hours = +(2 + Math.random() * 6).toFixed(1), hands = 150 + Math.round(Math.random() * 250);
  const stakes = Math.random() < .7 ? S.game === 'Tournaments' ? '$1/$2 NLH' : S.game : ['$1/$2 NLH', '$1/$3 NLH', '$2/$5 NLH'][Math.floor(Math.random() * 3)];
  const room = S.rooms.length && Math.random() < .6 ? S.rooms[Math.floor(Math.random() * S.rooms.length)] : ROOMS[Math.floor(Math.random() * ROOMS.length)];
  return create({ kind: 'session', type: 'cash', on: isoDay(d), room, game: /PLO/.test(stakes) ? 'PLO' : 'NLH', stakes, buyin, out: Math.max(0, buyin + res), hours, hands, note: '', re: 0, place: null, field: null, by: S.me, at: Date.now() });
}
function loadSample() {
  const ch = []; for (let i = 0; i < 8; i++) ch.push(sampleSession());
  const s = ch[0];
  ch.push(create({ kind: 'hand', session: s.id, pos: 'BTN', stakes: s.stakes, text: 'UTG limps, I raise AQo to $15 on the button, BB and UTG call. Flop A 9 4 two hearts, checks to me, I bet $25, BB calls. Turn 2, check, I bet $60, call. River K, check, I check back. BB shows A9.', board: 'Ah 9d 4c · 2s · Kh', result: -100, tags: ['value', 'cooler'], by: S.me, at: Date.now() }));
  save(true); broadcast(ch); render(true); toast('Loaded eight example sessions and a hand. Delete them whenever.');
}
function finishSetup(name, cur, bank, game, rooms, join) {
  if (!S) S = blank();
  S.names[S.me] = String(name || '').trim().slice(0, 30); S._t.names = stamp();
  S.cur = cur || 'USD'; S._t.cur = stamp(); S.game = game || PRESETS[0]; S._t.game = stamp(); S.rooms = (rooms || []).slice(0, 30); S._t.rooms = stamp(); S._t.stakes = stamp();
  S.bankroll.start = bank || 0; S.bankroll._t.start = stamp();
  S.started = true;
  if (join && okCode(join) && join !== S.dev) { S.joined = true; S.pending = join; }
  save(true); begin();
  if (S.pending) { setNet('dialing'); openPair(); }
}

/* ================= events ================= */
let toastT = 0;
function toast(msg, undo) {
  const t = $('#toast');
  t.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button type="button" id="undo">Undo</button>' : ''}`;
  if (undo) $('#undo').onclick = () => { undo(); t.classList.remove('on'); };
  t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), undo ? 6000 : 3000);
}
function applyTheme() {
  const t = LS.get(THEME, '');
  if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
  if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.dataset.dark = '1'; else delete document.documentElement.dataset.dark;
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
document.addEventListener('click', async e => {
  const a = e.target.closest('button,a'); if (!a) return;
  const d = a.dataset;
  if (a.id === 'home') { e.preventDefault(); if (S && S.started) { tab = 'home'; render(); } return; }
  if (d.close != null) { closeSheet(); return; }
  if (d.tab) { tab = d.tab; render(); return; }
  if (d.game) { $$('[data-game]').forEach(b => b.setAttribute('aria-pressed', String(b === a))); return; }
  if (d.addroom != null) { const i = $('#sr'); const v = i.value.trim().slice(0, 40); if (v && !landRooms.includes(v)) landRooms.push(v); i.value = ''; paintRooms(); i.focus(); return; }
  if (d.rmroom != null) { landRooms.splice(+d.rmroom, 1); paintRooms(); return; }
  if (!S || !S.started) return;
  if (d.gx) { gx = d.gx; render(true); return; }
  if (d.start != null) { openStart(); return; }
  if (d.lst) { $$('[data-lst]').forEach(b => b.setAttribute('aria-pressed', String(b === a))); return; }
  if (d.golive != null) { startLive(); return; }
  if (d.addon != null) { addOn(+d.addon); return; }
  if (d.end != null) { openSession('', S.live); return; }
  if (d.log != null) { openSession(''); return; }
  if (d.sample != null) { loadSample(); return; }
  if (d.open) { openSession(d.open); return; }
  if (d.stype) { readSession(); form.type = d.stype; if (d.stype === 'mtt' && S.stakes.includes(form.stakes)) form.stakes = ''; if (d.stype === 'cash' && !S.stakes.includes(form.stakes)) form.stakes = S.game === 'Tournaments' ? S.stakes[0] : S.game; paintSession(); return; }
  if (d.savesession != null) { saveSession(); return; }
  if (d.del) { del(d.del); return; }
  if (d.ftype != null) { filt.type = d.ftype; render(true); return; }
  if (d.fclear != null) { filt = { type: '', stakes: '', room: '', from: '', to: '' }; render(true); return; }
  if (d.htag != null) { htag = d.htag; render(true); return; }
  if (d.newhand != null) { openHand('', d.newhand || ''); return; }
  if (d.hand) { openHand(d.hand); return; }
  if (d.htg) { a.setAttribute('aria-pressed', String(a.getAttribute('aria-pressed') !== 'true')); return; }
  if (d.savehand != null) { saveHand(); return; }
  if (d.comment) { postComment(d.comment); return; }
  if (d.pair != null || a.id === 'pairBtn') { openPair(); return; }
  if (d.dial != null) { pairCode($('#pcode').value); return; }
  if (d.copycode != null) { try { await navigator.clipboard.writeText(fmtCode(S.dev)); toast('Code copied'); } catch (er) { prompt('Your code:', fmtCode(S.dev)); } return; }
  if (d.copylink != null) { const u = APP + '?join=' + S.dev; try { await navigator.clipboard.writeText(u); toast('Link copied'); } catch (er) { prompt('Copy this link:', u); } return; }
  if (d.forget != null) { S.partner = null; S.pending = null; save(true); for (const c of conns) try { c.close(); } catch (er) { /* gone */ } conns.clear(); setNet(peer ? 'ready' : 'idle'); openPair(); toast('Partner forgotten'); return; }
  if (d.accept != null) { const p = pendingAsk; pendingAsk = null; if (p) { closeSheet(); acceptHello(p.c, p.d, false); } return; }
  if (d.reject != null) { closeSheet(); return; }
  if (a.id === 'menuBtn') { openMenu(); return; }
  if (d.settings != null) { openSettings(); return; }
  if (d.sg) { $$('[data-sg]').forEach(b => b.setAttribute('aria-pressed', String(b === a))); return; }
  if (d.savesettings != null) {
    const n = $('#stn').value.trim().slice(0, 30), p = $('#stp').value.trim().slice(0, 30), g = $('[data-sg][aria-pressed="true"]');
    const stakes = $('#sts').value.split('\n').map(s => s.trim()).filter(Boolean).slice(0, 20), rooms = $('#str').value.split('\n').map(s => s.trim()).filter(Boolean).slice(0, 30);
    const names = { a: S.names.a, b: S.names.b }; names[S.me] = n; names[other()] = p;
    setMeta({ names, cur: $('#stc').value, game: g ? g.dataset.sg : S.game, stakes: stakes.length ? stakes : PRESETS.slice(), rooms });
    const b = num($('#stb').value) || 0; if (b !== S.bankroll.start) { S.bankroll.start = b; S.bankroll._t.start = stamp(); }
    save(true); sendMeta(); closeSheet(); render(true); toast('Settings saved'); return;
  }
  if (d.backup != null) { openBackup(); return; }
  if (d.export != null) { dl('create-felt-backup.json', JSON.stringify(S, null, 2), 'application/json'); toast('Backup downloaded'); return; }
  if (d.csv != null) { dl(`felt-sessions-${isoDay()}.csv`, csv(), 'text/csv'); toast('CSV downloaded'); return; }
  if (d.copystate != null) { const p = await packState(); const u = APP + '#b=' + p; try { await navigator.clipboard.writeText(u); toast('Link copied. It holds your whole log.'); } catch (er) { prompt('Copy this link:', u); } return; }
  if (d.theme != null) { const cur = LS.get(THEME, ''); const nx = cur === '' ? 'light' : cur === 'light' ? 'dark' : ''; if (nx) LS.set(THEME, nx); else LS.del(THEME); applyTheme(); openMenu(); return; }
  if (d.reset != null) { if (!confirm('Clear Felt on this device? Your partner’s copy stays.')) return; LS.del(KEY); location.hash = ''; location.reload(); return; }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && sheetKind) closeSheet();
  if (e.key === 'Enter' && e.target.id === 'sr') { e.preventDefault(); $('[data-addroom]').click(); }
  if (e.key === 'Enter' && e.target.id === 'hcm') { e.preventDefault(); $('[data-comment]').click(); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'hq') { hq = t.value; const list = $('.list'); if (list) { const all = hands(), q = hq.trim().toLowerCase(); const l = all.filter(h => (!htag || (h.tags || []).includes(htag)) && (!q || [h.text, h.board, h.pos, h.stakes].join(' ').toLowerCase().includes(q))); list.innerHTML = l.length ? l.map(handRow).join('') : '<div class="empty"><h3>No hands match</h3><p>Try another word or tag.</p></div>'; } }
  if (t.id === 'hboard') { const p = $('#boardPrev'); if (p) p.innerHTML = cardsHTML(t.value); }
});
document.addEventListener('change', e => {
  const t = e.target, d = t.dataset;
  if (d.fstakes != null) { filt.stakes = t.value; render(true); }
  if (d.froom != null) { filt.room = t.value; render(true); }
  if (d.ffrom != null) { filt.from = t.value; render(true); }
  if (d.fto != null) { filt.to = t.value; render(true); }
  if (d.import && t.files && t.files[0]) importFile(t.files[0], d.import);
});
document.addEventListener('submit', e => {
  e.preventDefault(); const f = e.target; if (f.id !== 'startForm') return;
  const name = f.me.value.trim(); if (!name) return;
  const g = $('[data-game][aria-pressed="true"]');
  finishSetup(name, f.cur.value, num(f.bank.value), g ? g.dataset.game : PRESETS[0], landRooms, f.join ? cleanCode(f.join.value) : '');
});
$('#scrim').addEventListener('click', closeSheet);
addEventListener('storage', e => {
  if (e.key === INBOX) { if (S && S.started && drainInbox().length) render(true); return; }
  if (e.key !== KEY || !e.newValue || !S) return;
  let o; try { o = JSON.parse(e.newValue); } catch (er) { return; }
  if (!o || o.v !== 1) return;
  const ch = Object.values(o.items || {}).filter(mergeItem), m = mergeMeta(o);
  if (o.partner && (!S.partner || S.partner.code !== o.partner.code)) S.partner = o.partner;
  if (ch.length || m) { broadcast(ch); if (m) sendMeta(); render(true); }
});
addEventListener('pagehide', () => { if (S) save(true); });
document.addEventListener('visibilitychange', () => {
  if (!S || !S.started || document.hidden) return;
  if (drainInbox().length) render(true);
  if (S.partner && !openConns().length) { if (!peer) startPeer(); else dial(S.partner.code, true); }
});

/* ================= start ================= */
function begin() { drainInbox(true); render(); startPeer(); startDialLoop(); if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); }
(async () => {
  applyTheme(); load();
  const h = new URLSearchParams(location.hash.replace(/^#\/?/, ''));
  if (h.get('b')) { try { const p = await unpackState(h.get('b')); if (p && p.items) { if (!S) { S = blank(); } const n = mergeState(p); if (!S.started && p.started) { S.started = true; S.names = p.names || S.names; S.cur = p.cur || S.cur; S.game = p.game || S.game; S.stakes = p.stakes || S.stakes; S.rooms = p.rooms || S.rooms; save(true); } toast(n ? `${n} records merged from the link` : 'That link had nothing new'); } } catch (e) { toast('That link is incomplete. Ask for it again.'); } history.replaceState(null, '', location.pathname + location.search); }
  const j = cleanCode(qp.get('join') || '');
  if (S && S.started) {
    if (okCode(j) && j !== S.dev && (!S.partner || S.partner.code !== j)) { S.joined = true; S.pending = j; save(true); }
    begin();
    if (S.pending) { setNet('dialing'); openPair(); }
  } else renderLanding();
})();
window.__create = {
  id: 'felt',
  setup: name => { if (!S || !S.started) finishSetup(name, 'USD', 3000, '$1/$2 NLH', ['Horseshoe', 'Rivers']); else { S.names[S.me] = String(name).slice(0, 30); S._t.names = stamp(); save(true); render(true); } },
  code: () => S.dev,
  pair: code => pairCode(code),
  net: () => net,
  add: () => { const it = sampleSession(); save(true); broadcast([it]); render(true); return it.id; },
  count: () => Object.values(S.items).filter(it => !it.del && (it.kind === 'session' || it.kind === 'hand')).length,
  state: () => JSON.parse(JSON.stringify(S)),
  export: () => JSON.stringify(S)
};
})();
</script>
