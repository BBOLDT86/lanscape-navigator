<style>
:root{
  --bg:#F8F7F4; --raise:#FFFFFF; --sunk:#EFEBE4; --ink:#2A251F; --ink2:#62594F; --ink3:#968B7E; --rule:rgba(42,37,31,.12); --rule2:rgba(42,37,31,.22);
  --a:#C2785C; --a-soft:rgba(194,120,92,.15); --b:#5B7FA1; --b-soft:rgba(91,127,161,.15); --gold:#8B7355; --gold-soft:rgba(139,115,85,.16); --lens:#A88A5E;
  --ok:#3D7A55; --warn:#B4532F; --scrim:rgba(30,25,20,.45); --on:#fff;
  --shadow:0 1px 2px rgba(42,37,31,.05),0 8px 24px rgba(42,37,31,.07);
  --serif:'Instrument Serif','Iowan Old Style',Georgia,serif;
  --sans:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --p:#C2785C;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#191613; --raise:#24201B; --sunk:#131110; --ink:#F2EDE6; --ink2:#C6BCAF; --ink3:#918679; --rule:rgba(242,237,230,.12); --rule2:rgba(242,237,230,.24);
  --a:#E39B7F; --a-soft:rgba(227,155,127,.17); --b:#8FB1D2; --b-soft:rgba(143,177,210,.17); --gold:#CDB089; --gold-soft:rgba(205,176,137,.17); --lens:#BFA27A;
  --ok:#7EC39B; --warn:#F08C66; --scrim:rgba(0,0,0,.62); --on:#191613; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.34); color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#191613; --raise:#24201B; --sunk:#131110; --ink:#F2EDE6; --ink2:#C6BCAF; --ink3:#918679; --rule:rgba(242,237,230,.12); --rule2:rgba(242,237,230,.24);
  --a:#E39B7F; --a-soft:rgba(227,155,127,.17); --b:#8FB1D2; --b-soft:rgba(143,177,210,.17); --gold:#CDB089; --gold-soft:rgba(205,176,137,.17); --lens:#BFA27A;
  --ok:#7EC39B; --warn:#F08C66; --scrim:rgba(0,0,0,.62); --on:#191613; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.34); color-scheme:dark; }
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--serif);font-weight:400;margin:0;letter-spacing:-.01em}
.in{max-width:760px;margin:0 auto;padding:0 16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--rule);padding-top:env(safe-area-inset-top)}
.top .in{display:flex;align-items:center;gap:8px;height:56px}
.logo{display:flex;align-items:baseline;gap:8px;text-decoration:none;flex:1;min-width:0;white-space:nowrap;overflow:hidden}
.logo span{font:400 27px/1 var(--serif)}
.logo small{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--p)}
.tools{display:flex;align-items:center;gap:8px;flex:none}
.pill{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 13px;border-radius:999px;border:1px solid var(--rule2);background:var(--raise);font-size:14px;font-weight:600;white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:transparent;border:1.5px solid var(--ink3);flex:none}
.pill.on i{background:var(--ok);border-color:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 22%,transparent)}
.pill.wait i{background:var(--gold);border-color:var(--gold);animation:pulse 1.4s infinite}
.pill.away i{background:var(--ink3);border-color:var(--ink3)}
@keyframes pulse{50%{opacity:.35}}
.ic{width:40px;height:40px;border-radius:50%;border:1px solid var(--rule2);background:var(--raise);display:inline-flex;align-items:center;justify-content:center;padding:0;flex:none}
.ic svg{width:18px;height:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--rule2);background:var(--raise);font-size:15px;font-weight:600;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--ink3)}
.btn.p{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.sm{height:36px;padding:0 14px;font-size:14px}
.btn.warn{color:var(--warn)}
.btn svg{width:16px;height:16px}
.lk{background:none;border:0;padding:0;color:var(--gold);font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.tabs{display:flex;gap:4px;padding:10px 0 2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{height:38px;padding:0 15px;border-radius:999px;border:1px solid transparent;background:transparent;font-weight:600;font-size:14.5px;white-space:nowrap;color:var(--ink2)}
.tabs button[aria-selected="true"]{background:var(--raise);border-color:var(--rule2);color:var(--ink);box-shadow:var(--shadow)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:4px 13px;border-radius:999px;border:1px solid var(--rule2);background:transparent;font-size:14px;font-weight:600;white-space:nowrap}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c,var(--p));flex:none}
.chip[aria-pressed="true"]{background:var(--sunk);border-color:var(--ink3)}
.chip.add{border-style:dashed;color:var(--ink2)}

/* content */
main{padding-bottom:calc(40px + env(safe-area-inset-bottom))}
.card{background:var(--raise);border:1px solid var(--rule);border-radius:18px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:24px;line-height:1.1}
.card h3{font-size:20px}
.stack{display:flex;flex-direction:column;gap:12px;padding-top:12px}
.hd{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hd p{margin:0;color:var(--ink3);font-size:13.5px}
.today{padding:16px 0 4px}
.today h1{font-size:38px;line-height:1.02}
.today p{margin:4px 0 0;color:var(--ink2)}
.big{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:64px;border-radius:20px;border:0;background:var(--p);color:#fff;font:600 19px var(--sans);box-shadow:var(--shadow)}
.big svg{width:22px;height:22px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g2>*{min-width:0}
.stat b{display:block;font:400 40px/1 var(--serif);margin-top:2px}
.stat b small{font:400 20px var(--serif);color:var(--ink3)}
.stat span{font-size:13px;color:var(--ink3);display:block}
.stat .lb{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3)}
.ringw{display:flex;align-items:center;gap:14px}
.ring{width:84px;height:84px;flex:none}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring .tr{stroke:var(--sunk)}
.ring .pr{stroke:var(--p);transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dasharray .4s}
.ring text{font:600 15px var(--sans);fill:var(--ink)}
.yg{overflow-x:auto;scrollbar-width:thin;margin:0 -4px;padding:0 4px}
.yg svg{display:block;width:100%;min-width:620px;height:auto}
.yg rect{fill:var(--p);rx:2;cursor:pointer}
.yg .l0{fill:var(--sunk)}
.yg .l1{fill-opacity:.3}.yg .l2{fill-opacity:.55}.yg .l3{fill-opacity:.8}.yg .l4{fill-opacity:1}
.yg rect.sel{stroke:var(--ink);stroke-width:1.5}
.yg text{font:500 10px var(--sans);fill:var(--ink3)}
.leg{display:flex;align-items:center;gap:4px;justify-content:flex-end;font-size:12px;color:var(--ink3);margin-top:6px}
.leg i{width:11px;height:11px;border-radius:2px;background:var(--p)}
.leg .l0{background:var(--sunk)}.leg .l1{opacity:.3}.leg .l2{opacity:.55}.leg .l3{opacity:.8}
.dayp{border-top:1px solid var(--rule);margin-top:12px;padding-top:12px}
.sess{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--rule)}
.sess:last-child{border-bottom:0}
.sess .dt{flex:none;width:44px;text-align:center;line-height:1.1}
.sess .dt b{display:block;font:400 24px var(--serif)}
.sess .dt small{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3)}
.sess .bd{flex:1;min-width:0}
.sess .ln{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sess .mn{font-weight:650}
.sess .by{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--ink3)}
.sess .by i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.tg{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.tg span{font-size:12.5px;font-weight:600;background:var(--sunk);border-radius:999px;padding:2px 9px}
.sess p{margin:5px 0 0;font-size:14.5px;color:var(--ink2);white-space:pre-wrap;overflow-wrap:anywhere}
.sess .ed{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:transparent;color:var(--ink3);display:inline-flex;align-items:center;justify-content:center}
.sess .ed svg{width:18px;height:18px}
.rt{display:inline-flex;gap:3px;align-items:center}
.rt i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--p);display:inline-block}
.rt i.f{background:var(--p)}
.nts{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.nt{border-left:3px solid var(--c);padding:4px 10px;font-size:14px;color:var(--ink2);background:var(--sunk);border-radius:0 10px 10px 0}
.nt b{color:var(--c);font-weight:650;font-size:13px;display:block}
.nt .x{float:right;background:none;border:0;color:var(--ink3);font-size:13px;padding:0 2px}
.nt-add{display:flex;gap:6px;margin-top:8px}
.nt-add input{flex:1;min-width:0;height:40px;border-radius:10px;border:1px solid var(--rule2);background:var(--raise);padding:0 12px;font-size:15px}
.mon{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:18px 0 0;padding-bottom:4px;border-bottom:1px solid var(--rule2)}
.mon h3{font-size:22px}
.mon span{font-size:13.5px;color:var(--ink3)}
.bars{width:100%;height:auto;display:block}
.bars rect{fill:var(--p)}
.bars .g{fill:none;stroke:var(--ink3);stroke-dasharray:3 3}
.bars text{font:500 10.5px var(--sans);fill:var(--ink3)}
.tot{display:flex;flex-direction:column;gap:6px}
.tot div{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;font-size:14.5px}
.tot .br{grid-column:1/-1;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.tot .br i{display:block;height:100%;background:var(--p);border-radius:3px}
.prog{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden;margin:8px 0 4px}
.prog i{display:block;height:100%;background:var(--p);border-radius:5px;transition:width .4s}
.prog.done i{background:var(--ok)}
.empty{border:1.5px dashed var(--rule2);border-radius:20px;padding:30px 20px;text-align:center}
.empty h2{font-size:30px}
.empty p{margin:8px auto 16px;max-width:46ch;color:var(--ink2)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.c{justify-content:center}
.hint{font-size:13.5px;color:var(--ink3);margin:6px 0 0}
.note-c{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--rule)}
.note-c .av{width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.note-c .bd{flex:1;min-width:0}
.note-c small{color:var(--ink3);font-size:13px;display:block}
.note-c p{margin:2px 0 0;font-size:15px}

/* forms */
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld label,.lb{font-size:13px;font-weight:650;color:var(--ink2)}
.fld input,.fld select,.fld textarea{height:46px;border-radius:12px;border:1px solid var(--rule2);background:var(--raise);padding:0 14px;font-size:16px;width:100%;min-width:0}
.fld textarea{height:auto;min-height:80px;padding:11px 14px;resize:vertical;line-height:1.45}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{height:44px;min-width:52px;padding:0 12px;border-radius:12px;border:1px solid var(--rule2);background:var(--raise);font-weight:600}
.quick button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.quick input{width:84px;height:44px;border-radius:12px;border:1px solid var(--rule2);background:var(--raise);padding:0 12px;font-size:16px}
.dots{display:flex;gap:8px}
.dots button{width:44px;height:44px;border-radius:50%;border:0;background:transparent;display:flex;align-items:center;justify-content:center;padding:0}
.dots button i{width:24px;height:24px;border-radius:50%;border:2px solid var(--p);display:block}
.dots button[aria-pressed="true"] i{background:var(--p)}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:36px;height:36px;border-radius:50%;border:3px solid transparent;padding:0}
.sw button[aria-pressed="true"]{border-color:var(--ink)}
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.presets button{display:flex;align-items:center;gap:9px;height:48px;padding:0 14px;border-radius:14px;border:1px solid var(--rule2);background:var(--raise);font-weight:600;text-align:left}
.presets button i{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none}
.presets button[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink)}
.land{padding-top:28px;padding-bottom:10px}
.eyebrow{margin:0 0 10px;font-size:13px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--p)}
.land h1{font-size:clamp(40px,8vw,64px);line-height:.98;letter-spacing:-.02em}
.land h1 em{color:var(--p);font-style:italic}
.lede{margin:14px 0 0;font-size:17px;color:var(--ink2);max-width:56ch}
.feat{list-style:none;padding:0;margin:30px 0 0;display:grid;grid-template-columns:1fr;gap:12px}
.feat li{border-top:1px solid var(--rule2);padding:12px 2px 0}
.feat b{display:block;font:400 22px/1.1 var(--serif);margin-bottom:3px}
.feat span{color:var(--ink2);font-size:14.5px}

/* sheet, toast */
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:41;left:50%;bottom:0;width:min(600px,100%);max-height:calc(100% - 40px);background:var(--bg);border-radius:22px 22px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.2);transform:translate(-50%,105%);transition:transform .26s cubic-bezier(.2,.8,.2,1);overflow-y:auto;overscroll-behavior:contain;padding:0 0 calc(24px + env(safe-area-inset-bottom))}
.sheet.on{transform:translate(-50%,0)}
.shh{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:14px 18px 10px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--rule)}
.shh h2{flex:1;font-size:27px;line-height:1.1;min-width:0}
.shb{padding:16px 18px 6px;display:flex;flex-direction:column;gap:14px}
.box{border:1px solid var(--rule);background:var(--raise);border-radius:18px;padding:16px}
.box h3{font-size:19px;margin-bottom:3px}
.box p{margin:4px 0;color:var(--ink2);font-size:14.5px}
.box p.code{font:400 50px/1 var(--serif);letter-spacing:.08em;text-align:center;margin:12px 0 6px;color:var(--ink)}
.qr{width:180px;height:180px;margin:10px auto;background:#fff;border-radius:14px;padding:10px}
.qr svg{width:100%;height:100%;display:block}
.srch{display:flex;gap:8px}
.srch input{flex:1;min-width:0;height:46px;border-radius:12px;border:1px solid var(--rule2);background:var(--raise);padding:0 14px;font-size:16px}
.status{margin:10px 0 0;font-size:14px;font-weight:600;text-align:center}
.status.ok{color:var(--ok)}.status.bad{color:var(--warn)}
.menu-l{display:flex;flex-direction:column}
.menu-l button,.menu-l label{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;border:0;background:transparent;padding:12px 4px;border-bottom:1px solid var(--rule);font-weight:600;font-size:16px;cursor:pointer;width:100%}
.menu-l small{font-weight:400;color:var(--ink3);font-size:13.5px}
.menu-l .warn{color:var(--warn)}
.plist{display:flex;flex-direction:column;gap:8px}
.plist div{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--rule)}
.plist div i{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none}
.plist div b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;visibility:hidden;pointer-events:none;z-index:60;background:var(--ink);color:var(--bg);padding:11px 16px 11px 18px;border-radius:999px;display:flex;gap:12px;align-items:center;font-size:15px;font-weight:550;box-shadow:0 10px 30px rgba(0,0,0,.25);transition:transform .25s,opacity .25s,visibility .25s;max-width:calc(100% - 32px)}
.toast.on{transform:translate(-50%,0);opacity:1;visibility:visible;pointer-events:auto}
.toast button{background:none;border:0;color:var(--bg);font-weight:700;text-decoration:underline;padding:0 4px}
@media (min-width:760px){
  .in{padding:0 24px}
  .home{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .home>.full{grid-column:1/-1}
  .today h1{font-size:46px}
  .feat{grid-template-columns:repeat(3,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top"><div class="in">
  <a class="logo" href="#" id="logo" aria-label="Practice, home"><span>Practice</span><small>Create</small></a>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js" defer></script>
<script>
'use strict';
/* Create · Practice: a practice log for any pursuit. Sessions live in this browser (localStorage create.practice.v1)
   and travel phone to phone over WebRTC (PeerJS); a coach who connects sees the log and leaves notes on sessions. */
(() => {
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const KEY = 'create.practice.v1', INBOX = 'create.practice.inbox', THEME = 'create.theme';
const LS = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
             set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
             del(k) { try { localStorage.removeItem(k); } catch (e) {} } };
const ALPH = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const code6 = () => { const a = new Uint32Array(6); crypto.getRandomValues(a); return [...a].map(x => ALPH[x % ALPH.length]).join(''); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
let lastStamp = 0; const SALT = Math.floor(Math.random() * 90) + 10;
function stamp() { const t = Math.max(Date.now(), Math.floor(lastStamp / 100) + 1); lastStamp = t * 100 + SALT; return lastStamp; }
const seeStamp = n => { if (n > lastStamp) lastStamp = n; };
const fmtCode = c => c ? c.slice(0, 3) + '-' + c.slice(3) : '';
const cleanCode = s => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
const okCode = c => c.length === 6 && [...c].every(ch => ALPH.includes(ch));
const clone = o => JSON.parse(JSON.stringify(o));
const pad = n => String(n).padStart(2, '0');
const isoDay = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const DD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = DD(s); d.setDate(d.getDate() + n); return isoDay(d); };
const md = s => DD(s).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
const longDay = s => DD(s).toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
const monName = s => DD(s + '-01').toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
const weekStart = s => { const d = DD(s); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return isoDay(d); }; // Monday
const hm = m => m >= 60 ? `${Math.floor(m / 60)}h${m % 60 ? ' ' + (m % 60) + 'm' : ''}` : `${m}m`;
const qp = new URLSearchParams(location.search);
const PAGE = location.href.split(/[?#]/)[0];
const IC = {
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  pen: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4l10-10-4-4L4 16z"/><path d="M12 6l4 4"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>'
};
const PRESETS = {
  dressage: { name: 'Dressage', color: '#8B6A4E', tags: ['Walk work', 'Lateral', 'Transitions', 'Canter', 'Test ride'] },
  woodworking: { name: 'Woodworking', color: '#A0723A', tags: ['Milling', 'Joinery', 'Finishing', 'Sharpening'] },
  poker: { name: 'Poker', color: '#2F6F5E', tags: ['Preflop', 'Solver', 'Hand review', 'Live play', 'Mental game'] },
  music: { name: 'Music', color: '#5B5EA6', tags: ['Scales', 'Technique', 'Repertoire', 'Sight reading', 'Ear'] },
  running: { name: 'Running', color: '#3E7CB1', tags: ['Easy', 'Tempo', 'Intervals', 'Long run'] },
  writing: { name: 'Writing', color: '#8A4F6D', tags: ['Drafting', 'Revision', 'Outlining', 'Reading'] },
  language: { name: 'Language', color: '#C2785C', tags: ['Vocabulary', 'Grammar', 'Listening', 'Speaking', 'Reading'] }
};
const COLORS = ['#C2785C', '#8B6A4E', '#A0723A', '#2F6F5E', '#5B5EA6', '#3E7CB1', '#8A4F6D', '#5B7FA1'];

/* ================= state ================= */
let S = null;
function blank() { return { v: 1, dev: code6(), me: 'a', joined: false, partner: null, pending: null, names: { a: '', b: '' }, cur: '', pursuits: {}, items: {}, _t: {} }; }
function load() {
  let s = LS.get(KEY, null);
  if (!s || typeof s !== 'object') return null;
  const b = blank();
  for (const k of Object.keys(b)) if (s[k] === undefined) s[k] = b[k];
  s.v = 1;
  for (const p of Object.values(s.pursuits)) { p._t = p._t || {}; p.goal = p.goal || {}; p.tags = p.tags || []; }
  for (const it of Object.values(s.items)) { it._t = it._t || {}; for (const v of Object.values(it._t)) seeStamp(v); }
  for (const p of Object.values(s.pursuits)) for (const v of Object.values(p._t)) seeStamp(v);
  for (const v of Object.values(s._t)) seeStamp(v);
  return s;
}
let saveT = 0, saveWarned = false;
function save(now) {
  clearTimeout(saveT);
  const go = () => { if (!S) return; if (!LS.set(KEY, S) && !saveWarned) { saveWarned = true; toast('This browser’s storage is full; the log can’t save right now.'); } };
  if (now) go(); else saveT = setTimeout(go, 120);
}
const other = () => S.me === 'a' ? 'b' : 'a';
const nameOf = slot => (S.names[slot] || '').trim() || (slot === S.me ? 'You' : 'Your coach');
const myName = () => nameOf(S.me), theirName = () => nameOf(other());
const colorOf = slot => slot === 'a' ? 'var(--a)' : 'var(--b)';
function setName(slot, n) { S.names[slot] = String(n || '').trim().slice(0, 30); S._t['n' + slot] = stamp(); }
function setF(it, f) { const t = stamp(); for (const k of Object.keys(f)) { it[k] = f[k]; it._t[k] = t; } return it; }
function create(id, f) { const it = { id, _t: {} }; setF(it, f); S.items[id] = it; return it; }
const live = () => Object.values(S.items).filter(it => !it.del);
const sessions = p => live().filter(it => it.kind !== 'note' && (!p || it.pursuit === p));
const notesFor = sid => live().filter(it => it.kind === 'note' && it.session === sid).sort((x, y) => (x.at || 0) - (y.at || 0));
const pursuits = () => Object.values(S.pursuits).filter(p => !p.del).sort((x, y) => (x.at || 0) - (y.at || 0));
function curP() { const ps = pursuits(); if (!ps.length) return null; return S.pursuits[S.cur] && !S.pursuits[S.cur].del ? S.pursuits[S.cur] : ps[0]; }
function mergeInto(map, r) {
  if (!r || !r.id) return false;
  for (const v of Object.values(r._t || {})) seeStamp(v);
  const L = map[r.id];
  if (!L) { map[r.id] = clone(r); map[r.id]._t = map[r.id]._t || {}; return true; }
  let ch = false;
  for (const k of Object.keys(r._t || {})) if ((r._t[k] || 0) > (L._t[k] || 0)) { L[k] = r[k]; L._t[k] = r._t[k]; ch = true; }
  return ch;
}
const mergeItem = r => mergeInto(S.items, r);
const mergePursuit = r => mergeInto(S.pursuits, r);
function mergeMeta(m) {
  if (!m || !m._t) return false;
  let ch = false;
  for (const slot of ['a', 'b']) { const k = 'n' + slot; if ((m._t[k] || 0) > (S._t[k] || 0)) { S.names[slot] = m.names[slot]; S._t[k] = m._t[k]; ch = true; } }
  return ch;
}
function swapSlots() {
  S.me = other();
  const n = S.names, t = S._t;
  [n.a, n.b] = [n.b, n.a]; [t.na, t.nb] = [t.nb, t.na];
  for (const it of Object.values(S.items)) if (it.by) it.by = it.by === 'a' ? 'b' : 'a';
  for (const k of ['na', 'nb']) if (t[k] === undefined) delete t[k];
}
function addPursuit(kind, name, color, tags, goal) {
  const id = 'p' + uid();
  const p = { id, _t: {} };
  setF(p, { name: name.slice(0, 40), kind: kind || 'custom', color, tags: tags.slice(0, 12), goal: goal || {}, at: Date.now(), del: false });
  S.pursuits[id] = p; S.cur = id; S._t.cur = stamp();
  return p;
}
function dedupePursuits() { // two devices each started the same preset: the empty copy yields to the one with sessions
  const ps = pursuits();
  for (const p of ps) for (const q of ps) {
    if (p === q || p.del || q.del || p.kind === 'custom' || p.kind !== q.kind || p.name !== q.name) continue;
    const np = sessions(p.id).length, nq = sessions(q.id).length;
    if (np && nq) continue;
    const loser = np ? q : nq ? p : p.id > q.id ? p : q;
    setF(loser, { del: true }); if (S.cur === loser.id) S.cur = (loser === p ? q : p).id;
  }
}
function drainInbox(quiet) {
  if (!S) return [];
  const q = LS.get(INBOX, []);
  if (!Array.isArray(q) || !q.length) return [];
  LS.set(INBOX, []);
  const p = curP(); if (!p) return [];
  const made = [];
  for (const e of q) { if (!e || typeof e !== 'object') continue; const mins = Math.max(1, Math.min(600, +e.mins || 30)); made.push(create('s' + uid(), { pursuit: p.id, on: /^\d{4}-\d\d-\d\d$/.test(e.on || '') ? e.on : isoDay(), mins, focus: Array.isArray(e.focus) ? e.focus.map(String).slice(0, 6) : [], rating: Math.min(5, Math.max(0, +e.rating || 0)), note: String(e.note || '').slice(0, 1000), by: S.me, at: e.at || Date.now(), del: false })); }
  if (made.length) { save(true); broadcast(made); if (!quiet) toast(made.length === 1 ? 'A session came in from the site' : `${made.length} sessions came in`); }
  return made;
}

/* ================= sync (protocol v2) ================= */
const PID = c => 'create-prc-' + String(c).toLowerCase();
function peerOpts() { const q = qp.get('peer'); if (q) { const [h, p] = q.split(':'); return { host: h, port: +p || 9000, path: '/', secure: location.protocol === 'https:', debug: 0 }; } return { debug: 0 }; }
let peer = null, net = 'idle', netMsg = '', dialT = 0, pendingAsk = null;
const conns = new Set();
const openConns = () => [...conns].filter(c => c.open);
const isOn = () => openConns().some(c => c._hello);
function setNet(n, msg) { net = n; netMsg = msg || ''; paintPresence(); paintPairStatus(); }
function startPeer() {
  if (!S || peer) return;
  if (!window.Peer) {
    if (document.readyState === 'loading') { setNet('starting'); document.addEventListener('DOMContentLoaded', startPeer, { once: true }); }
    else setNet('nolib', 'The sync library didn’t load. Practice still works on this device; back up from the menu.');
    return;
  }
  setNet('starting');
  try { peer = new window.Peer(PID(S.dev), peerOpts()); } catch (e) { peer = null; setNet('error', 'Sync couldn’t start in this browser.'); return; }

  peer.on('connection', c => wire(c, false));
  peer.on('disconnected', () => { if (!openConns().length) setNet('offline', 'Lost the matchmaking server. Trying again…'); setTimeout(() => { if (peer && !peer.destroyed && peer.disconnected) try { peer.reconnect(); } catch (e) {} }, 4000); });
  peer.on('close', () => { peer = null; });
  peer.on('error', e => {
    const t = e && e.type;
    if (t === 'unavailable-id') { setNet('error', 'Practice is open in another tab on this device; that one keeps the connection.'); try { peer.destroy(); } catch (er) {} peer = null; return; }
    if (t === 'peer-unavailable') { if (openConns().length) return; setNet('away', S.pending ? `${fmtCode(S.pending)} isn’t open right now. Practice keeps trying while this page is open.` : ''); return; }
    if (t === 'network' || t === 'server-error' || t === 'socket-error' || t === 'socket-closed') { if (!openConns().length) setNet('offline', 'Can’t reach the matchmaking server. Your log still works here.'); return; }
    if (t === 'browser-incompatible') { setNet('nolib', 'This browser can’t make direct connections. Use a backup file instead.'); return; }
    if (!openConns().length) setNet('error', 'Sync hit a snag (' + (t || 'unknown') + ').');
  });
}
function dial(code) {
  if (!peer || peer.destroyed || peer.disconnected || !code || code === S.dev) return;
  if (openConns().some(c => c.peer === PID(code))) return;
  setNet('dialing');
  const c = peer.connect(PID(code), { reliable: true, metadata: { v: 1 } });
  wire(c, true, code);
}
function wire(c, outgoing) {
  conns.add(c); c._hello = false; c._sent = false;
  c.on('open', () => { if (outgoing) { c._sent = true; send(c, hello()); } paintPresence(); });
  c.on('data', d => { try { onMsg(c, d, outgoing); } catch (e) { console.warn('practice: bad message', e); } });
  c.on('close', () => { conns.delete(c); if (!openConns().length) setNet(S.partner ? 'away' : 'ready'); paintPresence(); });
  c.on('error', () => { conns.delete(c); paintPresence(); });
}
function send(c, m) { try { if (c.open) c.send(m); } catch (e) {} }
function hello() { return { t: 'hello', v: 1, dev: S.dev, me: S.me, joined: !!S.joined, names: S.names, _t: S._t, pursuits: S.pursuits, cur: S.cur, items: S.items, name: myName() }; }
function broadcast(items) { if (!items || !items.length) return; const m = { t: 'put', items: items.map(it => S.items[it.id] || it) }; for (const c of openConns()) if (c._hello) send(c, m); }
function sendMeta() { const m = { t: 'meta', names: S.names, _t: S._t, pursuits: S.pursuits }; for (const c of openConns()) if (c._hello) send(c, m); }
function onMsg(c, d, outgoing) {
  if (!d || typeof d !== 'object') return;
  if (d.t === 'hello') {
    if (d.dev === S.dev) return;
    const known = S.partner && S.partner.code === d.dev;
    if (!known && S.partner && !outgoing && !c._ok) { pendingAsk = { c, d }; askAccept(d); return; }
    acceptHello(c, d, outgoing); return;
  }
  if (!c._hello) return;
  if (d.t === 'put' && Array.isArray(d.items)) {
    const before = new Set(live().map(it => it.id));
    const ch = d.items.filter(mergeItem);
    if (ch.length) {
      save(true); render();
      const fresh = ch.filter(it => !before.has(it.id) && !it.del && it.by === other());
      if (fresh.length) { const n = fresh.filter(it => it.kind === 'note').length; toast(n === fresh.length ? `${theirName()} left ${n === 1 ? 'a note' : n + ' notes'}` : `${theirName()} logged ${fresh.length === 1 ? 'a session' : fresh.length + ' sessions'}`); }
    }
  } else if (d.t === 'meta') {
    let ch = mergeMeta(d);
    for (const p of Object.values(d.pursuits || {})) if (mergePursuit(p)) ch = true;
    if (ch) { save(); render(); }
  }
}
function acceptHello(c, d, outgoing) {
  c._ok = true;
  let wait = false, swapped = false;
  if (d.me === S.me) { const yieldMe = S.joined && !d.joined ? true : !S.joined && d.joined ? false : S.dev > d.dev; if (yieldMe) { swapSlots(); swapped = true; } else wait = true; }
  const first = !S.partner || S.partner.code !== d.dev;
  S.partner = { code: d.dev, at: Date.now() }; S.pending = null;
  const before = new Set(live().map(it => it.id));
  if (!wait) {
    mergeMeta(d);
    if (d.name && !S.names[other()]) setName(other(), d.name);
    for (const p of Object.values(d.pursuits || {})) mergePursuit(p);
    for (const it of Object.values(d.items || {})) mergeItem(it);
    dedupePursuits();
    if (!curP() && d.cur && S.pursuits[d.cur]) S.cur = d.cur;
    S.joined = false;
  }
  save(true); c._hello = true;
  if (!c._sent || swapped) { c._sent = true; send(c, hello()); }

  if (first && !wait) toast(`Connected with ${theirName()}.${got ? ` ${got} ${got === 1 ? 'entry' : 'entries'} came over.` : ''}`);
  else if (got && !wait) toast(`${got} new from ${theirName()}`);

function askAccept(d) {
  openSheet('ask', head('Connect a new device?') + `<div class="shb"><div class="box"><h3>${esc(d.name || 'Someone')} wants to connect</h3><p>Code ${esc(fmtCode(d.dev))}. A device you haven’t connected before used your code. Let it in and it gets a copy of the log; it will reconnect by itself from then on.</p>
    <div class="row" style="margin-top:12px"><button class="btn p" type="button" data-accept>Accept</button><button class="btn" type="button" data-reject>Not now</button></div></div></div>`);
}
function startDialLoop() {
  clearInterval(dialT);
  dialT = setInterval(() => {
    if (!S || !(S.partner || S.pending) || document.hidden) return;
    if (!peer) { startPeer(); return; }
    if (peer.disconnected && !peer.destroyed) { try { peer.reconnect(); } catch (e) {} return; }
    if (!openConns().length) { if (S.partner) dial(S.partner.code); if (S.pending && (!S.partner || S.pending !== S.partner.code)) dial(S.pending); }
  }, 15000);
}
function pairWith(c) {
  c = cleanCode(c);
  if (!okCode(c)) { netMsg = 'That code doesn’t look right: six letters and numbers, like ABC-234.'; paintPairStatus(); return false; }
  if (c === S.dev) { netMsg = 'That’s your own code. Enter the one on the other screen.'; paintPairStatus(); return false; }
  if (!S.partner || S.partner.code !== c) { S.joined = true; S.pending = c; }
  netMsg = ''; save(true);
  if (!peer) startPeer(); else if (peer.disconnected) { try { peer.reconnect(); } catch (e) {} } else dial(c);
  paintPairStatus(); return true;
}

/* ---------- backup: file, link */
const b64u = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const unb64u = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4)), c => c.charCodeAt(0));
async function pack() {
  const json = JSON.stringify(S);
  if (window.CompressionStream) { try { const st = new Blob([json]).stream().pipeThrough(new CompressionStream('deflate-raw')); return 'z' + b64u(await new Response(st).arrayBuffer()); } catch (e) {} }
  return 'j' + b64u(new TextEncoder().encode(json));
}
async function unpack(s) {

  if (s[0] === 'z') { const st = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw')); return JSON.parse(await new Response(st).text()); }
  return JSON.parse(new TextDecoder().decode(bytes));
}
function restore(p, replace) {
  if (!p || typeof p !== 'object' || !p.items) throw new Error('not a backup');
  if (replace) { S = p; S = load() ? (LS.set(KEY, p), load()) : S; save(true); render(); return Object.keys(S.items).length; }
  if (p.dev !== S.dev && p.me && p.me !== S.me) { for (const it of Object.values(p.items)) if (it.by) it.by = it.by === 'a' ? 'b' : 'a'; if (p.names) { [p.names.a, p.names.b] = [p.names.b, p.names.a]; if (p._t) [p._t.na, p._t.nb] = [p._t.nb, p._t.na]; } }
  let n = 0; const ch = [];
  for (const pr of Object.values(p.pursuits || {})) mergePursuit(pr);
  for (const it of Object.values(p.items)) if (mergeItem(it)) { n++; ch.push(it); }
  if (p.names && p._t) mergeMeta(p);
  if (!curP() && p.cur && S.pursuits[p.cur]) S.cur = p.cur;
  save(true); broadcast(ch); sendMeta(); render();
  return n;
}
function download(name, data, type) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], { type })); a.download = name; document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function csv() {
  const q = s => '"' + String(s ?? '').replace(/"/g, '""') + '"';
  const rows = [['date', 'pursuit', 'minutes', 'focus', 'rating', 'note', 'by', 'coach notes']];
  for (const s of sessions().sort((x, y) => x.on < y.on ? -1 : 1)) rows.push([s.on, (S.pursuits[s.pursuit] || {}).name || '', s.mins, (s.focus || []).join('; '), s.rating || '', s.note || '', nameOf(s.by || 'a'), notesFor(s.id).map(n => `${nameOf(n.by)}: ${n.text}`).join(' | ')]);
  return rows.map(r => r.map(q).join(',')).join('\r\n');
}
/* ================= stats ================= */
function byDay(p) { const m = {}; for (const s of sessions(p)) m[s.on] = (m[s.on] || 0) + (+s.mins || 0); return m; }
function streaks(p) {
  const days = byDay(p), today = isoDay();
  let cur = 0, d = days[today] ? today : addDays(today, -1);
  while (days[d]) { cur++; d = addDays(d, -1); }
  let best = 0, run = 0, prev = '';
  for (const k of Object.keys(days).sort()) { run = prev && addDays(prev, 1) === k ? run + 1 : 1; prev = k; if (run > best) best = run; }

    if (j && okCode(j) && j !== S.dev && (!S.partner || S.partner.code !== j)) { pairWith(j); openPair(); }
  } else renderLanding();
})();

/* ================= test hooks ================= */
window.__create = {
  id: 'practice',
  setup: name => { if (!S) { S = blank(); setName('a', String(name || 'You')); addPursuit('dressage', PRESETS.dressage.name, PRESETS.dressage.color, PRESETS.dressage.tags, { minsWeek: 150 }); save(true); begin(); } else { setName(S.me, String(name || myName())); if (!curP()) addPursuit('dressage', PRESETS.dressage.name, PRESETS.dressage.color, PRESETS.dressage.tags, { minsWeek: 150 }); save(true); render(); } },
  code: () => S.dev,
  pair: code => { pairWith(code); },
  net: () => net,
  add: () => {
    const p = curP(); const n = sessions().length;
    const tags = p.tags || [], mins = [20, 30, 45, 60, 75, 90, 40, 25][n % 8], rating = [4, 3, 5, 4, 2, 5, 3, 4][n % 8];
    const it = create('s' + uid(), { pursuit: p.id, on: addDays(isoDay(), -[0, 1, 2, 4, 5, 7, 9, 12, 3, 6][n % 10]), mins, focus: tags.length ? [tags[n % tags.length], ...(n % 2 ? [tags[(n + 2) % tags.length]] : [])] : [], rating, note: ['Slow was fast today.', '', 'Kept it short, stayed honest.', 'Drilled the hard part twice.', ''][n % 5], by: S.me, at: Date.now() - n * 1000, del: false });
    save(true); broadcast([it]); render(); return it.id;
  },
  count: () => Object.values(S.items).filter(it => !it.del).length,
  state: () => JSON.parse(JSON.stringify(S)),
  export: () => JSON.stringify(S),
};
})();
</script>
