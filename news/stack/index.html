<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="description" content="Five-minute ideas you scroll like a feed: electronics, poker, money, the mind, history and science, health and home. Read them or have your phone read them to you. Three new hours every day.">

<meta property="og:type" content="website">

<meta property="og:url" content="https://bboldt86.github.io/lanscape-navigator/news/stack/">
<meta property="og:image" content="https://bboldt86.github.io/lanscape-navigator/news/stack/share.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#121A24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="stack.css?v=2">
<script defer src="/lanscape-navigator/news/pulse/pulse.js"></script>
</head>
<body data-pulse-card="off">
<div id="app" data-view="feed">
  <header class="top">
    <a class="back" href="../" aria-label="Back to The Watch"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></a>
    <div class="modes" role="tablist" aria-label="Feed">
      <button role="tab" data-mode="you" aria-selected="true">For you</button>
      <button role="tab" data-mode="new" aria-selected="false">New today</button>
    </div>
    <button class="streak" data-go="me" aria-label="Your streak and minutes today"><svg viewBox="0 0 24 24"><path d="M12 3c1 3 4 5 4 9a4 4 0 0 1-8 0c0-1.5.5-2.5 1-3 .2 2 1.5 2.5 1.5 2.5C10.5 9 11 6 12 3z"/></svg><b id="streakN">0</b></button>
  </header>

  <div class="filter" id="filter" hidden><span id="filterName"></span><button id="filterX" aria-label="Back to the full feed">Back to everything</button></div>

  <main id="feed" class="feed" tabindex="0" aria-label="Ideas"></main>

  <section id="topics" class="pane" hidden></section>
  <section id="saved" class="pane" hidden></section>
  <section id="me" class="pane" hidden></section>

  <div class="player" id="player" hidden>
    <button id="plToggle" aria-label="Pause"><svg viewBox="0 0 24 24" id="plIcon"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg></button>
    <div class="pl-t"><b id="plTitle"></b><span id="plSub"></span></div>
    <button id="plRate" aria-label="Reading speed">1×</button>
    <button id="plStop" aria-label="Stop listening"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>

  <nav class="tabs" aria-label="The Stack">
    <button data-go="feed" aria-current="page"><svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h14"/></svg><span>Feed</span></button>
    <button data-go="topics"><svg viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg><span>Topics</span></button>
    <button data-go="saved"><svg viewBox="0 0 24 24"><path d="M7 4h10v16l-5-4-5 4z"/></svg><span>Saved</span></button>
    <button data-go="me"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg><span>You</span></button>
  </nav>
</div>

<div class="welcome" id="welcome" hidden>
  <div class="w-in">
    <div class="w-mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    <h1>The Stack</h1>
    <p class="w-lede">Five-minute ideas, one screen at a time. Scroll them like a feed, or tap Listen and put the phone down.</p>
    <p class="w-q">What do you want in your feed?</p>
    <div class="w-topics" id="wTopics"></div>
    <button class="w-go" id="wGo">Start scrolling</button>
    <p class="w-note" id="wNote"></p>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:2rem;color:#fff">The Stack needs JavaScript to run.</p></noscript>
<script src="stack.js?v=2" defer></script>
</body>
</html>
