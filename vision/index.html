<style>
:root{
  --bg:#F8F7F4; --raise:#FFFFFF; --sunk:#EFEBE4; --ink:#2A251F; --ink2:#62594F; --ink3:#968B7E; --rule:rgba(42,37,31,.12); --rule2:rgba(42,37,31,.22);
  --a:#C2785C; --a-soft:rgba(194,120,92,.15); --b:#5B7FA1; --b-soft:rgba(91,127,161,.15); --gold:#8B7355; --gold-soft:rgba(139,115,85,.16); --lens:#A88A5E;
  --ok:#3D7A55; --warn:#B4532F; --scrim:rgba(30,25,20,.45); --on:#fff;
  --shadow:0 1px 2px rgba(42,37,31,.05),0 8px 24px rgba(42,37,31,.07);
  --serif:'Instrument Serif','Iowan Old Style',Georgia,serif;
  --sans:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#191613; --raise:#24201B; --sunk:#131110; --ink:#F2EDE6; --ink2:#C6BCAF; --ink3:#918679; --rule:rgba(242,237,230,.12); --rule2:rgba(242,237,230,.24);
    --a:#E39B7F; --a-soft:rgba(227,155,127,.17); --b:#8FB1D2; --b-soft:rgba(143,177,210,.17); --gold:#CDB089; --gold-soft:rgba(205,176,137,.17); --lens:#BFA27A;
    --ok:#7EC39B; --warn:#F08C66; --scrim:rgba(0,0,0,.62); --on:#191613; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.34); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#191613; --raise:#24201B; --sunk:#131110; --ink:#F2EDE6; --ink2:#C6BCAF; --ink3:#918679; --rule:rgba(242,237,230,.12); --rule2:rgba(242,237,230,.24);
  --a:#E39B7F; --a-soft:rgba(227,155,127,.17); --b:#8FB1D2; --b-soft:rgba(143,177,210,.17); --gold:#CDB089; --gold-soft:rgba(205,176,137,.17); --lens:#BFA27A;
  --ok:#7EC39B; --warn:#F08C66; --scrim:rgba(0,0,0,.62); --on:#191613; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.34); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:hidden}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
img{display:block;max-width:100%}
.in{max-width:1280px;margin:0 auto;padding:0 28px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.serif{font-family:var(--serif);font-weight:400}

/* ---------- top bar */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--rule)}
.top .in{display:flex;align-items:center;gap:14px;height:62px}
.logo{display:flex;align-items:center;gap:9px;text-decoration:none;flex:none}
.logo svg{width:34px;height:24px}
.logo span{font:400 29px/1 var(--serif);letter-spacing:-.01em}
.who{margin:0;flex:1;min-width:0;font-size:15px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who b{font-weight:600;color:var(--ink)}
.tools{display:flex;align-items:center;gap:8px;flex:none}
.pill{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--rule2);background:var(--raise);font-size:14px;font-weight:550;white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--ink3);flex:none}
.pill.on i{background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 22%,transparent)}
.pill.wait i{background:var(--gold);animation:pulse 1.4s infinite}
.pill.off i{background:transparent;border:1.5px solid var(--ink3)}
@keyframes pulse{50%{opacity:.35}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:40px;padding:0 18px;border-radius:999px;border:1px solid var(--rule2);background:var(--raise);font-size:15px;font-weight:600;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--ink3)}
.btn.p{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.p:hover{opacity:.9}
.btn.sm{height:34px;padding:0 13px;font-size:14px}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--on)}
.btn svg{width:16px;height:16px}
.ic{width:40px;height:40px;border-radius:50%;border:1px solid var(--rule2);background:var(--raise);display:inline-flex;align-items:center;justify-content:center;padding:0}
.ic svg{width:18px;height:18px}
.lk{background:none;border:0;padding:0;color:var(--gold);font-weight:600;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}

/* ---------- hero: the Venn and the lanes */
.hero{display:grid;grid-template-columns:minmax(260px,380px) 1fr;gap:34px;align-items:center;padding-top:30px;padding-bottom:12px}
.hero>*,.land-g>*,.g2>*,.form>*{min-width:0}
.venn{width:100%;height:auto;overflow:visible}
.venn .ca{fill:var(--a);fill-opacity:.2;stroke:var(--a);stroke-width:1.5}
.venn .cb{fill:var(--b);fill-opacity:.2;stroke:var(--b);stroke-width:1.5}
.venn .lens{fill:var(--lens);fill-opacity:.42}
.venn .hit{fill:transparent;cursor:pointer}
.venn .hit:hover+.hl,.venn .sel{opacity:1}
.venn .hl{opacity:0;fill:none;stroke:var(--ink);stroke-width:2.5;pointer-events:none;transition:opacity .15s}
.venn text{fill:var(--ink);pointer-events:none}
.venn .vn{font:400 23px var(--serif)}
.venn .vc{font:600 13px var(--sans);fill:var(--ink2)}
.venn .vb{font:400 21px var(--serif)}
.hero h1{margin:0;font:400 clamp(38px,5.4vw,64px)/1.02 var(--serif);letter-spacing:-.015em}
.hero h1 em{font-style:italic;color:var(--gold)}
.hero .sub{margin:10px 0 0;color:var(--ink2);font-size:17px;max-width:62ch}
.lanes{display:flex;gap:8px;margin:22px 0 0;flex-wrap:wrap}
.lane-b{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 16px;border-radius:999px;border:1px solid var(--rule2);background:var(--raise);font-weight:600;font-size:15px}
.lane-b small{font-weight:500;color:var(--ink3);font-size:13px}
.lane-b[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lane-b[aria-pressed="true"] small{color:color-mix(in srgb,var(--bg) 70%,transparent)}
.lane-b svg{width:17px;height:17px}
.tot{display:flex;gap:26px;flex-wrap:wrap;margin:18px 0 0;padding:14px 0 0;border-top:1px solid var(--rule)}
.tot div{min-width:0}
.tot b{display:block;font:400 30px/1.05 var(--serif)}
.tot span{font-size:13px;color:var(--ink3)}
.tot .bw b{color:var(--gold)}

/* ---------- controls */
.ctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-top:18px;padding-bottom:14px}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--rule2);background:transparent;font-size:14px;font-weight:550;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--sunk);border-color:var(--ink3)}
.chip.x{background:var(--gold-soft);border-color:transparent}
.ctl .sp{flex:1}
.ctl select{height:32px;border-radius:999px;border:1px solid var(--rule2);background:var(--raise);padding:0 12px;font-size:14px}

/* ---------- the board */
.grid{display:flex;gap:16px;align-items:flex-start}
.col{flex:1;min-width:0;display:flex;flex-direction:column;gap:16px}
.card{position:relative;background:var(--raise);border:1px solid var(--rule);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);transition:transform .18s,box-shadow .18s}
.card:hover{transform:translateY(-2px)}
.card.both{border-color:color-mix(in srgb,var(--gold) 55%,transparent);box-shadow:0 0 0 2px var(--gold-soft),var(--shadow)}
.card .ph{display:block;position:relative;background:var(--sunk);cursor:pointer;width:100%;border:0;padding:0}
.card .ph img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.card .ph .gt{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:16px;text-align:left;color:#fff;font:400 30px/1.02 var(--serif)}
.card .ph .gt small{display:block;font:600 12px/1.3 var(--sans);letter-spacing:.06em;text-transform:uppercase;opacity:.85;margin-bottom:6px}
.card .ph.g-travel,.g-travel{background:linear-gradient(150deg,#C2785C,#8B5A44 70%,#5E3C2E)}
.card .ph.g-shop,.g-shop{background:linear-gradient(150deg,#A08562,#6A5640)}
.card .ph.g-home,.g-home{background:linear-gradient(150deg,#5B7FA1,#3E5A75 75%)}
.ribbon{position:absolute;left:10px;top:10px;z-index:2;display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px 0 8px;border-radius:999px;background:var(--gold);color:#fff;font-size:12px;font-weight:650}
.ribbon svg{width:15px;height:15px}
.nwb{position:absolute;right:10px;top:10px;z-index:2;height:24px;padding:0 9px;border-radius:999px;background:var(--raise);color:var(--ink);font-size:12px;font-weight:650;display:inline-flex;align-items:center;box-shadow:var(--shadow)}
.cbd{padding:13px 15px 12px}
.lane{margin:0 0 3px;font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);display:flex;gap:6px;align-items:center}
.lane i{width:7px;height:7px;border-radius:50%}
.l-travel i{background:var(--a)}.l-shop i{background:var(--gold)}.l-home i{background:var(--b)}
.card h3{margin:0;font:600 16.5px/1.28 var(--sans);letter-spacing:-.005em}
.card h3 button{all:unset;cursor:pointer}
.card h3 button:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
.card.k-note h3{font:400 24px/1.12 var(--serif)}
.meta{margin:5px 0 0;font-size:14px;color:var(--ink2);display:flex;flex-wrap:wrap;gap:4px 10px}
.meta .pr{font-weight:650;color:var(--ink)}
.meta s{color:var(--ink3);font-weight:450;margin-left:5px}
.note-t{margin:7px 0 0;font-size:14.5px;color:var(--ink2);white-space:pre-wrap;overflow-wrap:anywhere}
.live{margin:8px 0 0;font-size:13.5px;color:var(--ink2);display:flex;flex-direction:column;gap:3px}
.live:empty{display:none}
.live .up{color:var(--warn);font-weight:600}.live .dn{color:var(--ok);font-weight:600}
.live .wx{display:inline-flex;align-items:center;gap:5px}
.live .wx svg{width:16px;height:16px;flex:none}
.fcl{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin-top:3px}
.fcs{display:flex;flex-wrap:wrap;gap:4px}
.fc{display:inline-flex;align-items:center;gap:3px;background:var(--sunk);border-radius:8px;padding:3px 7px;font-size:12.5px;white-space:nowrap}
.fc b{font-weight:650}
.fc svg{width:14px;height:14px}
.fc small{color:var(--b);font-weight:650}
.links{margin:9px 0 0;display:flex;flex-wrap:wrap;gap:6px}
.links a{font-size:13px;font-weight:600;text-decoration:none;padding:4px 10px;border-radius:999px;background:var(--sunk)}
.links a:hover{background:var(--gold-soft)}
.cf{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:11px;padding-top:10px;border-top:1px solid var(--rule)}
.hrt{display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 11px 0 9px;border-radius:999px;border:1px solid var(--rule2);background:transparent;font-size:13px;font-weight:600}
.hrt svg{width:17px;height:17px}
.hrt[aria-pressed="true"]{border-color:transparent;background:var(--me-soft,var(--a-soft));color:var(--me,var(--a))}
.pd{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--ink3)}
.pd i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--them,var(--b))}
.pd.on i{background:var(--them,var(--b))}
.pd.on{color:var(--ink2)}
.stb{margin-left:auto;height:28px;padding:0 10px;border-radius:999px;border:0;background:var(--sunk);font-size:12.5px;font-weight:650;color:var(--ink2)}
.stb.s-plan{background:var(--b-soft);color:var(--b)}
.stb.s-done{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.byi{width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;color:#fff;flex:none;margin-left:auto;letter-spacing:0}
.byi.a{background:var(--a)}.byi.b{background:var(--b)}
.card.k-note{background:var(--nbg,var(--raise))}
.card.k-note .cbd{padding-top:18px}

/* ---------- empty board, ideas */
.empty{border:1.5px dashed var(--rule2);border-radius:22px;padding:38px 28px;text-align:center;margin:8px 0 10px}
.empty h2{margin:0;font:400 36px/1.1 var(--serif)}
.empty p{margin:8px auto 18px;max-width:52ch;color:var(--ink2)}
.empty .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.ideas{padding-top:30px;padding-bottom:10px}
.sh{display:flex;align-items:baseline;gap:14px;justify-content:space-between;flex-wrap:wrap}
.sh h2,.h2{margin:0;font:400 32px/1.1 var(--serif)}
.sh p{margin:0;color:var(--ink3);font-size:14px}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(200px,230px);gap:14px;overflow-x:auto;padding:16px 2px 14px;scroll-snap-type:x mandatory;scrollbar-width:thin}
.idea{scroll-snap-align:start;background:var(--raise);border:1px solid var(--rule);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.idea .ip{aspect-ratio:4/3;background:var(--sunk);position:relative;overflow:hidden}
.idea .ip img{width:100%;height:100%;object-fit:cover}
.idea .ip .gt{position:absolute;inset:0;display:flex;align-items:flex-end;padding:12px;color:#fff;font:400 24px/1.05 var(--serif)}
.idea .it{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.idea .it b{font-size:14.5px;line-height:1.3;font-weight:600}
.idea .it small{color:var(--ink3);font-size:12.5px}
.idea .it .btn{margin-top:auto;align-self:flex-start}
.pinned{background:var(--gold-soft)!important;border-color:transparent!important;color:var(--gold)!important}

/* ---------- landing / first run */
.land{padding-top:46px}
.land-g{display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center}
.eyebrow{margin:0 0 12px;font-size:13px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--gold)}
.land h1{margin:0;font:400 clamp(46px,7vw,88px)/.98 var(--serif);letter-spacing:-.02em}
.land h1 em{color:var(--a);font-style:italic}
.lede{margin:18px 0 0;font-size:19px;line-height:1.5;color:var(--ink2);max-width:56ch}
.form{margin:26px 0 0;display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end;max-width:640px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld label,.fld .lb{font-size:13px;font-weight:650;color:var(--ink2)}
.fld input,.fld select,.fld textarea{height:46px;border-radius:12px;border:1px solid var(--rule2);background:var(--raise);padding:0 14px;font-size:16px;width:100%;min-width:0}
.fld textarea{height:auto;min-height:84px;padding:11px 14px;resize:vertical;line-height:1.45}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.form .btn{height:46px}
.joinl{margin:14px 0 0;font-size:15px;color:var(--ink2)}
.land-art{position:relative;aspect-ratio:1/0.86}
.land-art svg{width:100%;height:100%}
.mini{position:absolute;background:var(--raise);border:1px solid var(--rule);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow);font-size:13px;max-width:44%;line-height:1.3}
.mini b{display:block;font-size:14px}
.mini small{color:var(--ink3)}
.mini i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
.feat{list-style:none;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:54px auto 0;padding-top:0}
.feat li{border-top:1px solid var(--rule2);padding:16px 4px 0}
.feat b{display:block;font:400 26px/1.1 var(--serif);margin-bottom:6px}
.feat span{color:var(--ink2);font-size:15px}
.how{list-style:none;counter-reset:s;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:46px auto 0}
.how li{counter-increment:s;background:var(--raise);border:1px solid var(--rule);border-radius:18px;padding:20px}
.how li::before{content:counter(s);display:inline-flex;width:30px;height:30px;border-radius:50%;background:var(--gold-soft);color:var(--gold);font-weight:700;align-items:center;justify-content:center;margin-bottom:10px}
.how b{display:block;font-size:17px;margin-bottom:4px}
.how span{color:var(--ink2);font-size:15px}
.faq{margin:46px auto 0;max-width:820px}
.faq details{border-bottom:1px solid var(--rule);padding:14px 0}
.faq summary{cursor:pointer;font-weight:600;font-size:17px;list-style:none;display:flex;justify-content:space-between;gap:10px}
.faq summary::after{content:'+';color:var(--ink3);font-size:22px;line-height:1}
.faq details[open] summary::after{content:'–'}
.faq p{margin:8px 0 0;color:var(--ink2)}

/* ---------- sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:41;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg);box-shadow:-10px 0 40px rgba(0,0,0,.18);transform:translateX(102%);transition:transform .26s cubic-bezier(.2,.8,.2,1);overflow-y:auto;overscroll-behavior:contain;padding:0 0 calc(30px + env(safe-area-inset-bottom))}
.sheet.on{transform:none}

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js" defer></script>

<script>
'use strict';
/* Vision: one shared board for two people (trips, things, the home), synced phone to phone over WebRTC (PeerJS).
   The board lives in each browser (localStorage 'vision.v1'). Other pages on this site pin to it through
   'vision.inbox' (same origin): The Watch, Weekender and Finds. Live data: Finds' feed (prices, stock), Weekender's
   cities, guides and weather, Open-Meteo for any other place, and Zillow's research data via The Watch (home values).
   Sync is a last-writer-wins map per field, so both partners can edit offline and merge cleanly. */
(() => {
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const PUBLIC = 'https://bboldt86.github.io/lanscape-navigator/';
const APP = PUBLIC + 'vision/';
const KEY = 'vision.v1', INBOX = 'vision.inbox', THEME = 'vision.theme';
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { /* storage off */ } }
};
const ALPH = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const code6 = () => { const a = new Uint32Array(6); crypto.getRandomValues(a); return [...a].map(x => ALPH[x % ALPH.length]).join(''); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
function h32(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); }
const fmtCode = c => c ? c.slice(0, 3) + '-' + c.slice(3) : '';
const cleanCode = s => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
const okCode = c => c.length === 6 && [...c].every(ch => ALPH.includes(ch));
const clone = o => JSON.parse(JSON.stringify(o));
const pad = n => String(n).padStart(2, '0');
const isoDay = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const DD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = DD(s); d.setDate(d.getDate() + n); return isoDay(d); };
const comingFriday = () => { const d = new Date(); const w = d.getDay(); d.setDate(d.getDate() + (((5 - w + 7) % 7) || (w === 5 ? 0 : 7))); return isoDay(d); };
const md = s => DD(s).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
const dow = s => DD(s).toLocaleDateString('en-US', { weekday: 'short' });
function range(a, b) { if (!a) return ''; if (!b || a === b) return md(a); const A = DD(a), B = DD(b); return A.getMonth() === B.getMonth() ? `${md(a)}–${B.getDate()}` : `${md(a)} – ${md(b)}`; }
const money = (p, c = 'USD') => p == null || isNaN(p) ? '' : new Intl.NumberFormat('en-US', { style: 'currency', currency: c || 'USD', maximumFractionDigits: p % 1 && p < 100 ? 2 : 0 }).format(p);
const moneyK = v => v >= 1e6 ? '$' + (v / 1e6).toFixed(v % 1e6 ? 2 : 0).replace(/\.?0+$/, '') + 'M' : v >= 1e3 ? '$' + Math.round(v / 1e3) + 'k' : money(v);
const host = u => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return ''; } };
const safeUrl = u => { if (!u || typeof u !== 'string') return ''; try { const x = new URL(u.trim()); return /^https?:$/.test(x.protocol) ? x.href : ''; } catch (e) { return ''; } };
const okHref = u => typeof u === 'string' && (/^https?:\/\//i.test(u) || /^\.\.\/[\w#/?=&%.,:+-]*$/.test(u));
const okImg = u => typeof u === 'string' && (/^https:\/\//i.test(u) || /^data:image\/(jpeg|png|webp);base64,/.test(u));
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const qp = new URLSearchParams(location.search);

const IC = {
  heart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 20.5s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.7c0 5.6-7.5 10.2-7.5 10.2z"/></svg>',
  heartF: '<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 20.5s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.7c0 5.6-7.5 10.2-7.5 10.2z"/></svg>',
  both: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="9" cy="12" r="6"/><circle cx="15" cy="12" r="6"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  out: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5h11v11"/><path d="M19 5L6 18"/></svg>',
  plane: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M2.5 13.5l7-2.2L14 3.8c.5-.8 1.8-.6 2 .3l-.9 6.2 5 1.6c.9.3.9 1.6 0 1.9l-5 1.6.9 4.9c.2.9-.9 1.4-1.5.8L11 18l-3.6.6-.8 2.4-2.2-1 .8-2.6-2.7-1.9z"/></svg>',
  bag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>',
  house: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 11l8-7 8 7"/><path d="M6 9.5V20h12V9.5"/><path d="M10 20v-5h4v5"/></svg>',
  all: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="7" height="9" rx="2"/><rect x="13" y="4" width="7" height="5" rx="2"/><rect x="4" y="15" width="7" height="5" rx="2"/><rect x="13" y="11" width="7" height="9" rx="2"/></svg>'
};
const LANES = { travel: { name: 'Travel', icon: IC.plane, done: 'Booked' }, shop: { name: 'Shopping', icon: IC.bag, done: 'Bought' }, home: { name: 'Home', icon: IC.house, done: 'Done' } };
const STATUS = ['dream', 'plan', 'done'];
const statusName = it => it.status === 'plan' ? 'Planning' : it.status === 'done' ? LANES[it.lane].done : 'Dreaming';
const NOTE_COLORS = ['', '#F3E3D8', '#DDE6EF', '#EDE4D3', '#E3EBDD', '#EFE0E6'];
const NOTE_DARK = { '#F3E3D8': '#3A2A22', '#DDE6EF': '#22303D', '#EDE4D3': '#352D22', '#E3EBDD': '#26302A', '#EFE0E6': '#382A30' };

/* ================= state ================= */
let S = LS.get(KEY, null);
if (S && S.v !== 1) S = null;
let lastStamp = 0, SALT = 0;
function initClock() { SALT = parseInt(h32(S ? S.dev : 'x'), 36) % 97; for (const it of Object.values((S && S.items) || {})) for (const v of Object.values(it._t || {})) if (v > lastStamp) lastStamp = v; }
function stamp() { const t = Math.max(Date.now(), Math.floor(lastStamp / 100) + 1); lastStamp = t * 100 + SALT; return lastStamp; }
const seeStamp = n => { if (n > lastStamp) lastStamp = n; };
function blankState(me) {
  return { v: 1, dev: (S && S.dev) || code6(), me, joined: false, board: { id: 'b' + uid(), names: { a: '', b: '' }, title: '', _t: {} }, items: {}, partner: null, created: Date.now(), seen: Date.now() };
}
const other = () => S.me === 'a' ? 'b' : 'a';
const nameOf = slot => (S.board.names[slot] || '').trim() || (slot === S.me ? 'You' : 'Your partner');
const myName = () => nameOf(S.me), theirName = () => nameOf(other());
const initial = slot => (nameOf(slot)[0] || '?').toUpperCase();
const first = slot => { const n = nameOf(slot); return n === 'Your partner' ? 'Partner' : n === 'You' ? 'You' : n.split(' ')[0]; };
function setName(slot, n) { S.board.names[slot] = String(n || '').trim().slice(0, 30); S.board._t['n' + slot] = stamp(); }
let saveT = 0, saveWarned = false;
function save(now) {
  clearTimeout(saveT);
  const go = () => { if (!S) return; if (!LS.set(KEY, S) && !saveWarned) { saveWarned = true; toast('This browser’s storage is full. Remove a photo or two so the board can save.'); } };
  if (now) go(); else saveT = setTimeout(go, 120);
}
function live() { return Object.values(S.items).filter(it => !it.del); }
function setF(it, f) { const t = stamp(); for (const k of Object.keys(f)) { it[k] = f[k]; it._t[k] = t; } return it; }
function create(id, f) { const it = { id, _t: {} }; setF(it, f); S.items[id] = it; return it; }
function mergeItem(r) {
  if (!r || !r.id) return false;
  for (const v of Object.values(r._t || {})) seeStamp(v);
  const L = S.items[r.id];
  if (!L) { S.items[r.id] = clone(r); return true; }
  let ch = false;
  for (const k of Object.keys(r._t || {})) if ((r._t[k] || 0) > (L._t[k] || 0)) { L[k] = r[k]; L._t[k] = r._t[k]; ch = true; }
  return ch;
}
function mergeBoard(rb) {
  if (!rb || !rb._t) return false;
  let ch = false;
  for (const [k, field] of [['na', 'a'], ['nb', 'b']]) if ((rb._t[k] || 0) > (S.board._t[k] || 0)) { S.board.names[field] = rb.names[field]; S.board._t[k] = rb._t[k]; ch = true; }
  if ((rb._t.title || 0) > (S.board._t.title || 0)) { S.board.title = rb.title; S.board._t.title = rb._t.title; ch = true; }
  return ch;
}
function swapSlots() { // two devices both thought they were partner A: the one that joined moves over
  S.me = other();
  const n = S.board.names, t = S.board._t;
  [n.a, n.b] = [n.b, n.a]; [t.na, t.nb] = [t.nb, t.na];
  for (const it of Object.values(S.items)) {
    [it.ha, it.hb] = [it.hb, it.ha]; [it._t.ha, it._t.hb] = [it._t.hb, it._t.ha];
    if (it.by) it.by = it.by === 'a' ? 'b' : 'a';
    for (const k of ['ha', 'hb']) { if (it[k] === undefined) delete it[k]; if (it._t[k] === undefined) delete it._t[k]; }
  }
}

/* ================= pins arriving from The Watch, Weekender and Finds ================= */
function laneGuess(p) {
  if (p.lane && LANES[p.lane]) return p.lane;
  if (p.kind === 'trip' || p.kind === 'hotel') return 'travel';
  if (p.kind === 'homesearch' || p.kind === 'listing') return 'home';
  if (p.sec && /^(home|remodel)$/.test(p.sec)) return 'home';
  return 'shop';
}
function fromPin(p) {
  if (!p || (!p.title && !p.unpin)) return null;
  const id = p.key ? 'k' + h32(p.key) : 'i' + uid();
  const ex = S.items[id];

    const u = safeUrl($('#ou').value.trim()), f = $('#of').files && $('#of').files[0];
    let img = safeUrl($('#oi').value.trim()), ar = null;
    if (f) { try { const s = await shrink(f); img = s.src; ar = s.ar; } catch (er) { toast('That photo couldn’t be read.'); } }
    const price = num($('#op').value);
    const it = pinIt({ key: '', lane: ownLane, kind: img || u ? 'link' : 'note', title: t, url: u, img, ar, note: $('#on').value.trim(), [ownLane === 'travel' ? 'cost' : 'price']: price });
    if (it && ownColor && !img) { setF(it, { color: ownColor }); save(); broadcast([it]); render(true); }
    ownColor = '';
    closeSheet(); return;
  }
  if (d.idea != null) { const x = IDEAS[+d.idea]; if (!x) return; if (x.pinned) { toast('Already on the board'); return; } pinIt(x.pin); return; }
  if (d.setst) { const it = S.items[sheetId]; if (it) { setF(it, { status: d.setst }); save(); broadcast([it]); openDetail(sheetId); render(true); } return; }
  if (d.setlane) { const it = S.items[sheetId]; if (it) { setF(it, { lane: d.setlane }); save(); broadcast([it]); openDetail(sheetId); render(true); } return; }
  if (d.savedetail != null) { saveDetail(); return; }
  if (d.pair != null || a.id === 'pairBtn') { openPair(); return; }
  if (d.dial != null) { dialFromInput(); return; }
  if (d.sharelink != null) { shareLink(APP + '#pair=' + S.dev + '&from=' + encodeURIComponent(myName()), `Join our Vision board. My code is ${fmtCode(S.dev)}.`); return; }
  if (d.copylink != null) { try { await navigator.clipboard.writeText(APP + '#pair=' + S.dev + '&from=' + encodeURIComponent(myName())); toast('Link copied'); } catch (er) { prompt('Copy this link:', APP + '#pair=' + S.dev); } return; }
  if (d.sendboard != null) { const p = await packBoard(); shareLink(APP + '#merge=' + p, `${myName()}’s Vision board`); return; }
  if (d.export != null) { exportBoard(); return; }
  if (d.forget != null) { S.partner = null; save(true); for (const c of conns) try { c.close(); } catch (er) { /* gone */ } conns.clear(); setNet(peer ? 'ready' : 'idle'); openPair(); return; }
  if (d.accept != null) { const p = pendingAsk; pendingAsk = null; if (p) { closeSheet(); acceptHello(p.c, p.d, false); } return; }
  if (d.reject != null) { closeSheet(); return; }
  if (d.mergeok != null) { const n = mergePacked(mergeOffer); mergeOffer = null; render(true); toast(n ? `${n} pins merged in` : 'You already had all of those'); return; }
  if (d.mergeno != null) { mergeOffer = null; render(true); return; }
  if (d.names != null) { openNames(); return; }
  if (d.savenames != null) { const na = $('#na').value.trim(), nb = $('#nb').value.trim(), tt = $('#ntt').value.trim(); if (na !== S.board.names.a) setName('a', na); if (nb !== S.board.names.b) setName('b', nb); if (tt !== S.board.title) { S.board.title = tt.slice(0, 60); S.board._t.title = stamp(); } save(true); for (const c of openConns()) if (c._hello) send(c, { t: 'board', board: S.board }); closeSheet(); render(true); return; }
  if (d.theme != null) { const cur = LS.get(THEME, ''); const nx = cur === '' ? 'light' : cur === 'light' ? 'dark' : ''; if (nx) LS.set(THEME, nx); else LS.del(THEME); applyTheme(); openMenu(); return; }
  if (d.saveapp != null) { saveApp(); return; }
  if (d.reset != null) { if (!confirm('Clear this device’s copy of the board? Your partner’s copy stays, and you can reconnect to get it back.')) return; LS.del(KEY); location.hash = ''; location.reload(); return; }
  if (d.joincode != null) { pairLink = { code: '', from: '' }; renderLanding(); const c = $('#jc'); if (c) c.focus(); return; }
  if (d.unjoin != null) { pairLink = null; history.replaceState(null, '', location.pathname + location.search); renderLanding(); return; }
  if (a.id === 'addBtn' || a.id === 'fab') { openAdd(); return; }
  if (a.id === 'menuBtn') { openMenu(); return; }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && sheetKind) closeSheet();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.hit')) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click', { bubbles: true })); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'sort') { view.sort = e.target.value; keepView(); render(true); }
  if (e.target.matches('[data-import]') && e.target.files[0]) importBoard(e.target.files[0]);
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === 'startForm') {
    const me = f.me.value.trim(), them = (f.them && f.them.value.trim()) || '';
    if (!me) return;
    S = blankState('a'); initClock();
    setName('a', me); setName('b', them);
    if (mergeOffer) { S.me = mergeOffer.me === 'a' ? 'b' : 'a'; S.board.names = { a: '', b: '' }; S.board._t = {}; setName(S.me, me); setName(other(), them || mergeOffer.from || ''); const n = mergePacked(mergeOffer); mergeOffer = null; toast(`${n} pins from ${theirName()} came over`); }
    save(true); begin();
  }
  if (f.id === 'joinForm') {
    const me = f.me.value.trim(); if (!me) return;
    if (f.code) { const c = cleanCode(f.code.value); if (!okCode(c)) { $('#joinMsg').textContent = 'That code doesn’t look right: six letters and numbers, like ABC-234.'; f.code.focus(); return; } pairLink.code = c; }
    S = blankState('b'); initClock(); S.joined = true;
    setName('b', me); if (pairLink.from) setName('a', pairLink.from);
    wantCode = pairLink.code; S.pending = pairLink.code; S.partner = null;
    save(true); pairLink = null; history.replaceState(null, '', location.pathname + location.search);
    begin(); setNet('dialing');
    openPair();
  }
});
$('#scrim').addEventListener('click', closeSheet);
addEventListener('storage', e => {
  if (!S) { if (e.key === KEY && e.newValue) { S = LS.get(KEY, null); if (S) { initClock(); begin(); } } return; }
  if (e.key === INBOX) { if (drainInbox().length) render(true); return; }
  if (e.key !== KEY || !e.newValue) return;
  let o; try { o = JSON.parse(e.newValue); } catch (er) { return; }
  if (!o || o.v !== 1) return;
  if (o.me !== S.me) { S = o; initClock(); render(true); return; }
  const ch = Object.values(o.items || {}).filter(mergeItem);
  const bch = mergeBoard(o.board);
  if (o.partner && (!S.partner || S.partner.code !== o.partner.code)) S.partner = o.partner;
  if (ch.length || bch) { broadcast(ch); if (bch) for (const c of openConns()) if (c._hello) send(c, { t: 'board', board: S.board }); render(true); }
});
let rsT = 0, lastN = 0;
addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(() => { if (S && colN() !== lastN) { lastN = colN(); paintGrid(); } }, 150); });
document.addEventListener('visibilitychange', () => {
  if (!S) return;
  if (document.hidden) { S.seen = Date.now(); save(true); }
  else { if (drainInbox().length) render(true); if (S.partner && !openConns().length) { if (!peer) startPeer(); else dial(S.partner.code, true); } }
});
addEventListener('pagehide', () => { if (S) { S.seen = Date.now(); save(true); } });
function applyTheme() {
  const t = LS.get(THEME, '');
  if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
  const dark = t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches);
  if (dark) document.documentElement.dataset.dark = '1'; else delete document.documentElement.dataset.dark;
  if (S && $('#grid')) paintGrid();
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);

/* ================= start ================= */
let pairLink = null, mergeOffer = null;
function readHash() {
  const h = new URLSearchParams(location.hash.replace(/^#\/?/, ''));
  if (h.get('pair')) { const c = cleanCode(h.get('pair')); if (okCode(c)) pairLink = { code: c, from: (h.get('from') || '').slice(0, 30) }; }
  return h.get('merge');
}
function begin() {
  lastN = colN();
  seenPrev = S.seen || 0;
  drainInbox(true);
  render();
  renderFoot();
  loadLive().then(() => { if (S) render(true); });
  startPeer(); startDialLoop();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
}
(async () => {
  applyTheme(); renderFoot();
  const m = readHash();
  if (m) { try { mergeOffer = await unpackBoard(m); } catch (e) { mergeOffer = null; toast('That board link is incomplete. Ask for it again.'); } history.replaceState(null, '', location.pathname + location.search); }
  if (S) {
    initClock();
    if (pairLink) { // opened a partner's link on a device that already has a board
      if (pairLink.code !== S.dev && (!S.partner || S.partner.code !== pairLink.code)) { S.joined = true; S.pending = wantCode = pairLink.code; save(true); }
      pairLink = null; history.replaceState(null, '', location.pathname + location.search);
    }
    if (mergeOffer && mergeOffer.board && mergeOffer.board.id === S.board.id && mergeOffer.from === myName()) mergeOffer = null; // our own link
    begin();
    if (wantCode) { setNet('dialing'); openPair(); }
  } else { renderLanding(); loadLive(); }
})();
})();
</script>
</body>
