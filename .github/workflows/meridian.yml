name: Meridian live feed
# Weather (METAR, TAF, D-ATIS; NOTAMs every 3 hours with FAA keys) for every station in meridian/index.html, plus every
# airborne Southwest jet from ADS-B and FAA NAS programs, published to the `meridian-feed` branch every 5 minutes.
#
# GitHub fires scheduled runs late or not at all, so the feed doesn't depend on cron. A run is a relay: it does one
# cycle every 5 minutes for about 5 h 20 min (meridian/updater/run_feed.sh), then starts the next run itself
# (workflow_dispatch, handoff=true) before it ends. The hourly cron is only a backstop: it restarts the relay if it
# ever stops and exits in seconds when one is already running. Cancelling a run stops the relay until the next
# backstop; disable the workflow to stop it for good. See meridian/UPDATER.md.
on:
  schedule:
    - cron: '43 * * * *'
  workflow_dispatch:
    inputs:
      notams:
        description: 'Refresh NOTAMs now'
        type: boolean
        default: false
      handoff:
        description: 'Internal: set when a run hands off to the next one (leave unticked)'
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
jobs:
  feed:
    if: github.repository == 'BBOLDT86/lanscape-navigator'
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Relay already running?
        id: mode
        run: |
          if [ "${{ inputs.handoff }}" = "true" ]; then echo "mode=relay" >> "$GITHUB_OUTPUT"; echo "handed off; relay"; exit 0; fi
          busy=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/meridian.yml/runs?per_page=30" \
            --jq "[.workflow_runs[] | select(.id != ${GITHUB_RUN_ID} and (.status == \"in_progress\" or .status == \"queued\" or .status == \"waiting\" or .status == \"pending\"))] | length" || echo 0)
          if [ "$busy" -eq 0 ]; then mode=relay
          elif [ "${{ inputs.notams }}" = "true" ]; then mode=once
          else mode=skip; fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "other active runs: $busy -> $mode"
      - uses: actions/checkout@v4
        if: steps.mode.outputs.mode != 'skip'
        with:
          fetch-depth: 1
          sparse-checkout: meridian
      - uses: actions/setup-python@v5
        if: steps.mode.outputs.mode != 'skip'
        with:
          python-version: '3.12'
      - name: Run the feed
        id: feed
        if: steps.mode.outputs.mode != 'skip'
        env:
          # optional: free keys from https://api.faa.gov switch NOTAMs on (FAA NOTAM API)
          FAA_CLIENT_ID: ${{ secrets.FAA_CLIENT_ID }}
          FAA_CLIENT_SECRET: ${{ secrets.FAA_CLIENT_SECRET }}
          # optional: a free OpenSky account (https://opensky-network.org) lifts the ADS-B budget from 400 to 4,000 credits a day
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
        run: bash meridian/updater/run_feed.sh "${{ steps.mode.outputs.mode }}" ${{ inputs.notams && '--notams' || '' }}
      - name: Hand off to the next run
        if: (success() || failure()) && steps.mode.outputs.mode == 'relay' && steps.feed.outputs.yielded != 'true'
        run: |
          for i in 1 2 3 4 5; do
            gh workflow run meridian.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f handoff=true && { echo "next run started"; exit 0; }
            sleep 20
          done
          echo "::warning::couldn't start the next run; the hourly backstop will restart the relay"
