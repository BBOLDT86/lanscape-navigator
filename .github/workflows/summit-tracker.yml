name: Summit seat tracker
# Polls resale listings for John Summit at the Schottenstein Center (Fri Nov 13, 2026) and alerts
# (ntfy push, GitHub issue as backup) on floor pairs and front-row pairs in the sections worth moving for.
# GitHub drops most hourly cron firings in this repo (19 scheduled workflows), so each run is a long
# poller: it checks every 15 minutes (10 on show day) for up to ~5.7 hours, committing snapshots as it
# goes. The hourly cron only has to land once to re-arm the next stretch; the concurrency group queues
# any overlap so coverage is continuous. Off once the show starts.
on:
  schedule:
    - cron: '13 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: summit-tracker
  cancel-in-progress: false
jobs:
  track:
    if: github.repository == 'BBOLDT86/lanscape-navigator'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Poll until the stretch is up or the show starts
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "Summit tracker"
          git config user.email "summit-tracker@users.noreply.github.com"
          start=$(date +%s)
          while :; do
            now_utc=$(date -u +%Y%m%d%H)
            if [ "$now_utc" -ge 2026111400 ]; then echo "show started: stopping"; break; fi
            git pull -q --rebase -X theirs origin main || true
            python3 summit/tracker/track.py || echo "tracker errored; will retry next poll"
            git add summit/tracker/data
            if ! git diff --cached --quiet; then
              git commit -qm "Summit tracker: $(date -u +%Y-%m-%dT%H:%MZ)"
              for i in 1 2 3; do
                git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && break
                sleep 10
              done
            fi
            elapsed=$(( $(date +%s) - start ))
            if [ "$elapsed" -ge 20400 ]; then echo "stretch done after ${elapsed}s"; break; fi
            if [ "$(date -u +%Y%m%d)" = "20261113" ]; then sleep 600; else sleep 900; fi
          done
