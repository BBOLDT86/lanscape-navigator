name: probe discover (scratch)
on:
  push:
    branches: [probe-discover]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 probe.py || true
      - name: Build discover.json for real (every show resolved by name if needed)
        run: |
          rm -f news/data/discover.json
          DISCOVER_FULL=1 python3 news/updater/discover.py 2>&1 | tee discover-run.log
      - run: |
          git config user.name "probe"; git config user.email "probe@users.noreply.github.com"
          git add probe-results.json discover-run.log news/data/discover.json
          git commit -qm "probe discover results" && git push -q origin HEAD:probe-discover
