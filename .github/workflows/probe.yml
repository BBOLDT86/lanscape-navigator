name: Probe market data sources (one-off)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    if: github.repository == 'BBOLDT86/lanscape-navigator'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Probe
        run: python3 .github/probe/probe.py
      - name: Save to the probe branch
        run: |
          git config user.name "probe"; git config user.email "probe@users.noreply.github.com"
          git checkout --orphan probe-results
          git rm -rq --cached . && git add probe.json && git commit -qm "probe results"
          git push -f -q origin HEAD:probe-results
