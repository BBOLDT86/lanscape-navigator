name: probe (scratch)
on:
  push:
    branches: [probe-hobbies]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 probe.py
      - run: |
          git config user.name "probe"; git config user.email "probe@users.noreply.github.com"
          git add results.json && git commit -qm "probe results" && git push -q origin HEAD:probe-hobbies
