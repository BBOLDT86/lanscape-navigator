name: Probe (temporary)
on:
  push:
    branches: [probe-wx]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: python3 probe/probe.py
      - run: |
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add probe-out && git commit -qm "probe results" && git push -q origin HEAD:probe-wx-results2 --force
