name: Probe (temporary)
on:
  push:
    branches: [probe-wx]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 shop/updater/shop.py
      - run: |
          mkdir -p probe-out && cp shop/data/feed.json probe-out/
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add probe-out && git commit -qm "probe results" && git push -q origin HEAD:probe-wx-results3 --force
