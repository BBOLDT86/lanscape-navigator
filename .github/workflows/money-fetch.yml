name: The money, data only
# Fetches the FEC and Google data for news/money/ and commits data/money.json (with its query log) and the rebuilt
# pages, without writing anything with the API. Runs on a push of news/money/fetch.json or by hand; its own
# concurrency group so it doesn't wait behind a long writing run.
on:
  schedule:
    - cron: '7 */3 * * *'   # every three hours until Dec. 9 (the step below checks the date): the counts and the 24-hour reports move
  push:
    paths: ['news/money/fetch.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: money-fetch
  cancel-in-progress: false
jobs:
  fetch:
    if: github.repository == 'BBOLDT86/lanscape-navigator'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%Y%m%d)" -gt 20261209 ]; then echo "past Dec. 9"; exit 0; fi
          timeout -k 30 55m python3 news/money/fetch.py || echo "fetch stopped with $?"
          ls -la news/money/data/ || true
      - name: Build
        if: always()
        run: |
          python3 news/money/build.py
          python3 news/wave/tools/make_pages.py
      - name: Commit and push
        if: always()
        run: |
          git config user.name "The Watch writer"
          git config user.email "the-watch@users.noreply.github.com"
          git add news/money news/wave/*.html news/wave/pages.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -qm "The money: data ($(date -u +%Y-%m-%dT%H:%MZ))"
          for i in 1 2 3 4; do git pull --rebase -X theirs origin main && git push -q origin HEAD:main && exit 0; sleep 15; done
          exit 1
