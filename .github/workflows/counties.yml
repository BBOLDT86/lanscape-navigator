name: County results 2026
# Pulls county-level 2026 Senate and governor results (NYT's public results files, AP counts) into
# election2026/data/counties2026.json and rebuilds The Watch's blue-wave data (news/wave/data/). Every three hours
# until Nov. 30, 2026, and by hand.
on:
  schedule:
    - cron: '41 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: counties2026
  cancel-in-progress: false
jobs:
  update:
    if: github.repository == 'BBOLDT86/lanscape-navigator'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stop after the count
        run: |
          if [ "$(date -u +%Y%m%d)" -gt 20261130 ]; then echo "past Nov. 30, 2026: nothing to do"; echo "SKIP=1" >> "$GITHUB_ENV"; fi
      - name: Fetch the counties
        if: env.SKIP != '1'
        run: |
          python3 election2026/updater/fetch_counties.py
          python3 election2026/updater/fetch_night.py --debug || echo "night: failed (kept last values)"
      - name: Build the wave
        if: env.SKIP != '1'
        run: |
          if [ -f news/wave/build.py ]; then python3 news/wave/build.py; fi
          if [ -f news/wave/tools/make_pages.py ]; then python3 news/wave/tools/make_pages.py; fi
      - name: Commit and push
        if: env.SKIP != '1'
        run: |
          git config user.name "Election Desk updater"
          git config user.email "election-desk@users.noreply.github.com"
          git add election2026/data/counties2026.json election2026/data/night2026.json 2>/dev/null || git add election2026/data/counties2026.json
          if [ -d news/wave/data ]; then git add news/wave/data news/wave/*.html news/wave/pages.json; fi
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -qm "County results: automated update $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push -q origin HEAD:main && exit 0
            sleep 10
          done
          echo "push failed" >&2; exit 1
