name: Finds updater
# Finds (shop/): live prices, pictures and stock from the stores' own catalogs every six hours, Claude's picks refreshed,
# trend reporting, and (with the repository secrets EBAY_CLIENT_ID / EBAY_CLIENT_SECRET) new and used eBay listings.
# Runs on a schedule, when the picks or the store list change, or by hand. See shop/UPDATER.md.
on:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths: ['shop/picks/**', 'shop/sources.json', 'shop/updater/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: finds
  cancel-in-progress: false
jobs:
  update:
    if: github.repository == 'BBOLDT86/lanscape-navigator'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the picks
        run: python3 shop/updater/shop.py check
      - name: Stores, picks, eBay and trends
        timeout-minutes: 9
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: python3 shop/updater/shop.py
      - name: Commit and push
        run: |
          git config user.name "Finds updater"
          git config user.email "the-watch-news@users.noreply.github.com"
          git add shop/data
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -qm "Finds: live prices and stock"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push -q origin HEAD:main && exit 0
            sleep 10
          done
          echo "push failed" >&2; exit 1
