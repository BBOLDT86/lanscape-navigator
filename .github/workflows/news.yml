name: The Watch news updater
# Six editions a day, one for each ship's watch, Eastern time: Middle (12 a.m.), Morning (4 a.m.), Forenoon (8 a.m.),
# Afternoon (12 p.m.), Dog (4 p.m.) and First (8 p.m.). GitHub's cron is UTC, so this fires at both the EDT and the
# EST hour of every watch (and covers a late run); news/updater/run.py builds an edition only when the current
# watch has none yet. A manual run (Run workflow) always builds. See news/UPDATER.md.
on:
  schedule:
    - cron: '11 0,1,4,5,8,9,12,13,16,17,20,21 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: the-watch-news
  cancel-in-progress: false
jobs:
  update:
    if: github.repository == 'BBOLDT86/lanscape-navigator'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the edition
        run: python3 news/updater/run.py ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
      - name: Markets and the economy
        timeout-minutes: 4
        continue-on-error: true
        run: |
          pip install --quiet xlrd==2.0.1 || echo "xlrd not installed; gas prices come from DBnomics"
          python3 news/updater/markets.py ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }} || echo "markets failed, kept the last snapshot"
      - name: Scores, schedules and standings
        timeout-minutes: 3
        continue-on-error: true
        run: |
          python3 news/updater/sports.py || echo "sports failed; kept the last copy"
      - name: What the week's reports move, and what options price
        timeout-minutes: 4
        continue-on-error: true
        run: |
          python3 news/updater/impact.py ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }} || echo "impact maps failed; the calendar works without them"
      - name: The power grids, prices and carbon
        timeout-minutes: 4
        continue-on-error: true
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: |
          python3 news/updater/power.py ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }} || echo "power data failed; kept the last copy"
      - name: The garage, the auctions and FSD news
        timeout-minutes: 3
        continue-on-error: true
        run: |
          python3 news/updater/garage.py || echo "garage feeds failed; kept the last copy"
      - name: Home market and saved searches
        timeout-minutes: 6
        continue-on-error: true
        env:
          RENTCAST_API_KEY: ${{ secrets.RENTCAST_API_KEY }}
        run: |
          python3 news/updater/home.py || echo "home failed, kept the last data"
      - name: Pictures and video
        timeout-minutes: 4
        continue-on-error: true
        run: |
          python3 news/updater/media.py || echo "media failed; the page works without it"
      - name: Weather (the airports and the tropics)
        timeout-minutes: 2
        continue-on-error: true
        run: |
          python3 news/updater/weather.py || echo "weather failed; kept the last copy"
      - name: Late Night segments
        timeout-minutes: 2
        continue-on-error: true
        run: |
          python3 news/updater/latenight.py || echo "late-night feeds failed; kept the last copy"
      - name: Link preview cards for new reports
        timeout-minutes: 3
        continue-on-error: true
        run: |
          pip install --quiet pillow || echo "pillow not installed"
          python3 news/updater/share.py || echo "share cards failed; links still work"
      - name: Commit and push
        run: |
          git config user.name "The Watch updater"
          git config user.email "the-watch-news@users.noreply.github.com"
          git add news/data news/r
          if git diff --cached --quiet; then echo "no new edition"; exit 0; fi
          label=$(python3 -c "import json;d=json.load(open('news/data/latest.json'));print(d['label'], d['id'][:10])")
          git commit -qm "The Watch: $label edition"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push -q origin HEAD:main && exit 0
            sleep 10
          done
          echo "push failed" >&2; exit 1
