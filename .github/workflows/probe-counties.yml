name: Probe county results endpoints
# Scratch: tries public county-level results endpoints from a runner (manual only; prints to the log, commits nothing).
on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'path to a URL list in the repo'
        default: 'election2026/updater/probe_urls.txt'
jobs:
  probe:
    if: github.repository == 'BBOLDT86/lanscape-navigator'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 election2026/updater/probe_counties.py "${{ github.event.inputs.urls }}"
