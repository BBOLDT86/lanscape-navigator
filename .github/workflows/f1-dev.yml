name: F1 hub dev run (temporary)
on:
  push:
    branches: [f1-dev]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 news/updater/f1.py
      - run: |
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add -f news/data/f1.json news/data/f1 && git commit -qm "f1 dev data" && git push -q origin HEAD:f1-dev-data --force
