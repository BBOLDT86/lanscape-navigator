name: Probe Barstool API (scratch)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch
        run: |
          mkdir -p probe
          for u in \
            "https://union.barstoolsports.com/v2/stories/latest?limit=5&type=standard_post" \
            "https://union.barstoolsports.com/v2/stories/latest?limit=5" \
            "https://www.barstoolsports.com/feed" \
            "https://www.barstoolsports.com/rss" \
            "https://www.barstoolsports.com/sitemap.xml"; do
            echo "=== $u" >> probe/out.txt
            curl -sS -L -m 20 -A "Mozilla/5.0 (compatible; TheWatch/1.0)" -w "\n--- HTTP %{http_code} %{content_type}\n" "$u" | head -c 4000 >> probe/out.txt || echo "curl failed" >> probe/out.txt
            echo >> probe/out.txt
          done
      - name: Commit
        run: |
          git config user.name probe; git config user.email probe@example.com
          git add probe/out.txt && git commit -m "probe output" && git push origin HEAD:probe-barstool
