<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LANscape Navigator</title>
<meta name="description" content="A serverless 1990s-style web browser for the files on your own computer: every page gets a domain name, similar pages join web rings, a search engine indexes it all, and documents, music, video and photos open in programs of their own. Nothing is uploaded.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23101060'/%3E%3Ccircle cx='11' cy='6' r='3' fill='%23ffb347'/%3E%3Cpath d='M0 13 5 7l3 3 3-4 5 6v4H0z' fill='%232d8a5f'/%3E%3C/svg%3E">
<style>
/* Layout concept: a maximized Win95-era browser window — chrome bands stacked top and bottom, page frame in the middle, optional Explorer-style sidebar. */
:root{
  --face:#c0c0c0; --face-hi:#dfdfdf; --hilite:#ffffff; --shadow:#808080; --dk:#0a0a0a;
  --text:#000000; --muted:#3c3c3c; --field:#ffffff; --field-text:#000000;
  --title-a:#000080; --title-b:#1084d0; --title-text:#ffffff; --title-ia:#7b7b7b; --title-ib:#b4b4b4;
  --sel:#000080; --sel-text:#ffffff; --desk:#008080; --link:#0000ee; --tip:#ffffe1; --tip-text:#000;
  --ok:#008000; --warn:#a05a00; --bad:#c00000;
  --ui-font: Tahoma, "MS Sans Serif", Geneva, Verdana, "DejaVu Sans", sans-serif;
  --mono-font: "Courier New", Courier, "Liberation Mono", ui-monospace, Menlo, monospace;
  --serif-font: "Times New Roman", Times, "Liberation Serif", serif;
  color-scheme: light;
}
:root[data-theme="night"]{
  --face:#2f3341; --face-hi:#3c4152; --hilite:#565d74; --shadow:#1d2029; --dk:#07080b;
  --text:#e7e9f0; --muted:#a7adbd; --field:#1b1e27; --field-text:#e7e9f0;
  --title-a:#2b0f52; --title-b:#6d32d8; --title-text:#ffffff; --title-ia:#3a3d48; --title-ib:#4b4f5d;
  --sel:#5a4bd1; --sel-text:#ffffff; --desk:#0d1117; --link:#8ab4ff; --tip:#3c4152; --tip-text:#e7e9f0;
  --ok:#5fd38d; --warn:#f0b35a; --bad:#ff7a7a;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--desk);color:var(--text);font:11px/1.35 var(--ui-font);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:1px dotted var(--text);outline-offset:-4px}

/* ---------- bevels ---------- */
.raised,.btn,.tool,.dbtn,.tbb{background:var(--face);box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--hilite),inset -2px -2px var(--shadow),inset 2px 2px var(--face-hi)}
.sunken,.field{box-shadow:inset -1px -1px var(--hilite),inset 1px 1px var(--shadow),inset -2px -2px var(--face-hi),inset 2px 2px var(--dk)}
.field{background:var(--field);color:var(--field-text);border:0;padding:3px 5px;min-height:21px}
.field:focus{outline:none}
.groove{border-top:1px solid var(--shadow);border-bottom:1px solid var(--hilite)}
.btn{border:0;padding:4px 12px;min-width:72px;min-height:23px;cursor:pointer}
.btn:active,.btn.on,.tool:active:not(:disabled),.dbtn:active,.tbb:active{box-shadow:inset -1px -1px var(--hilite),inset 1px 1px var(--dk),inset -2px -2px var(--face-hi),inset 2px 2px var(--shadow)}
.btn:disabled,.tool:disabled{color:var(--shadow);text-shadow:1px 1px var(--hilite);cursor:default}
.btn.primary{outline:1px solid var(--dk);outline-offset:-1px}

/* ---------- window ---------- */
.app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--face);padding:3px;
  box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--face-hi),inset -2px -2px var(--shadow),inset 2px 2px var(--hilite)}
.app.restored{inset:28px 5% 28px 5%}
@media (max-width:820px){.app.restored{inset:0}}
/* Full screen: the page frame takes the whole window; the chrome comes back with the chip, F11 or the View menu */
.app.kiosk{padding:0;background:#000}
.app.kiosk>.titlebar,.app.kiosk>.menubar,.app.kiosk>.bands,.app.kiosk>.ringstrip,.app.kiosk>.statusbar,.app.kiosk .sidebar{display:none}
.app.kiosk .main{padding:0;gap:0} .app.kiosk .viewport{padding:0;background:#000} .app.kiosk #frame{inset:0;width:100%;height:100%} .app.kiosk .curtain{left:0;right:0;bottom:0}
.fschip{position:fixed;z-index:45;font:bold 11px var(--ui-font);background:rgba(20,20,20,.72);color:#fff;border:1px solid rgba(255,255,255,.45);padding:7px 10px;cursor:pointer;display:none;align-items:center;gap:6px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);border-radius:3px}
.fschip:hover{background:#000;border-color:#fff}
#fsEnter{right:12px;bottom:calc(32px + env(safe-area-inset-bottom,0px))} .app.framed #fsEnter{display:inline-flex}
#fsExit{right:8px;top:calc(8px + env(safe-area-inset-top,0px));opacity:.9;transition:opacity .4s} .app.kiosk #fsExit{display:inline-flex} .app.kiosk.coop #fsExit{display:none} .app.kiosk #fsExit.dim{opacity:.35} .app.kiosk #fsEnter{display:none}
.titlebar{display:flex;align-items:center;gap:6px;height:22px;padding:0 3px 0 4px;color:var(--title-text);
  background:linear-gradient(90deg,var(--title-a),var(--title-b));font-weight:bold;user-select:none;flex:none}
.app.blur .titlebar{background:linear-gradient(90deg,var(--title-ia),var(--title-ib))}
.tb-icon{width:16px;height:16px;flex:none;display:block}
.tb-title{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.2px}
.tb-btns{display:flex;gap:2px}
.tbb{width:18px;height:16px;border:0;padding:0;display:grid;place-items:center;cursor:pointer}
.tbb svg{display:block}

/* ---------- menus ---------- */
.menubar{display:flex;gap:0;padding:1px 2px;flex:none;overflow-x:auto;scrollbar-width:none}
.menubar::-webkit-scrollbar{display:none}
.mitem{background:none;border:0;padding:3px 8px;cursor:default;white-space:nowrap}
.mitem.open,.mitem:focus-visible{background:var(--sel);color:var(--sel-text);outline:none}
.menu{position:fixed;z-index:60;min-width:200px;padding:2px;background:var(--face);
  box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--face-hi),inset -2px -2px var(--shadow),inset 2px 2px var(--hilite),3px 3px 0 rgba(0,0,0,.25)}
.menu button{display:flex;width:100%;align-items:center;gap:10px;border:0;background:none;padding:4px 20px 4px 22px;text-align:left;cursor:default;position:relative;white-space:nowrap}
.menu button:hover,.menu button:focus-visible{background:var(--sel);color:var(--sel-text);outline:none}
.menu button:disabled{color:var(--shadow);text-shadow:1px 1px var(--hilite)}
.menu button:disabled:hover{background:none}
.menu button .k{margin-left:auto;padding-left:24px;opacity:.85}
.menu button.chk::before{content:"✓";position:absolute;left:7px;font-weight:bold}
.menu button.rad::before{content:"●";position:absolute;left:8px;font-size:8px}
.menu hr{border:0;border-top:1px solid var(--shadow);border-bottom:1px solid var(--hilite);margin:3px 2px}
.menu .mlabel{padding:3px 8px;color:var(--muted);font-style:italic}

/* ---------- toolbar ---------- */
.bands{flex:none;display:flex;flex-direction:column;gap:2px;padding-top:2px}
.band{display:flex;align-items:center;gap:4px;padding:2px 3px;border-top:1px solid var(--hilite);border-bottom:1px solid var(--shadow);position:relative}
.band::before{content:"";width:3px;align-self:stretch;margin-right:2px;flex:none;
  box-shadow:inset -1px -1px var(--shadow),inset 1px 1px var(--hilite)}
.toolbar .tools{display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.toolbar .tools::-webkit-scrollbar{display:none}
.tool{border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-width:50px;height:44px;padding:2px 4px;cursor:pointer;flex:none}
.tool svg{width:24px;height:24px;display:block}
.tool:disabled svg{filter:grayscale(1) opacity(.45)}
.tool span{font-size:11px}
.throbber{flex:none;width:46px;height:46px;display:block;cursor:pointer;margin-left:4px}
.throbber svg{width:100%;height:100%;display:block}
.sep{width:2px;align-self:stretch;margin:2px 3px;box-shadow:inset 1px 0 var(--shadow),inset -1px 0 var(--hilite)}

.locbar label{white-space:nowrap;padding:0 2px 0 4px;font-weight:bold}
.loc-wrap{flex:1;min-width:120px;position:relative;display:flex}
.loc-wrap .field{flex:1;min-width:0;padding-left:22px;font-size:12px}
.loc-fav{position:absolute;left:5px;top:50%;width:14px;height:14px;transform:translateY(-50%);pointer-events:none;image-rendering:pixelated}
.loc-drop{width:18px;border:0;padding:0;cursor:pointer}
.suggest{position:absolute;left:0;right:0;top:100%;z-index:55;background:var(--field);color:var(--field-text);border:1px solid var(--dk);max-height:360px;overflow:auto;box-shadow:3px 3px 0 rgba(0,0,0,.25)}
.sg{display:flex;gap:8px;align-items:baseline;padding:4px 8px;cursor:default;white-space:nowrap;overflow:hidden}
.sg.on{background:var(--sel);color:var(--sel-text)}
.sg .u{opacity:.75;overflow:hidden;text-overflow:ellipsis}
.sg .tag{font-size:10px;border:1px solid currentColor;padding:0 3px;opacity:.7;flex:none}
.sg b{font-weight:bold}
.sg-h{padding:3px 8px;font-size:10px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);background:var(--face-hi)}
.btnsm{border:0;padding:3px 8px;min-height:22px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.btnsm svg{width:14px;height:14px}
.dirbar .row{display:flex;gap:3px;flex-wrap:wrap}
.dbtn{border:0;padding:2px 9px;min-height:20px;cursor:pointer;white-space:nowrap}

/* ---------- main ---------- */
.main{flex:1;min-height:0;display:flex;gap:3px;padding-top:3px}
.viewport{flex:1;min-width:0;position:relative;padding:2px;background:var(--field)}
#frame{position:absolute;inset:2px;width:calc(100% - 4px);height:calc(100% - 4px);border:0;background:#fff;display:block}
.curtain{position:absolute;left:2px;right:2px;bottom:2px;background:#c0c0c0;pointer-events:none;
  background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.05) 0 1px,transparent 1px 3px)}
.curtain::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(#999,#c0c0c0)}
.dropzone{position:absolute;inset:2px;z-index:5;display:grid;place-items:center;background:rgba(0,0,128,.82);color:#fff;font:bold 20px/1.4 var(--ui-font);text-align:center;border:4px dashed #ffff66}

.sidebar{width:290px;flex:none;display:flex;flex-direction:column;min-height:0}
.sb-head{display:flex;align-items:center;justify-content:space-between;padding:2px 2px 2px 6px;background:linear-gradient(90deg,var(--title-a),var(--title-b));color:var(--title-text);font-weight:bold}
.tabs{display:flex;gap:0;padding:4px 2px 0;flex:none}
.tab{border:0;background:var(--face);padding:3px 8px;margin-right:-1px;cursor:pointer;position:relative;top:1px;
  box-shadow:inset -1px 0 var(--dk),inset 1px 1px var(--hilite),inset -2px 0 var(--shadow)}
.tab.on{z-index:2;padding-bottom:5px;top:0;font-weight:bold}
.sb-panes{flex:1;min-height:0;display:flex;flex-direction:column;padding:6px;
  box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--hilite),inset -2px -2px var(--shadow)}
.pane{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}
.list{flex:1;min-height:0;overflow:auto;background:var(--field);color:var(--field-text);padding:2px}
.li{display:flex;gap:6px;align-items:flex-start;padding:4px;cursor:pointer;border-bottom:1px dotted rgba(128,128,128,.35)}
.li:hover{background:rgba(0,0,128,.08)}
.li.on{background:var(--sel);color:var(--sel-text)}
.li .t{font-weight:bold;display:block;overflow-wrap:anywhere}
.li .u{display:block;color:var(--ok);font-size:10px;overflow-wrap:anywhere}
.li.on .u{color:inherit}
.li .s{display:block;font-size:10.5px;opacity:.85;overflow-wrap:anywhere}
.li .s b{background:#ffff66;color:#000;font-weight:normal}
.li img.th{width:64px;height:48px;object-fit:cover;flex:none;border:1px solid var(--shadow);background:#fff}
.li img.b88{width:44px;height:15.5px;flex:none;image-rendering:pixelated;margin-top:2px}
.li .x{margin-left:auto;border:0;background:none;cursor:pointer;color:inherit;opacity:.6;padding:0 3px}
.li .bar{display:block;height:5px;background:var(--face-hi);margin-top:3px;box-shadow:inset 1px 1px var(--shadow)}
.li .bar i{display:block;height:100%;background:var(--sel)}
.tree .ring{display:flex;align-items:center;gap:6px;padding:3px 4px;cursor:pointer;font-weight:bold;user-select:none}
.tree .ring .dot{width:10px;height:10px;border:1px solid var(--dk);flex:none}
.tree .ring .n{margin-left:auto;font-weight:normal;opacity:.7}
.tree .kids{padding-left:18px}
.tree .kid{padding:2px 4px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tree .kid:hover{text-decoration:underline}
.tree .kid.on{background:var(--sel);color:var(--sel-text)}
.hint{color:var(--muted);font-size:10.5px}
.empty{padding:14px 8px;color:var(--muted);text-align:center}

/* ---------- ring strip & status ---------- */
.ringstrip{flex:none;display:flex;align-items:center;gap:6px;margin-top:3px;padding:3px 5px;min-height:28px;flex-wrap:wrap}
.ringstrip .rnav{display:flex;gap:2px;flex:none}
.ringstrip .rnav button{border:0;padding:2px 8px;min-height:20px;cursor:pointer;white-space:nowrap}
.ringstrip .rinfo{flex:1;min-width:160px;display:flex;align-items:center;gap:6px;overflow:hidden;white-space:nowrap}
.ringstrip .rinfo img{width:88px;height:31px;image-rendering:pixelated;flex:none;cursor:pointer}
.ringstrip .rinfo .nm{font-weight:bold;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.ringstrip .rinfo .nm:hover{text-decoration:underline}
.ringstrip .rextra{display:flex;gap:4px;align-items:center;flex:none}
.verbar{position:absolute;left:2px;right:2px;top:2px;height:29px;z-index:3;display:flex;align-items:center;gap:5px;padding:0 4px 0 7px;background:var(--tip);color:var(--tip-text);border-bottom:1px solid var(--shadow);font-size:11.5px;white-space:nowrap;overflow:hidden}
.verbar .vb-ico svg{width:16px;height:16px;display:block}
.verbar .vb-msg{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.verbar .dbtn{padding:1px 7px;min-height:20px;font-size:11px}
.verbar .dbtn:disabled{color:var(--shadow)}
.verbar .vb-x{border:0;background:none;color:inherit;cursor:pointer;font-size:15px;line-height:1;padding:0 4px;opacity:.7}
.viewport.vb #frame{top:31px;height:calc(100% - 33px)}
.verbar .vb-n{display:none}
@media (max-width:700px){.verbar .vb-w{display:none}.verbar .vb-n{display:inline}.verbar [data-v=split],.verbar [data-v=all],.verbar [data-v=older],.verbar [data-v=newer]{display:none}}
.odo{display:inline-flex;gap:1px;padding:1px;background:#000;border:1px solid var(--shadow)}
.odo b{display:inline-block;width:9px;text-align:center;background:linear-gradient(#333,#000 45%,#222 55%,#000);color:#fff;font:bold 11px/14px var(--mono-font)}
.statusbar{flex:none;display:flex;gap:3px;margin-top:3px;height:22px}
.statusbar > span{display:flex;align-items:center;padding:0 5px;min-width:0;
  box-shadow:inset -1px -1px var(--hilite),inset 1px 1px var(--shadow)}
.sb-sec{width:26px;justify-content:center;flex:none}
.sb-sec svg{width:16px;height:16px}
.sb-msg{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-prog{width:150px;flex:none;padding:3px!important}
.sb-prog i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,var(--sel) 0 8px,transparent 8px 10px);transition:width .15s linear}
.sb-net{width:auto;flex:none;gap:5px}
.sb-net .led{width:7px;height:7px;border-radius:50%;background:#2c2;box-shadow:0 0 3px #2c2}
.sb-net .led.busy{background:#fc2;box-shadow:0 0 3px #fc2;animation:blinkled .25s steps(2) infinite}
@keyframes blinkled{50%{opacity:.25}}
.sb-music{flex:0 1 auto;max-width:min(340px,38vw);gap:4px}
.sb-music[hidden]{display:none!important}
.sb-music button{flex:none;border:0;background:var(--face);min-width:18px;height:16px;padding:0 3px;display:grid;place-items:center;font:9px/1 var(--ui-font);color:#000;cursor:default;box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--hilite),inset -2px -2px var(--shadow)}
.sb-music button:active{box-shadow:inset 1px 1px var(--dk),inset -1px -1px var(--hilite)}
.sb-music .sbm-t{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:inherit;text-decoration:none}
.sb-music .sbm-t:hover{text-decoration:underline;color:var(--link,#00e)}
.sb-music.on .sbm-t{font-weight:bold}

/* ---------- throbber animation ---------- */
.throbber .stars circle{opacity:.85}
.throbber.busy .stars circle{animation:twinkle 1.1s ease-in-out infinite}
.throbber.busy .stars circle:nth-child(2n){animation-delay:.35s}
.throbber.busy .stars circle:nth-child(3n){animation-delay:.7s}
.throbber .comet{opacity:0}
.throbber.busy .comet{animation:comet 1.2s linear infinite}
.throbber .sun{transform-origin:28px 30px;transition:transform .4s}
.throbber.busy .sun{animation:sunrise 2.4s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.1}}
@keyframes comet{0%{opacity:0;transform:translate(0,0)}15%{opacity:1}70%{opacity:1}100%{opacity:0;transform:translate(26px,12px)}}
@keyframes sunrise{0%,100%{transform:translateY(5px)}50%{transform:translateY(-3px)}}

/* ---------- dialogs ---------- */
.layer{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px;pointer-events:none}
.layer.modal{pointer-events:auto;background:rgba(0,0,0,.08)}
.win{pointer-events:auto;background:var(--face);padding:3px;max-width:calc(100vw - 24px);max-height:calc(100vh - 24px);display:flex;flex-direction:column;
  box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--face-hi),inset -2px -2px var(--shadow),inset 2px 2px var(--hilite),4px 4px 0 rgba(0,0,0,.3)}
.win .titlebar{cursor:move}
.win-body{padding:12px;overflow:auto;min-height:0;flex:1}
.win-foot{display:flex;justify-content:flex-end;gap:6px;padding:4px 12px 10px;flex-wrap:wrap}
.msg{display:flex;gap:14px;align-items:flex-start;max-width:440px}
.msg svg{flex:none;width:34px;height:34px}
.msg p{margin:0 0 8px}
fieldset{border:0;margin:0 0 10px;padding:14px 10px 10px;position:relative;
  box-shadow:inset -1px -1px var(--hilite),inset 1px 1px var(--shadow),inset -2px -2px var(--shadow),inset 2px 2px var(--hilite)}
legend{padding:0 4px;position:absolute;top:-7px;left:8px;background:var(--face)}
.frow{display:flex;gap:8px;align-items:center;margin:5px 0;flex-wrap:wrap}
.frow > label:first-child{min-width:130px}
.check{display:flex;gap:6px;align-items:flex-start;margin:4px 0}
.check input{margin:1px 0 0}
.grid-table{width:100%;border-collapse:collapse;background:var(--field);color:var(--field-text)}
.grid-table th{position:sticky;top:0;background:var(--face);text-align:left;font-weight:normal;padding:3px 6px;white-space:nowrap;z-index:1;
  box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--hilite)}
.grid-table td{padding:3px 6px;border-bottom:1px solid rgba(128,128,128,.25);vertical-align:middle}
.grid-table tr.sel td{background:var(--sel);color:var(--sel-text)}
.grid-table input.field{width:100%;min-width:180px;font:12px var(--mono-font)}
.grid-table input.bad{outline:2px solid var(--bad);outline-offset:-2px}
.tscroll{overflow:auto;max-height:52vh}
.source{margin:0;padding:8px;background:var(--field);color:var(--field-text);font:12px/1.45 var(--mono-font);white-space:pre-wrap;word-break:break-word;overflow:auto;max-height:68vh;tab-size:2}
.source .tg{color:#800080}.source .at{color:#a0522d}.source .st{color:#0000c0}.source .cm{color:#008000;font-style:italic}.source .dt{color:#808080}
:root[data-theme="night"] .source .tg{color:#d79cff}:root[data-theme="night"] .source .at{color:#ffb38a}:root[data-theme="night"] .source .st{color:#8ab4ff}:root[data-theme="night"] .source .cm{color:#7fd88f}
.progress{height:18px;padding:2px;margin:8px 0}
.progress i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,var(--sel) 0 9px,transparent 9px 11px)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:3px 12px;align-items:baseline}
.kv dt{color:var(--muted)}
.kv dd{margin:0;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{padding:1px 6px;background:var(--field);color:var(--field-text);border:1px solid var(--shadow)}
.spider-art{width:64px;height:64px;flex:none}
.spider-art .leg{transform-origin:32px 30px;animation:legs .5s ease-in-out infinite alternate}
@keyframes legs{to{transform:rotate(6deg)}}
.cols2{display:grid;grid-template-columns:220px 1fr;gap:10px;min-height:0}
@media (max-width:640px){.cols2{grid-template-columns:1fr}}
.ringlist{max-height:46vh;overflow:auto;background:var(--field);color:var(--field-text)}
.ringlist .rl{display:flex;gap:6px;align-items:center;padding:4px 6px;cursor:pointer}
.ringlist .rl.on{background:var(--sel);color:var(--sel-text)}
.ringlist .rl i{width:10px;height:10px;border:1px solid var(--dk);flex:none}
.ringlist .rl span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{background:var(--tip);color:var(--tip-text);border:1px solid var(--dk);padding:6px 8px;margin:0 0 8px}
.mono{font-family:var(--mono-font)}

/* ---------- responsive ---------- */
@media (max-width:900px){.sidebar{position:absolute;z-index:40;left:6px;top:auto;bottom:60px;height:62vh;width:min(300px,86vw);
  box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--hilite),4px 4px 0 rgba(0,0,0,.3);background:var(--face)}}
@media (max-width:700px){.tool span{display:none}.tool{min-width:34px;height:32px}.throbber{width:34px;height:34px}
  .dirbar{display:none}.locbar label{display:none}.sb-prog{width:60px}.ringstrip .rinfo img{display:none}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important;animation-iteration-count:1!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="titlebar" id="titlebar">
    <svg class="tb-icon" viewBox="0 0 16 16" aria-hidden="true"><rect width="16" height="16" fill="#101060"/><circle cx="4" cy="3" r=".7" fill="#fff"/><circle cx="8" cy="2" r=".5" fill="#fff"/><circle cx="11" cy="6" r="3" fill="#ffb347"/><path d="M0 13 5 7l3 3 3-4 5 6v4H0z" fill="#2d8a5f"/><path d="M7 16l1-4h1l1 4z" fill="#ccc"/></svg>
    <span class="tb-title" id="winTitle">LANscape Navigator</span>
    <span class="tb-btns">
      <button class="tbb" data-act="min" title="Hide toolbars" aria-label="Hide toolbars"><svg width="8" height="8" viewBox="0 0 8 8"><rect x="1" y="6" width="6" height="2" fill="currentColor"/></svg></button>
      <button class="tbb" data-act="max" title="Restore / maximize" aria-label="Restore or maximize"><svg width="9" height="9" viewBox="0 0 9 9"><path d="M0 0h9v9H0zM1 2v6h7V2z" fill="currentColor"/></svg></button>
      <button class="tbb" data-act="close" title="Disconnect" aria-label="Disconnect"><svg width="8" height="8" viewBox="0 0 8 8"><path d="M0 0h2l2 2 2-2h2v1L5 4l3 3v1H6L4 6 2 8H0V7l3-3-3-3z" fill="currentColor"/></svg></button>
    </span>
  </header>
  <nav class="menubar" id="menubar" role="menubar" aria-label="Menu"></nav>
  <div class="bands" id="bands">
    <div class="band toolbar" id="toolbar">
      <div class="tools" id="tools"></div>
      <a class="throbber" id="throbber" href="#" title="LANscape Home" aria-label="LANscape Home">
        <svg viewBox="0 0 40 40" aria-hidden="true">
          <defs>
            <linearGradient id="thSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#05052e"/><stop offset=".7" stop-color="#3b2a7c"/><stop offset="1" stop-color="#c2477d"/></linearGradient>
            <linearGradient id="thSun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff2a8"/><stop offset="1" stop-color="#ff8c42"/></linearGradient>
          </defs>
          <rect width="40" height="40" fill="url(#thSky)"/>
          <g class="stars" fill="#fff"><circle cx="5" cy="5" r=".8"/><circle cx="13" cy="9" r=".6"/><circle cx="21" cy="4" r=".7"/><circle cx="34" cy="7" r=".9"/><circle cx="9" cy="15" r=".5"/><circle cx="27" cy="12" r=".5"/><circle cx="37" cy="16" r=".6"/></g>
          <path class="comet" d="M3 6 L9 9" stroke="#fff" stroke-width="1.2" stroke-linecap="round"/>
          <g class="sun"><circle cx="28" cy="27" r="7" fill="url(#thSun)"/></g>
          <path d="M0 29 L8 21 L14 26 L21 17 L30 27 L35 23 L40 27 V40 H0Z" fill="#2c7a57"/>
          <path d="M0 33 L11 27 L19 31 L29 25 L40 31 V40 H0Z" fill="#164d36"/>
          <path d="M17.5 40 L19.6 30.5 L20.4 30.5 L22.5 40Z" fill="#b8b8b8"/>
          <path d="M19.9 32 v1.4 M19.95 35 v1.8 M20.05 38.2 v1.6" stroke="#ffd34d" stroke-width=".5"/>
        </svg>
      </a>
    </div>
    <div class="band locbar" id="locbar">
      <button class="btnsm raised" id="bmkBtn" title="Bookmarks"><svg viewBox="0 0 14 14"><path d="M3 1h8v12l-4-3-4 3z" fill="#1c5fd1" stroke="#000" stroke-width=".8"/></svg>Bookmarks</button>
      <label for="loc" id="locLabel">Location:</label>
      <div class="loc-wrap">
        <img class="loc-fav" id="locFav" alt="">
        <input class="field" id="loc" type="text" spellcheck="false" autocomplete="off" aria-label="Location" aria-autocomplete="list" aria-controls="suggest">
        <button class="loc-drop raised" id="locDrop" title="Recently typed" aria-label="Recently typed locations"><svg width="7" height="4" viewBox="0 0 7 4"><path d="M0 0h7L3.5 4z" fill="currentColor"/></svg></button>
        <div class="suggest" id="suggest" role="listbox" hidden></div>
      </div>
      <button class="btnsm raised" id="relBtn" title="What's Related"><svg viewBox="0 0 14 14"><rect x="1" y="1" width="7" height="9" fill="#fff" stroke="#000" stroke-width=".8"/><rect x="6" y="4" width="7" height="9" fill="#ffe680" stroke="#000" stroke-width=".8"/><path d="M8 7h3M8 9h3M8 11h2" stroke="#000" stroke-width=".7"/></svg>What's Related</button>
    </div>
    <div class="band dirbar" id="dirbar"><div class="row" id="dirrow"></div></div>
  </div>
  <div class="main" id="main">
    <aside class="sidebar raised" id="sidebar" hidden>
      <div class="sb-head"><span>LANscape Explorer</span><button class="tbb" id="sbClose" aria-label="Close sidebar"><svg width="8" height="8" viewBox="0 0 8 8"><path d="M0 0h2l2 2 2-2h2v1L5 4l3 3v1H6L4 6 2 8H0V7l3-3-3-3z" fill="currentColor"/></svg></button></div>
      <div class="tabs" role="tablist" id="sbTabs"></div>
      <div class="sb-panes" id="sbPanes"></div>
    </aside>
    <div class="viewport sunken" id="viewport">
      <iframe id="frame" title="Page" referrerpolicy="no-referrer"></iframe>
      <div class="curtain" id="curtain" hidden></div>
      <div class="dropzone" id="dropzone" hidden><div>Drop a folder of HTML files<br><span style="font-weight:normal;font-size:14px">LANscape will give every page a domain name and build your Internet</span></div></div>
    </div>
    <button class="fschip" id="fsEnter" title="Full screen (F11)">&#x26F6; Full screen</button>
    <button class="fschip" id="fsExit" title="Back to LANscape (F11)">&#x2716; LANscape</button>
  </div>
  <div class="ringstrip sunken" id="ringstrip"></div>
  <footer class="statusbar" id="statusbar">
    <span class="sb-sec" id="sbSec" title="This page was loaded from your own disk"></span>
    <span class="sb-msg" id="sbMsg">Document: Done</span>
    <span class="sb-prog" id="sbProg"><i id="sbBar"></i></span>
    <span class="sb-net" id="sbNet" title="Connection speed (Options menu)"><i class="led" id="sbLed"></i><b id="sbNetTxt">LAN</b></span>
  </footer>
</div>
<div id="menus"></div>
<div class="layer" id="layer"></div>
<div id="spiderBox" aria-hidden="true" style="position:fixed;left:-20000px;top:0;width:1024px;height:768px;overflow:hidden;opacity:0;pointer-events:none"></div>
<input type="file" id="dirInput" webkitdirectory directory multiple hidden autocomplete="off">
<input type="file" id="fileInput" multiple hidden autocomplete="off" accept=".html,.htm,.xhtml,.txt,.md,.pdf,.css,.js,.png,.jpg,.jpeg,.gif,.svg,.webp">
<input type="file" id="importInput" accept=".json,application/json" hidden autocomplete="off">
