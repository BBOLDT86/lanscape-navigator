<title>The Reserve in 3-D</title>

<style>
/* One dark look, like the wave's election night: a navy stage, warm light on the blocks. */
:root{
  --bg:#0b1526; --panel:#122037; --panel-2:#182a45; --line:#2a3d5c; --ink:#e9f0f8; --muted:#9fb0c8; --dim:#6f819c;
  --amber:#f2b84b; --rose:#ff8f6b; --teal:#5fc4cc; --blue:#6fb2ff; --olive:#b9c25a; --slate:#41526e;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
a{color:var(--amber)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mast{border-bottom:1px solid var(--line)}
.mast .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px;flex-wrap:wrap}
.back{font-weight:600;text-decoration:none;font-size:14px}
.kick{font-family:var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-size:13px}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.05;margin:0;text-wrap:balance}
h1{font-size:clamp(34px,6vw,58px)} h2{font-size:28px} h3{font-size:20px}
.head{padding-block:22px 14px;display:flex;flex-direction:column;gap:8px}
.dek{color:var(--muted);max-width:70ch;margin:0;font-size:16px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:10px}
.tabs button{font-family:var(--display);font-size:18px;font-weight:600;letter-spacing:.02em;padding:8px 16px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stage{position:relative;height:min(74vh,700px);min-height:420px;border-radius:12px;overflow:hidden;background:radial-gradient(120% 90% at 50% 20%,#14284a 0%,#0b1526 70%);border:1px solid var(--line);touch-action:none;user-select:none;-webkit-user-select:none}
.stage canvas{display:block;width:100%;height:100%}
.stage.fs{position:fixed;inset:0;z-index:50;height:auto;border-radius:0;border:0}
.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;transform:translate(-50%,-50%);font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap;text-shadow:0 1px 2px #000}
.lb.seat{font-family:var(--display);font-size:15px;font-weight:600;color:var(--ink);text-align:center;line-height:1.05}
.lb.seat small{display:block;font-family:var(--mono);font-size:12px;font-weight:500;color:var(--amber)}
.lb.rank{font-family:var(--display);font-size:16px;font-weight:600;color:var(--ink)}
.lb.zone{font-family:var(--display);font-size:16px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);opacity:.75}
.lb.axis{font-family:var(--display);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--amber)}
.hud{position:absolute;left:0;top:0;right:0;padding:12px 14px 22px;background:linear-gradient(180deg,rgba(11,21,38,.85),rgba(11,21,38,0));pointer-events:none;display:flex;flex-direction:column;gap:2px}
.hud .hk{font-family:var(--display);letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--amber)}
.hud .ht{font-family:var(--display);font-size:clamp(22px,3.4vw,34px);font-weight:600;line-height:1.05;text-shadow:0 2px 8px #000}
.hud .hb{font-size:13.5px;color:var(--muted);text-shadow:0 1px 3px #000}
.legend{position:absolute;left:14px;bottom:12px;display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted);pointer-events:none;max-width:calc(100% - 28px)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.legend .ramp{display:inline-block;width:90px;height:9px;border-radius:5px;vertical-align:0;margin:0 6px}
.tip{position:absolute;right:12px;bottom:12px;width:min(320px,calc(100% - 24px));background:rgba(12,22,40,.94);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:13.5px;display:flex;flex-direction:column;gap:5px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.tip b.t{font-family:var(--display);font-size:20px;font-weight:600}
.tip .row{display:flex;justify-content:space-between;gap:10px;font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.tip .row span:last-child{color:var(--ink)}
.tip p{margin:0;color:var(--ink)}
.tip .x{position:absolute;right:8px;top:6px;background:none;border:0;color:var(--muted);font-size:18px;cursor:pointer;pointer-events:auto}
.fs-close{position:absolute;right:12px;top:12px;display:none;font:inherit;font-size:13px;padding:7px 12px;border-radius:7px;border:1px solid var(--line);background:rgba(12,22,40,.9);color:var(--ink);cursor:pointer}
.stage.fs .fs-close{display:block}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 0 4px}
.bar button,.bar select{font:inherit;font-size:14px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;min-height:38px}
.bar select{max-width:100%}
.scrub{flex:1 1 200px;min-width:140px;display:flex;align-items:center}
.scrub input{width:100%;accent-color:var(--amber)}
.hint{font-size:12.5px;color:var(--dim);margin:2px 0 0}
.story{padding-block:26px 40px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px;max-width:780px}
.story p{margin:0;font-size:16px}
.story .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.story .stats div{background:var(--panel);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.story .stats b{font-family:var(--display);font-size:26px;font-weight:600;line-height:1}
.story .stats span{font-size:12px;color:var(--muted)}
.story ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.story li{border-left:3px solid var(--amber);padding:2px 0 2px 12px;font-size:15px}
.story .note{font-size:13px;color:var(--dim)}
.nogl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px}
footer{border-top:1px solid var(--line);padding-block:18px 40px;color:var(--dim);font-size:13px}
@media (max-width:640px){
  .stage{height:68vh;min-height:380px}
  .hud .hb{display:none}
  .lb{font-size:10px} .lb.seat{font-size:13px} .lb.seat small{font-size:11px} .lb.zone{font-size:13px}
}
</style>
</head>

    legend: () => `<span>Lower<span class="ramp" style="background:linear-gradient(90deg,#2a63b4,#f2b84b,#ff8f6b)"></span>higher</span><span><i style="background:#7d8aa0"></i>paler: few hands</span>`},
  ranges: {group: G.group, mesh: G.cells, cam: {az: .38, el: .92, dist: 33, tx: 0, ty: 0, tz: .6}, still: true, frames: () => rangeFrames().length, draw: drawRanges, tip: rangeTip, hold: 2.8,
    fields: [['replay', 'Every field'], ...KSEL.filter(k => k !== 'all').map(k => [k, KN[k]])], metrics: [['replay', 'Replay: early seats → small blind'], ['early', GN.early], ['middle', GN.middle], ['late', GN.late], ['blinds', GN.blinds], ['all', GN.all]],
    legend: () => `<span><i style="background:#f2b84b"></i>raised</span><span><i style="background:#5fc4cc"></i>called</span><span><i style="background:#b9c25a"></i>limped</span><span><i style="background:#33445f"></i>mostly folded</span>`},
  room: {group: M.group, mesh: M.hex, cam: {az: -.3, el: .82, dist: 25, tx: .5, ty: 0, tz: -1.4}, frames: () => 1, draw: drawRoom, tip: roomTip, dur: 12, continuous: true,
    fields: [['replay', 'Every stream, oldest first']], metrics: [],
    legend: () => Object.entries(SN).filter(([k]) => k !== 'unknown').map(([k, n]) => `<span><i style="background:#${SC[k].getHexString()}"></i>${n} ${D.room.filter(r => r[6] === k).length}</span>`).join('')},
};
let cur = 'table';
const timeline = {f: 0, playing: true, last: 0};
function totalLen(){ const m = MAPS[cur]; return m.continuous ? m.dur : Math.max(1, m.frames()) * m.hold; }
function seekP(p){ const m = MAPS[cur]; timeline.f = m.continuous ? clamp(p, 0, 1) : clamp(p, 0, 1) * (m.frames() - 1); render(true); }
function progress(){ const m = MAPS[cur]; return m.continuous ? timeline.f : (m.frames() > 1 ? timeline.f / (m.frames() - 1) : 1); }
function setMap(k){
  cur = k; const m = MAPS[k];
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.map === k));
  for (const [n, mm] of Object.entries(MAPS)) mm.group.visible = n === k;
  LB.forEach(l => { l.el.style.visibility = l.map === k ? 'visible' : 'hidden'; });
  $('#field').innerHTML = m.fields.map(([v, l]) => `<option value="${v}">${esc(l)}</option>`).join(''); $('#field').hidden = m.fields.length < 2;
  $('#metric').innerHTML = m.metrics.map(([v, l]) => `<option value="${v}">${esc(l)}</option>`).join(''); $('#metric').hidden = !m.metrics.length;
  if (k === 'table') $('#metric').value = T.metric; if (k === 'ranges') $('#metric').value = G.pos;
  Object.assign(cam, m.cam); tip.hidden = true;
  $('#legend').innerHTML = m.legend();
  story(k); timeline.f = 0; timeline.playing = true; setPlay(); render(true);
  try { localStorage.setItem('rmap.v', k); } catch (e) {}
}
function setPlay(){ $('#play').textContent = timeline.playing ? 'Pause' : 'Play'; }
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => setMap(b.dataset.map));
$('#play').onclick = () => { if (!timeline.playing && progress() >= .999) timeline.f = 0; timeline.playing = !timeline.playing; setPlay(); };
$('#replay').onclick = () => { timeline.f = 0; timeline.playing = true; setPlay(); };
$('#scrub').oninput = e => { timeline.playing = false; setPlay(); seekP(+e.target.value / 1000); };
$('#field').onchange = () => { timeline.f = 0; timeline.playing = $('#field').value === 'replay' || cur === 'ranges'; setPlay(); render(true); story(cur); };
$('#metric').onchange = e => { if (cur === 'table') T.metric = e.target.value; if (cur === 'ranges') G.pos = e.target.value; timeline.f = 0; timeline.playing = true; setPlay(); render(true); story(cur); };
const goFs = on => { stage.classList.toggle('fs', on); if (on && stage.requestFullscreen) stage.requestFullscreen().catch(() => {}); if (!on && document.fullscreenElement) document.exitFullscreen().catch(() => {}); setTimeout(resize, 60); };
$('#fs').onclick = () => goFs(true); $('#fsClose').onclick = () => goFs(false);
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement) { stage.classList.remove('fs'); setTimeout(resize, 60); } });

/* drag to turn, wheel and pinch to zoom, tap to pick */
const ptrs = new Map(); let drag = null, pinch = null, idle = 0;
stage.addEventListener('pointerdown', e => { ptrs.set(e.pointerId, {x: e.clientX, y: e.clientY}); stage.setPointerCapture(e.pointerId);
  if (ptrs.size === 1) drag = {x: e.clientX, y: e.clientY, az: cam.az, el: cam.el, moved: false};
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch = {d: Math.hypot(a.x - b.x, a.y - b.y), dist: cam.dist}; drag = null; } });
stage.addEventListener('pointermove', e => {
  if (ptrs.has(e.pointerId)) ptrs.set(e.pointerId, {x: e.clientX, y: e.clientY});
  if (pinch && ptrs.size === 2) { const [a, b] = [...ptrs.values()]; cam.dist = clamp(pinch.dist * pinch.d / Math.max(20, Math.hypot(a.x - b.x, a.y - b.y)), 10, 60); idle = 0; return; }
  if (drag) { const dx = e.clientX - drag.x, dy = e.clientY - drag.y; if (Math.abs(dx) + Math.abs(dy) > 4) drag.moved = true;
    cam.az = drag.az - dx * .008; cam.el = clamp(drag.el + dy * .006, .22, 1.45); idle = 0; return; }
  if (e.pointerType === 'mouse') pick(e, true);
});
stage.addEventListener('pointerup', e => { ptrs.delete(e.pointerId); if (drag && !drag.moved) pick(e, false); drag = null; if (ptrs.size < 2) pinch = null; });
stage.addEventListener('pointercancel', e => { ptrs.delete(e.pointerId); drag = null; pinch = null; });
stage.addEventListener('wheel', e => { e.preventDefault(); cam.dist = clamp(cam.dist * (1 + e.deltaY * .001), 10, 60); idle = 0; }, {passive: false});
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let hoverId = -1, pinned = false;
function pick(e, hover){
  if (hover && pinned) return;
  const r = stage.getBoundingClientRect(); ndc.set((e.clientX - r.left) / r.width * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObject(MAPS[cur].mesh)[0];
  if (!hit) { if (!hover) { pinned = false; tip.hidden = true; } else if (!pinned) tip.hidden = true; hoverId = -1; return; }
  hoverId = hit.instanceId; pinned = !hover;
  tip.innerHTML = `<button type="button" class="x" aria-label="Close">×</button>` + MAPS[cur].tip(hit.instanceId); tip.hidden = false;
  tip.querySelector('.x').onclick = () => { pinned = false; tip.hidden = true; };
}

function render(){
  MAPS[cur].draw(timeline.f);
  $('#scrub').value = Math.round(progress() * 1000);
}
let lastT = performance.now();
function loop(now){
  const dt = Math.min(.1, (now - lastT) / 1000); lastT = now;
  const m = MAPS[cur];
  if (timeline.playing){
    if (m.continuous) timeline.f = Math.min(1, timeline.f + dt / m.dur);
    else { const n = m.frames(); timeline.f = n > 1 ? Math.min(n - 1, timeline.f + dt / m.hold) : 0; }
    if (progress() >= .999 && !(m.continuous ? false : m.frames() <= 1)) { timeline.playing = false; setPlay(); }
    if (!m.continuous && m.frames() <= 1) { timeline.playing = false; setPlay(); }
    render();
  }
  idle += dt; if (idle > 4 && !drag && !m.still) cam.az += dt * .04;
  placeCamera(); drawLabels();
  if (renderer) renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

/* ---------- the write-ups ---------- */
function story(k){
  const el = $('#story');
  if (k === 'table'){
    const t = D.table.all, f = D.table.day2 || t, rv = (s, p) => { const v = TMET.rfi.get(s, p); return v && v[1] ? Math.round(v[0] / v[1] * 100) : null; };
    const early = ['UTG', 'UTG+1', 'MP'].reduce((a, p) => [a[0] + t[p].rfi[0], a[1] + t[p].rfi[1]], [0, 0]);
    el.innerHTML = `<h2>Who opens from where</h2>
      <p>The table is drawn the way you sit at it: the dealer at the top, the small blind on the dealer’s left and the action running clockwise to the button. Each column is a seat, and its height is how often the player in that seat raises when everyone before has folded. The big blind’s column is different: how often it fights back against an open. Press play to watch the room change from day-one fields to Day 2 tables to final tables, or switch what the columns show.</p>
      <div class="stats"><div><b>${pc(early[0], early[1]) ?? '–'}%</b><span>opens from the first three seats</span></div><div><b>${rv(t.CO, 'CO') ?? '–'}%</b><span>cutoff opens</span></div><div><b>${rv(t.BTN, 'BTN') ?? '–'}%</b><span>button opens</span></div><div><b>${rv(t.BB, 'BB') ?? '–'}%</b><span>big blind defends</span></div></div>
      <ul><li>Early opens are tight: give a raise from the first three seats real credit at 20 to 25bb, and fold your weak aces and kings to it.</li>
      <li>The cutoff and button open far wider than early seats but still well under what a solver would. Their opens are where your re-steal jams make money.</li>
      <li>The big blind gives up a lot. When you’re on the button or cutoff, the blinds are worth attacking.</li></ul>
      <p class="note">Positions are named by seats from the button, so an eight-handed table has no middle seat. The paler columns have fewer than 25 hands behind them.</p>`;
  } else if (k === 'ranges'){
    const A = D.ranges.all, tot = g => A[g].reduce((a, c) => [a[0] + c[0] + c[1] + c[2], a[1] + c[0] + c[1] + c[2] + c[3]], [0, 0]);
    const e = tot('early'), l = tot('late'), al = A.all;
    const cls = D.classes.map((c, i) => ({c, r: al[i], s: al[i][0] + al[i][1] + al[i][2] + al[i][3]})).filter(x => x.s >= 12);
    const calls = cls.filter(x => x.r[1] > x.r[0] && x.r[1] + x.r[2] > x.s * .3).sort((a, b) => b.r[1] / b.s - a.r[1] / a.s).slice(0, 6).map(x => x.c);
    const limps = cls.filter(x => x.r[2] >= 2).sort((a, b) => b.r[2] / b.s - a.r[2] / a.s).slice(0, 6).map(x => x.c);
    const seen = al.reduce((a, c) => a + c[0] + c[1] + c[2] + c[3], 0);
    el.innerHTML = `<h2>What the room actually plays</h2>
      <p>This is the usual 13-by-13 hand chart turned into a landscape: pairs on the diagonal, suited hands above it, offsuit below. Every time the stream showed a player’s hole cards, the reader noted what they did with them. A block’s height is how often the room put chips in with that hand; its color is how: gold for a raise, teal for a call, olive for a limp. Press play to sweep from the early seats to the small blind and watch the range spread.</p>
      <div class="stats"><div><b>${seen.toLocaleString()}</b><span>hands with hole cards shown</span></div><div><b>${pc(e[0], e[1]) ?? '–'}%</b><span>played from early seats</span></div><div><b>${pc(l[0], l[1]) ?? '–'}%</b><span>played from the cutoff and button</span></div></div>
      <ul>${calls.length ? `<li>Hands this room calls with more than it raises: <b>${calls.join(', ')}</b>. When these players flat, those hands are in their range.</li>` : ''}
      ${limps.length ? `<li>Hands it limps most: <b>${limps.join(', ')}</b>. Raise limpers from late position; these are the hands you’re isolating.</li>` : ''}
      <li>The tall gold ridge along the top and left is the big cards. Everywhere else the landscape drops off quickly, which is what a tight-early, wider-late field looks like.</li></ul>
      <p class="note">Hands seen only a few times from a given seat borrow their height from how the same hand is played from every seat, so a single odd hand doesn’t make a spike.</p>`;
  } else {
    const n = D.room.length, by = s => D.room.filter(r => r[6] === s).length;
    const top = Object.keys(SN).filter(s => s !== 'unknown').sort((a, b) => by(b) - by(a));
    el.innerHTML = `<h2>Every player on video, by style</h2>
      <p>Each block is one player the camera caught for at least 30 hands. Left to right is how many hands they play (VPIP); front to back is how many they raise (PFR); nobody can raise more hands than they play, so everyone sits below the dashed line. Taller blocks are players with more hands on video, so their numbers are firmer. Press play to watch the room fill in, stream by stream, from the oldest broadcast to the newest. Nobody is named.</p>
      <div class="stats"><div><b>${n}</b><span>players with 30+ hands</span></div><div><b>${Math.round(M.avg.vpip)}% · ${Math.round(M.avg.pfr)}%</b><span>room average VPIP · PFR</span></div><div><b>${by(top[0])}</b><span>${SN[top[0]].toLowerCase()}, the biggest group</span></div></div>
      <ul>${top.filter(s => by(s)).map(s => `<li><b>${SN[s]} (${by(s)})</b>: ${SPLAY[s]}</li>`).join('')}</ul>
      <p class="note">Styles: tight plays 18% of hands or fewer; loose-passive plays 32% or more but raises little; loose-aggressive plays 30% or more and raises 20% or more; solid aggressive raises most of what it plays.</p>`;
  }
}

let start = 'table'; try { const v = localStorage.getItem('rmap.v'); if (v && MAPS[v]) start = v; } catch (e) {}
if (location.hash && MAPS[location.hash.slice(1)]) start = location.hash.slice(1);
resize(); setMap(start); requestAnimationFrame(loop);
window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (MAPS[v]) setMap(v); });
</script>
</body>
</html>
