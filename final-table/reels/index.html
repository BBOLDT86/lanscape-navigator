<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07090c">
<title>Poker Reels</title>
<style>
:root{--bg:#07090c;--ink:#f6f4ee;--muted:#a9aeb7;--line:rgba(255,255,255,.14);--hi:#ffe14d;--good:#3ddc84;--bad:#ff5a5f;--gold:#e8b44c;
  --cap:clamp(25px,7.2vw,36px);--safeT:env(safe-area-inset-top,0px);--safeB:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
#feed{position:fixed;inset:0;overflow-y:scroll;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none}
#feed::-webkit-scrollbar{display:none}
.reel{position:relative;height:100dvh;height:100svh;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;display:flex;flex-direction:column;
  padding:calc(var(--safeT) + 62px) max(16px,env(safe-area-inset-right,0px)) calc(var(--safeB) + 22px) max(16px,env(safe-area-inset-left,0px))}
.reel::before{content:"";position:absolute;inset:0;z-index:0;background:var(--g);opacity:1}
.reel>*{position:relative;z-index:1}
.reel[data-cat=spot]{--g:radial-gradient(120% 80% at 50% 0%,#0f3d2b 0%,#07130e 55%,#050806 100%);--acc:#3ddc84}
.reel[data-cat=math]{--g:radial-gradient(120% 80% at 50% 0%,#3a2a08 0%,#140e04 55%,#070503 100%);--acc:#e8b44c}
.reel[data-cat=odds]{--g:radial-gradient(120% 80% at 50% 0%,#14304d 0%,#08111c 55%,#04070b 100%);--acc:#5ab0ff}
.reel[data-cat=equity]{--g:radial-gradient(120% 80% at 50% 0%,#3d1230 0%,#150712 55%,#070306 100%);--acc:#ff6fb5}
.reel[data-cat=rule]{--g:radial-gradient(120% 80% at 50% 0%,#2b2550 0%,#0e0c1c 55%,#05040a 100%);--acc:#a99bff}
.reel[data-cat=replay]{--g:radial-gradient(120% 80% at 50% 0%,#4a1414 0%,#170707 55%,#070303 100%);--acc:#ff7a59}
.reel[data-cat=range]{--g:radial-gradient(120% 80% at 50% 0%,#06343a 0%,#051416 55%,#030709 100%);--acc:#3fd6d0}
.reel[data-cat=room]{--g:radial-gradient(120% 80% at 50% 0%,#33300c 0%,#121104 55%,#060603 100%);--acc:#d9d24a}
.reel[data-cat=recap]{--g:radial-gradient(120% 80% at 50% 0%,#20313f 0%,#0b1117 55%,#040608 100%);--acc:#ffe14d}
.meta{display:flex;align-items:center;gap:8px;min-height:26px}
.chip{font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.08);color:var(--acc);border:1px solid rgba(255,255,255,.12)}
.ttl{font-size:15px;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.bars{display:flex;gap:3px;margin-top:8px}
.bars i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.18);overflow:hidden;position:relative}
.bars i b{position:absolute;inset:0;width:0;background:var(--acc)}
.bars i.done b{width:100%}
.vis{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;margin:10px 52px 8px 0}
.vis3d{position:absolute;inset:0;border-radius:18px;overflow:hidden}
.vis3d canvas{display:block;width:100%!important;height:100%!important}
.lbl{position:absolute;transform:translate(-50%,-50%);font-size:12px;font-weight:800;color:#fff;text-shadow:0 1px 3px #000,0 0 8px #000;white-space:nowrap;pointer-events:none}
.lbl.me{color:var(--hi)}
.cap{min-height:calc(var(--cap) * 3.6);display:flex;flex-direction:column;justify-content:flex-end;gap:12px;margin-right:52px}
.line{font-size:var(--cap);font-weight:850;line-height:1.14;letter-spacing:-.01em;text-wrap:balance;paint-order:stroke fill;-webkit-text-stroke:5px rgba(0,0,0,.55);text-shadow:0 2px 14px rgba(0,0,0,.6)}
.w{opacity:0;transition:opacity .12s}
.w.v{opacity:1}
.w.on{color:var(--hi)}
.tap{font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.04em;opacity:0;transition:opacity .4s;text-align:center}
.tap.v{opacity:.9;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.q{font-size:17px;font-weight:800;color:var(--acc)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{flex:1 1 calc(50% - 8px);min-width:120px;padding:15px 12px;border-radius:14px;border:1.5px solid rgba(255,255,255,.22);background:rgba(0,0,0,.35);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);font-size:17px;font-weight:800;cursor:pointer;transform:translateY(12px);opacity:0;transition:transform .25s,opacity .25s,background .2s,border-color .2s}
.opts.v .opt{transform:none;opacity:1}
.opts:not(.v) .opt{pointer-events:none}
.opt.good{background:rgba(61,220,132,.22);border-color:var(--good)}
.opt.bad{background:rgba(255,90,95,.2);border-color:var(--bad)}
.opt[disabled]{cursor:default}
.rail{position:absolute;right:max(8px,env(safe-area-inset-right,0px));bottom:calc(var(--safeB) + 120px);z-index:3;display:flex;flex-direction:column;gap:16px;align-items:center}
.rb{width:44px;height:44px;border-radius:50%;border:0;background:rgba(0,0,0,.35);display:grid;place-items:center;font-size:21px;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.rb small{display:block;font-size:10.5px;font-weight:800;color:var(--muted);margin-top:2px}
.rbw{display:flex;flex-direction:column;align-items:center}
.rb.on{color:var(--bad)}
.rb.sv.on{color:var(--hi)}
#hud{position:fixed;left:0;right:0;top:0;z-index:10;display:flex;align-items:center;gap:8px;padding:calc(var(--safeT) + 10px) max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px));
  background:linear-gradient(#07090ccc,#07090c00);pointer-events:none}
#hud>*{pointer-events:auto}
#hud a,#hud button{border:0;background:rgba(255,255,255,.1);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:800;text-decoration:none;color:var(--ink);cursor:pointer}
#hud .sp{flex:1}
#streak{font-weight:900;font-size:15px}
#xp{font-size:13px;color:var(--muted);font-weight:800}
.pop{position:fixed;left:50%;top:42%;z-index:20;transform:translate(-50%,-50%) scale(.6);font-size:46px;font-weight:900;opacity:0;pointer-events:none;text-shadow:0 4px 24px rgba(0,0,0,.5)}
.pop.go{animation:pop .9s ease-out forwards}
@keyframes pop{15%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}70%{opacity:1;transform:translate(-50%,-60%) scale(1)}100%{opacity:0;transform:translate(-50%,-80%) scale(.95)}}
/* visuals */
.cards{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap}
.pc{width:clamp(64px,19vw,96px);aspect-ratio:5/7;border-radius:11px;background:#fbfaf6;color:#15171a;display:flex;flex-direction:column;justify-content:space-between;padding:7px 8px;
  box-shadow:0 10px 30px rgba(0,0,0,.45);font-weight:900;transform:rotateY(90deg);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.pc.v{transform:none}
.pc .r{font-size:clamp(22px,6.4vw,34px);line-height:1}
.pc .s{font-size:clamp(26px,8vw,42px);align-self:flex-end;line-height:1}
.pc.red{color:#d42a32}
.pc.sm{width:clamp(44px,12.6vw,62px);border-radius:8px;padding:4px 5px}
.pc.sm .r{font-size:clamp(16px,4.6vw,22px)}.pc.sm .s{font-size:clamp(18px,5.4vw,26px)}
.pc.back{background:repeating-linear-gradient(45deg,#7a1b22 0 6px,#5c1218 6px 12px);border:3px solid #f2efe8;transform:none}
.stage{display:flex;flex-direction:column;align-items:center;gap:16px;width:100%}
.badge{font-size:13px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--acc)}
.big{font-size:clamp(64px,22vw,128px);font-weight:900;line-height:.95;text-align:center;white-space:pre-line;letter-spacing:-.03em;background:linear-gradient(180deg,#fff,var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent}
.bigsub{font-size:15px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;text-align:center}
.mini{width:min(78vw,320px);aspect-ratio:1.7}
.pie{width:min(52vw,220px);aspect-ratio:1;border-radius:50%;background:conic-gradient(var(--acc) calc(var(--p)*1%),rgba(255,255,255,.12) 0);display:grid;place-items:center;transition:--p 1s}
.pie b{width:62%;aspect-ratio:1;border-radius:50%;background:#0a0f16;display:grid;place-items:center;font-size:clamp(30px,10vw,48px);font-weight:900}
.eqrow{display:flex;flex-direction:column;gap:12px;width:min(86vw,380px)}
.eqh{display:flex;align-items:center;gap:10px}
.eqh .cards{gap:6px;flex:none}
.eqbar{flex:1;height:22px;border-radius:11px;background:rgba(255,255,255,.1);overflow:hidden}
.eqbar b{display:block;height:100%;width:0;background:var(--acc);border-radius:11px;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.eqp{width:56px;text-align:right;font-weight:900;font-size:20px}
.rg{display:grid;grid-template-columns:repeat(13,1fr);gap:2px;width:min(88vw,380px);aspect-ratio:1}
.rg i{border-radius:2px;background:rgba(255,255,255,.06);font-size:clamp(6px,1.9vw,9px);font-style:normal;font-weight:800;display:grid;place-items:center;color:rgba(255,255,255,.35);transition:background .3s,color .3s}
.rg i.in{background:var(--acc);color:#04201c}
.bandsv{display:flex;flex-direction:column;gap:9px;width:min(86vw,360px)}
.bandsv div{padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.07);font-weight:800;display:flex;justify-content:space-between;opacity:.35;transition:opacity .3s,background .3s}
.bandsv div.v{opacity:1;background:rgba(232,180,76,.22)}
.stat{display:flex;flex-direction:column;align-items:center;gap:10px}
.meter{width:min(80vw,340px);height:16px;border-radius:8px;background:rgba(255,255,255,.1);overflow:hidden}
.meter b{display:block;height:100%;width:0;background:var(--acc);transition:width 1.2s}
.recap{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(88vw,380px)}
.recap div{background:rgba(255,255,255,.07);border-radius:14px;padding:14px}
.recap b{display:block;font-size:30px;font-weight:900}
.recap span{font-size:12px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.08em}
/* sheet */
#sheet,.dlg{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.55);display:flex;align-items:flex-end}
#sheet[hidden],.dlg[hidden]{display:none}
#sheet .in,.dlg .in{width:100%;background:#12161c;border-radius:20px 20px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(var(--safeB) + 18px) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;max-height:85dvh;overflow:auto}
#sheet h3,.dlg h3{margin:0;font-size:18px}
.tg{display:flex;flex-wrap:wrap;gap:8px}
.tg button{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:9px 13px;font-weight:800;font-size:14px;cursor:pointer}
.tg button[aria-pressed=true]{background:#f6f4ee;color:#0b0d10;border-color:#f6f4ee}
.small{font-size:13px;color:var(--muted)}
#heart{position:fixed;z-index:25;font-size:90px;pointer-events:none;opacity:0;transform:translate(-50%,-50%)}
#heart.go{animation:heart .8s ease-out forwards}
@keyframes heart{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-90%) scale(1)}}
.rb.fb.on{color:var(--hi)}
.fbtags{display:flex;flex-wrap:wrap;gap:8px}
.fbtags button{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:9px 12px;font-weight:800;font-size:14px;cursor:pointer}
.fbtags button[aria-pressed=true]{background:var(--hi);color:#111;border-color:var(--hi)}
textarea.fbn{width:100%;min-height:84px;border-radius:12px;border:1.5px solid var(--line);background:#0b0f14;color:var(--ink);font:15px/1.4 inherit;padding:10px;resize:vertical}
textarea.ex{width:100%;height:42dvh;border-radius:12px;border:1.5px solid var(--line);background:#0b0f14;color:var(--ink);font:11.5px/1.4 ui-monospace,Menlo,Consolas,monospace;padding:10px;white-space:pre;overflow:auto}
.row2{display:flex;flex-wrap:wrap;gap:8px}
.row2 button{flex:1 1 30%;border:0;border-radius:12px;padding:13px 8px;font-weight:900;font-size:15px;background:rgba(255,255,255,.1);cursor:pointer}
.row2 button.pri{background:var(--hi);color:#111}
.fbref{font-size:13px;color:var(--muted);font-weight:700}
@media (prefers-reduced-motion:reduce){.w,.opt,.pc,.eqbar b,.meter b{transition:none}.tap.v{animation:none}}
</style>
</head>

</div>

</div>

    for (let t = 0; t < towers; t++){ const c = Math.min(10, n - t * 10); label(`${c}`, new THREE.Vector3(X(t), c * TH + .45, 0), false, hide); }
    const one = new THREE.Mesh(g, new THREE.MeshStandardMaterial({color: 0xf4f1ea})); one.position.set(X(0) - 1.1, TH / 2, 1.3); scene.add(one);
    label('1 bb', new THREE.Vector3(one.position.x, .55, 1.3));
    label(hide ? '' : `${n} big blinds`, new THREE.Vector3(0, 10 * TH + 1.1, 0), true);
    if (hide){ const L = labels[labels.length - 1][0]; L.dataset.after = `${n} big blinds`; held.push(L); L.style.visibility = 'hidden'; }
    const floor = new THREE.Mesh(new THREE.CircleGeometry(Math.max(4.2, towers * .9 + 2), 48), new THREE.MeshStandardMaterial({color: 0x0f5a3c, roughness: .9})); floor.rotation.x = -Math.PI / 2; scene.add(floor);
    return t => { objs.forEach(o => { const k = Math.min(1, Math.max(0, (t - o.userData.d) / 0.5)); o.position.y = o.userData.y + (1 - k * k) * 8; });
      const a = Math.sin(t * .35) * .35, R = fit(towers * 1.35 + 2.6, 4.5); cam.position.set(Math.sin(a) * R, R * .42, Math.cos(a) * R); cam.lookAt(0, 1, 0); };

  function sky(ev){
    cam.position.set(0, 9, 10); cam.lookAt(0, 0, 0);
    const box = new THREE.BoxGeometry(.62, 1, .62), objs = [], vals = Object.values(ev), mx = Math.max(1, ...vals.map(Math.abs));
    for (let i = 0; i < 13; i++) for (let j = 0; j < 13; j++){
      const name = i === j ? RK[i] + RK[j] : i < j ? RK[i] + RK[j] + 's' : RK[j] + RK[i] + 'o', v = ev[name];
      const h = v == null ? .05 : v > 0 ? .25 + 3.4 * v / mx : .12, col = v == null ? 0x1b2a2c : v > 0 ? 0x3fd6d0 : 0xff5a5f;

      m.position.set((j - 6) * .72, 0, (i - 6) * .72); m.scale.y = .001; m.userData = {h, d: (i + j) * .03}; scene.add(m); objs.push(m);

    const rail = new THREE.Mesh(new THREE.TorusGeometry(4.05, .22, 16, 80), new THREE.MeshStandardMaterial({color: 0x3a2412, roughness: .6})); rail.rotation.x = Math.PI / 2; rail.scale.y = .58; rail.position.y = .15; scene.add(rail);
    const g = new THREE.CylinderGeometry(.32, .32, .08, 24), objs = [];
    v.stacks.forEach((bb, s) => {
      const a = Math.PI / 2 + (s - v.hero) * 2 * Math.PI / v.stacks.length, x = Math.cos(a) * 3.1, z = Math.sin(a) * 3.1 * .58;

      for (let i = 0; i < n; i++){ const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({color: i % 2 ? col : 0x222222, roughness: .5})); m.position.set(x, 9, z); m.userData = {y: .2 + i * .09, d: s * .08 + i * .02}; scene.add(m); objs.push(m); }
      label(`${s === v.hero ? 'You ' : ''}${bb}bb`, new THREE.Vector3(x, .3 + n * .09 + .35, z), s === v.hero);
    });
    return t => { objs.forEach(o => { const k = Math.min(1, Math.max(0, (t - o.userData.d) / .45)); o.position.y = o.userData.y + (1 - k * k) * 6; });
      const a = Math.sin(t * .3) * .45, R = fit(8.4, 4.6); cam.position.set(Math.sin(a) * R * .62, R * .72, Math.cos(a) * R * .62); cam.lookAt(0, 0, 0); };
  }
  return {
    show(h, v){
      host = h; kind = v; if (!h) return;
      load().then(T => { if (host !== h) return; THREE = T;
        if (!ren){ ren = new THREE.WebGLRenderer({antialias: true, alpha: true}); ren.setPixelRatio(Math.min(2, devicePixelRatio || 1)); cam = new THREE.PerspectiveCamera(45, 1, .1, 100); }
        scene = new THREE.Scene(); lights(); labels.forEach(l => l[0].remove()); labels = [];
        h.appendChild(ren.domElement); size();
        held = [];
        const anim = v.v === 'chips' ? chips(Math.max(1, Math.min(60, v.bb)), v.hide && !v.shown) : v.v === 'sky' ? sky(v.ev) : table(v);
        t0 = performance.now(); cancelAnimationFrame(raf);
        const loop = () => { const t = (performance.now() - t0) / 1000; anim(t); ren.render(scene, cam);
          const w = host.clientWidth, hh = host.clientHeight;
          labels.forEach(([d, p]) => { const q = p.clone().project(cam); d.style.left = ((q.x + 1) / 2 * w) + 'px'; d.style.top = ((1 - q.y) / 2 * hh) + 'px'; d.style.display = q.z < 1 ? '' : 'none'; });

    },
    hide(){ cancelAnimationFrame(raf); labels.forEach(l => l[0].remove()); labels = []; if (scene){ scene.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose(); }); scene = null; } if (ren && ren.domElement.parentNode) ren.domElement.remove(); host = null; },
    resize: size,

})();
addEventListener('resize', () => G3.resize());

/* ---------- feedback loop ---------- */
const BUILD = (D.build || '');
const FBTAGS = ['👍 Great', 'Wrong answer', 'Bug / broken', 'Confusing', 'Too easy', 'Too hard', 'Captions too fast', 'Captions too slow', 'More like this', 'Less like this', 'Visual is off'];
const capText = c => (c || []).map(x => typeof x === 'string' ? x : x.t).join(' ');
function describe(r){ return [r.title, capText(r.caps), r.q ? 'Q: ' + r.q : ''].filter(Boolean).join(' | ').slice(0, 400); }
let fbEl = null, fbTags = new Set();
function openFb(el){
  fbEl = el; const r = el._r, prev = S.fb.find(f => f.key === r.key && !f.sent);
  fbTags = new Set(prev ? prev.tags : []);
  $('#fbref').textContent = `${(CATS.find(c => c[0] === r.cat) || [0, 'Reel'])[1]} · ${r.title}`;
  $('#fbtags').innerHTML = FBTAGS.map(t => `<button type="button" aria-pressed="${fbTags.has(t)}">${esc(t)}</button>`).join('');
  $('#fbnote').value = prev ? prev.note : '';
  $('#fbsheet').hidden = false; clearTimeout(timer);
}
$('#fbtags').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; const t = b.textContent; if (fbTags.has(t)) fbTags.delete(t); else fbTags.add(t); b.setAttribute('aria-pressed', fbTags.has(t)); });
$('#fbcancel').onclick = () => { $('#fbsheet').hidden = true; if (fbEl === active) play(active); };
$('#fbsave').onclick = () => {
  const r = fbEl._r, note = $('#fbnote').value.trim();
  if (!fbTags.size && !note){ $('#fbsheet').hidden = true; return; }
  S.fb = S.fb.filter(f => !(f.key === r.key && !f.sent));
  S.fb.push({t: Date.now(), key: r.key, cat: r.cat, title: r.title, tags: [...fbTags], note,
    caps: capText(r.caps), q: r.q || null, opts: r.opts || null, correct: r.q ? r.opts[r.ans] : null, picked: r._picked != null ? r.opts[r._picked] : null,
    why: r.why ? capText(r.why) : null, vis: (r.vis || {}).v || null});
  save(); $('#fbsheet').hidden = true; const b = fbEl.querySelector('.fb'); b && b.classList.add('on'); pop('✓ noted', 'var(--hi)'); if (fbEl === active) play(active);
};
const dt = ms => { try { return new Date(ms).toLocaleString('en-US', {weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'}); } catch (e) { return new Date(ms).toISOString(); } };
const pct = (a, b) => b ? Math.round(100 * a / b) + '%' : '–';
function exportData(){
  const fb = S.fb.filter(f => !f.sent), mis = Object.entries(S.misses).filter(([k, m]) => !S.sent || m.last > S.sent).sort((a, b) => b[1].n - a[1].n);
  return {app: 'poker-reels', build: BUILD, exported: new Date().toISOString(), since: new Date(S.since).toISOString(),
    device: {w: innerWidth, h: innerHeight, ua: navigator.userAgent.slice(0, 120)}, speed: S.speed, topics: Object.keys(S.cats).filter(k => S.cats[k]),
    totals: {reels: S.n, answered: S.answered, correct: S.correct, best: S.best, xp: S.xp},
    byTopic: S.tstat, feedback: fb, misses: mis.slice(0, 40).map(([k, m]) => Object.assign({key: k}, m)),
    liked: Object.keys(S.liked), saved: Object.keys(S.saved), ideas: S.ideas};
}
function packet(){
  const x = exportData(), L = [];
  L.push('POKER REELS · feedback packet', `Build ${x.build || '?'} · exported ${dt(Date.now())} · covering activity since ${dt(S.since)}`,
    `Device ${x.device.w}×${x.device.h} · caption speed ${SPEED[S.speed] || S.speed} · topics: ${x.topics.length === CATS.length ? 'all' : x.topics.join(', ')}`,
    `Totals: ${x.totals.reels} reels finished · ${x.totals.answered} answered · ${pct(x.totals.correct, x.totals.answered)} right · best streak ${x.totals.best} · ${x.totals.xp} XP`, '');
  L.push('BY TOPIC (seen · answered · right · swiped away fast · avg seconds)');
  CATS.forEach(([c, n]) => { const t = S.tstat[c]; if (t && t.seen) L.push(`${n.padEnd(11)} ${t.seen} · ${t.answered} · ${pct(t.right, t.answered)} · ${t.fast} (${pct(t.fast, t.seen)}) · ${Math.round(t.secs / t.seen)}s`); });
  L.push('', `NOTES AND FLAGS (${x.feedback.length})`);
  if (!x.feedback.length) L.push('none');
  x.feedback.forEach((f, i) => { L.push(`${i + 1}. [${f.tags.join(', ') || 'note'}] ${(CATS.find(c => c[0] === f.cat) || [0, f.cat])[1]} · ${f.title}`);
    if (f.note) L.push(`   Note: ${f.note}`);
    L.push(`   Captions: ${f.caps}`);
    if (f.q) L.push(`   Q: ${f.q} | Options: ${f.opts.join(' / ')} | Marked correct: ${f.correct}${f.picked ? ' | I picked: ' + f.picked : ''}`);
    if (f.why) L.push(`   Explanation: ${f.why}`);
    L.push(`   Key: ${f.key}${f.vis ? ' · visual: ' + f.vis : ''}`); });
  L.push('', `MOST MISSED (${x.misses.length})`);
  x.misses.slice(0, 20).forEach(m => L.push(`- ${m.n}× · ${m.desc} · I picked ${m.picked}, answer ${m.correct}`));
  if (!x.misses.length) L.push('none');
  L.push('', `LIKED (${x.liked.length}): ${x.liked.slice(0, 30).join(', ') || 'none'}`, `SAVED (${x.saved.length}): ${x.saved.slice(0, 30).join(', ') || 'none'}`);
  L.push('', 'IDEAS', x.ideas.trim() || 'none');
  L.push('', 'Ask: use this to improve Reels. Fix anything flagged wrong or broken, rebalance the feed toward what I miss and away from what I swipe past, adjust caption timing, and build what the ideas ask for.');
  L.push('', 'JSON', JSON.stringify(x));
  return L.join('\n');
}
let exFmt = 'packet';
function renderEx(){
  const t = exFmt === 'json' ? JSON.stringify(exportData(), null, 1) : packet();
  $('#extext').value = t; $('#extext').scrollTop = 0;
  const x = exportData(); $('#exstat').textContent = `${x.feedback.length} notes · ${x.misses.length} missed spots · ${Math.max(1, Math.round(t.length / 1024))} KB`;
  $('#exfmt').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.f === exFmt));
}
function openEx(){ $('#sheet').hidden = true; $('#exsheet').hidden = false; renderEx(); }
$('#openex').onclick = openEx;
$('#exfmt').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; exFmt = b.dataset.f; renderEx(); });
$('#excopy').onclick = async () => { const t = $('#extext').value; let ok = false;
  try { if (navigator.clipboard && navigator.clipboard.writeText){ await navigator.clipboard.writeText(t); ok = true; } } catch (e) {}
  if (!ok){ const ta = $('#extext'); ta.removeAttribute('readonly'); ta.focus(); ta.select(); try { ta.setSelectionRange(0, t.length); ok = document.execCommand('copy'); } catch (e) {} ta.setAttribute('readonly', ''); }
  $('#exstat').textContent = ok ? 'Copied. Paste it into your chat with Claude.' : 'The text is selected: use Copy from the menu.'; };
$('#exshare').onclick = async () => { const t = $('#extext').value;
  try { if (navigator.share){ await navigator.share({title: 'Poker Reels feedback', text: t}); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
  $('#exstat').textContent = 'Sharing isn’t available here. Use Copy or Save file.'; };
$('#exsave').onclick = () => { const t = $('#extext').value, json = exFmt === 'json', z = v => String(v).padStart(2, '0'), d = new Date();
  const name = `poker-reels-feedback-${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}-${z(d.getHours())}${z(d.getMinutes())}.${json ? 'json' : 'txt'}`;
  try { const u = URL.createObjectURL(new Blob([t], {type: json ? 'application/json' : 'text/plain'})); const a = document.createElement('a'); a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 5000);
    $('#exstat').textContent = 'Saved ' + name + ' (Files › Downloads on iPhone).'; } catch (e) { $('#exstat').textContent = 'Saving is blocked here. Use Copy or Share.'; } };
$('#exmark').onclick = () => { const now = Date.now(); S.fb.forEach(f => f.sent = f.sent || now); S.sent = now; S.since = now; S.tstat = {}; save(); document.querySelectorAll('.rb.fb.on').forEach(b => b.classList.remove('on')); renderEx(); $('#exstat').textContent = 'Marked as sent. The next export starts fresh from now.'; };
$('#exclose').onclick = () => { $('#exsheet').hidden = true; if (active) play(active); };

/* ---------- HUD, topics, keys ---------- */
function hud(){ $('#streak').textContent = `🔥 ${S.streak}`; $('#xp').textContent = `${S.xp} XP`; }
function topicsLabel(){ const on = CATS.filter(c => S.cats[c[0]]); $('#topics').textContent = (S.savedOnly ? 'Saved' : on.length === CATS.length ? 'All topics' : on.length === 1 ? on[0][1] : `${on.length} topics`) + ' ▾'; }
function sheet(open){
  $('#sheet').hidden = !open; if (!open) return;
  $('#tg').innerHTML = CATS.map(c => `<button type="button" data-c="${c[0]}" aria-pressed="${!!S.cats[c[0]]}">${c[1]}</button>`).join('') + `<button type="button" data-saved aria-pressed="${!!S.savedOnly}">★ Saved (${Object.keys(S.saved).length})</button>`;
  $('#spd').innerHTML = Object.entries(SPEED).map(([v, n]) => `<button type="button" data-s="${v}" aria-pressed="${S.speed == v}">${n}</button>`).join('');
  const acc = S.answered ? Math.round(100 * S.correct / S.answered) : 0;
  $('#stats').textContent = `${S.n} reels · ${S.answered} answered · ${acc}% right · best streak ${S.best} · ${S.xp} XP. Progress stays in this browser. Build ${BUILD}.`;
  const nf = S.fb.filter(f => !f.sent).length, nm = Object.values(S.misses).filter(m => !S.sent || m.last > S.sent).length;
  $('#fbcount').textContent = `${nf} note${nf === 1 ? '' : 's'} and ${nm} missed spot${nm === 1 ? '' : 's'} waiting to export. Tap ✎ on any reel to leave a note.`;
  $('#ideas').value = S.ideas || '';
}
$('#topics').onclick = () => sheet(true);
$('#ideas').addEventListener('input', e => { S.ideas = e.target.value; save(); });
$('#close').onclick = () => { sheet(false); refill(); };
$('#sheet').addEventListener('click', e => {
  if (e.target.id === 'sheet'){ sheet(false); refill(); return; }
  const b = e.target.closest('button'); if (!b || !(b.dataset.c || 'saved' in b.dataset || b.dataset.s || b.id === 'reset')) return;
  if (b.dataset.c){ S.cats[b.dataset.c] = !S.cats[b.dataset.c]; if (!CATS.some(c => S.cats[c[0]])) S.cats[b.dataset.c] = true; S.savedOnly = false; }
  else if ('saved' in b.dataset){ S.savedOnly = !S.savedOnly && Object.keys(S.saved).length > 0; }
  else if (b.dataset.s){ S.speed = +b.dataset.s; }
  else if (b.id === 'reset'){ Object.assign(S, {xp: 0, streak: 0, best: 0, answered: 0, correct: 0, n: 0, box: {}}); hud(); }
  save(); topicsLabel(); sheet(true);
});
function refill(){
  // replace everything after the current reel with reels from the new topic mix
  const i = [...feed.children].indexOf(active);
  [...feed.children].slice(i + 1).forEach(n => { io.unobserve(n); n.remove(); });
  for (let k = 0; k < 6; k++) mount(nextReel());
}
addEventListener('keydown', e => {
  if (!$('#fbsheet').hidden || !$('#exsheet').hidden){ if (e.key === 'Escape'){ $('#fbsheet').hidden = true; $('#exsheet').hidden = true; } return; }
  if (!$('#sheet').hidden) { if (e.key === 'Escape') { sheet(false); refill(); } return; }
  const go = d => { const i = [...feed.children].indexOf(active); const n = feed.children[i + d]; n && n.scrollIntoView({behavior: 'smooth'}); };
  if (e.key === 'ArrowDown' || e.key === 'j' || e.key === 'PageDown'){ e.preventDefault(); go(1); }
  else if (e.key === 'ArrowUp' || e.key === 'k' || e.key === 'PageUp'){ e.preventDefault(); go(-1); }
  else if (e.key === ' ' && active){ e.preventDefault(); skip(active); }
  else if (/^[1-4]$/.test(e.key) && active){ const b = active.querySelectorAll('.opt')[+e.key - 1]; b && b.click(); }
});
hud(); topicsLabel();
// first reel: a welcome, then the feed
mount({key: 'welcome', cat: 'rule', title: 'Poker Reels', vis: {v: 'big', text: '↑', sub: 'swipe to learn'},
  caps: ['Swipe up for the next one.', 'Tap to skip ahead. Double-tap to like.', 'Miss a spot, and it comes back.', 'Build your streak.']});
for (let k = 0; k < 6; k++) mount(nextReel());
