<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Finds</title>
<meta name="description" content="Real things from the stores that make them, picked with reasons and priced live: fashion, coffee, kitchen, home, remodel, gifts, tech, garage and what's trending on TikTok and Instagram.">
<meta property="og:title" content="Finds">
<meta property="og:description" content="Real things from the stores that make them, picked with reasons and priced live.">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%231d1d1f'/%3E%3Cpath d='M23 46V18h20M23 32h15' stroke='%23fff' stroke-width='6' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f5f5f7; --card:#ffffff; --ink:#1d1d1f; --ink-2:#424245; --ink-3:#6e6e73; --hair:rgba(0,0,0,.09); --fill:#e8e8ed; --fill-2:#f0f0f3;
  --blue:#0071e3; --blue-h:#0077ed; --link:#0066cc; --sale:#bf4800; --green:#1a7f37; --nav:rgba(245,245,247,.78); --shadow:0 12px 34px rgba(0,0,0,.12);
  --sf:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter',system-ui,'Segoe UI',Roboto,sans-serif;
  --sfd:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter',system-ui,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000; --card:#1c1c1e; --ink:#f5f5f7; --ink-2:#d2d2d7; --ink-3:#a1a1a6; --hair:rgba(255,255,255,.12); --fill:#2c2c2e; --fill-2:#1c1c1e;
  --blue:#0a84ff; --blue-h:#409cff; --link:#2997ff; --sale:#ff9f0a; --green:#30d158; --nav:rgba(22,22,23,.78); --shadow:0 12px 34px rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000000; --card:#1c1c1e; --ink:#f5f5f7; --ink-2:#d2d2d7; --ink-3:#a1a1a6; --hair:rgba(255,255,255,.12); --fill:#2c2c2e; --fill-2:#1c1c1e;
  --blue:#0a84ff; --blue-h:#409cff; --link:#2997ff; --sale:#ff9f0a; --green:#30d158; --nav:rgba(22,22,23,.78); --shadow:0 12px 34px rgba(0,0,0,.55); color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.47 var(--sf);letter-spacing:-.022em;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;letter-spacing:inherit}
img{display:block;max-width:100%}
:focus-visible{outline:3px solid rgba(0,125,250,.6);outline-offset:2px;border-radius:8px}
.in{max-width:1440px;margin:0 auto;padding:0 max(22px,env(safe-area-inset-left))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- the bar: frosted, the way Apple does it */
.nav{position:sticky;top:0;z-index:40;background:var(--nav);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--hair)}
.top{display:flex;align-items:center;gap:18px;height:56px}
.logo{font:700 23px/1 var(--sfd);letter-spacing:-.03em;display:flex;align-items:center;gap:9px}
.logo i{width:26px;height:26px;border-radius:7px;background:var(--ink);display:grid;place-items:center}
.logo i svg{width:15px;height:15px}
.search{flex:1;min-width:0;max-width:520px;margin:0 auto;display:flex;align-items:center;gap:8px;background:var(--fill);border-radius:12px;padding:0 12px;height:38px}
.search svg{width:16px;height:16px;flex:none;color:var(--ink-3)}
.search input{all:unset;flex:1;font:400 16px var(--sf);letter-spacing:-.01em;color:var(--ink);min-width:0}
.search input::placeholder{color:var(--ink-3)}
.tb{flex:none;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:999px;border:0;background:none;font:500 15px var(--sf)}
.tb:hover{background:var(--fill)}
.tb svg{width:19px;height:19px}
.tb .n{font:600 12px/1 var(--sf);background:var(--ink);color:var(--bg);border-radius:999px;padding:3px 6px;min-width:18px;text-align:center}
.tb .n:empty{display:none}
.secs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0 10px;scroll-padding:0 22px}
.secs::-webkit-scrollbar{display:none}
.secs a{flex:none;font:500 14px/1 var(--sf);letter-spacing:-.01em;padding:9px 14px;border-radius:999px;color:var(--ink-2);white-space:nowrap}
.secs a:hover{background:var(--fill)}
.secs a[aria-current]{background:var(--ink);color:var(--bg)}

/* ---------- headlines */
.hero{padding:44px 0 18px}
.eyebrow{font:600 14px var(--sf);color:var(--sale);margin:0 0 6px;letter-spacing:-.01em}
.h1{font:700 clamp(38px,6vw,64px)/1.03 var(--sfd);letter-spacing:-.035em;margin:0}
.dek{font:400 clamp(19px,2vw,23px)/1.35 var(--sfd);color:var(--ink-3);margin:12px 0 0;max-width:46ch;letter-spacing:-.02em}
.dek b{color:var(--ink);font-weight:600}
.meta-line{font-size:14px;color:var(--ink-3);margin:12px 0 0;letter-spacing:-.01em}
.h2{font:700 28px/1.1 var(--sfd);letter-spacing:-.03em;margin:46px 0 16px;display:flex;align-items:baseline;gap:14px}
.h2 a{font:400 17px var(--sf);color:var(--link);letter-spacing:-.02em}
.h2 a:hover{text-decoration:underline}

/* ---------- section tiles */
.tiles{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(200px,1fr);gap:14px;overflow-x:auto;scrollbar-width:none;padding-bottom:6px;scroll-snap-type:x mandatory}
.tiles::-webkit-scrollbar{display:none}
.tile{scroll-snap-align:start;position:relative;border-radius:22px;overflow:hidden;background:var(--card);aspect-ratio:4/5;display:flex;flex-direction:column;justify-content:flex-end;padding:18px;isolation:isolate}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.tile::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(transparent 45%,rgba(0,0,0,.62))}
.tile:hover img{transform:scale(1.04)}
.tile b{font:700 24px/1.05 var(--sfd);letter-spacing:-.03em;color:#fff}
.tile span{font:500 14px var(--sf);color:rgba(255,255,255,.82);margin-top:4px}

/* ---------- trend stories */
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(260px,320px);gap:14px;overflow-x:auto;scrollbar-width:none;padding-bottom:6px}
.rail::-webkit-scrollbar{display:none}
.story{background:var(--card);border-radius:18px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:10px;min-height:150px}
.story:hover{box-shadow:var(--shadow)}
.story .o{font:600 12px var(--sf);letter-spacing:.02em;text-transform:uppercase;color:var(--ink-3)}
.story b{font:600 18px/1.25 var(--sfd);letter-spacing:-.02em}
.story time{margin-top:auto;font-size:13px;color:var(--ink-3)}

/* ---------- filters */
.bar2{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:22px 0 4px}
.chip{border:0;background:var(--card);border-radius:999px;padding:8px 14px;font:500 14px var(--sf);letter-spacing:-.01em;color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--hair)}
.chip:hover{color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);box-shadow:none}
.chip.b{font-weight:600}
.sep{width:1px;height:22px;background:var(--hair);margin:0 4px}
.sort{margin-left:auto;font:500 14px var(--sf);color:var(--ink-2);display:flex;align-items:center;gap:6px}
.sort select{font:500 14px var(--sf);color:var(--ink);background:var(--card);border:0;box-shadow:inset 0 0 0 1px var(--hair);border-radius:10px;padding:7px 10px}

/* ---------- the board: Pinterest's masonry, ranked left to right */
.grid{display:flex;gap:16px;align-items:flex-start;margin-top:16px}
.col{flex:1;min-width:0;display:flex;flex-direction:column;gap:22px}
.pin{position:relative}
.ph{display:block;position:relative;border-radius:18px;overflow:hidden;background:var(--fill-2)}
.ph img{width:100%;height:100%;object-fit:cover;transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .3s;opacity:0}
.ph img.ld{opacity:1}
.ph::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,0);transition:background .2s}
.pin:hover .ph img{transform:scale(1.03)}
.pin:hover .ph::after{background:rgba(0,0,0,.04)}
.ph .tx{position:absolute;inset:0;display:flex;align-items:flex-end;padding:18px;font:700 22px/1.1 var(--sfd);letter-spacing:-.03em;background:linear-gradient(135deg,var(--fill),var(--fill-2))}
.heart{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:50%;border:0;display:grid;place-items:center;background:rgba(255,255,255,.88);color:#1d1d1f;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);opacity:0;transform:scale(.9);transition:opacity .15s,transform .15s;z-index:2;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.heart svg{width:19px;height:19px}
.pin:hover .heart,.heart[aria-pressed="true"],.heart:focus-visible{opacity:1;transform:none}
.heart[aria-pressed="true"]{color:#ff375f}
@media (hover:none){.heart{opacity:1;transform:none;width:34px;height:34px}}
.badges{position:absolute;left:10px;top:10px;display:flex;gap:5px;flex-wrap:wrap;z-index:2;max-width:calc(100% - 60px)}
.bd{font:600 11.5px/1 var(--sf);letter-spacing:-.005em;padding:5px 8px;border-radius:999px;background:rgba(255,255,255,.9);color:#1d1d1f;backdrop-filter:blur(10px)}
.bd.sale{background:#bf4800;color:#fff}.bd.pick{background:#1d1d1f;color:#fff}.bd.used{background:#0071e3;color:#fff}.bd.trend{background:linear-gradient(90deg,#ff2d55,#af52de);color:#fff}.bd.out{background:rgba(0,0,0,.6);color:#fff}
.pm{padding:10px 4px 0}
.pm .nm{font:600 15px/1.3 var(--sf);letter-spacing:-.015em;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pm .sub{display:flex;gap:8px;align-items:baseline;margin:3px 0 0;font-size:14px;color:var(--ink-3);letter-spacing:-.01em}
.pm .br{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pm .pr{margin-left:auto;font-weight:600;color:var(--ink);white-space:nowrap}
.pm .pr.sale{color:var(--sale)}
.pm s{color:var(--ink-3);font-weight:400;margin-left:4px}
.pm .why{font-size:14px;line-height:1.4;color:var(--ink-2);margin:6px 0 0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;letter-spacing:-.01em}
.seg2{display:inline-flex;background:var(--fill);border-radius:999px;padding:3px;gap:2px}
.seg2 button{border:0;background:none;border-radius:999px;padding:6px 13px;font:500 14px var(--sf);letter-spacing:-.01em;color:var(--ink-2)}
.seg2 button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.szl{font:500 13px var(--sf);color:var(--ink-3)}
.pm .sz{font:600 11.5px/1 var(--sf);border:1px solid var(--hair);border-radius:6px;padding:3px 5px;color:var(--ink-2);flex:none}.pm .sz.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pm .pr small{font-weight:400;color:var(--ink-3);font-size:12px}
.info .pnote{font:400 15px var(--sf);color:var(--ink-3)}
.deal2{margin:6px 0 0;font-size:15px;color:var(--ink-2)}.deal2 b{color:var(--sale)}
.more{display:block;margin:30px auto 0;border:0;background:var(--card);box-shadow:inset 0 0 0 1px var(--hair);border-radius:999px;padding:12px 22px;font:500 15px var(--sf)}
.empty{padding:70px 0;text-align:center;color:var(--ink-3)}
.empty b{display:block;font:700 26px var(--sfd);color:var(--ink);letter-spacing:-.03em;margin-bottom:6px}

/* ---------- the sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.42);opacity:0;pointer-events:none;transition:opacity .25s;z-index:60}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:61;left:50%;top:50%;width:min(1040px,calc(100vw - 48px));max-height:calc(100vh - 64px);transform:translate(-50%,-46%) scale(.98);opacity:0;pointer-events:none;
  background:var(--card);border-radius:26px;overflow:auto;box-shadow:0 30px 90px rgba(0,0,0,.35);transition:transform .32s cubic-bezier(.2,.9,.25,1),opacity .2s;overscroll-behavior:contain}
.sheet.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
.sheet:focus{outline:none}
.sx{position:sticky;top:0;display:flex;justify-content:flex-end;gap:8px;padding:14px 14px 0;z-index:3;height:0}
.sx button{width:36px;height:36px;border-radius:50%;border:0;background:var(--fill);display:grid;place-items:center}
.sx svg{width:15px;height:15px}
.sg{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:34px;padding:28px}
.gal{position:relative}
.gal .main{border-radius:18px;overflow:hidden;background:var(--fill-2);aspect-ratio:1/1;display:flex;scroll-snap-type:x mandatory;overflow-x:auto;scrollbar-width:none}
.gal .main::-webkit-scrollbar{display:none}
.gal .main img{flex:0 0 100%;width:100%;height:100%;object-fit:contain;scroll-snap-align:start;background:#fff}
.gal .th{display:flex;gap:8px;margin-top:10px;overflow-x:auto}
.gal .th button{flex:none;width:58px;height:58px;border-radius:10px;overflow:hidden;border:0;padding:0;background:#fff;box-shadow:inset 0 0 0 1px var(--hair);opacity:.6}
.gal .th button[aria-current]{opacity:1;box-shadow:inset 0 0 0 2px var(--ink)}
.gal .th img{width:100%;height:100%;object-fit:contain}
.info .k{font:600 14px var(--sf);color:var(--ink-3);margin:6px 0 4px;letter-spacing:-.01em}
.info h2{font:700 32px/1.1 var(--sfd);letter-spacing:-.035em;margin:0}
.info .price{font:600 24px var(--sfd);letter-spacing:-.02em;margin:14px 0 2px;display:flex;gap:10px;align-items:baseline}
.info .price.sale span{color:var(--sale)}.info .price s{font-size:18px;color:var(--ink-3);font-weight:400}
.info .stock{font-size:14px;color:var(--ink-3)}.info .stock.ok{color:var(--green)}
.why2{background:var(--fill-2);border-radius:16px;padding:16px 18px;margin:20px 0 0}
.why2 h3{font:600 13px var(--sf);text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3);margin:0 0 6px}
.why2 p{margin:0;font-size:16px;line-height:1.5}
.why2 ul{margin:10px 0 0;padding:0;list-style:none;font-size:14px}
.why2 li a{color:var(--link)}.why2 li a:hover{text-decoration:underline}
.desc{font-size:15px;line-height:1.55;color:var(--ink-2);margin:18px 0 0}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:999px;padding:12px 22px;font:500 16px var(--sf);letter-spacing:-.01em;background:var(--fill);color:var(--ink);min-height:44px}
.btn:hover{background:var(--hair)}
.btn.p{background:var(--blue);color:#fff}.btn.p:hover{background:var(--blue-h)}
.btn svg{width:15px;height:15px}
.btn[aria-pressed="true"] svg{color:#ff375f}
.ebl{margin:22px 0 0}
.ebl h3{font:600 13px var(--sf);text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3);margin:0 0 8px}
.ebl a{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--hair)}
.ebl a img{width:52px;height:52px;border-radius:8px;object-fit:cover;background:#fff}
.ebl a span{font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ebl a small{display:block;color:var(--ink-3);font-size:12.5px}
.ebl a b{font-weight:600}
.boards{margin:16px 0 0;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px;color:var(--ink-3)}
.boards input{font:inherit;border:0;box-shadow:inset 0 0 0 1px var(--hair);border-radius:999px;padding:7px 12px;background:var(--card);color:var(--ink);width:150px}
.sml{padding:0 28px 30px}
.sml .h2{margin-top:6px;font-size:22px}
.fine{font-size:12.5px;color:var(--ink-3);margin:16px 0 0;line-height:1.45}
@media (max-width:820px){
  .top{gap:10px}.logo span{display:none}.tb .lb{display:none}
  .sheet{left:0;right:0;top:auto;bottom:0;width:100%;max-height:92vh;border-radius:22px 22px 0 0;transform:translateY(100%);opacity:1}
  .sheet.on{transform:none}
  .sg{grid-template-columns:minmax(0,1fr);gap:18px;padding:18px 18px 8px}.sml{padding:0 18px 30px}
  .info h2{font-size:26px}.hero{padding:30px 0 12px}
  .tiles{grid-auto-columns:46%}
  .grid{gap:10px}.col{gap:16px}.pm .why{display:none}.pm .nm{font-size:14px}
  .sort{margin-left:0}
}

/* ---------- toast, footer */
.toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:rgba(29,29,31,.92);color:#fff;border-radius:999px;padding:11px 18px;font:500 15px var(--sf);opacity:0;pointer-events:none;transition:.25s;z-index:80;display:flex;gap:12px;align-items:center;backdrop-filter:blur(12px)}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{border:0;background:none;color:#2997ff;font-weight:600;padding:0}
footer{margin-top:70px;border-top:1px solid var(--hair);padding:22px 0 50px;font-size:12.5px;color:var(--ink-3);line-height:1.6}
footer p{max-width:900px;margin:0 0 8px}
footer a{color:var(--link)}
</style>
</head>
<body>
<header class="nav">
  <div class="in top">
    <a class="logo" href="#/" aria-label="Finds, home"><i><svg viewBox="0 0 24 24" fill="none" stroke="var(--bg)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M8 20V4h10M8 12h8"/></svg></i><span>Finds</span></a>
    <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
      <span class="sr">Search Finds</span><input id="q" type="search" placeholder="Search Finds" autocomplete="off" enterkeyhint="search"></label>
    <a class="tb" href="#/saved" aria-label="Saved"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 20.5s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.7c0 5.6-7.5 10.2-7.5 10.2z"/></svg><span class="lb">Saved</span><span class="n" id="savedN"></span></a>
  </div>
  <nav class="in secs" id="secs" aria-label="Sections"></nav>
</header>
<main class="in" id="main"><div class="empty"><b>Opening Finds…</b></div></main>
<footer class="in" id="foot"></footer>
<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shT" tabindex="-1"></aside>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
/* Finds. Data: data/feed.json, built every six hours by shop/updater/shop.py from the stores' own catalogs, Claude's picks
   (shop/picks/) and, with keys, eBay's API. Everything you save or open is learned in this browser only (finds.v1). */
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const IC = {
  heart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 20.5s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.7c0 5.6-7.5 10.2-7.5 10.2z"/></svg>',

  const like = F.items.filter(x => x.i !== it.i && x.s === it.s && x.im && !P.hide[x.i]).map(x => ({ x, s: (x.br === it.br ? 2 : 0) + (x.b && x.b === it.b ? 2 : 0) + (x.tg || []).filter(t => (it.tg || []).includes(t)).length + score(x) * .3 })).sort((a, b) => b.s - a.s).slice(0, 12).map(x => x.x);
  const eb = it.eb || null;
  const ebRows = (l, h) => l && l.length ? `<div class="ebl"><h3>${h}</h3>${l.map(x => `<a href="${esc(x.u)}" target="_blank" rel="noopener" data-out="${it.i}"><img src="${esc(x.im)}" alt="" loading="lazy" referrerpolicy="no-referrer"><span>${esc(x.t)}<small>${esc(x.cond || '')}${x.auc ? ' · auction' : ''}${x.sel ? ` · seller ${esc(x.sel)}% positive` : ''}</small></span><b>${money(x.p, x.c)}</b></a>`).join('')}</div>` : '';
  const myBoards = Object.keys(P.boards).filter(b => P.boards[b].includes(id));
  $('#sheet').innerHTML = `<div class="sx"><button type="button" data-share aria-label="Share">${IC.share}</button><button type="button" data-close aria-label="Close">${IC.x}</button></div>
    <div class="sg"><div class="gal"><div class="main" id="gm">${ims.length ? ims.map(u => `<img src="${esc(u)}" alt="${esc(it.n)}" loading="lazy" referrerpolicy="no-referrer">`).join('') : `<span class="tx" style="position:relative;display:flex;align-items:flex-end;padding:22px;font:700 30px/1.1 var(--sfd);width:100%">${esc(it.n)}</span>`}</div>
      ${ims.length > 1 ? `<div class="th">${ims.map((u, i) => `<button type="button" data-gi="${i}"${i ? '' : ' aria-current="true"'}><img src="${esc(u)}" alt="" loading="lazy" referrerpolicy="no-referrer"></button>`).join('')}</div>` : ''}</div>
    <div class="info"><p class="k"><a href="#/s/${it.s}">${esc(s.title)}</a> · ${esc(it.br || it.st)}${it.st && it.st !== it.br ? (it.k === 'used' ? ` · listed on ${esc(it.st)}` : ` at ${esc(it.st)}`) : ''}</p><h2 id="shT">${esc(it.n)}</h2>
      ${it.k === 'used' ? `<p class="price"><span>${money(it.p, it.c)}</span><span class="pnote">all-in${it.sh ? `: ${money(it.pp)} + ${money(it.sh)} shipping` : ', free shipping'}</span></p><p class="deal2"><b>About ${offAny(it)}% below new.</b> ${money(it.nw)} new (${it.nwk === 'listed' ? 'retail in the listing' : 'typical retail, estimated'}).</p>`
        : it.p != null ? `<p class="price${it.was ? ' sale' : ''}"><span>${money(it.p, it.c)}</span>${it.was ? `<s>${money(it.was, it.c)}</s><span style="font-size:15px">Save ${off(it)}%</span>` : ''}</p>` : ''}
      <p class="stock${it.av !== false ? ' ok' : ''}">${it.k === 'used' ? esc(`${it.cond} on ${it.st}${it.z ? ' · size ' + it.z : ''}${it.bo ? ' · takes offers' : ''}`) : it.cond ? esc(`${it.cond}, from ${it.st}'s own resale · checked ${ago(F.at)}`) : it.k === 'ebay' ? esc(`${it.cond || 'Pre-owned'} on eBay${it.auc ? ', auction' : ''}${it.sel ? ` · seller ${it.sel}% positive` : ''}`) : it.av === false ? 'Sold out at the store right now' : it.live || it.k === 'store' ? `In stock at ${esc(it.st)} · checked ${ago(F.at)}` : it.seen ? `Price as seen ${esc(it.seen)}` : ''}</p>
      ${it.y ? `<div class="why2"><h3>Why it’s here</h3><p>${esc(it.y)}</p>${it.tr ? `<p style="margin-top:8px;font-size:15px"><b>${esc(it.tr.where)}:</b> ${esc(it.tr.note || '')}</p>` : ''}${(it.src || []).length || (it.tr && it.tr.src) ? `<ul>${[...(it.src || []), ...(it.tr && it.tr.src ? [it.tr.src] : [])].slice(0, 5).map(u => `<li><a href="${esc(u)}" target="_blank" rel="noopener">${esc(new URL(u).hostname.replace(/^www\./, ''))} ↗</a></li>`).join('')}</ul>` : ''}</div>` : ''}
      ${it.k === 'used' ? `<div class="why2"><h3>The listing</h3><p>${esc(it.lt || it.n)}</p>${it.m || it.note ? `<p style="margin-top:6px;font-size:15px">${esc([it.m, it.note].filter(Boolean).join('. '))}</p>` : ''}<ul><li>Found for <a href="../pinfall/">Pinfall</a>, ${esc(it.seen || '')}. Resale listings sell fast: if it’s gone, the eBay link below finds others like it.</li></ul></div>` : ''}
      ${it.d ? `<p class="desc">${esc(it.d)}</p>` : ''}
      <div class="acts"><a class="btn p" href="${esc(it.u)}" target="_blank" rel="noopener" data-out="${it.i}">${it.k === 'ebay' || it.k === 'used' ? `View on ${esc(it.st)}` : `Buy at ${esc(it.st)}`} ${IC.out}</a>
        <button class="btn" type="button" data-save="${it.i}" aria-pressed="${!!P.saved[it.i]}">${P.saved[it.i] ? IC.heartF + 'Saved' : IC.heart + 'Save'}</button>
        ${it.k !== 'ebay' ? `<a class="btn" href="${ebaySearch(it.k === 'used' ? (it.lt || it.n) : qOf(it), true)}" target="_blank" rel="noopener" data-out="${it.i}">${it.k === 'used' ? 'More like it on eBay' : 'Used on eBay'} ${IC.out}</a>` : ''}</div>
      ${eb ? ebRows(eb.used, 'Used on eBay now') + ebRows(eb.new, 'New on eBay now') : ''}
      <div class="boards">${P.saved[id] ? `Boards: ${Object.keys(P.boards).map(b => `<button class="chip" type="button" data-bd="${esc(b)}" aria-pressed="${myBoards.includes(b)}">${esc(b)}</button>`).join('')}<input id="nb" placeholder="New board" aria-label="New board name" enterkeyhint="done">` : ''}</div>
      <p class="fine">${it.k === 'used' ? `A seller’s listing on ${esc(it.st)}; check its condition, size and photos there before you buy.` : it.k === 'ebay' ? 'Listing from eBay’s API; check the listing before you bid or buy.' : `Price and stock from ${esc(it.st)}’s own catalog. Finds isn’t paid by any store.`} <button type="button" data-hide="${it.i}" style="border:0;background:none;color:var(--link);padding:0;font:inherit">Not for me</button></p></div></div>
    ${like.length ? `<div class="sml"><h2 class="h2">More like this</h2><div id="sm"></div></div>` : ''}`;
  if (like.length) { const g = $('#sm'); g.innerHTML = `<div class="grid">${[...Array(Math.min(4, cols()))].map((_, c) => `<div class="col">${like.filter((_, i) => i % Math.min(4, cols()) === c).map(card).join('')}</div>`).join('')}</div>`; }
  $('#scrim').classList.add('on'); $('#sheet').classList.add('on'); $('#sheet').scrollTop = 0; $('#sheet').focus({ preventScroll: true });
  document.title = it.n + ' · Finds';
  const gm = $('#gm'); if (gm) gm.addEventListener('scroll', () => { const i = Math.round(gm.scrollLeft / gm.clientWidth); $$('.th button').forEach((b, j) => b.toggleAttribute('aria-current', i === j)); }, { passive: true });
}
function closeSheet() {
  if (!sheetFor) return;
  sheetFor = null; $('#scrim').classList.remove('on'); $('#sheet').classList.remove('on');
  if (location.hash.startsWith('#/p/')) history.replaceState(null, '', lastHash);
  route(true);
}

/* ---------- actions */
function toggleSave(id) {
  const it = BY.get(id);
  if (P.saved[id]) { delete P.saved[id]; for (const b in P.boards) P.boards[b] = P.boards[b].filter(x => x !== id); toast('Removed from Saved'); }
  else { P.saved[id] = Date.now(); learn(it, 3); toast('Saved', null); }
  save(); counts();
  $$(`[data-save="${id}"]`).forEach(b => { b.setAttribute('aria-pressed', String(!!P.saved[id])); b.innerHTML = b.classList.contains('btn') ? (P.saved[id] ? IC.heartF + 'Saved' : IC.heart + 'Save') : (P.saved[id] ? IC.heartF : IC.heart); });
  if (sheetFor === id) openSheet(id);
}
let toastT = 0;
function toast(msg, undo) {
  const t = $('#toast'); t.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button type="button" id="undo">Undo</button>' : ''}`;
  if (undo) $('#undo').onclick = () => { undo(); t.classList.remove('on'); };
  t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), undo ? 5000 : 1800);
}
const counts = () => { const n = Object.keys(P.saved).length; $('#savedN').textContent = n || ''; };
document.addEventListener('click', e => {
  const a = e.target.closest('a,button'); if (!a) return;
  const d = a.dataset;
  if (d.save) { e.preventDefault(); toggleSave(d.save); return; }
  if (d.close != null) { closeSheet(); return; }
  if (d.more != null) { shown += 48; paintGrid(); return; }
  if (d.out) { learn(BY.get(d.out), 2); return; }
  if (d.gi != null) { const gm = $('#gm'); gm.scrollTo({ left: gm.clientWidth * +d.gi, behavior: 'smooth' }); return; }
  if (d.hide) { const id = d.hide; P.hide[id] = 1; learn(BY.get(id), -3); save(); closeSheet(); toast('Fewer like that', () => { delete P.hide[id]; learn(BY.get(id), 3); save(); route(true); }); return; }
  if (d.bd) { const b = d.bd, l = P.boards[b] || (P.boards[b] = []); const i = l.indexOf(sheetFor); if (i >= 0) l.splice(i, 1); else l.push(sheetFor); save(); openSheet(sheetFor); return; }
  if (d.share != null) { const it = BY.get(sheetFor); const url = PUBLIC + '#/p/' + sheetFor; if (navigator.share) navigator.share({ title: it.n, url }).catch(() => {}); else navigator.clipboard && navigator.clipboard.writeText(url).then(() => toast('Link copied')); return; }
  if (d.cond) { COND = d.cond; LS.set('finds.cond', COND); route(true); return; }
  if (d.size) { const i = SIZES.indexOf(d.size); if (i >= 0) SIZES.splice(i, 1); else SIZES.push(d.size); LS.set('finds.sizes', SIZES); route(true); return; }
  if (d.board != null) { filt.board = filt.board === d.board ? '' : d.board; refresh(); return; }
  if (d.band) { filt.band = filt.band === d.band ? '' : d.band; refresh(); return; }
  if (d.sale != null) { filt.sale = !filt.sale; refresh(); return; }
  if (d.nw != null) { filt.nw = !filt.nw; refresh(); return; }
  if (a.matches('.ph') && !e.metaKey && !e.ctrlKey) { lastHash = location.hash.startsWith('#/p/') ? lastHash : (location.hash || '#/'); }
});
document.addEventListener('change', e => { if (e.target.id === 'sort') { filt.sort = e.target.value; refresh(); } });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && sheetFor) closeSheet();
  if (e.key === 'Enter' && e.target.id === 'nb' && e.target.value.trim()) { const b = e.target.value.trim().slice(0, 40); (P.boards[b] || (P.boards[b] = [])).includes(sheetFor) || P.boards[b].push(sheetFor); save(); openSheet(sheetFor); toast(`Added to ${b}`); }
  if (e.key === '/' && document.activeElement === document.body) { e.preventDefault(); $('#q').focus(); }
});
$('#scrim').addEventListener('click', closeSheet);
let qT = 0; $('#q').addEventListener('input', e => { clearTimeout(qT); const v = e.target.value.trim(); qT = setTimeout(() => go(v ? '#/q/' + encodeURIComponent(v) : '#/'), 260); });
function refresh() { const l = view.t === 'sec' ? F.items.filter(it => it.s === view.id) : null; if (!l) return route(true); $('#fl').innerHTML = filters(l, F.sections.find(x => x.id === view.id)); grid(apply(l), $('#board')); watchMore(); }

/* ---------- routing */
function parse() {
  const h = decodeURIComponent(location.hash.replace(/^#\/?/, ''));
  const [a, ...r] = h.split('/'); const b = r.join('/');
  if (a === 's' && b) return { t: 'sec', id: b };
  if (a === 'p' && b) return { t: 'p', id: b };
  if (a === 'q' && b) return { t: 'q', q: b };
  if (a === 'deals') return { t: 'deals' };
  if (a === 'used') return { t: 'used' };
  if (a === 'saved') return { t: 'saved', board: b || '' };
  return { t: 'home' };
}
function go(h) { if (location.hash !== h) location.hash = h; else route(); }
let lastView = '';
function route(keep) {
  if (!F) return;
  const v = parse();
  if (v.t === 'p') { if (!lastView) { view = { t: 'home' }; secNav(); home(); lastView = 'home'; } openSheet(v.id); return; }
  if (sheetFor) { sheetFor = null; $('#scrim').classList.remove('on'); $('#sheet').classList.remove('on'); }
  const key = JSON.stringify(v);
  if (key !== lastView) { filt = { band: '', sale: false, nw: false, board: '', sort: 'you' }; }
  view = v; secNav();
  if (v.t === 'sec') section(v.id); else if (v.t === 'used') usedPage(); else if (v.t === 'deals') deals(); else if (v.t === 'saved') saved(); else if (v.t === 'q') { search(v.q); if (document.activeElement !== $('#q')) $('#q').value = v.q; } else home();
  if (!keep && key !== lastView) scrollTo(0, 0);
  lastView = key;
}
addEventListener('hashchange', () => { if (!location.hash.startsWith('#/p/')) lastHash = location.hash || '#/'; route(); });

/* ---------- start */
async function load() {
  const tries = /^https?:$/.test(location.protocol) ? ['data/feed.json', PUBLIC + 'data/feed.json'] : [PUBLIC + 'data/feed.json'];
  for (const u of tries) { try { const r = await fetch(u + '?v=' + Math.floor(Date.now() / 600000), { cache: 'no-cache' }); if (r.ok) return await r.json(); } catch (e) { /* next */ } }
  throw new Error('no feed');
}
load().then(d => {
  F = d; for (const it of F.items) if (!it.br || /unknown|^default/i.test(it.br)) it.br = it.st;
  BY = new Map(F.items.map(it => [it.i, it]));
  F.sections = F.sections.filter(s => s.n);
  counts();
  $('#foot').innerHTML = `<p>Finds doesn’t sell anything and isn’t paid by any store. New products, prices and stock come from each store’s own published catalog, checked every six hours; pre-owned comes from the brands’ own resale and refurbished collections, from Pinfall’s resale finds on eBay, Poshmark, Mercari and Grailed (all-in prices, as found) (last ${ago(F.at)}); check the store before you buy. Picks are Claude’s, each with the reviews or reporting behind it linked.${F.ebay ? ' Pre-owned listings come from eBay’s API.' : ' eBay links open eBay’s own search.'} Trend stories link to the outlets that reported them.</p>
    <p>What you save and open stays in this browser. From the makers of <a href="../news/">The Watch</a> and <a href="../travel/">Weekender</a>.</p>`;
  route();
}).catch(() => { $('#main').innerHTML = '<div class="empty"><b>Finds didn’t load</b>Check your connection and try again.</div>'; });
</script>
